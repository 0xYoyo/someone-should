<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a tool that detects the BPM of an audio file</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
main { max-width: 560px; }
#file { display: none; }
label.btn { display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 18px; border-radius: var(--radius); background: var(--ink); color: var(--paper); cursor: pointer; text-align: center; }
body.drag label.btn { outline: 2px dashed var(--ink); outline-offset: 4px; }
section { border-top: 1px solid var(--line); padding-top: 16px; }
.label { font-size: 16px; color: var(--meta); }
#fname { font-size: 16px; color: var(--meta); overflow-wrap: anywhere; }
#tap { width: 100%; min-height: 96px; font-size: 22px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#tap.hit { background: var(--ink); color: var(--paper); }
.unit { font-size: 20px; color: var(--meta); }
#status, #tapnote, #cmp { font-size: 16px; }
.err { color: var(--no); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a tool that detects the BPM of an audio file</h1>

<main id="app" class="stack">
  <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.oga,.opus,.flac,.webm">
  <label class="btn" for="file" id="open">Open an audio file</label>
  <p id="status" class="empty" aria-live="polite">Open an audio file. It never leaves this device.</p>

  <div id="result" class="stack" hidden>
    <div id="fname"></div>
    <div><span id="bpm" class="big">0</span> <span class="unit">BPM</span></div>
    <div class="row">
      <button id="half" type="button">&times;&frac12;</button>
      <button id="double" type="button">&times;2</button>
      <button id="play" type="button" class="primary">Play with click</button>
    </div>
    <div id="conf" class="label"></div>
  </div>

  <section class="stack">
    <div class="label">Tap along to check</div>
    <button id="tap" type="button">Tap</button>
    <div class="row" style="justify-content:space-between">
      <div><span id="tapbpm" class="big">&ndash;</span> <span class="unit">BPM</span></div>
      <button id="tapreset" type="button">Reset</button>
    </div>
    <div id="tapnote" class="label">Tap at least 4 times on the beat.</div>
    <div id="cmp" class="label"></div>
  </section>
</main>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);

  const ui = {
    file: $('#file'), status: $('#status'), result: $('#result'), fname: $('#fname'),
    bpm: $('#bpm'), conf: $('#conf'), play: $('#play'),
    tap: $('#tap'), tapbpm: $('#tapbpm'), tapnote: $('#tapnote'), cmp: $('#cmp')
  };

  let buffer = null;      // decoded AudioBuffer
  let detected = null;    // { bpm, phase (s), conf }
  let shown = 0;          // BPM currently displayed (after x1/2, x2)
  let tapBpm = 0;

  const setStatus = (msg, isErr) => {
    ui.status.textContent = msg;
    ui.status.className = isErr ? 'err' : 'empty';
    ui.status.hidden = !msg;
  };

  const fmt = b => (Math.round(b * 10) / 10).toFixed(1).replace(/\.0$/, '');

  // ---------- decoding ----------
  const ACtx = window.AudioContext || window.webkitAudioContext;
  const OCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;

  function decode(arrayBuf) {
    // Decode at 22.05 kHz: plenty for tempo, half the memory.
    let ctx;
    try { ctx = new OCtx(1, 1, 22050); } catch { ctx = null; }
    if (!ctx) { if (!ACtx) return Promise.reject(new Error('no audio')); ctx = new ACtx(); }
    return new Promise((res, rej) => {
      const p = ctx.decodeAudioData(arrayBuf, res, rej);
      if (p && p.then) p.then(res, rej);
    });
  }

  // ---------- tempo estimation ----------
  // Onset envelope from two bands (full + low), then autocorrelation with a
  // tempo prior centred on 120 BPM, refined over several beat multiples.
  function analyse(buf) {
    const sr = buf.sampleRate;
    const n = buf.length;
    const chs = buf.numberOfChannels;
    const data = [];
    for (let c = 0; c < chs; c++) data.push(buf.getChannelData(c));

    const hop = Math.max(64, Math.round(sr / 172));
    const fps = sr / hop;
    const frames = Math.floor(n / hop);
    if (frames < fps * 6) return null;

    const eAll = new Float32Array(frames), eLow = new Float32Array(frames);
    const a = 1 - Math.exp(-2 * Math.PI * 150 / sr); // one-pole low-pass ~150 Hz
    let lp = 0, hp_prev = 0, hp = 0;
    const ha = Math.exp(-2 * Math.PI * 4000 / sr);
    let i = 0;
    for (let f = 0; f < frames; f++) {
      let sa = 0, sl = 0;
      for (let k = 0; k < hop; k++, i++) {
        let x = 0;
        for (let c = 0; c < chs; c++) x += data[c][i];
        x /= chs;
        lp += a * (x - lp);
        // rough high-pass for hats/snares
        hp = ha * (hp + x - hp_prev); hp_prev = x;
        sa += hp * hp; sl += lp * lp;
      }
      eAll[f] = Math.log(1 + 1000 * sa / hop);
      eLow[f] = Math.log(1 + 1000 * sl / hop);
    }

    // rectified difference, normalised per band, summed
    const onset = new Float32Array(frames);
    for (const e of [eAll, eLow]) {
      const d = new Float32Array(frames);
      let mx = 0;
      for (let f = 1; f < frames; f++) { const v = e[f] - e[f - 1]; d[f] = v > 0 ? v : 0; if (d[f] > mx) mx = d[f]; }
      if (mx > 0) for (let f = 0; f < frames; f++) onset[f] += d[f] / mx;
    }
    // subtract local mean (~0.4 s) to keep only peaks
    const w = Math.round(fps * 0.2);
    const env = new Float32Array(frames);
    let acc = 0;
    for (let f = 0; f < Math.min(frames, w); f++) acc += onset[f];
    for (let f = 0; f < frames; f++) {
      if (f + w < frames) acc += onset[f + w];
      if (f - w - 1 >= 0) acc -= onset[f - w - 1];
      const cnt = Math.min(frames - 1, f + w) - Math.max(0, f - w) + 1;
      const v = onset[f] - acc / cnt;
      env[f] = v > 0 ? v : 0;
    }

    const minB = 50, maxB = 220;
    const minLag = Math.floor(fps * 60 / maxB), maxLag = Math.ceil(fps * 60 / minB);
    const topLag = Math.min(maxLag * 4 + 4, frames - 1);
    const ac = new Float32Array(topLag + 1);
    for (let L = 1; L <= topLag; L++) {
      let s = 0;
      for (let f = L; f < frames; f++) s += env[f] * env[f - L];
      ac[L] = s / (frames - L);
    }

    // comb score: a true period also peaks at 2x and 4x
    const at = x => { const j = Math.floor(x), t = x - j; return j + 1 > topLag ? 0 : ac[j] * (1 - t) + ac[j + 1] * t; };
    let best = -1, bestLag = 0, sum = 0, cnt = 0;
    const scores = [];
    for (let L = minLag; L <= maxLag; L++) {
      const bpm = 60 * fps / L;
      const prior = Math.exp(-0.5 * Math.pow(Math.log2(bpm / 120) / 0.9, 2));
      const s = (at(L) + 0.5 * at(2 * L) + 0.25 * at(4 * L)) * prior;
      scores.push(s); sum += s; cnt++;
      if (s > best) { best = s; bestLag = L; }
    }
    if (best <= 0) return null;

    // refine: parabolic peak at multiples k*L, fit period
    const peakNear = c => {
      let j = Math.round(c), r = Math.max(2, Math.round(c * 0.04));
      let bj = j;
      for (let q = j - r; q <= j + r; q++) if (q > 1 && q < topLag && ac[q] > ac[bj]) bj = q;
      if (bj <= 1 || bj >= topLag) return bj;
      const y0 = ac[bj - 1], y1 = ac[bj], y2 = ac[bj + 1], den = y0 - 2 * y1 + y2;
      return den < 0 ? bj + 0.5 * (y0 - y2) / den : bj;
    };
    let num = 0, den = 0;
    for (let k = 1; k <= 4; k++) {
      if (k * bestLag + 2 >= topLag) break;
      const p = peakNear(k * bestLag);
      num += p * k; den += k * k;
    }
    const period = den ? num / den : bestLag;
    const bpm = 60 * fps / period;

    // phase: offset where onsets line up best with the grid
    let bestPh = 0, bestPs = -1;
    const P = Math.round(period);
    for (let ph = 0; ph < P; ph++) {
      let s = 0;
      for (let t = ph; t < frames; t += period) s += env[Math.round(t)] || 0;
      if (s > bestPs) { bestPs = s; bestPh = ph; }
    }
    const mean = sum / cnt;
    const conf = Math.max(0, Math.min(1, (best / mean - 1) / 3));
    return { bpm, phase: bestPh / fps, conf };
  }

  // ---------- file handling ----------
  async function load(file) {
    if (!file) return;
    stop();
    ui.result.hidden = true;
    buffer = null; detected = null;
    if (!OCtx && !ACtx) { setStatus('This browser cannot decode audio.', true); return; }
    setStatus('Decoding ' + file.name + '…');
    let ab;
    try { ab = await file.arrayBuffer(); } catch { setStatus('Could not read that file.', true); return; }
    try { buffer = await decode(ab); } catch { setStatus('This browser cannot decode that file. Try MP3 or WAV.', true); return; }
    setStatus('Listening for the beat…');
    await new Promise(r => setTimeout(r, 30)); // let the status paint
    let res = null;
    try { res = analyse(buffer); } catch { res = null; }
    if (!res) { setStatus('Too short or too quiet to find a beat. Use at least 6 seconds.', true); return; }
    detected = res; shown = res.bpm;
    const secs = Math.round(buffer.duration);
    ui.fname.textContent = file.name + ' · ' + Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
    ui.conf.textContent = res.conf > 0.5 ? 'Steady beat.' : res.conf > 0.2 ? 'Beat found, some doubt. Check with the click.' : 'Weak beat. Check with the click or tap.';
    setStatus('');
    render();
    ui.result.hidden = false;
  }

  function render() {
    ui.bpm.textContent = fmt(shown);
    compare();
  }

  ui.file.addEventListener('change', () => { load(ui.file.files[0]); ui.file.value = ''; });
  addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
  addEventListener('dragleave', () => document.body.classList.remove('drag'));
  addEventListener('drop', e => {
    e.preventDefault(); document.body.classList.remove('drag');
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) load(f);
  });

  $('#half').addEventListener('click', () => { if (shown / 2 >= 20) { shown /= 2; render(); restart(); } });
  $('#double').addEventListener('click', () => { if (shown * 2 <= 400) { shown *= 2; render(); restart(); } });

  // ---------- playback with click ----------
  let actx = null, src = null, clickTimer = 0, startAt = 0, nextBeat = 0;
  function stop() {
    if (src) { try { src.stop(); } catch {} src.disconnect(); src = null; }
    clearInterval(clickTimer); clickTimer = 0;
    ui.play.textContent = 'Play with click';
  }
  function restart() { if (src) { stop(); play(); } }
  function click(t, accent) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = accent ? 1760 : 1320;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + 0.06);
  }
  function play() {
    if (!buffer || !detected) return;
    try { actx = actx || new ACtx(); } catch { setStatus('Playback is not available here.', true); return; }
    if (actx.state === 'suspended') actx.resume();
    src = actx.createBufferSource();
    src.buffer = buffer;
    const g = actx.createGain(); g.gain.value = 0.7;
    src.connect(g).connect(actx.destination);
    startAt = actx.currentTime + 0.1;
    src.start(startAt);
    src.onended = () => { if (src) stop(); };
    // grid anchored on detected phase, spaced by the shown tempo
    const per = 60 / shown;
    let k = Math.ceil((0 - detected.phase) / per);
    nextBeat = detected.phase + k * per;
    let beatNo = 0;
    const schedule = () => {
      const horizon = actx.currentTime - startAt + 0.25;
      while (nextBeat < horizon) {
        if (nextBeat >= 0 && nextBeat < buffer.duration) click(startAt + nextBeat, beatNo % 4 === 0);
        nextBeat += per; beatNo++;
      }
    };
    schedule();
    clickTimer = setInterval(schedule, 80);
    ui.play.textContent = 'Stop';
  }
  ui.play.addEventListener('click', () => (src ? stop() : play()));

  // ---------- tap tempo ----------
  let taps = [];
  function tap() {
    const now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2500) taps = [];
    taps.push(now);
    if (taps.length > 16) taps.shift();
    ui.tap.classList.add('hit');
    setTimeout(() => ui.tap.classList.remove('hit'), 90);
    if (taps.length < 2) { ui.tapnote.textContent = 'Keep tapping.'; return; }
    const span = taps[taps.length - 1] - taps[0];
    tapBpm = 60000 * (taps.length - 1) / span;
    ui.tapbpm.textContent = fmt(tapBpm);
    ui.tapnote.textContent = taps.length < 4 ? 'Keep tapping.' : (taps.length - 1) + ' beats averaged.';
    compare();
  }
  ui.tap.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
  ui.tap.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tap(); } });
  $('#tapreset').addEventListener('click', () => {
    taps = []; tapBpm = 0;
    ui.tapbpm.textContent = '–'; ui.tapnote.textContent = 'Tap at least 4 times on the beat.'; ui.cmp.textContent = '';
  });

  function compare() {
    if (!detected || !tapBpm || taps.length < 4) { ui.cmp.textContent = ''; return; }
    const d = Math.abs(tapBpm - shown);
    if (d <= Math.max(2, shown * 0.03)) ui.cmp.textContent = 'Your taps agree with the file.';
    else if (Math.abs(tapBpm - shown / 2) <= shown * 0.04) ui.cmp.textContent = 'You are tapping half time. Try ×½.';
    else if (Math.abs(tapBpm - shown * 2) <= shown * 0.08) ui.cmp.textContent = 'You are tapping double time. Try ×2.';
    else ui.cmp.textContent = 'Off by ' + fmt(d) + ' BPM.';
  }
})();
</script>
</body>
</html>
