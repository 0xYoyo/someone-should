<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a tool that edits math equations visually</title>
<style>
/* ---- paste design/tokens.css here, verbatim ---- */
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
#eq { min-height: 120px; padding: 20px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); font: 30px/1.2 "Times New Roman", "STIX Two Math", Cambria, Georgia, serif; overflow-x: auto; overflow-y: hidden; display: flex; align-items: center; cursor: text; white-space: nowrap; }
#eq.focus { border-color: var(--ink); }
.slot { display: inline-flex; align-items: center; min-height: 1em; }
.slot.empty { min-width: 0.6em; min-height: 0.9em; border: 1px dashed var(--meta); border-radius: 2px; }
#eq > .slot.empty { border: 0; }
.ch { padding: 0 0.04em; }
.ch.op { padding: 0 0.18em; }
.ch.fn { font-style: normal; padding-right: 0.15em; }
.ch.v { font-style: italic; }
.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 0.1em; font-size: max(16px, 0.85em); }
.frac > .slot:first-child { border-bottom: 1.5px solid currentColor; padding: 0 0.15em 0.08em; }
.frac > .slot:last-child { padding: 0.08em 0.15em 0; }
.sqrt { display: inline-flex; align-items: stretch; }
.sqrt .rad { font-size: 1.1em; line-height: 1; align-self: flex-end; }
.sqrt > .slot { border-top: 1.5px solid currentColor; padding: 0.08em 0.1em 0; }
.sup, .sub { display: inline-flex; font-size: max(16px, 0.65em); }
.sup { align-self: flex-start; margin-top: -0.2em; }
.sub { align-self: flex-end; margin-bottom: -0.3em; }
.caret { display: inline-block; width: 0; height: 1em; border-left: 2px solid var(--ink); margin: 0 -1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#hint { margin-top: -4px; }
#keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 6px; }
#keys button { padding: 0 4px; font-size: 18px; min-width: 44px; }
#keys button.wide { grid-column: span 2; }
#latex { display: block; font: 16px/1.4 var(--mono); padding: 12px; border: 1.5px solid var(--line); border-radius: var(--radius); word-break: break-all; white-space: pre-wrap; min-height: var(--tap); }
#latex:empty::before { content: "LaTeX shows here"; color: var(--meta); }
.row > input { flex: 1 1 160px; width: auto; }
</style>
</head>
<body>
<h1 id="wish">someone should make a tool that edits math equations visually</h1>

<main id="app" class="stack">
  <div id="eq" aria-label="equation"></div>
  <input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type: 2x+1, / fraction, ^ power, _ index" aria-label="type into the equation">
  <div id="keys">
    <button id="k-frac" data-a="frac" aria-label="fraction">a⁄b</button>
    <button id="k-sqrt" data-a="sqrt" aria-label="square root">√x</button>
    <button id="k-sup" data-a="sup" aria-label="power">xⁿ</button>
    <button id="k-sub" data-a="sub" aria-label="subscript">xₙ</button>
    <button data-a="paren" aria-label="parentheses">( )</button>
    <button data-c="π">π</button>
    <button data-c="θ">θ</button>
    <button data-c="α">α</button>
    <button data-c="β">β</button>
    <button data-c="Δ">Δ</button>
    <button data-c="±">±</button>
    <button data-c="×">×</button>
    <button data-c="÷">÷</button>
    <button data-c="·">·</button>
    <button data-c="=">=</button>
    <button data-c="≠">≠</button>
    <button data-c="≈">≈</button>
    <button data-c="≤">≤</button>
    <button data-c="≥">≥</button>
    <button data-c="∞">∞</button>
    <button data-c="Σ">Σ</button>
    <button data-c="∫">∫</button>
    <button data-c="→">→</button>
    <button data-f="sin">sin</button>
    <button data-f="cos">cos</button>
    <button data-f="tan">tan</button>
    <button data-f="log">log</button>
    <button data-f="ln">ln</button>
    <button data-a="left" aria-label="move left">◀</button>
    <button data-a="right" aria-label="move right">▶</button>
    <button id="k-back" data-a="back" aria-label="delete">⌫</button>
    <button data-a="undo">undo</button>
    <button data-a="clear">clear</button>
  </div>
  <code id="latex"></code>
  <div class="row">
    <button id="copy" class="primary">copy LaTeX</button>
    <span id="msg" class="meta" role="status"></span>
  </div>
  <div class="row">
    <input id="src" autocomplete="off" spellcheck="false" placeholder="paste LaTeX to edit it" aria-label="LaTeX to open">
    <button id="open">open</button>
  </div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const KEY = 'visual-equation-editor:latex';

  // Symbol <-> LaTeX command
  const SYM = { 'π': 'pi', 'θ': 'theta', 'α': 'alpha', 'β': 'beta', 'γ': 'gamma', 'λ': 'lambda', 'μ': 'mu', 'σ': 'sigma', 'φ': 'phi', 'ω': 'omega', 'Δ': 'Delta',
    '±': 'pm', '×': 'times', '÷': 'div', '·': 'cdot', '≠': 'neq', '≈': 'approx', '≤': 'le', '≥': 'ge', '∞': 'infty', 'Σ': 'sum', '∫': 'int', '→': 'to', 'Π': 'prod', '∂': 'partial' };
  const CMD = Object.fromEntries(Object.entries(SYM).map(([k, v]) => [v, k]));
  Object.assign(CMD, { leq: '≤', geq: '≥', ne: '≠', rightarrow: '→', ast: '×' });
  const FN = ['sin', 'cos', 'tan', 'log', 'ln', 'exp', 'lim', 'min', 'max', 'sec', 'csc', 'cot'];
  const OPS = '+−=<>±×÷·≠≈≤≥→';
  const TYPE_MAP = { '*': '×', '-': '−' };
  const SLOTS = { frac: ['a', 'b'], sqrt: ['a'], sup: ['a'], sub: ['a'] };

  let root = [];
  let cur = { slot: root, i: 0 };
  let parent = new Map(); // child slot -> { slot, i } of the node that owns it
  let history = [];

  const eq = $('#eq'), inp = $('#in'), out = $('#latex'), msg = $('#msg');

  // ---------- LaTeX out ----------
  function toLatex(slot) {
    let s = '';
    for (const n of slot) {
      let p;
      if (n.t === 'c') p = SYM[n.v] ? '\\' + SYM[n.v] : n.v === '−' ? '-' : n.v;
      else if (n.t === 'fn') p = '\\' + n.v;
      else if (n.t === 'frac') p = '\\frac{' + toLatex(n.a) + '}{' + toLatex(n.b) + '}';
      else if (n.t === 'sqrt') p = '\\sqrt{' + toLatex(n.a) + '}';
      else if (n.t === 'sup') p = '^{' + toLatex(n.a) + '}';
      else if (n.t === 'sub') p = '_{' + toLatex(n.a) + '}';
      if (/\\[a-zA-Z]+$/.test(s) && /^[a-zA-Z0-9]/.test(p)) s += ' ';
      s += p;
    }
    return s;
  }

  // ---------- LaTeX in ----------
  function parse(src) {
    const toks = src.match(/\\[a-zA-Z]+|\\.|[^\s]/g) || [];
    let k = 0;
    const group = () => {
      if (toks[k] === '{') { k++; const s = seq('}'); k++; return s; }
      if (k < toks.length) return seq(null, 1);
      return [];
    };
    function seq(end, max = Infinity) {
      const s = [];
      let count = 0;
      while (k < toks.length && toks[k] !== end && count < max) {
        if (end === null && max === Infinity && toks[k] === '}') { k++; continue; }
        const t = toks[k++];
        count++;
        if (t === '{') { s.push(...seq('}')); k++; }
        else if (t === '^' || t === '_') s.push({ t: t === '^' ? 'sup' : 'sub', a: group() });
        else if (t[0] === '\\') {
          const c = t.slice(1);
          if (c === 'frac' || c === 'dfrac' || c === 'tfrac') { const a = group(); s.push({ t: 'frac', a, b: group() }); }
          else if (c === 'sqrt') s.push({ t: 'sqrt', a: group() });
          else if (c === 'left' || c === 'right' || c.length === 1 && !/[{}%$#&_]/.test(c)) { if (c === '{' || c === '}') s.push({ t: 'c', v: c }); }
          else if (CMD[c]) s.push({ t: 'c', v: CMD[c] });
          else if (FN.includes(c)) s.push({ t: 'fn', v: c });
          else if (/[{}%$#&_]/.test(c)) s.push({ t: 'c', v: c });
          else s.push({ t: 'c', v: t });
        }
        else s.push({ t: 'c', v: TYPE_MAP[t] || t });
      }
      return s;
    }
    return seq(null);
  }

  // ---------- render ----------
  const span = (cls, text) => { const e = document.createElement('span'); e.className = cls; if (text != null) e.textContent = text; return e; };

  function renderSlot(slot) {
    const el = span('slot' + (slot.length ? '' : ' empty'));
    el._slot = slot;
    slot.forEach((n, i) => {
      if (cur.slot === slot && cur.i === i) el.append(span('caret'));
      const ne = renderNode(n);
      ne._slot = slot; ne._i = i;
      el.append(ne);
      for (const key of SLOTS[n.t] || []) parent.set(n[key], { slot, i });
    });
    if (cur.slot === slot && cur.i === slot.length) el.append(span('caret'));
    return el;
  }

  function renderNode(n) {
    if (n.t === 'c') {
      const cls = OPS.includes(n.v) ? 'ch op' : /^[a-zA-Z]$/.test(n.v) ? 'ch v' : 'ch';
      return span(cls, n.v);
    }
    if (n.t === 'fn') return span('ch fn', n.v);
    const e = span(n.t);
    if (n.t === 'sqrt') e.append(span('rad', '√'));
    for (const key of SLOTS[n.t]) e.append(renderSlot(n[key]));
    return e;
  }

  function render(save = true) {
    parent = new Map();
    eq.replaceChildren(renderSlot(root));
    const tex = toLatex(root);
    out.textContent = tex;
    if (save) store.set(KEY, tex);
    const c = eq.querySelector('.caret');
    if (c && c.scrollIntoView) c.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  // ---------- editing ----------
  function snapshot() {
    history.push(toLatex(root));
    if (history.length > 100) history.shift();
  }

  function insert(node) { cur.slot.splice(cur.i, 0, node); cur.i++; }

  function insertStruct(type) {
    snapshot();
    const n = { t: type };
    for (const key of SLOTS[type]) n[key] = [];
    if (type === 'frac') {
      // take the term just before the caret as numerator, like on paper
      let j = cur.i;
      while (j > 0) {
        const p = cur.slot[j - 1];
        if (p.t === 'c' && OPS.includes(p.v) || p.t === 'c' && /[()]/.test(p.v)) break;
        j--;
      }
      n.a = cur.slot.splice(j, cur.i - j);
      cur.i = j;
      cur.slot.splice(cur.i, 0, n);
      cur = { slot: n.a.length ? n.b : n.a, i: 0 };
    } else {
      cur.slot.splice(cur.i, 0, n);
      cur = { slot: n.a, i: 0 };
    }
  }

  function typeText(text) {
    if (!text) return;
    for (const ch of text) {
      if (ch === '/') insertStruct('frac');
      else if (ch === '^') insertStruct('sup');
      else if (ch === '_') insertStruct('sub');
      else if (ch === ' ') continue;
      else { snapshot(); insert({ t: 'c', v: TYPE_MAP[ch] || ch }); }
    }
  }

  function moveRight() {
    const n = cur.slot[cur.i];
    if (n && SLOTS[n.t]) { cur = { slot: n[SLOTS[n.t][0]], i: 0 }; return; }
    if (n) { cur.i++; return; }
    const p = parent.get(cur.slot);
    if (!p) return;
    const node = p.slot[p.i], keys = SLOTS[node.t], idx = keys.findIndex(k => node[k] === cur.slot);
    cur = idx < keys.length - 1 ? { slot: node[keys[idx + 1]], i: 0 } : { slot: p.slot, i: p.i + 1 };
  }

  function moveLeft() {
    const n = cur.slot[cur.i - 1];
    if (n && SLOTS[n.t]) { const s = n[SLOTS[n.t].at(-1)]; cur = { slot: s, i: s.length }; return; }
    if (n) { cur.i--; return; }
    const p = parent.get(cur.slot);
    if (!p) return;
    const node = p.slot[p.i], keys = SLOTS[node.t], idx = keys.findIndex(k => node[k] === cur.slot);
    if (idx > 0) { const s = node[keys[idx - 1]]; cur = { slot: s, i: s.length }; }
    else cur = { slot: p.slot, i: p.i };
  }

  function backspace() {
    const n = cur.slot[cur.i - 1];
    if (n) {
      if (SLOTS[n.t] && SLOTS[n.t].some(k => n[k].length)) { moveLeft(); return; }
      snapshot();
      cur.slot.splice(cur.i - 1, 1); cur.i--;
      return;
    }
    // at the start of a box: dissolve the box, keep its contents
    const p = parent.get(cur.slot);
    if (!p) return;
    snapshot();
    const node = p.slot[p.i];
    const flat = SLOTS[node.t].flatMap(k => node[k]);
    p.slot.splice(p.i, 1, ...flat);
    cur = { slot: p.slot, i: p.i };
  }

  function load(tex) {
    root = parse(tex || '');
    cur = { slot: root, i: root.length };
  }

  function act(a) {
    if (a === 'left') moveLeft();
    else if (a === 'right') moveRight();
    else if (a === 'back') backspace();
    else if (a === 'paren') { snapshot(); insert({ t: 'c', v: '(' }); cur.slot.splice(cur.i, 0, { t: 'c', v: ')' }); }
    else if (a === 'undo') { if (history.length) load(history.pop()); else say('nothing to undo'); }
    else if (a === 'clear') { if (root.length) snapshot(); load(''); }
    else insertStruct(a);
  }

  let sayT;
  function say(t) { msg.textContent = t; clearTimeout(sayT); sayT = setTimeout(() => { msg.textContent = ''; }, 2000); }

  // ---------- events ----------
  inp.addEventListener('input', () => {
    const v = inp.value;
    inp.value = '';
    typeText(v);
    render();
  });

  inp.addEventListener('keydown', e => {
    if (inp.value) return;
    const map = { Backspace: 'back', ArrowLeft: 'left', ArrowRight: 'right' };
    if (map[e.key]) { e.preventDefault(); act(map[e.key]); render(); }
    else if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); act('undo'); render(); }
  });

  inp.addEventListener('focus', () => eq.classList.add('focus'));
  inp.addEventListener('blur', () => eq.classList.remove('focus'));

  // keep the phone keyboard open while tapping the palette
  $('#keys').addEventListener('pointerdown', e => { if (e.target.closest('button') && document.activeElement === inp) e.preventDefault(); });
  $('#keys').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.a) act(b.dataset.a);
    else if (b.dataset.c) { snapshot(); insert({ t: 'c', v: b.dataset.c }); }
    else if (b.dataset.f) { snapshot(); insert({ t: 'fn', v: b.dataset.f }); }
    render();
  });

  // tap in the equation to put the caret there
  eq.addEventListener('click', e => {
    const hit = e.target.closest('.ch, .frac, .sqrt, .sup, .sub, .rad');
    const node = hit && (hit._slot ? hit : hit.parentElement);
    if (node && node._slot) {
      const r = node.getBoundingClientRect();
      cur = { slot: node._slot, i: node._i + (e.clientX > r.left + r.width / 2 ? 1 : 0) };
    } else {
      const s = e.target.closest('.slot');
      const slot = s ? s._slot : root;
      cur = { slot, i: slot.length };
    }
    render(false);
    inp.focus();
  });

  $('#copy').addEventListener('click', () => {
    const tex = out.textContent;
    if (!tex) { say('nothing to copy yet'); return; }
    const fallback = () => {
      try {
        const r = document.createRange(); r.selectNodeContents(out);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        say(document.execCommand('copy') ? 'copied' : 'selected, copy it');
      } catch { say('select the LaTeX and copy it'); }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tex).then(() => say('copied'), fallback);
      else fallback();
    } catch { fallback(); }
  });

  const openSrc = () => {
    const tex = $('#src').value.trim().replace(/^\$+|\$+$/g, '');
    if (!tex) { say('paste some LaTeX first'); return; }
    snapshot();
    load(tex);
    $('#src').value = '';
    render();
    say('opened');
  };
  $('#open').addEventListener('click', openSrc);
  $('#src').addEventListener('keydown', e => { if (e.key === 'Enter') openSrc(); });

  load(store.get(KEY, ''));
  render(false);
})();
</script>
</body>
</html>
