<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that makes computer bleeping noises when you do things</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
h1{font-size:16px}
.note{font:16px/1.4 var(--mono);color:var(--meta)}
.sets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sets button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pads button{min-height:64px;padding:0}
label.chk{display:flex;align-items:center;gap:12px;min-height:var(--tap)}
label.chk input{width:44px;min-height:44px;accent-color:var(--ink)}
input[type=range]{padding:0;border:0;accent-color:var(--ink)}
#count{font-variant-numeric:tabular-nums}
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that makes computer bleeping noises when you do things</h1>

<main id="app" class="stack">
  <div class="sets" role="group" aria-label="sound set">
    <button type="button" data-set="arcade" aria-pressed="true">arcade</button>
    <button type="button" data-set="terminal" aria-pressed="false">terminal</button>
    <button type="button" data-set="scifi" aria-pressed="false">sci-fi</button>
    <button type="button" data-set="modem" aria-pressed="false">modem</button>
  </div>
  <div class="pads">
    <button type="button" class="pad" data-n="0">1</button>
    <button type="button" class="pad" data-n="1">2</button>
    <button type="button" class="pad" data-n="2">3</button>
    <button type="button" class="pad" data-n="3">4</button>
  </div>
  <input id="field" type="text" placeholder="type here" autocomplete="off" aria-label="type here">
  <label class="chk"><input id="check" type="checkbox"> toggle me</label>
  <label class="stack">volume <input id="vol" type="range" min="0" max="100" value="60"></label>
  <p id="status" class="note">tap anything to start the sound</p>
  <p class="note">bleeps: <span id="count">0</span></p>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  // Each set: wave type, note frequencies (Hz), note length (s)
  const SETS = {
    arcade:   { wave: 'square',   notes: [523, 659, 784, 1046], len: 0.08 },
    terminal: { wave: 'square',   notes: [880, 880, 1320, 660],  len: 0.05 },
    scifi:    { wave: 'sine',     notes: [300, 900, 1500, 600],  len: 0.18, slide: 1.8 },
    modem:    { wave: 'sawtooth', notes: [1200, 2100, 980, 1650], len: 0.07 }
  };
  let current = store.get('set', 'arcade');
  if (!SETS[current]) current = 'arcade';
  let volume = store.get('vol', 60);
  let ctx = null, count = 0, last = 0;

  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch { return null; }
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function bleep(n) {
    count++;
    $('#count').textContent = count;
    const c = audio();
    if (!c) { $('#status').textContent = 'this browser cannot play sound'; return; }
    $('#status').textContent = current + ' set';
    const s = SETS[current];
    const f = s.notes[n % s.notes.length];
    const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = s.wave;
    o.frequency.setValueAtTime(f, t);
    if (s.slide) o.frequency.exponentialRampToValueAtTime(f * s.slide, t + s.len);
    const peak = Math.max(0.0001, (volume / 100) * 0.25);
    g.gain.setValueAtTime(peak, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + s.len);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + s.len + 0.02);
  }

  // Any tap or key on the page bleeps; pads pick their own note.
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('[data-set],#vol')) return;
    const pad = e.target.closest('.pad');
    bleep(pad ? +pad.dataset.n : (last = (last + 1) % 4));
  });
  document.addEventListener('keydown', e => {
    if (e.target.id !== 'field' && (e.key === 'Enter' || e.key === ' ')) bleep(1);
  });
  $('#field').addEventListener('input', e => { bleep(e.data ? e.data.charCodeAt(0) : 2); });
  $('#check').addEventListener('change', () => bleep(3));

  function setSet(name) {
    current = name;
    store.set('set', name);
    $$('[data-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.set === name));
  }
  $$('[data-set]').forEach(b => b.addEventListener('click', () => { setSet(b.dataset.set); bleep(0); }));
  setSet(current);

  const vol = $('#vol');
  vol.value = volume;
  vol.addEventListener('input', () => { volume = +vol.value; store.set('vol', volume); });
  vol.addEventListener('change', () => bleep(1));
})();
</script>
</body>
</html>
