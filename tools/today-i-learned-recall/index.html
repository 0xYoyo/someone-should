<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app to capture things you learn each day and recall them later</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.card{border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px}
.q{font-size:20px;font-weight:500}
.a{font-size:19px}
.hide{display:none}
label.meta{display:block;margin-bottom:4px}
ul.plain li{align-items:flex-start}
ul.plain li button{min-width:var(--tap)}
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app to capture things you learn each day and recall them later</h1>
<main id="app" class="stack">
  <section class="card" id="recall">
    <div class="meta" id="due">due</div>
    <div class="q" id="topic"></div>
    <div class="a hide" id="fact"></div>
    <div class="row">
      <button class="primary" id="show">show</button>
      <button id="got" class="hide">remembered</button>
      <button id="forgot" class="hide">forgot</button>
    </div>
  </section>
  <section class="stack">
    <div><label class="meta" for="t">topic</label><input id="t" maxlength="80" autocomplete="off" placeholder="octopus hearts"></div>
    <div><label class="meta" for="f">what I learned</label><input id="f" maxlength="200" autocomplete="off" placeholder="three hearts, blue blood"></div>
    <div class="row"><button class="primary" id="add">save</button><span class="meta" id="msg"></span></div>
  </section>
  <ul class="plain" id="list"></ul>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const DAY = 864e5;
  const STEPS = [1, 3, 7, 14, 30, 60];
  const day = t => Math.floor((t - new Date(t).getTimezoneOffset() * 6e4) / DAY);
  const today = () => day(Date.now());
  const fmt = d => new Date(d * DAY).toISOString().slice(5, 10);
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let items = store.get('til.items', null);
  let example = false;
  if (!Array.isArray(items) || !items.length) {
    example = true;
    const d = today();
    items = [
      { id: 1, t: 'octopus hearts', f: 'three hearts, blue blood', added: d - 1, step: 0, due: d },
      { id: 2, t: 'honey', f: 'never spoils if sealed', added: d, step: 0, due: d + 1 }
    ];
  }
  let cur = null;
  const save = () => { if (!example) store.set('til.items', items); };
  const dueList = () => items.filter(i => i.due <= today()).sort((a, b) => a.due - b.due);

  function render() {
    const due = dueList();
    cur = due[0] || null;
    $('#due').textContent = cur ? due.length + ' to recall' + (example ? ' (example)' : '') : 'nothing due';
    $('#topic').textContent = cur ? 'What was ' + cur.t + '?' : (example ? '' : 'Nothing to recall today.');
    $('#fact').textContent = cur ? cur.f : '';
    $('#fact').classList.add('hide');
    $('#show').classList.toggle('hide', !cur);
    $('#got').classList.add('hide');
    $('#forgot').classList.add('hide');
    const l = $('#list');
    l.innerHTML = items.length ? items.slice().sort((a, b) => b.added - a.added || b.id - a.id).map(i =>
      '<li><span>' + esc(i.t) + '<br><span class="meta">' + fmt(i.added) + ' · next ' + fmt(i.due) + '</span></span>' +
      '<button data-del="' + i.id + '" aria-label="delete ' + esc(i.t) + '">x</button></li>').join('') : '<li class="empty">Nothing saved yet.</li>';
  }

  $('#show').onclick = () => {
    if (!cur) return;
    $('#fact').classList.remove('hide');
    $('#show').classList.add('hide');
    $('#got').classList.remove('hide');
    $('#forgot').classList.remove('hide');
  };
  function grade(ok) {
    if (!cur) return;
    cur.step = ok ? Math.min(cur.step + 1, STEPS.length - 1) : 0;
    cur.due = today() + (ok ? STEPS[cur.step] : 1);
    save(); render();
  }
  $('#got').onclick = () => grade(true);
  $('#forgot').onclick = () => grade(false);

  $('#add').onclick = () => {
    const t = $('#t').value.trim(), f = $('#f').value.trim();
    if (!t || !f) { $('#msg').textContent = 'Fill both lines.'; return; }
    if (example) { items = []; example = false; }
    items.push({ id: Date.now(), t, f, added: today(), step: 0, due: today() + 1 });
    save();
    $('#t').value = ''; $('#f').value = ''; $('#msg').textContent = 'Saved. Back tomorrow.';
    render();
  };
  $('#f').onkeydown = e => { if (e.key === 'Enter') $('#add').click(); };
  $('#list').onclick = e => {
    const id = e.target.getAttribute && e.target.getAttribute('data-del');
    if (!id) return;
    if (example) return;
    items = items.filter(i => String(i.id) !== id);
    save(); render();
  };
  render();
})();
</script>
</body>
</html>
