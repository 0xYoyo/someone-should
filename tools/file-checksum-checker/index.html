<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a file integrity checker</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
.drop { display: flex; align-items: center; justify-content: center; min-height: 120px; padding: 16px; border: 1.5px dashed var(--ink); border-radius: var(--radius); text-align: center; cursor: pointer; }
.drop.over { background: var(--line); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
textarea { min-height: 88px; resize: vertical; }
label.field { display: grid; gap: 6px; color: var(--meta); font-size: 16px; }
#verdict { font-size: 20px; font-weight: 500; min-height: 1.45em; }
#verdict.ok { color: var(--built); }
#verdict.bad { color: var(--no); }
#results { list-style: none; margin: 0; padding: 0; display: grid; gap: 20px; }
#results > li { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; min-width: 0; }
.name { font-weight: 500; overflow-wrap: anywhere; }
.sub { color: var(--meta); font-size: 16px; }
.sub.changed { color: var(--no); }
.sub.same { color: var(--built); }
button.hash { display: grid; grid-template-columns: 5.5em 1fr; gap: 8px; text-align: left; width: 100%; padding: 10px 12px; border-color: var(--line); font: 16px/1.35 var(--mono); }
button.hash span:first-child { color: var(--meta); }
button.hash span:last-child { word-break: break-all; min-width: 0; }
button.hash.hit { border-color: var(--built); }
button.hash.hit span:first-child { color: var(--built); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>

<body>
<h1 id="wish">someone should make a file integrity checker</h1>

<main id="app" class="stack">
  <label class="drop" id="drop">
    <input type="file" id="file" multiple>
    <span>Choose or drop files. They never leave this device.</span>
  </label>
  <label class="field">or paste text
    <textarea id="text" spellcheck="false" autocomplete="off"></textarea>
  </label>
  <label class="field">expected hash or checksum list (MD5, SHA-1, SHA-256, CRC32)
    <input id="expected" spellcheck="false" autocomplete="off" autocapitalize="off">
  </label>
  <div id="verdict" aria-live="polite"></div>
  <p id="empty" class="empty">No files yet.</p>
  <ul id="results"></ul>
  <div class="row" id="actions" hidden>
    <button id="copyList">Copy SHA-256 list</button>
    <button id="forget">Forget remembered files</button>
  </div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  // ---- incremental block hashers (64-byte blocks) ----
  const rotl = (x, n) => (x << n) | (x >>> (32 - n));
  function blockHasher(init, compress, littleEndian, words) {
    const h = Int32Array.from(init), buf = new Uint8Array(64);
    let bl = 0, len = 0;
    return {
      update(d) {
        let i = 0; len += d.length;
        if (bl) { while (bl < 64 && i < d.length) buf[bl++] = d[i++]; if (bl < 64) return; compress(h, buf, 0); bl = 0; }
        for (; i + 64 <= d.length; i += 64) compress(h, d, i);
        while (i < d.length) buf[bl++] = d[i++];
      },
      digest() {
        const bits = len * 8, lo = bits >>> 0, hi = Math.floor(bits / 4294967296);
        buf[bl++] = 0x80;
        if (bl > 56) { buf.fill(0, bl); compress(h, buf, 0); bl = 0; }
        buf.fill(0, bl);
        for (let k = 0; k < 4; k++) {
          if (littleEndian) { buf[56 + k] = lo >>> (8 * k); buf[60 + k] = hi >>> (8 * k); }
          else { buf[63 - k] = lo >>> (8 * k); buf[59 - k] = hi >>> (8 * k); }
        }
        compress(h, buf, 0);
        let out = '';
        for (let w = 0; w < words; w++) for (let k = 0; k < 4; k++) {
          const b = (h[w] >>> (littleEndian ? 8 * k : 24 - 8 * k)) & 255;
          out += (b < 16 ? '0' : '') + b.toString(16);
        }
        return out;
      }
    };
  }

  const MD5K = Array.from({ length: 64 }, (_, i) => Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) | 0);
  const MD5S = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21];
  const M = new Int32Array(16);
  function md5c(h, d, o) {
    for (let j = 0; j < 16; j++) M[j] = d[o + 4 * j] | d[o + 4 * j + 1] << 8 | d[o + 4 * j + 2] << 16 | d[o + 4 * j + 3] << 24;
    let a = h[0], b = h[1], c = h[2], e = h[3];
    for (let i = 0; i < 64; i++) {
      let f, g;
      if (i < 16) { f = (b & c) | (~b & e); g = i; }
      else if (i < 32) { f = (e & b) | (~e & c); g = (5 * i + 1) & 15; }
      else if (i < 48) { f = b ^ c ^ e; g = (3 * i + 5) & 15; }
      else { f = c ^ (b | ~e); g = (7 * i) & 15; }
      f = (f + a + MD5K[i] + M[g]) | 0;
      a = e; e = c; c = b; b = (b + rotl(f, MD5S[(i >> 4) * 4 + (i & 3)])) | 0;
    }
    h[0] += a; h[1] += b; h[2] += c; h[3] += e;
  }

  const W = new Int32Array(80);
  const be = (d, o) => d[o] << 24 | d[o + 1] << 16 | d[o + 2] << 8 | d[o + 3];
  function sha1c(h, d, o) {
    for (let j = 0; j < 16; j++) W[j] = be(d, o + 4 * j);
    for (let j = 16; j < 80; j++) W[j] = rotl(W[j - 3] ^ W[j - 8] ^ W[j - 14] ^ W[j - 16], 1);
    let a = h[0], b = h[1], c = h[2], e = h[3], f = h[4];
    for (let i = 0; i < 80; i++) {
      let t;
      if (i < 20) t = ((b & c) | (~b & e)) + 0x5a827999;
      else if (i < 40) t = (b ^ c ^ e) + 0x6ed9eba1;
      else if (i < 60) t = ((b & c) | (b & e) | (c & e)) + 0x8f1bbcdc;
      else t = (b ^ c ^ e) + 0xca62c1d6;
      t = (rotl(a, 5) + t + f + W[i]) | 0;
      f = e; e = c; c = rotl(b, 30); b = a; a = t;
    }
    h[0] += a; h[1] += b; h[2] += c; h[3] += e; h[4] += f;
  }

  const K256 = Int32Array.from([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);
  const ror = (x, n) => (x >>> n) | (x << (32 - n));
  function sha256c(h, d, o) {
    for (let j = 0; j < 16; j++) W[j] = be(d, o + 4 * j);
    for (let j = 16; j < 64; j++) {
      const x = W[j - 15], y = W[j - 2];
      W[j] = (W[j - 16] + (ror(x, 7) ^ ror(x, 18) ^ (x >>> 3)) + W[j - 7] + (ror(y, 17) ^ ror(y, 19) ^ (y >>> 10))) | 0;
    }
    let a = h[0], b = h[1], c = h[2], e = h[3], f = h[4], g = h[5], k = h[6], l = h[7];
    for (let i = 0; i < 64; i++) {
      const t1 = (l + (ror(f, 6) ^ ror(f, 11) ^ ror(f, 25)) + ((f & g) ^ (~f & k)) + K256[i] + W[i]) | 0;
      const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      l = k; k = g; g = f; f = (e + t1) | 0; e = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h[0] += a; h[1] += b; h[2] += c; h[3] += e; h[4] += f; h[5] += g; h[6] += k; h[7] += l;
  }

  const CRC = new Int32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; CRC[n] = c; }
  function crc32() {
    let c = -1;
    return {
      update(d) { for (let i = 0; i < d.length; i++) c = CRC[(c ^ d[i]) & 255] ^ (c >>> 8); },
      digest() { return ((c ^ -1) >>> 0).toString(16).padStart(8, '0'); }
    };
  }

  const ALGOS = ['SHA-256', 'SHA-1', 'MD5', 'CRC32'];
  function hashers() {
    return {
      'SHA-256': blockHasher([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19], sha256c, false, 8),
      'SHA-1': blockHasher([0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476, 0xc3d2e1f0], sha1c, false, 5),
      'MD5': blockHasher([0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476], md5c, true, 4),
      'CRC32': crc32()
    };
  }
  function digestAll(hs) { const r = {}; for (const a of ALGOS) r[a] = hs[a].digest(); return r; }
  function hashBytes(bytes) { const hs = hashers(); for (const a of ALGOS) hs[a].update(bytes); return digestAll(hs); }

  // ---- state & UI ----
  const KEY = 'file-checksum-checker.known';
  let known = store.get(KEY, {});
  const items = []; // {id, name, size, hashes, progress, note, noteClass}
  let textItem = null, queue = Promise.resolve();

  const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' kB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
  const today = () => new Date().toISOString().slice(0, 10);

  function expectedTokens() {
    return ($('#expected').value.toLowerCase().match(/\b(?:[0-9a-f]{64}|[0-9a-f]{40}|[0-9a-f]{32}|[0-9a-f]{8})\b/g)) || [];
  }

  function render() {
    const exp = new Set(expectedTokens());
    const all = textItem ? [textItem, ...items] : items;
    const ul = $('#results');
    ul.textContent = '';
    const hits = [];
    for (const it of all) {
      const li = document.createElement('li');
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = it.name;
      li.append(name);
      const sub = document.createElement('div');
      sub.className = 'sub ' + (it.noteClass || '');
      sub.textContent = it.hashes ? [it.size != null ? fmtSize(it.size) : '', it.note].filter(Boolean).join(' · ') : (it.error || 'hashing ' + it.progress + '%');
      li.append(sub);
      if (it.hashes) for (const a of ALGOS) {
        const b = document.createElement('button');
        const hit = exp.has(it.hashes[a]);
        if (hit) hits.push(a + ' matches — ' + it.name);
        b.className = 'hash' + (hit ? ' hit' : '');
        b.dataset.value = it.hashes[a];
        b.setAttribute('aria-label', 'copy ' + a);
        const l = document.createElement('span'); l.textContent = a;
        const v = document.createElement('span'); v.textContent = it.hashes[a];
        b.append(l, v);
        li.append(b);
      }
      ul.append(li);
    }
    $('#empty').hidden = all.length > 0;
    $('#actions').hidden = !items.some(i => i.hashes) && !Object.keys(known).length;
    $('#copyList').hidden = !items.some(i => i.hashes);
    $('#forget').hidden = !Object.keys(known).length;

    const v = $('#verdict');
    const raw = $('#expected').value.trim();
    const done = all.filter(i => i.hashes);
    v.className = '';
    if (!raw) v.textContent = '';
    else if (!exp.size) { v.textContent = 'Not a hash. Expected 8, 32, 40 or 64 hex characters.'; v.className = 'bad'; }
    else if (hits.length) { v.textContent = hits.join('; '); v.className = 'ok'; }
    else if (!done.length) v.textContent = 'Add a file to compare.';
    else { v.textContent = 'No match. ' + (all.some(i => !i.hashes && !i.error) ? 'Still hashing.' : 'The file differs from the expected hash.'); v.className = all.some(i => !i.hashes && !i.error) ? '' : 'bad'; }
  }

  function remember(it) {
    const prev = known[it.name];
    if (prev && prev.sha256 === it.hashes['SHA-256']) { it.note = 'unchanged since ' + prev.date; it.noteClass = 'same'; }
    else if (prev) { it.note = 'changed since ' + prev.date; it.noteClass = 'changed'; }
    else it.note = 'remembered for next time';
    if (!prev || prev.sha256 !== it.hashes['SHA-256']) {
      known[it.name] = { sha256: it.hashes['SHA-256'], size: it.size, date: today() };
      store.set(KEY, known);
    }
  }

  const CHUNK = 4 * 1048576;
  async function hashFile(file, it) {
    const hs = hashers();
    try {
      for (let pos = 0; pos < file.size; pos += CHUNK) {
        const bytes = new Uint8Array(await file.slice(pos, pos + CHUNK).arrayBuffer());
        for (const a of ALGOS) hs[a].update(bytes);
        it.progress = Math.floor(Math.min(1, (pos + CHUNK) / file.size) * 100);
        render();
      }
      it.hashes = digestAll(hs);
      remember(it);
    } catch {
      it.error = 'could not read this file';
    }
    render();
  }

  function addFiles(list) {
    for (const file of list) {
      const it = { name: file.name, size: file.size, progress: 0 };
      items.unshift(it);
      queue = queue.then(() => hashFile(file, it));
    }
    render();
  }

  $('#file').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  document.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

  $('#text').addEventListener('input', e => {
    const s = e.target.value;
    textItem = s ? { name: 'pasted text', size: null, hashes: hashBytes(new TextEncoder().encode(s)), note: 'UTF-8, ' + new TextEncoder().encode(s).length + ' bytes' } : null;
    render();
  });
  $('#expected').addEventListener('input', render);

  $('#results').addEventListener('click', async e => {
    const b = e.target.closest('button.hash');
    if (!b) return;
    const label = b.firstChild, was = label.textContent;
    try { await navigator.clipboard.writeText(b.dataset.value); label.textContent = 'copied'; }
    catch { label.textContent = 'select'; getSelection().selectAllChildren(b.lastChild); }
    setTimeout(() => { label.textContent = was; }, 1200);
  });

  $('#copyList').addEventListener('click', async e => {
    const text = items.filter(i => i.hashes).map(i => i.hashes['SHA-256'] + '  ' + i.name).join('\n');
    try { await navigator.clipboard.writeText(text); e.target.textContent = 'Copied'; }
    catch { e.target.textContent = 'Copy failed'; }
    setTimeout(() => { e.target.textContent = 'Copy SHA-256 list'; }, 1200);
  });
  $('#forget').addEventListener('click', () => {
    known = {}; store.set(KEY, known);
    for (const i of items) if (i.hashes) { i.note = ''; i.noteClass = ''; }
    render();
  });

  render();
})();
</script>
</body>
</html>
