<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a reader that highlights one line at a time to help you focus</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
#reader { font-size: 22px; line-height: 1.7; padding: 8px 0; cursor: pointer; user-select: none; -webkit-user-select: none; }
#reader .w { opacity: .25; transition: opacity .12s; }
#reader .w.on { opacity: 1; }
#reader .w.on.first { }
#text { min-height: 240px; resize: vertical; }
.bar { position: sticky; bottom: 0; background: var(--paper); padding: 10px 0; border-top: 1px solid var(--line); }
.bar button { flex: 1; }
#pos { min-width: 70px; text-align: center; }
[hidden] { display: none !important; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a reader that highlights one line at a time to help you focus</h1>

<main id="app" class="stack">
  <textarea id="text" aria-label="Text to read" placeholder="Paste text here" hidden></textarea>
  <div id="reader" role="document" aria-live="polite"></div>
  <p id="empty" class="empty" hidden>Nothing to read. Paste some text.</p>
  <div class="row bar">
    <button id="prev" aria-label="Previous line">Up</button>
    <span id="pos" class="meta">0 / 0</span>
    <button id="next" class="primary" aria-label="Next line">Down</button>
    <button id="edit">Paste</button>
  </div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const SAMPLE = "It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.\n\nHowever little known the feelings or views of such a man may be on his first entering a neighbourhood, this truth is so well fixed in the minds of the surrounding families, that he is considered the rightful property of some one or other of their daughters.\n\n\"My dear Mr. Bennet,\" said his lady to him one day, \"have you heard that Netherfield Park is let at last?\"";

  const reader = $('#reader'), area = $('#text'), pos = $('#pos'), empty = $('#empty');
  let lines = [];   // arrays of word spans, one array per visual line
  let cur = store.get('line', 0);
  let editing = false;

  function render() {
    const text = area.value.trim();
    reader.textContent = '';
    lines = [];
    empty.hidden = !!text;
    if (!text) { update(); return; }
    // one span per word; paragraph breaks become a block break
    text.split(/\n+/).forEach(par => {
      const p = document.createElement('div');
      p.style.marginBottom = '.6em';
      par.split(/\s+/).filter(Boolean).forEach(w => {
        const s = document.createElement('span');
        s.className = 'w';
        s.textContent = w;
        p.appendChild(s);
        p.appendChild(document.createTextNode(' '));
      });
      reader.appendChild(p);
    });
    group();
    update();
  }

  // group words into visual lines by their vertical position
  function group() {
    lines = [];
    let top = null;
    reader.querySelectorAll('.w').forEach(s => {
      const t = s.offsetTop;
      if (top === null || Math.abs(t - top) > 4) { lines.push([]); top = t; }
      lines[lines.length - 1].push(s);
    });
  }

  function update() {
    if (cur >= lines.length) cur = Math.max(0, lines.length - 1);
    if (cur < 0) cur = 0;
    reader.querySelectorAll('.w.on').forEach(s => s.classList.remove('on'));
    (lines[cur] || []).forEach(s => s.classList.add('on'));
    pos.textContent = lines.length ? (cur + 1) + ' / ' + lines.length : '0 / 0';
    store.set('line', cur);
    const el = lines[cur] && lines[cur][0];
    if (el && !editing) {
      const r = el.getBoundingClientRect();
      if (r.top < 60 || r.bottom > innerHeight - 90) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  function move(d) { cur += d; update(); }

  function setEditing(on) {
    editing = on;
    area.hidden = !on;
    reader.hidden = on;
    $('#edit').textContent = on ? 'Read' : 'Paste';
    if (on) { area.focus(); }
    else { store.set('text', area.value); cur = 0; render(); }
  }

  $('#next').addEventListener('click', () => move(1));
  $('#prev').addEventListener('click', () => move(-1));
  $('#edit').addEventListener('click', () => setEditing(!editing));
  reader.addEventListener('click', e => {
    // tap lower half of the screen goes down, upper half goes up
    move(e.clientY < innerHeight * 0.3 ? -1 : 1);
  });
  document.addEventListener('keydown', e => {
    if (editing) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
  });
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (!editing) { group(); update(); } }, 150); });

  area.value = store.get('text', SAMPLE) || SAMPLE;
  render();
})();
</script>
</body>
</html>
