<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data: blob:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that takes one picture a day facing south at solar noon and makes a time-lapse</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.meta { font-size: 16px; }
label.meta { display: grid; gap: 4px; flex: 1; min-width: 120px; }
.stage { position: relative; width: 100%; aspect-ratio: 3/4; max-height: 56vh; background: var(--line); border-radius: var(--radius); overflow: hidden; display: grid; place-items: center; }
.stage video, .stage canvas, .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stage img.ghost { opacity: .4; pointer-events: none; }
.stage .msg { position: relative; padding: 16px; text-align: center; color: var(--meta); }
.big { font-size: 40px; }
.hidden { display: none !important; }
input[type=range] { padding: 0; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that takes one picture a day facing south at solar noon and makes a time-lapse</h1>

<main id="app" class="stack">
  <div>
    <div class="meta" id="when">solar noon today</div>
    <div class="big" id="noon">--:--</div>
    <div class="meta" id="status">&nbsp;</div>
  </div>

  <div class="row">
    <label class="meta">longitude <input id="lon" type="number" inputmode="decimal" step="any" min="-180" max="180"></label>
    <label class="meta">latitude <input id="lat" type="number" inputmode="decimal" step="any" min="-90" max="90"></label>
    <button id="locate" type="button">use my location</button>
  </div>

  <div class="stage" id="stage">
    <video id="video" class="hidden" playsinline muted></video>
    <img id="ghost" class="ghost hidden" alt="">
    <canvas id="play" class="hidden"></canvas>
    <div class="msg" id="msg">tap start camera, face <span id="dir">south</span>, take one photo at solar noon</div>
  </div>

  <div class="row">
    <button id="cam" class="primary" type="button">start camera</button>
    <button id="snap" type="button" disabled>take today's photo</button>
    <label class="hidden" id="filewrap"><input id="file" type="file" accept="image/*" capture="environment" style="display:none"><span class="meta" style="display:inline-grid;min-height:44px;align-items:center;border:1.5px solid var(--ink);border-radius:4px;padding:0 18px;color:var(--ink)">choose a photo</span></label>
  </div>

  <div class="row">
    <button id="playbtn" type="button">play time-lapse</button>
    <button id="del" type="button">delete last</button>
    <span class="meta" id="count">0 frames</span>
  </div>
  <ul class="plain" id="list"></ul>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const lonEl = $('#lon'), latEl = $('#lat');
  let frames = store.get('snd.frames', []); // [{d:'YYYY-MM-DD', t:'HH:MM', img:dataURL}]
  let stream = null, timer = null;

  // Solar noon in minutes after 00:00 UTC, equation-of-time approximation (good to about a minute)
  function noonDate(lon, d) {
    const start = Date.UTC(d.getFullYear(), 0, 0);
    const n = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - start) / 864e5);
    const b = 2 * Math.PI * (n - 81) / 365;
    const eot = 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);
    const mins = 720 - 4 * lon - eot;
    return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) + mins * 6e4);
  }
  const pad = n => String(n).padStart(2, '0');
  const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

  function say(t) { $('#status').textContent = t || '\u00a0'; }
  function msg(t) { const m = $('#msg'); m.textContent = t; m.classList.toggle('hidden', !t); }

  function update() {
    let lon = parseFloat(lonEl.value);
    const lat = parseFloat(latEl.value);
    let est = false;
    if (isNaN(lon) || lon < -180 || lon > 180) {
      lon = -new Date().getTimezoneOffset() / 60 * 15; // estimate from the clock's time zone
      est = true;
    }
    const now = new Date();
    const noon = noonDate(lon, now);
    $('#noon').textContent = hm(noon);
    const diff = Math.round((noon - now) / 6e4);
    let line;
    if (diff > 0) line = 'in ' + Math.floor(diff / 60) + 'h ' + pad(diff % 60) + 'm';
    else line = 'was ' + Math.floor(-diff / 60) + 'h ' + pad(-diff % 60) + 'm ago';
    const taken = frames.some(f => f.d === dayKey(now));
    line += taken ? ', today is done' : ', no photo yet today';
    if (est) line += '. Estimated from time zone; enter longitude for exact.';
    say(line);
    $('#dir').textContent = (!isNaN(lat) && lat < 0) ? 'north' : 'south';
    store.set('snd.loc', { lon: lonEl.value, lat: latEl.value });
  }

  function render() {
    $('#count').textContent = frames.length + (frames.length === 1 ? ' frame' : ' frames');
    const ul = $('#list');
    ul.innerHTML = '';
    frames.slice().reverse().slice(0, 7).forEach(f => {
      const li = document.createElement('li');
      li.textContent = f.d + '  ' + f.t;
      ul.appendChild(li);
    });
    const g = $('#ghost'), last = frames[frames.length - 1];
    if (last && stream) { g.src = last.img; g.classList.remove('hidden'); } else g.classList.add('hidden');
    $('#playbtn').disabled = frames.length < 2;
    $('#del').disabled = !frames.length;
    update();
  }

  function save() {
    // drop oldest frames until it fits in storage
    while (!store.set('snd.frames', frames) && frames.length > 1) frames.shift();
  }

  function addFrame(source, w, h) {
    const c = document.createElement('canvas');
    const s = Math.min(1, 480 / Math.max(w, h));
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
    const now = new Date();
    const f = { d: dayKey(now), t: hm(now), img: c.toDataURL('image/jpeg', 0.6) };
    frames = frames.filter(x => x.d !== f.d); // one picture a day: replace today's
    frames.push(f);
    save(); render();
    say('saved ' + f.d + ' ' + f.t);
  }

  async function startCam() {
    stopPlay();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return noCam();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    } catch (e) { return noCam(); }
    const v = $('#video');
    v.srcObject = stream; v.classList.remove('hidden'); v.play().catch(() => {});
    $('#play').classList.add('hidden');
    msg('');
    $('#snap').disabled = false;
    $('#cam').textContent = 'stop camera';
    render();
  }
  function stopCam() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    $('#video').classList.add('hidden');
    $('#snap').disabled = true;
    $('#cam').textContent = 'start camera';
    msg('camera off');
    render();
  }
  function noCam() {
    msg('Camera not available. Choose a photo instead.');
    $('#filewrap').classList.remove('hidden');
  }

  $('#cam').onclick = () => stream ? stopCam() : startCam();
  $('#snap').onclick = () => {
    const v = $('#video');
    if (!v.videoWidth) return say('camera not ready');
    addFrame(v, v.videoWidth, v.videoHeight);
  };
  $('#file').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => { addFrame(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(img.src); };
    img.onerror = () => say('could not read that photo');
    img.src = URL.createObjectURL(file);
  };

  function stopPlay() { clearInterval(timer); timer = null; $('#playbtn').textContent = 'play time-lapse'; }
  $('#playbtn').onclick = () => {
    if (timer) { stopPlay(); return; }
    if (frames.length < 2) return say('need at least 2 days of photos');
    if (stream) stopCam();
    const c = $('#play'), ctx = c.getContext('2d');
    c.classList.remove('hidden'); msg('');
    $('#playbtn').textContent = 'stop';
    let i = 0;
    const imgs = frames.map(f => { const im = new Image(); im.src = f.img; return im; });
    timer = setInterval(() => {
      const im = imgs[i % imgs.length], f = frames[i % frames.length];
      if (im.naturalWidth) {
        c.width = im.naturalWidth; c.height = im.naturalHeight;
        ctx.drawImage(im, 0, 0);
        ctx.font = '600 ' + Math.round(c.width / 16) + 'px sans-serif';
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
        ctx.strokeText(f.d, 12, c.height - 14); ctx.fillText(f.d, 12, c.height - 14);
      }
      i++;
    }, 200);
  };
  $('#del').onclick = () => { frames.pop(); save(); stopPlay(); render(); };

  $('#locate').onclick = () => {
    if (!navigator.geolocation) return say('location not available; enter it by hand');
    say('locating');
    navigator.geolocation.getCurrentPosition(p => {
      lonEl.value = p.coords.longitude.toFixed(3);
      latEl.value = p.coords.latitude.toFixed(3);
      update();
    }, () => say('location denied; enter longitude by hand'), { timeout: 10000 });
  };
  lonEl.oninput = latEl.oninput = update;

  const saved = store.get('snd.loc', null);
  if (saved) { lonEl.value = saved.lon || ''; latEl.value = saved.lat || ''; }
  render();
  setInterval(update, 30000);
})();
</script>
</body>
</html>
