<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that works like trello</title>
<style>
/* ---- paste design/tokens.css here, verbatim ---- */
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
#app { min-width: 0; }
.bar { display: flex; gap: 10px; flex-wrap: wrap; }
.bar button, .bar label { flex: 1 1 0; }
.filebtn { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); border-radius: var(--radius); cursor: pointer; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.filebtn:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
#status { min-height: 1.45em; margin: 0; color: var(--meta); font-size: 16px; }
#status.err { color: var(--no); }
#board { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 12px; align-items: flex-start; overscroll-behavior-x: contain; }
.col { flex: 0 0 min(300px, calc(100vw - 2 * var(--gutter) - 28px)); scroll-snap-align: start; border: 1.5px solid var(--line); border-radius: var(--radius); padding: 10px; display: grid; gap: 10px; }
.col-head { display: flex; gap: 8px; align-items: center; }
.col-name { flex: 1; min-width: 0; text-align: left; border: 0; padding: 0 4px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-count { font: 16px/1 var(--mono); color: var(--meta); padding: 0 6px; }
.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; min-height: 44px; }
.card { display: flex; align-items: stretch; border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.card-text { flex: 1; min-width: 0; border: 0; text-align: left; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.35; }
.handle { flex: 0 0 44px; width: 44px; padding: 0; border: 0; border-left: 1.5px solid var(--line); border-radius: 0; touch-action: none; cursor: grab; color: var(--meta); display: grid; place-items: center; }
.card.dragging { opacity: .35; }
.ghost { position: fixed; z-index: 10; pointer-events: none; width: 260px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.ph { height: 8px; border-radius: var(--radius); background: var(--ink); opacity: .5; }
.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; }
.add button { padding: 0 14px; }
.empty-col { color: var(--meta); font-size: 16px; padding: 10px 4px; margin: 0; }
#addcol { flex: 0 0 auto; align-self: flex-start; border-style: dashed; }
#sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
#sheet[hidden] { display: none; }
.panel { background: var(--paper); width: 100%; max-width: 480px; padding: var(--gutter); border-radius: var(--radius) var(--radius) 0 0; display: grid; gap: 12px; max-height: 90dvh; overflow: auto; }
.panel textarea { min-height: 110px; resize: vertical; }
.panel .row button { flex: 1 1 0; }
.danger { color: var(--no); border-color: var(--no); }
</style>
</head>
<body>
<h1 id="wish">someone should make an app that works like trello</h1>

<main id="app" class="stack">
  <div class="bar">
    <button id="export" type="button">Export</button>
    <label class="filebtn" for="import">Import<input id="import" type="file" accept="application/json,.json"></label>
  </div>
  <p id="status" role="status"></p>
  <div id="board" aria-label="Board"></div>
</main>

<div id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ed-title">
    <strong id="ed-title">Card</strong>
    <textarea id="ed-text" aria-label="Text"></textarea>
    <div class="row">
      <button id="ed-left" type="button" aria-label="Move left">&larr; Move</button>
      <button id="ed-right" type="button" aria-label="Move right">Move &rarr;</button>
    </div>
    <div class="row">
      <button id="ed-delete" type="button" class="danger">Delete</button>
      <button id="ed-save" type="button" class="primary">Done</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  // storage helper — never throws
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const KEY = 'pocket-kanban-board.v1';
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const fresh = () => ({ cols: ['To do', 'Doing', 'Done'].map(name => ({ id: uid(), name, cards: [] })) });

  // accepts our own export format, or a bare array of columns
  function clean(data) {
    const cols = Array.isArray(data) ? data : data && Array.isArray(data.cols) ? data.cols : null;
    if (!cols) return null;
    return {
      cols: cols.filter(c => c && typeof c === 'object').map(c => ({
        id: uid(),
        name: String(c.name ?? c.title ?? 'Untitled').slice(0, 80) || 'Untitled',
        cards: (Array.isArray(c.cards) ? c.cards : []).map(k => typeof k === 'string' ? k : k && (k.text ?? k.name))
          .filter(t => typeof t === 'string' && t.trim()).map(text => ({ id: uid(), text: text.slice(0, 2000) }))
      }))
    };
  }

  let state = clean(store.get(KEY, null)) || fresh();
  const board = $('#board'), status = $('#status');

  function say(msg, err) { status.textContent = msg; status.classList.toggle('err', !!err); }
  function save() { if (!store.set(KEY, state)) say('Not saved: storage is off in this browser.', true); }
  const findCard = id => {
    for (let ci = 0; ci < state.cols.length; ci++) {
      const i = state.cols[ci].cards.findIndex(c => c.id === id);
      if (i > -1) return { ci, i, card: state.cols[ci].cards[i] };
    }
    return null;
  };

  const GRIP = '<svg width="16" height="20" viewBox="0 0 16 20" aria-hidden="true" fill="currentColor"><circle cx="5" cy="4" r="1.8"/><circle cx="11" cy="4" r="1.8"/><circle cx="5" cy="10" r="1.8"/><circle cx="11" cy="10" r="1.8"/><circle cx="5" cy="16" r="1.8"/><circle cx="11" cy="16" r="1.8"/></svg>';

  function el(tag, props = {}, kids = []) {
    const n = Object.assign(document.createElement(tag), props);
    for (const k of kids) n.append(k);
    return n;
  }

  function render() {
    const sx = board.scrollLeft;
    board.textContent = '';
    state.cols.forEach((col, ci) => {
      const list = el('ul', { className: 'cards' });
      list.dataset.ci = ci;
      for (const card of col.cards) {
        const li = el('li', { className: 'card' });
        li.dataset.id = card.id;
        li.append(el('button', { type: 'button', className: 'card-text', textContent: card.text }));
        const h = el('button', { type: 'button', className: 'handle', innerHTML: GRIP });
        h.setAttribute('aria-label', 'Drag');
        li.append(h);
        list.append(li);
      }
      const input = el('input', { className: 'add-text', placeholder: 'Add a card', maxLength: 2000 });
      input.setAttribute('aria-label', 'New card in ' + col.name);
      const section = el('section', { className: 'col' }, [
        el('div', { className: 'col-head' }, [
          el('button', { type: 'button', className: 'col-name', textContent: col.name, title: 'Rename' }),
          el('span', { className: 'col-count', textContent: col.cards.length })
        ]),
        col.cards.length ? list : (list.append(el('p', { className: 'empty-col', textContent: 'No cards yet.' })), list),
        el('form', { className: 'add' }, [input, el('button', { type: 'submit', textContent: 'Add' })])
      ]);
      section.dataset.ci = ci;
      board.append(section);
    });
    board.append(el('button', { type: 'button', id: 'addcol', textContent: '+ Column' }));
    board.scrollLeft = sx;
  }

  // adding cards
  board.addEventListener('submit', e => {
    e.preventDefault();
    const ci = +e.target.closest('.col').dataset.ci;
    const input = $('.add-text', e.target);
    const text = input.value.trim();
    if (!text) { say('Type something first.'); return; }
    state.cols[ci].cards.push({ id: uid(), text });
    save(); render(); say('');
    const again = $$('.col')[ci] && $('.add-text', $$('.col')[ci]);
    if (again) again.focus({ preventScroll: true });
  });

  // editor sheet, shared by cards and columns
  const sheet = $('#sheet'), edText = $('#ed-text');
  let editing = null; // { kind: 'card'|'col', id|ci }

  function openSheet(target) {
    editing = target;
    const isCard = target.kind === 'card';
    $('#ed-title').textContent = isCard ? 'Card' : 'Column';
    edText.value = isCard ? findCard(target.id).card.text : state.cols[target.ci].name;
    edText.rows = isCard ? 4 : 1;
    sheet.hidden = false;
    updateMoveButtons();
    edText.focus();
  }
  function closeSheet() { sheet.hidden = true; editing = null; }
  function commitText() {
    if (!editing) return;
    const v = edText.value.trim();
    if (editing.kind === 'card') { const f = findCard(editing.id); if (f && v) f.card.text = v.slice(0, 2000); }
    else if (v) state.cols[editing.ci].name = v.slice(0, 80);
  }
  function updateMoveButtons() {
    const pos = editing.kind === 'card' ? findCard(editing.id).ci : editing.ci;
    $('#ed-left').disabled = pos === 0;
    $('#ed-right').disabled = pos === state.cols.length - 1;
  }
  function move(dir) {
    commitText();
    if (editing.kind === 'card') {
      const f = findCard(editing.id), to = f.ci + dir;
      if (!state.cols[to]) return;
      state.cols[f.ci].cards.splice(f.i, 1);
      state.cols[to].cards.push(f.card);
      say('Moved to ' + state.cols[to].name + '.');
    } else {
      const from = editing.ci, to = from + dir;
      if (!state.cols[to]) return;
      [state.cols[from], state.cols[to]] = [state.cols[to], state.cols[from]];
      editing.ci = to;
    }
    save(); render(); updateMoveButtons();
  }

  $('#ed-left').addEventListener('click', () => move(-1));
  $('#ed-right').addEventListener('click', () => move(1));
  $('#ed-save').addEventListener('click', () => { commitText(); save(); render(); closeSheet(); });
  $('#ed-delete').addEventListener('click', () => {
    if (editing.kind === 'card') {
      const f = findCard(editing.id);
      state.cols[f.ci].cards.splice(f.i, 1);
      say('Card deleted.');
    } else {
      const col = state.cols[editing.ci];
      if (col.cards.length && $('#ed-delete').textContent !== 'Delete ' + col.cards.length + ' cards too') {
        $('#ed-delete').textContent = 'Delete ' + col.cards.length + ' cards too';
        return;
      }
      state.cols.splice(editing.ci, 1);
      say('Column deleted.');
    }
    save(); render(); closeSheet();
  });
  sheet.addEventListener('click', e => { if (e.target === sheet) { commitText(); save(); render(); closeSheet(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) { closeSheet(); } });
  const resetDelete = () => { $('#ed-delete').textContent = 'Delete'; };

  board.addEventListener('click', e => {
    if (justDragged) return;
    const t = e.target.closest('button');
    if (!t) return;
    resetDelete();
    if (t.classList.contains('card-text')) openSheet({ kind: 'card', id: t.closest('.card').dataset.id });
    else if (t.classList.contains('col-name')) openSheet({ kind: 'col', ci: +t.closest('.col').dataset.ci });
    else if (t.id === 'addcol') {
      state.cols.push({ id: uid(), name: 'New column', cards: [] });
      save(); render();
      board.scrollLeft = board.scrollWidth;
      openSheet({ kind: 'col', ci: state.cols.length - 1 });
      edText.select();
    }
  });

  // drag a card by its handle, across columns and within one
  let drag = null, justDragged = false;
  board.addEventListener('pointerdown', e => {
    const h = e.target.closest('.handle');
    if (!h || e.button > 0) return;
    e.preventDefault();
    const li = h.closest('.card'), r = li.getBoundingClientRect();
    const ghost = li.cloneNode(true);
    ghost.classList.add('ghost');
    ghost.style.width = r.width + 'px';
    document.body.append(ghost);
    li.classList.add('dragging');
    drag = { id: li.dataset.id, li, ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, ph: el('li', { className: 'ph' }), moved: false, x: e.clientX, y: e.clientY };
    h.setPointerCapture(e.pointerId);
    place(e.clientX, e.clientY);
  });
  board.addEventListener('pointermove', e => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 4) drag.moved = true;
    place(e.clientX, e.clientY);
  });
  function place(x, y) {
    drag.ghost.style.left = (x - drag.dx) + 'px';
    drag.ghost.style.top = (y - drag.dy) + 'px';
    const b = board.getBoundingClientRect();
    if (x > b.right - 30) board.scrollLeft += 12;
    else if (x < b.left + 30) board.scrollLeft -= 12;
    const col = $$('.col').find(c => { const r = c.getBoundingClientRect(); return x >= r.left && x <= r.right; });
    if (!col) return;
    const list = $('.cards', col);
    const empty = $('.empty-col', list);
    if (empty) empty.remove();
    const before = $$('.card:not(.dragging)', list).find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
    list.insertBefore(drag.ph, before || null);
  }
  function endDrag(commit) {
    if (!drag) return;
    const { id, ghost, ph, moved } = drag;
    ghost.remove();
    if (commit && moved && ph.parentNode) {
      const list = ph.parentNode, to = +list.dataset.ci;
      const idx = [...list.children].filter(n => n.matches('.card:not(.dragging), .ph')).indexOf(ph);
      const f = findCard(id);
      state.cols[f.ci].cards.splice(f.i, 1);
      state.cols[to].cards.splice(idx, 0, f.card);
      save();
      justDragged = true;
      setTimeout(() => { justDragged = false; }, 0);
    }
    drag = null;
    render();
  }
  board.addEventListener('pointerup', () => endDrag(true));
  board.addEventListener('pointercancel', () => endDrag(false));

  // export / import
  $('#export').addEventListener('click', () => {
    const out = { app: 'pocket-kanban-board', exported: new Date().toISOString(), cols: state.cols.map(c => ({ name: c.name, cards: c.cards.map(k => k.text) })) };
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    const a = el('a', { href: URL.createObjectURL(blob), download: 'board-' + new Date().toISOString().slice(0, 10) + '.json' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    const n = state.cols.reduce((s, c) => s + c.cards.length, 0);
    say('Exported ' + n + ' cards.');
  });
  $('#import').addEventListener('change', e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    file.text().then(txt => {
      let data;
      try { data = clean(JSON.parse(txt)); } catch { data = null; }
      if (!data || !data.cols.length) { say('That file is not a board export.', true); return; }
      state = data; save(); render();
      say('Imported ' + data.cols.length + ' columns.');
    }, () => say('Could not read that file.', true));
  });

  render();
})();
</script>
</body>
</html>
