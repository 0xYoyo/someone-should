<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an RPG-style fitness app</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles ---- */
h1 { font-size: 16px; }
.meta { font-size: 16px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.bar { height: 14px; border: 1.5px solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats div { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 8px 4px; }
.stats b { display: block; font: 500 28px/1.1 var(--sans); font-variant-numeric: tabular-nums; }
.q { align-items: center; }
.q .mark { width: 44px; height: 44px; display: grid; place-items: center; font: 500 20px var(--mono); border: 1.5px solid var(--line); border-radius: var(--radius); flex: none; }
.q.done .mark { border-color: var(--built); color: var(--built); }
.q.done .t { color: var(--meta); text-decoration: line-through; }
.q .t { flex: 1; min-width: 0; }
h2 { font: 500 16px/1.3 var(--mono); color: var(--meta); margin: 8px 0 0; }
#mins { text-align: center; }
.lvl { display: flex; justify-content: space-between; align-items: baseline; }
.msg { min-height: 24px; color: var(--built); }
ul.plain li button { min-width: var(--tap); padding: 0 10px; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an RPG-style fitness app</h1>
<main id="app" class="stack">
  <section class="stack" aria-label="hero">
    <div class="lvl"><span class="big" id="level">Lv 1</span><span class="meta" id="xp">0 / 100 xp</span></div>
    <div class="bar" role="progressbar" aria-label="xp"><i id="fill"></i></div>
    <div class="stats">
      <div><span class="meta">STR</span><b id="str">1</b></div>
      <div><span class="meta">END</span><b id="end">1</b></div>
      <div><span class="meta">AGI</span><b id="agi">1</b></div>
    </div>
  </section>
  <h2>today's quests</h2>
  <ul class="plain" id="quests"></ul>
  <h2>log a workout</h2>
  <div class="seg" id="kinds">
    <button type="button" id="k-str" data-k="str" aria-pressed="true">Strength</button>
    <button type="button" id="k-end" data-k="end" aria-pressed="false">Cardio</button>
    <button type="button" id="k-agi" data-k="agi" aria-pressed="false">Mobility</button>
  </div>
  <div class="row">
    <input id="mins" type="number" inputmode="numeric" min="1" max="300" value="20" aria-label="minutes" style="flex:1">
    <span class="meta">min</span>
    <button type="button" class="primary" id="log" style="flex:2">Log it</button>
  </div>
  <div class="msg meta" id="msg" role="status"></div>
  <h2>log</h2>
  <ul class="plain" id="history"></ul>
  <div class="empty" id="empty">No workouts yet. Log one to earn xp.</div>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const NAMES = { str: 'Strength', end: 'Cardio', agi: 'Mobility' };
  const POOL = [
    { text: 'Any movement, 20 min', kind: null, min: 20 },
    { text: 'Strength, 15 min', kind: 'str', min: 15 },
    { text: 'Cardio, 20 min', kind: 'end', min: 20 },
    { text: 'Mobility, 10 min', kind: 'agi', min: 10 },
    { text: 'Any movement, 40 min', kind: null, min: 40 },
    { text: 'Strength, 30 min', kind: 'str', min: 30 },
    { text: 'Cardio, 30 min', kind: 'end', min: 30 },
    { text: 'Mobility, 20 min', kind: 'agi', min: 20 }
  ];
  const QUEST_XP = 50;

  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const dayNum = () => Math.floor(new Date().setHours(12, 0, 0, 0) / 864e5);
  const quests = () => { const n = dayNum(); return [POOL[0], POOL[1 + n % 3], POOL[4 + n % 4]]; };

  let state = store.get('fitness-rpg', null);
  if (!state || !Array.isArray(state.log)) state = { log: [], claimed: {} };
  let kind = 'str';

  // xp needed to go from level n to n+1
  const need = n => 100 + 50 * (n - 1);
  function levelOf(xp) { let l = 1; while (xp >= need(l)) { xp -= need(l); l++; } return { l, into: xp, next: need(l) }; }
  const minutesToday = k => state.log.filter(e => e.d === today() && (!k || e.k === k)).reduce((a, e) => a + e.m, 0);
  const questDone = q => minutesToday(q.kind) >= q.min;

  function totals() {
    let xp = 0; const st = { str: 0, end: 0, agi: 0 };
    state.log.forEach(e => { xp += e.m * 2; st[e.k] += e.m; });
    Object.keys(state.claimed).forEach(() => { xp += QUEST_XP; });
    return { xp, st };
  }

  function render() {
    const { xp, st } = totals();
    const lv = levelOf(xp);
    $('#level').textContent = 'Lv ' + lv.l;
    $('#xp').textContent = lv.into + ' / ' + lv.next + ' xp';
    $('#fill').style.width = Math.round(lv.into / lv.next * 100) + '%';
    ['str', 'end', 'agi'].forEach(k => { $('#' + k).textContent = 1 + Math.floor(st[k] / 30); });
    $('#quests').innerHTML = '';
    quests().forEach(q => {
      const done = questDone(q);
      const li = document.createElement('li');
      li.className = 'q' + (done ? ' done' : '');
      const mark = document.createElement('span'); mark.className = 'mark'; mark.textContent = done ? '+' : '·';
      const t = document.createElement('span'); t.className = 't'; t.textContent = q.text;
      const x = document.createElement('span'); x.className = 'meta'; x.textContent = '+' + QUEST_XP;
      li.append(mark, t, x);
      $('#quests').append(li);
    });
    const h = $('#history'); h.innerHTML = '';
    state.log.slice(-8).reverse().forEach((e, i, arr) => {
      const idx = state.log.length - 1 - i;
      const li = document.createElement('li');
      const s = document.createElement('span'); s.textContent = NAMES[e.k] + ' ' + e.m + ' min';
      const r = document.createElement('span'); r.className = 'row';
      const m = document.createElement('span'); m.className = 'meta'; m.textContent = '+' + e.m * 2;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'undo'; b.textContent = 'x'; b.setAttribute('aria-label', 'remove');
      b.addEventListener('click', () => { state.log.splice(idx, 1); reconcile(); save(); render(); });
      r.append(m, b); li.append(s, r); h.append(li);
    });
    $('#empty').style.display = state.log.length ? 'none' : '';
  }

  // quest bonus is granted once per day per quest, and revoked if the log no longer supports it
  function reconcile() {
    const keys = {};
    [0, 1, 2].forEach(i => {});
    Object.keys(state.claimed).forEach(k => { if (k.startsWith(today() + ':')) delete state.claimed[k]; });
    quests().forEach((q, i) => { if (questDone(q)) state.claimed[today() + ':' + i] = 1; });
  }
  function save() { store.set('fitness-rpg', state); }

  $$('#kinds button').forEach(b => b.addEventListener('click', () => {
    kind = b.dataset.k;
    $$('#kinds button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));

  $('#log').addEventListener('click', () => {
    const m = Math.round(Number($('#mins').value));
    if (!(m >= 1 && m <= 300)) { $('#msg').textContent = 'Enter 1 to 300 minutes.'; return; }
    const before = levelOf(totals().xp).l;
    state.log.push({ d: today(), k: kind, m });
    reconcile(); save(); render();
    const after = levelOf(totals().xp).l;
    $('#msg').textContent = '+' + m * 2 + ' xp' + (after > before ? ' · level up, Lv ' + after : '');
  });

  reconcile(); render();
})();
</script>
</body>
</html>
