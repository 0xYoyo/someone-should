<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a running app that shows your progress in terms of popular foods</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.meta, .small { font: 16px/1.4 var(--mono); color: var(--meta); }
label { display: block; }
label span { display: block; margin-bottom: 4px; }
.seg button { flex: 1; min-width: 80px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hero { padding: 8px 0 4px; }
.hero .big { display: block; }
.foods li { font-variant-numeric: tabular-nums; }
.foods b { font-weight: 500; }
.err { color: var(--no); min-height: 1.4em; margin: 0; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a running app that shows your progress in terms of popular foods</h1>

<main id="app" class="stack">
  <div class="row seg" role="group" aria-label="units">
    <button id="metric" aria-pressed="true">km / kg</button>
    <button id="imperial" aria-pressed="false">mi / lb</button>
  </div>
  <div class="fields">
    <label><span class="small" id="dl">distance, km</span><input id="dist" type="number" inputmode="decimal" min="0" step="any" value="5"></label>
    <label><span class="small" id="wl">weight, kg</span><input id="wt" type="number" inputmode="decimal" min="0" step="any" value="70"></label>
  </div>
  <p class="err" id="err" role="status"></p>
  <div class="hero">
    <span class="big" id="hero">1.5 donuts</span>
    <span class="small" id="kcal">363 kcal burned</span>
  </div>
  <ul class="plain foods" id="foods"></ul>
  <div class="row">
    <button class="primary" id="log">log this run</button>
    <button id="clear">clear total</button>
  </div>
  <p class="small" id="total"></p>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  // kcal per item (typical USDA values)
  const FOODS = [
    ['donut', 'donuts', 250],
    ['slice of pizza', 'slices of pizza', 285],
    ['cheeseburger', 'cheeseburgers', 300],
    ['banana', 'bananas', 105],
    ['can of cola', 'cans of cola', 140],
    ['chocolate bar', 'chocolate bars', 230]
  ];
  const KM_PER_MI = 1.609344, KG_PER_LB = 0.45359237;
  // running cost: about 1.036 kcal per kg per km
  const KCAL_KG_KM = 1.036;

  let imperial = store.get('imperial', false);
  let totalKcal = store.get('totalKcal', 0);
  if (typeof totalKcal !== 'number' || !isFinite(totalKcal) || totalKcal < 0) totalKcal = 0;
  const saved = store.get('weight', null);
  if (typeof saved === 'number' && saved > 0) $('#wt').value = saved;

  const fmt = n => n >= 10 ? String(Math.round(n)) : (Math.round(n * 10) / 10).toString();
  const noun = (f, n) => (Math.abs(n - 1) < 0.05 ? f[0] : f[1]);

  function current() {
    const d = parseFloat($('#dist').value), w = parseFloat($('#wt').value);
    if (!(d >= 0) || !(w > 0)) return null;
    const km = imperial ? d * KM_PER_MI : d;
    const kg = imperial ? w * KG_PER_LB : w;
    return km * kg * KCAL_KG_KM;
  }

  function list(kcal) {
    $('#foods').innerHTML = FOODS.slice(1).map(f => {
      const n = kcal / f[2];
      return '<li><span>' + noun(f, n) + '</span><b>' + fmt(n) + '</b></li>';
    }).join('');
  }

  function render() {
    $('#metric').setAttribute('aria-pressed', String(!imperial));
    $('#imperial').setAttribute('aria-pressed', String(imperial));
    $('#dl').textContent = 'distance, ' + (imperial ? 'mi' : 'km');
    $('#wl').textContent = 'weight, ' + (imperial ? 'lb' : 'kg');
    const kcal = current();
    if (kcal == null) {
      $('#err').textContent = 'Enter a distance and a weight.';
      return;
    }
    $('#err').textContent = '';
    const d = FOODS[0], n = kcal / d[2];
    $('#hero').textContent = fmt(n) + ' ' + noun(d, n);
    $('#kcal').textContent = Math.round(kcal) + ' kcal burned';
    list(kcal);
    renderTotal();
  }

  function renderTotal() {
    const t = $('#total');
    if (totalKcal <= 0) { t.textContent = 'Nothing logged yet.'; return; }
    const n = totalKcal / FOODS[0][2];
    t.textContent = 'Logged so far: ' + fmt(n) + ' ' + noun(FOODS[0], n) + ' (' + Math.round(totalKcal) + ' kcal)';
  }

  function setUnits(v) {
    if (v === imperial) return;
    const d = parseFloat($('#dist').value), w = parseFloat($('#wt').value);
    if (d >= 0) $('#dist').value = fmt2(v ? d / KM_PER_MI : d * KM_PER_MI);
    if (w > 0) $('#wt').value = fmt2(v ? w / KG_PER_LB : w * KG_PER_LB);
    imperial = v;
    store.set('imperial', imperial);
    render();
  }
  const fmt2 = n => String(Math.round(n * 100) / 100);

  $('#metric').onclick = () => setUnits(false);
  $('#imperial').onclick = () => setUnits(true);
  $('#dist').oninput = render;
  $('#wt').oninput = () => {
    const w = parseFloat($('#wt').value);
    if (w > 0) store.set('weight', w);
    render();
  };
  $('#log').onclick = () => {
    const k = current();
    if (k == null) { $('#err').textContent = 'Enter a distance and a weight.'; return; }
    totalKcal += k;
    store.set('totalKcal', totalKcal);
    renderTotal();
  };
  $('#clear').onclick = () => { totalKcal = 0; store.set('totalKcal', 0); renderTotal(); };

  render();
})();
</script>
</body>
</html>
