<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a tool that views files as hex</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


.btn { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); border-radius: var(--radius); cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--paper); }
#file { display: none; }
.row > input { flex: 1 1 140px; width: auto; min-width: 0; }
.row > select { width: auto; flex: 0 0 auto; }
textarea { min-height: 88px; resize: vertical; font-family: var(--mono); }
#drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 12px; }
#drop.over { border-color: var(--ink); }
#status { font: 16px/1.4 var(--mono); color: var(--meta); min-height: 22px; overflow-wrap: anywhere; }
#pane { position: relative; height: 60vh; min-height: 240px; overflow: auto; border: 1.5px solid var(--line); border-radius: var(--radius); }
#pane[hidden] { display: none; }
#spacer { width: 1px; }
#view { position: absolute; left: 0; top: 0; margin: 0; padding: 0 10px; font: 16px/24px var(--mono); white-space: pre; }
#view .o { color: var(--meta); }
#view .b { cursor: pointer; }
#view .hit { background: var(--ink); color: var(--paper); }
#view .sel { outline: 2px solid var(--ink); outline-offset: -1px; }
#view .a { color: var(--meta); }

</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a tool that views files as hex</h1>

<main id="app" class="stack">
  <div id="drop" class="stack">
    <div class="row">
      <label class="btn primary" for="file">Open file</label>
      <input type="file" id="file">
      <span class="meta" style="font-size:16px">or drop one here, or paste text</span>
    </div>
    <textarea id="text" aria-label="Text to view as bytes" placeholder="text to view as bytes"></textarea>
    <div class="row"><button id="load-text" type="button">View text as hex</button></div>
  </div>

  <div class="row">
    <input id="goto" inputmode="text" autocomplete="off" aria-label="Offset" placeholder="offset, e.g. 0x1f0 or 496">
    <button id="jump" type="button">Go</button>
  </div>
  <div class="row">
    <input id="q" autocomplete="off" aria-label="Search" placeholder="search">
    <select id="mode" aria-label="Search as"><option value="text">text</option><option value="hex">hex bytes</option></select>
    <button id="find" type="button">Find next</button>
  </div>

  <div id="status" aria-live="polite">No file open.</div>
  <div id="pane" hidden><div id="spacer"></div><pre id="view"></pre></div>
</main>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);

  const ROW_H = 24;
  const pane = $('#pane'), view = $('#view'), spacer = $('#spacer'), status = $('#status');
  let bytes = new Uint8Array(0);
  let name = '';
  let perRow = 16;
  let offDigits = 8;
  let hit = null;   // {start, len}
  let sel = -1;     // selected byte offset

  const hex2 = n => n.toString(16).padStart(2, '0');
  const hexOff = n => n.toString(16).padStart(offDigits, '0');
  const esc = c => c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '&' ? '&amp;' : c;
  const printable = b => (b >= 0x20 && b < 0x7f) ? String.fromCharCode(b) : '.';
  const say = t => { status.textContent = t; };

  function fitRow() {
    // 16 bytes per row when the line fits, otherwise 8 (pane scrolls sideways)
    const ch = 9.7;
    const need16 = (offDigits + 2 + 16 * 3 + 1 + 16) * ch + 24;
    perRow = pane.clientWidth >= need16 ? 16 : 8;
  }

  function load(buf, label) {
    bytes = new Uint8Array(buf);
    name = label;
    hit = null; sel = -1;
    offDigits = Math.max(4, Math.ceil(Math.log2(Math.max(bytes.length, 2)) / 4));
    pane.hidden = false;
    fitRow();
    pane.scrollTop = 0;
    layout();
    say(bytes.length ? `${name} · ${bytes.length.toLocaleString()} bytes (0x${bytes.length.toString(16)})` : `${name} is empty.`);
  }

  function layout() {
    const rows = Math.ceil(bytes.length / perRow);
    spacer.style.height = rows * ROW_H + 'px';
    render();
  }

  function render() {
    if (pane.hidden) return;
    const first = Math.floor(pane.scrollTop / ROW_H);
    const count = Math.ceil(pane.clientHeight / ROW_H) + 2;
    const last = Math.min(Math.ceil(bytes.length / perRow), first + count);
    let out = '';
    for (let r = first; r < last; r++) {
      const base = r * perRow;
      let hx = '', asc = '';
      for (let i = 0; i < perRow; i++) {
        const p = base + i;
        if (i) hx += ' ';
        if (p >= bytes.length) { hx += '  '; asc += ' '; continue; }
        const b = bytes[p];
        let cls = 'b';
        if (hit && p >= hit.start && p < hit.start + hit.len) cls += ' hit';
        if (p === sel) cls += ' sel';
        hx += `<span class="${cls}" data-p="${p}">${hex2(b)}</span>`;
        asc += `<span class="${cls}" data-p="${p}">${esc(printable(b))}</span>`;
      }
      out += `<span class="o">${hexOff(base)}</span>  ${hx}  <span class="a">${asc}</span>\n`;
    }
    view.style.top = first * ROW_H + 'px';
    view.innerHTML = out;
  }

  function reveal(p) {
    const row = Math.floor(p / perRow);
    const top = row * ROW_H;
    if (top < pane.scrollTop || top + ROW_H > pane.scrollTop + pane.clientHeight) {
      pane.scrollTop = Math.max(0, top - ROW_H * 2);
    }
    render();
  }

  function describe(p) {
    const b = bytes[p];
    return `offset 0x${p.toString(16)} (${p}) · 0x${hex2(b)} · ${b} · ${b.toString(2).padStart(8, '0')} · '${printable(b)}'`;
  }

  function parseOffset(s) {
    s = s.trim().toLowerCase();
    if (!s) return NaN;
    if (/^0x[0-9a-f]+$/.test(s)) return parseInt(s.slice(2), 16);
    if (/^[0-9]+$/.test(s)) return parseInt(s, 10);
    if (/^[0-9a-f]+h?$/.test(s)) return parseInt(s.replace(/h$/, ''), 16);
    return NaN;
  }

  function jump() {
    if (!bytes.length) return say('Open a file first.');
    const p = parseOffset($('#goto').value);
    if (!Number.isFinite(p)) return say('Offset must be a number, like 0x1f0 or 496.');
    if (p >= bytes.length) return say(`Past the end: file is ${bytes.length} bytes.`);
    sel = p; hit = null;
    reveal(p);
    say(describe(p));
  }

  function needle() {
    const q = $('#q').value;
    if ($('#mode').value === 'hex') {
      const clean = q.replace(/0x/gi, '').replace(/[\s,:-]/g, '');
      if (!clean || clean.length % 2 || /[^0-9a-f]/i.test(clean)) return null;
      return Uint8Array.from(clean.match(/../g), h => parseInt(h, 16));
    }
    return q ? new TextEncoder().encode(q) : null;
  }

  function indexOf(n, from) {
    const len = bytes.length - n.length;
    outer: for (let i = from; i <= len; i++) {
      if (bytes[i] !== n[0]) continue;
      for (let j = 1; j < n.length; j++) if (bytes[i + j] !== n[j]) continue outer;
      return i;
    }
    return -1;
  }

  function find() {
    if (!bytes.length) return say('Open a file first.');
    const n = needle();
    if (!n) return say($('#mode').value === 'hex' ? 'Hex search needs byte pairs, like de ad be ef.' : 'Type something to search for.');
    const from = hit ? hit.start + 1 : (sel >= 0 ? sel : 0);
    let at = indexOf(n, from);
    let wrapped = false;
    if (at < 0 && from > 0) { at = indexOf(n, 0); wrapped = at >= 0; }
    if (at < 0) { hit = null; render(); return say('Not found.'); }
    hit = { start: at, len: n.length }; sel = at;
    reveal(at);
    say(`Found at offset 0x${at.toString(16)} (${at})${wrapped ? ', wrapped to start' : ''}`);
  }

  async function openFile(f) {
    if (!f) return;
    say('Reading…');
    try { load(await f.arrayBuffer(), f.name); }
    catch { say('Could not read that file.'); }
  }

  $('#file').addEventListener('change', e => openFile(e.target.files[0]));
  $('#load-text').addEventListener('click', () => {
    const t = $('#text').value;
    if (!t) return say('Paste some text first.');
    load(new TextEncoder().encode(t).buffer, 'pasted text');
  });
  $('#jump').addEventListener('click', jump);
  $('#find').addEventListener('click', find);
  $('#goto').addEventListener('keydown', e => { if (e.key === 'Enter') jump(); });
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') find(); });
  $('#q').addEventListener('input', () => { hit = null; });
  $('#mode').addEventListener('change', () => { hit = null; });

  view.addEventListener('click', e => {
    const t = e.target.closest('[data-p]');
    if (!t) return;
    sel = +t.dataset.p;
    render();
    say(describe(sel));
  });

  let raf = 0;
  pane.addEventListener('scroll', () => {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; render(); });
  });
  addEventListener('resize', () => {
    if (pane.hidden) return;
    const keep = Math.floor(pane.scrollTop / ROW_H) * perRow;
    fitRow(); layout();
    pane.scrollTop = Math.floor(keep / perRow) * ROW_H;
  });

  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  document.addEventListener('drop', e => openFile(e.dataTransfer && e.dataTransfer.files[0]));
})();
</script>
</body>
</html>
