<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a tool that plots math equations in 3D</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }



.meta { font-size: 16px; }
label.meta { display: grid; gap: 4px; }
#eqrow { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
#eqrow > span { font: 500 18px var(--mono); }
#eq { font-family: var(--mono); }
.ranges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ranges input { padding: 10px 6px; text-align: center; }
#wrap { position: relative; border: 1.5px solid var(--line); border-radius: var(--radius); touch-action: none; }
#cv { display: block; width: 100%; aspect-ratio: 1 / 1; cursor: grab; touch-action: none; }
#msg { min-height: 1.45em; }
#msg.err { color: var(--no); }
#ctl { flex-wrap: nowrap; gap: 8px; }
#ctl button { flex: 1; padding: 0; min-width: 44px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; }
.presets button { font-family: var(--mono); padding: 0 12px; }

</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a tool that plots math equations in 3D</h1>

<main id="app" class="stack">
<form id="f" class="stack" autocomplete="off">
<div id="eqrow"><span>z =</span><input id="eq" type="text" spellcheck="false" autocapitalize="off" aria-label="z = f(x, y)" placeholder="sin(x) * cos(y)"><button id="plot" class="primary" type="submit">Plot</button></div>
<div class="ranges">
<label class="meta">x min<input id="x0" type="text" inputmode="decimal" value="-5"></label>
<label class="meta">x max<input id="x1" type="text" inputmode="decimal" value="5"></label>
<label class="meta">y min<input id="y0" type="text" inputmode="decimal" value="-5"></label>
<label class="meta">y max<input id="y1" type="text" inputmode="decimal" value="5"></label>
</div>
</form>
<div id="wrap"><canvas id="cv" aria-label="3D surface, drag to rotate"></canvas></div>
<div id="msg" class="meta" aria-live="polite"></div>
<div class="row" id="ctl"><button id="rl" type="button" aria-label="rotate left">&#8634;</button><button id="rr" type="button" aria-label="rotate right">&#8635;</button><button id="tu" type="button" aria-label="tilt up">&#8593;</button><button id="td" type="button" aria-label="tilt down">&#8595;</button><button id="zi" type="button" aria-label="zoom in">+</button><button id="zo" type="button" aria-label="zoom out">&minus;</button></div>
<div class="presets" id="presets">
<button type="button">sin(x)*cos(y)</button>
<button type="button">x^2 - y^2</button>
<button type="button">sin(sqrt(x^2+y^2))</button>
<button type="button">exp(-(x^2+y^2)/8)*4</button>
<button type="button">x*y/5</button>
</div>
</main>

<script>
(() => {
  'use strict';
  // storage helper — never throws
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];


  // ---- expression parser (no eval: CSP forbids it) ----
  const FN = { sin: Math.sin, cos: Math.cos, tan: Math.tan, asin: Math.asin, acos: Math.acos, atan: Math.atan,
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh, sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs, exp: Math.exp,
    ln: Math.log, log: Math.log10, log2: Math.log2, floor: Math.floor, ceil: Math.ceil, round: Math.round, sign: Math.sign,
    sec: v => 1 / Math.cos(v), csc: v => 1 / Math.sin(v), cot: v => 1 / Math.tan(v),
    min: Math.min, max: Math.max, pow: Math.pow, atan2: Math.atan2, hypot: Math.hypot, mod: (a, b) => a - b * Math.floor(a / b) };
  const CONST = { pi: Math.PI, e: Math.E, tau: 2 * Math.PI };

  function tokenize(s) {
    const out = []; let i = 0;
    s = s.replace(/×|·/g, '*').replace(/−/g, '-').replace(/π/g, 'pi').replace(/\*\*/g, '^');
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      let m = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i));
      if (m) { out.push({ t: 'n', v: parseFloat(m[0]) }); i += m[0].length; continue; }
      m = /^[a-z_][a-z0-9_]*/i.exec(s.slice(i));
      if (m) { splitIdent(m[0].toLowerCase(), out); i += m[0].length; continue; }
      if ('+-*/^(),'.includes(c)) { out.push({ t: c }); i++; continue; }
      if (c === '[' || c === '{') { out.push({ t: '(' }); i++; continue; }
      if (c === ']' || c === '}') { out.push({ t: ')' }); i++; continue; }
      throw new Error('unexpected "' + c + '"');
    }
    return out;
  }
  // "xy" -> x*y, "xsin" -> x*sin, "pix" -> pi*x
  function splitIdent(w, out) {
    while (w) {
      if (FN[w] || CONST[w] || w === 'x' || w === 'y') { out.push({ t: 'id', v: w }); return; }
      const names = [...Object.keys(FN), ...Object.keys(CONST), 'x', 'y'].sort((a, b) => b.length - a.length);
      const hit = names.find(n => w.startsWith(n));
      if (!hit) throw new Error('unknown name "' + w + '"');
      out.push({ t: 'id', v: hit }); w = w.slice(hit.length);
    }
  }

  function parse(src) {
    const tk = tokenize(src); let p = 0;
    if (!tk.length) throw new Error('empty');
    const peek = () => tk[p], eat = t => { if (tk[p] && tk[p].t === t) return tk[p++]; throw new Error(t === ')' ? 'missing ")"' : 'expected "' + t + '"'); };
    const startsAtom = k => k && (k.t === 'n' || k.t === 'id' || k.t === '(');
    function expr() {
      let a = term();
      while (peek() && (peek().t === '+' || peek().t === '-')) {
        const op = tk[p++].t, l = a, r = term();
        a = op === '+' ? (x, y) => l(x, y) + r(x, y) : (x, y) => l(x, y) - r(x, y);
      }
      return a;
    }
    function term() {
      let a = unary();
      for (;;) {
        const k = peek();
        if (k && (k.t === '*' || k.t === '/')) {
          p++; const l = a, r = unary();
          a = k.t === '*' ? (x, y) => l(x, y) * r(x, y) : (x, y) => l(x, y) / r(x, y);
        } else if (startsAtom(k)) { const l = a, r = power(); a = (x, y) => l(x, y) * r(x, y); }
        else return a;
      }
    }
    function unary() {
      if (peek() && peek().t === '-') { p++; const a = unary(); return (x, y) => -a(x, y); }
      if (peek() && peek().t === '+') { p++; return unary(); }
      return power();
    }
    function power() {
      const b = atom();
      if (peek() && peek().t === '^') { p++; const e = unary(); return (x, y) => Math.pow(b(x, y), e(x, y)); }
      return b;
    }
    function atom() {
      const k = tk[p++];
      if (!k) throw new Error('unfinished expression');
      if (k.t === 'n') { const v = k.v; return () => v; }
      if (k.t === '(') { const a = expr(); eat(')'); return a; }
      if (k.t === 'id') {
        if (k.v === 'x') return x => x;
        if (k.v === 'y') return (x, y) => y;
        if (k.v in CONST) { const v = CONST[k.v]; return () => v; }
        const f = FN[k.v];
        if (peek() && peek().t === '(') {
          p++; const args = [expr()];
          while (peek() && peek().t === ',') { p++; args.push(expr()); }
          eat(')');
          if (args.length === 1) { const a = args[0]; return (x, y) => f(a(x, y)); }
          return (x, y) => f(...args.map(a => a(x, y)));
        }
        // sin x  ->  sin(x)
        const a = power(); return (x, y) => f(a(x, y));
      }
      throw new Error('unexpected "' + k.t + '"');
    }
    const fn = expr();
    if (p < tk.length) throw new Error('unexpected "' + (tk[p].v ?? tk[p].t) + '"');
    return fn;
  }

  // ---- state ----
  const N = 44;
  const cv = $('#cv'), ctx = cv.getContext('2d'), msg = $('#msg');
  const st = store.get('eq3d', null) || {};
  const view = { yaw: st.yaw ?? -0.65, pitch: st.pitch ?? 0.55, zoom: st.zoom ?? 1 };
  let mesh = null;
  $('#eq').value = st.eq ?? 'sin(x) * cos(y)';
  for (const k of ['x0', 'x1', 'y0', 'y1']) if (st[k] != null) $('#' + k).value = st[k];

  const num = id => {
    const v = $('#' + id).value.trim().toLowerCase().replace(/−/g, '-');
    try { const f = parse(v); const n = f(0, 0); if (isFinite(n)) return n; } catch {}
    throw new Error(id[0] + ' range: "' + v + '" is not a number');
  };
  const fmt = v => { if (!isFinite(v)) return String(v); const a = Math.abs(v); return (a !== 0 && (a < 1e-3 || a >= 1e5)) ? v.toExponential(2) : String(+v.toFixed(3)); };

  function say(t, err) { msg.textContent = t; msg.className = 'meta' + (err ? ' err' : ''); }

  function build() {
    let f, x0, x1, y0, y1;
    try {
      f = parse($('#eq').value);
      x0 = num('x0'); x1 = num('x1'); y0 = num('y0'); y1 = num('y1');
      if (!(x1 > x0) || !(y1 > y0)) throw new Error('max must be larger than min');
    } catch (e) { say(e.message, true); return false; }
    const z = new Float64Array((N + 1) * (N + 1));
    let lo = Infinity, hi = -Infinity, bad = 0;
    for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
      const x = x0 + (x1 - x0) * i / N, y = y0 + (y1 - y0) * j / N;
      let v; try { v = f(x, y); } catch { v = NaN; }
      if (typeof v !== 'number' || !isFinite(v)) { v = NaN; bad++; } else { if (v < lo) lo = v; if (v > hi) hi = v; }
      z[j * (N + 1) + i] = v;
    }
    if (lo === Infinity) { say('undefined everywhere in this range', true); mesh = null; draw(); return false; }
    // clip extreme spikes so one pole does not flatten the surface
    const sorted = [...z].filter(v => v === v).sort((a, b) => a - b);
    const q = k => sorted[Math.min(sorted.length - 1, Math.max(0, Math.round(k * (sorted.length - 1))))];
    let clo = lo, chi = hi;
    const iqr = q(0.98) - q(0.02);
    if (hi - lo > 8 * (iqr || 1)) { clo = q(0.02) - iqr * 0.5; chi = q(0.98) + iqr * 0.5; }
    mesh = { z, x0, x1, y0, y1, lo, hi, clo, chi };
    say('z from ' + fmt(lo) + ' to ' + fmt(hi) + (bad ? ' · undefined at ' + bad + ' points' : '') + (clo > lo || chi < hi ? ' · spikes clipped' : ''));
    store.set('eq3d', { eq: $('#eq').value, x0: $('#x0').value, x1: $('#x1').value, y0: $('#y0').value, y1: $('#y1').value, ...view });
    draw();
    return true;
  }

  function size() {
    const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * d); cv.height = Math.round(r.width * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    return r.width;
  }

  let W = 0;
  function draw() {
    if (!W) W = size();
    const css = getComputedStyle(document.documentElement);
    const ink = css.getPropertyValue('--ink').trim(), meta = css.getPropertyValue('--meta').trim(), line = css.getPropertyValue('--line').trim();
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    ctx.clearRect(0, 0, W, W);
    if (!mesh) return;
    const { z, x0, x1, y0, y1, clo, chi } = mesh;
    const cy = Math.cos(view.yaw), sy = Math.sin(view.yaw), cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
    const S = W * 0.27 * view.zoom, D = 4.5;
    // model space: x,y in [-1,1], z in [-0.7,0.7]
    const nz = v => v !== v ? NaN : ((Math.min(chi, Math.max(clo, v)) - clo) / ((chi - clo) || 1) - 0.5) * 1.4;
    const proj = (X, Y, Z) => {
      const a = X * cy - Y * sy, b = X * sy + Y * cy;   // yaw about z
      const depth = -(b * cp + Z * sp), up = Z * cp - b * sp; // pitch
      const k = D / (D + depth);
      return [W / 2 + a * S * k, W / 2 - up * S * k, depth];
    };
    const M = N + 1, P = new Array(M * M);
    for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) {
      const Z = nz(z[j * M + i]);
      P[j * M + i] = Z === Z ? proj(-1 + 2 * i / N, -1 + 2 * j / N, Z) : null;
    }
    // bounding box, back edges first
    const corners = [];
    for (const zz of [-0.7, 0.7]) for (const yy of [-1, 1]) for (const xx of [-1, 1]) corners.push(proj(xx, yy, zz));
    const edges = [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
    ctx.lineWidth = 1; ctx.strokeStyle = line;
    for (const [a, b] of edges) { ctx.beginPath(); ctx.moveTo(corners[a][0], corners[a][1]); ctx.lineTo(corners[b][0], corners[b][1]); ctx.stroke(); }

    const quads = [];
    const L = [0.35, -0.45, 0.82];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const a = P[j * M + i], b = P[j * M + i + 1], c = P[(j + 1) * M + i + 1], d = P[(j + 1) * M + i];
      if (!a || !b || !c || !d) continue;
      const za = nz(z[j * M + i]), zb = nz(z[j * M + i + 1]), zc = nz(z[(j + 1) * M + i + 1]), zd = nz(z[(j + 1) * M + i]);
      const h = 2 / N;
      // normal from the two diagonals
      const ux = h, uy = h, uz = zc - za, vx = -h, vy = h, vz = zd - zb;
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nzz = ux * vy - uy * vx;
      const nl = Math.hypot(nx, ny, nzz) || 1; nx /= nl; ny /= nl; nzz /= nl;
      const lum = Math.abs(nx * L[0] + ny * L[1] + nzz * L[2]);
      const t = ((za + zb + zc + zd) / 4 + 0.7) / 1.4;
      quads.push([a[2] + b[2] + c[2] + d[2], a, b, c, d, lum, t]);
    }
    quads.sort((p, q) => q[0] - p[0]);
    for (const [, a, b, c, d, lum, t] of quads) {
      // height tint: cool low, warm high; shade by light
      const s = 0.35 + 0.65 * lum;
      const base = dark ? [70 + 120 * t, 90 + 60 * (1 - Math.abs(t - 0.5) * 2), 190 - 120 * t] : [60 + 160 * t, 100 + 70 * (1 - Math.abs(t - 0.5) * 2), 200 - 140 * t];
      ctx.fillStyle = 'rgb(' + base.map(v => Math.round(v * s)).join(',') + ')';
      ctx.strokeStyle = dark ? 'rgba(0,0,0,.25)' : 'rgba(20,20,20,.18)';
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
    // axis labels on the near-bottom edges
    ctx.fillStyle = meta; ctx.font = '13px ' + css.getPropertyValue('--mono');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lab = (X, Y, Z, t) => { const q = proj(X, Y, Z); ctx.fillText(t, q[0], q[1]); };
    // put tick labels on the edges nearest the viewer
    const ny_ = proj(0, -1, -0.7)[2] < proj(0, 1, -0.7)[2] ? -1.25 : 1.25, nx_ = proj(-1, 0, -0.7)[2] < proj(1, 0, -0.7)[2] ? -1.25 : 1.25;
    lab(-0.8, ny_, -0.7, fmt(x0)); lab(0.8, ny_, -0.7, fmt(x1)); lab(0, ny_ * 1.15, -0.7, 'x');
    lab(nx_, -0.8, -0.7, fmt(y0)); lab(nx_, 0.8, -0.7, fmt(y1)); lab(nx_ * 1.15, 0, -0.7, 'y');
    // z range on the vertical edge furthest left on screen
    let zc = [-1, -1], best = Infinity;
    for (const xx of [-1, 1]) for (const yy of [-1, 1]) { const q = proj(xx, yy, 0); if (q[0] < best) { best = q[0]; zc = [xx, yy]; } }
    ctx.fillStyle = ink; ctx.textAlign = 'left';
    const zt = (Z, t) => { const q = proj(zc[0], zc[1], Z); ctx.fillText(t, Math.max(2, q[0] - ctx.measureText(t).width - 8), q[1]); };
    zt(0.7, 'z ' + fmt(mesh.chi < mesh.hi ? mesh.chi : mesh.hi));
    zt(-0.7, fmt(mesh.clo > mesh.lo ? mesh.clo : mesh.lo));
  }

  // ---- interaction ----
  let raf = 0;
  const redraw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };
  const saveView = () => { const s = store.get('eq3d', {}) || {}; store.set('eq3d', { ...s, ...view }); };
  const clampPitch = () => { view.pitch = Math.max(-1.5, Math.min(1.5, view.pitch)); };
  const ptrs = new Map(); let pinch = 0;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; });
  cv.addEventListener('pointermove', e => {
    const prev = ptrs.get(e.pointerId); if (!prev) return;
    if (ptrs.size === 1) {
      view.yaw -= (e.clientX - prev[0]) * 0.01; view.pitch += (e.clientY - prev[1]) * 0.01; clampPitch();
    } else {
      const [p1, p2] = [...ptrs.values()];
      const before = Math.hypot(p1[0] - p2[0], p1[1] - p2[1]);
      ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      const [q1, q2] = [...ptrs.values()];
      const after = Math.hypot(q1[0] - q2[0], q1[1] - q2[1]);
      if (pinch && before) view.zoom = Math.max(0.4, Math.min(4, view.zoom * after / before));
      pinch = 1;
    }
    ptrs.set(e.pointerId, [e.clientX, e.clientY]); redraw();
  });
  const up = e => { if (ptrs.delete(e.pointerId)) saveView(); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); view.zoom = Math.max(0.4, Math.min(4, view.zoom * Math.exp(-e.deltaY * 0.0015))); redraw(); saveView(); }, { passive: false });

  const nudge = (k, d) => () => { view[k] += d; clampPitch(); if (k === 'zoom') view.zoom = Math.max(0.4, Math.min(4, view.zoom)); redraw(); saveView(); };
  $('#rl').onclick = nudge('yaw', 0.3); $('#rr').onclick = nudge('yaw', -0.3);
  $('#tu').onclick = nudge('pitch', 0.2); $('#td').onclick = nudge('pitch', -0.2);
  $('#zi').onclick = () => { view.zoom = Math.min(4, view.zoom * 1.2); redraw(); saveView(); };
  $('#zo').onclick = () => { view.zoom = Math.max(0.4, view.zoom / 1.2); redraw(); saveView(); };

  $('#f').addEventListener('submit', e => { e.preventDefault(); build(); });
  $('#presets').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $('#eq').value = b.textContent; build(); });
  addEventListener('resize', () => { W = 0; redraw(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);

  requestAnimationFrame(build);
})();
</script>
</body>
</html>
