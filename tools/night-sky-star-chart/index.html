<title>someone should make an app that draws star charts</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
main { max-width: 560px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label { display: grid; gap: 4px; min-width: 0; }
label input { min-width: 0; max-width: 100%; }
label span { font: 13px/1.4 var(--mono); color: var(--meta); }
select { appearance: none; }
select option { background: var(--paper); color: var(--ink); }
.row button { flex: 1 1 auto; }
#chart { width: 100%; height: auto; display: block; color: var(--ink); }
#chart .sky { fill: none; stroke: var(--ink); stroke-width: 1.2; }
#chart .grid { fill: none; stroke: var(--line); stroke-width: 0.8; }
#chart .cl { stroke: var(--meta); stroke-width: 0.9; opacity: .7; fill: none; }
#chart .st { fill: var(--ink); }
#chart text { font: 13px var(--sans); fill: var(--ink); }
#chart text.cn { fill: var(--meta); font-style: italic; }
#chart text.card { font: 600 14px var(--mono); }
#msg:empty { display: none; }
#msg { color: var(--no); margin: 0; }
#summary { margin: 0; }
#up { margin: 0; color: var(--meta); font-size: 16px; }
a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); min-width: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); border-radius: var(--radius); color: var(--ink); text-decoration: none; flex: 1 1 auto; }
@media print {
  h1, .controls, .actions, #msg { display: none; }
  body { padding: 0; }
}

  const RAD = Math.PI / 180;
  const C = 200, R = 178;
  const svgNS = document.getElementById('chart').namespaceURI;

  function julianDay(ms) { return ms / 86400000 + 2440587.5; }

  // Local sidereal time in degrees for a UTC timestamp and east longitude.
  function lst(ms, lon) {
    const d = julianDay(ms) - 2451545.0;
    const t = d / 36525;
    const g = 280.46061837 + 360.98564736629 * d + 0.000387933 * t * t;
    return ((g + lon) % 360 + 360) % 360;
  }

  function altAz(raDeg, decDeg, latDeg, lstDeg) {
    const H = (lstDeg - raDeg) * RAD, d = decDeg * RAD, p = latDeg * RAD;
    const sinAlt = Math.sin(p) * Math.sin(d) + Math.cos(p) * Math.cos(d) * Math.cos(H);
    const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
    const az = Math.atan2(-Math.sin(H) * Math.cos(d), Math.cos(p) * Math.sin(d) - Math.sin(p) * Math.cos(d) * Math.cos(H));
    return { alt: alt / RAD, az: ((az / RAD) + 360) % 360 };
  }

  // Looking up: north at top, east on the left. Stereographic keeps shapes true.
  function project(alt, az) {
    const r = R * Math.tan((90 - alt) * RAD / 2);
    return [C - r * Math.sin(az * RAD), C - r * Math.cos(az * RAD)];
  }

  function el(tag, attrs, text) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }

  const f = n => n.toFixed(1);

  function draw(lat, lon, ms) {

    svg.textContent = '';
    const L = lst(ms, lon);
    const pos = new Map();
    let count = 0;
    for (const s of stars.values()) {
      const h = altAz(s.ra, s.dec, lat, L);
      pos.set(s.name, h);
      if (h.alt > 0) count++;
    }

    svg.appendChild(el('circle', { class: 'grid', cx: C, cy: C, r: f(R * Math.tan(30 * RAD / 2)) }));
    svg.appendChild(el('circle', { class: 'grid', cx: C, cy: C, r: f(R * Math.tan(60 * RAD / 2)) }));
    svg.appendChild(el('circle', { class: 'sky', cx: C, cy: C, r: R }));

    const clip = el('clipPath', { id: 'skyclip' });
    clip.appendChild(el('circle', { cx: C, cy: C, r: R }));
    svg.appendChild(clip);
    const g = el('g', { 'clip-path': 'url(#skyclip)' });
    svg.appendChild(g);

    const upNames = [];
    for (const fig of figures) {
      for (const chain of fig.chains) {
        if (chain.length < 2) continue;
        const pts = chain.map(n => pos.get(n));
        // break the line where it dips well below the horizon
        let seg = [];
        const flush = () => { if (seg.length > 1) g.appendChild(el('polyline', { class: 'cl', points: seg.join(' ') })); seg = []; };
        for (const p of pts) {
          if (p.alt > -10) { const [x, y] = project(p.alt, p.az); seg.push(f(x) + ',' + f(y)); } else flush();
        }
        flush();
      }
      const vis = fig.members.filter(n => pos.get(n).alt > 0);
      if (vis.length && vis.length * 2 >= fig.members.length) {
        upNames.push(fig.name);
        let sx = 0, sy = 0;
        for (const n of vis) { const p = pos.get(n); const [x, y] = project(p.alt, p.az); sx += x; sy += y; }
        const x = sx / vis.length, y = sy / vis.length + 14;
        g.appendChild(el('text', { class: 'cn', x: f(x), y: f(y), 'text-anchor': 'middle' }, fig.name));
      }
    }

    for (const s of stars.values()) {
      const p = pos.get(s.name);
      if (p.alt <= 0) continue;
      const [x, y] = project(p.alt, p.az);
      const r = Math.max(0.9, 3.4 - 0.6 * s.mag);
      g.appendChild(el('circle', { class: 'st', cx: f(x), cy: f(y), r: f(r) }));
      if (s.mag <= 1.2) {
        const left = x > C + 60;
        g.appendChild(el('text', { x: f(x + (left ? -6 : 6)), y: f(y - 4), 'text-anchor': left ? 'end' : 'start' }, s.name.replace('_', ' ')));
      }
    }

    const card = [['N', 0], ['E', 90], ['S', 180], ['W', 270]];
    for (const [t, az] of card) {
      const x = C - (R + 11) * Math.sin(az * RAD), y = C - (R + 11) * Math.cos(az * RAD) + 5;
      svg.appendChild(el('text', { class: 'card', x: f(x), y: f(y), 'text-anchor': 'middle' }, t));
    }

    const when = new Date(ms);
    const label = `${lat.toFixed(2)}, ${lon.toFixed(2)} · ${when.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}`;
    svg.appendChild(el('title', {}, label));
    $('#summary').textContent = `${count} stars above the horizon · ${label}`;
    $('#up').textContent = upNames.length ? 'Up: ' + upNames.join(', ') : 'No catalog constellations above the horizon.';
    updateSave(label);
  }

  function updateSave(label) {
    const clone = $('#chart').cloneNode(true);
    clone.setAttribute('width', '800');
    clone.setAttribute('height', '800');
    const style = el('style', {}, `text{font:13px sans-serif;fill:#141414}.cn{fill:#6b6b6b;font-style:italic}.card{font:600 14px monospace}.sky{fill:none;stroke:#141414;stroke-width:1.2}.grid{fill:none;stroke:#d9d4c7;stroke-width:.8}.cl{stroke:#6b6b6b;stroke-width:.9;fill:none}.st{fill:#141414}`);
    clone.insertBefore(style, clone.firstChild);
    clone.insertBefore(el('rect', { width: 400, height: 400, fill: '#ffffff' }), style.nextSibling);
    const caption = el('text', { x: 4, y: 396, style: 'font:9px monospace;fill:#6b6b6b' }, label);
    clone.appendChild(caption);
    $('#save').href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
  }

  const pad = n => String(n).padStart(2, '0');
  function setNow() {
    const d = new Date();
    $('#date').value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    $('#time').value = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function say(t) { $('#msg').textContent = t; }

  function run() {
    const lat = parseFloat($('#lat').value), lon = parseFloat($('#lon').value);
    if (!isFinite(lat) || lat < -90 || lat > 90) return say('Latitude must be between -90 and 90.');
    if (!isFinite(lon) || lon < -180 || lon > 180) return say('Longitude must be between -180 and 180.');
    const [y, mo, d] = ($('#date').value || '').split('-').map(Number);
    const [h, mi] = ($('#time').value || '').split(':').map(Number);
    if (!y || !mo || !d || !isFinite(h) || !isFinite(mi)) return say('Pick a date and a time.');
    const ms = new Date(y, mo - 1, d, h, mi).getTime();
    if (!isFinite(ms)) return say('That date does not work.');
    say('');
    store.set('nssc.place', { lat, lon, city: $('#city').value });
    draw(lat, lon, ms);
  }

  const citySel = $('#city');
  for (const [name] of CITIES) citySel.appendChild(new Option(name, name));
  citySel.addEventListener('change', () => {
    const c = CITIES.find(x => x[0] === citySel.value);
    if (!c) return;
    $('#lat').value = c[1];
    $('#lon').value = c[2];
    run();
  });
  for (const id of ['#lat', '#lon']) $(id).addEventListener('input', () => { citySel.value = ''; });
  for (const id of ['#date', '#time']) $(id).addEventListener('change', run);
  for (const id of ['#lat', '#lon']) $(id).addEventListener('keydown', e => { if (e.key === 'Enter') run(); });

  $('#draw').addEventListener('click', run);
  $('#now').addEventListener('click', () => { setNow(); run(); });
  $('#print').addEventListener('click', () => window.print());
  $('#here').addEventListener('click', () => {
    if (!navigator.geolocation) return say('Location is not available here. Type latitude and longitude.');
    say('Finding location…');
    navigator.geolocation.getCurrentPosition(p => {
      $('#lat').value = p.coords.latitude.toFixed(2);
      $('#lon').value = p.coords.longitude.toFixed(2);
      citySel.value = '';
      run();
    }, () => say('Location was denied. Type latitude and longitude, or pick a place.'), { timeout: 10000 });
  });

  const saved = store.get('nssc.place', null);
  if (saved && isFinite(saved.lat) && isFinite(saved.lon)) {
    $('#lat').value = saved.lat; $('#lon').value = saved.lon;
    citySel.value = CITIES.some(c => c[0] === saved.city) ? saved.city : '';
  } else {
    citySel.value = 'London'; $('#lat').value = 51.51; $('#lon').value = -0.13;
  }
  setNow();
  run();
})();
</script>
</body>
</html>
