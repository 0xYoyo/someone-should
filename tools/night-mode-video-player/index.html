<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data: blob:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a night mode for video players that evens out loud and quiet volume</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

video { width: 100%; max-height: 40vh; background: #000; border-radius: var(--radius); display: block; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.seg button { padding: 0; min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.pick { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: var(--tap); border: 1.5px dashed var(--ink); border-radius: var(--radius); cursor: pointer; }
.pick input { position: absolute; width: 1px; height: 1px; opacity: 0; min-height: 0; padding: 0; }
.pick:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.bars { display: grid; gap: 6px; }
.bar { height: 14px; border: 1px solid var(--line); border-radius: 2px; position: relative; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ink); }
.lab { display: flex; justify-content: space-between; font: 13px/1.4 var(--mono); color: var(--meta); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a night mode for video players that evens out loud and quiet volume</h1>

<main id="app" class="stack">
  <video id="video" controls playsinline></video>
  <label class="pick" for="file"><span id="picklabel">choose a video from this device</span>
    <input id="file" type="file" accept="video/*,audio/*"></label>
  <div class="seg" role="group" aria-label="strength">
    <button id="lvl-off" type="button" aria-pressed="false">Off</button>
    <button id="lvl-light" type="button" aria-pressed="false">Light</button>
    <button id="lvl-medium" type="button" aria-pressed="true">Medium</button>
    <button id="lvl-strong" type="button" aria-pressed="false">Strong</button>
  </div>
  <div id="mode" class="meta">Night mode on: medium</div>
  <div class="bars">
    <div class="lab"><span>loudness in</span><span id="inDb">-</span></div>
    <div class="bar"><i id="inBar"></i></div>
    <div class="lab"><span>loudness out</span><span id="outDb">-</span></div>
    <div class="bar"><i id="outBar"></i></div>
  </div>
  <button id="demo" class="primary" type="button">Play a loud and quiet demo</button>
  <div id="msg" class="meta" aria-live="polite">Quiet parts are lifted, loud parts are held down.</div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  // threshold dB, ratio, makeup gain dB
  const LEVELS = {
    off:    { t: 0,   r: 1,  g: 0 },
    light:  { t: -30, r: 4,  g: 4 },
    medium: { t: -40, r: 8,  g: 8 },
    strong: { t: -50, r: 14, g: 13 }
  };
  let level = store.get('nm-level', 'medium');
  if (!LEVELS[level]) level = 'medium';

  let ctx, comp, gain, inAn, outAn, mediaSrc, osc, oscGain, timer, url;
  const video = $('#video');

  function setMsg(t) { $('#msg').textContent = t; }

  function ensureCtx() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { setMsg('This browser cannot process audio.'); return false; }
    try {
      ctx = new AC();
      comp = ctx.createDynamicsCompressor();
      comp.knee.value = 20; comp.attack.value = 0.01; comp.release.value = 0.25;
      gain = ctx.createGain();
      inAn = ctx.createAnalyser(); outAn = ctx.createAnalyser();
      inAn.fftSize = outAn.fftSize = 1024;
      comp.connect(gain); gain.connect(outAn); outAn.connect(ctx.destination);
      applyLevel();
      return true;
    } catch (e) { ctx = null; setMsg('Audio processing is not available here.'); return false; }
  }

  function applyLevel() {
    const L = LEVELS[level];
    $$('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.id === 'lvl-' + level)));
    $('#mode').textContent = level === 'off' ? 'Night mode off' : 'Night mode on: ' + level;
    if (!ctx) return;
    comp.threshold.value = L.t; comp.ratio.value = L.r;
    gain.gain.value = Math.pow(10, L.g / 20);
  }

  function rms(an) {
    const buf = new Float32Array(an.fftSize);
    an.getFloatTimeDomainData(buf);
    let s = 0; for (const v of buf) s += v * v;
    return Math.sqrt(s / buf.length);
  }
  function show(an, bar, lab) {
    const r = rms(an), db = r > 0.00001 ? 20 * Math.log10(r) : -100;
    bar.style.width = Math.max(0, Math.min(100, (db + 60) / 60 * 100)) + '%';
    lab.textContent = db <= -99 ? '-' : db.toFixed(0) + ' dB';
  }
  function startMeters() {
    clearInterval(timer);
    timer = setInterval(() => {
      if (!ctx) return;
      show(inAn, $('#inBar'), $('#inDb'));
      show(outAn, $('#outBar'), $('#outDb'));
    }, 100);
  }

  // Route the video's audio through the compressor (once per element).
  function hookVideo() {
    if (!ensureCtx()) return;
    if (!mediaSrc) {
      mediaSrc = ctx.createMediaElementSource(video);
      mediaSrc.connect(inAn);
      mediaSrc.connect(comp);
    }
    startMeters();
  }

  $('#file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (!/^(video|audio)\//.test(f.type) && f.type) { setMsg('That file is not a video.'); return; }
    stopDemo();
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(f);
    video.src = url;
    $('#picklabel').textContent = f.name;
    try { hookVideo(); } catch (err) { setMsg('Audio processing is not available here.'); }
    video.addEventListener('play', () => { if (ctx && ctx.state === 'suspended') ctx.resume(); }, { once: true });
    setMsg('Press play. Change strength any time.');
  });
  video.addEventListener('error', () => setMsg('This browser cannot play that file.'));

  $$('.seg button').forEach(b => b.addEventListener('click', () => {
    level = b.id.slice(4);
    store.set('nm-level', level);
    applyLevel();
  }));

  // Demo: a quiet voice-like tone and a loud burst alternating, so the effect is audible.
  function stopDemo() {
    if (osc) { try { osc.stop(); } catch {} osc = null; }
    if (oscGain) { try { oscGain.disconnect(); } catch {} oscGain = null; }
    $('#demo').textContent = 'Play a loud and quiet demo';
  }
  $('#demo').addEventListener('click', () => {
    if (osc) { stopDemo(); setMsg('Demo stopped.'); return; }
    if (!ensureCtx()) return;
    try {
      ctx.resume();
      osc = ctx.createOscillator(); oscGain = ctx.createGain();
      osc.type = 'sawtooth'; osc.frequency.value = 180;
      osc.connect(oscGain); oscGain.connect(inAn); oscGain.connect(comp);
      const t0 = ctx.currentTime;
      for (let i = 0; i < 40; i++) {
        oscGain.gain.setValueAtTime(i % 2 ? 0.5 : 0.01, t0 + i * 1.5);
      }
      osc.start(); osc.stop(t0 + 60);
      osc.onended = () => { if (osc) stopDemo(); };
      startMeters();
      $('#demo').textContent = 'Stop demo';
      setMsg('Quiet, then loud, every 1.5 seconds.');
    } catch (e) { setMsg('Audio processing is not available here.'); }
  });

  applyLevel();
})();
</script>
</body>
</html>
