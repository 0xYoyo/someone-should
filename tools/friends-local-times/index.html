<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a timezone app for people, not places</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
h1 { font-size: 16px; }
.meta { font-size: 16px; }
#people li { display: grid; grid-template-columns: 14px 1fr auto 44px; gap: 10px; align-items: center; padding: 10px 0; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink); }
.dot.awake { background: var(--built); border-color: var(--built); }
.dot.edge { background: transparent; border-color: var(--meta); border-style: dashed; }
.dot.asleep { background: var(--meta); border-color: var(--meta); }
.t { font: 500 26px/1 var(--sans); font-variant-numeric: tabular-nums; text-align: right; }
.who { min-width: 0; overflow-wrap: anywhere; }
.x { padding: 0; width: var(--tap); border-color: var(--line); }
input[type=range] { padding: 0; border: 0; min-height: var(--tap); accent-color: var(--ink); }
#add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#add-row button { grid-column: 1 / -1; }
#slot { font-size: 20px; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a timezone app for people, not places</h1>

<main id="app" class="stack">
  <div id="slot" class="meta"></div>
  <input id="shift" type="range" min="0" max="1440" step="30" value="0" aria-label="Hours from now">
  <div class="row"><button id="best" class="primary">Best hour for everyone</button><button id="now">Now</button></div>
  <ul id="people" class="plain"></ul>
  <div id="empty" class="empty" hidden>Add someone below.</div>
  <div id="add-row">
    <input id="name" placeholder="Name" autocomplete="off" aria-label="Name">
    <input id="zone" list="zones" placeholder="City or zone" autocomplete="off" aria-label="Time zone">
    <button id="add">Add</button>
  </div>
  <div id="err" class="meta no" role="status"></div>
  <datalist id="zones"></datalist>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const mine = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  let people = store.get('flt.people', null) || [
    { name: 'Me', zone: mine },
    { name: 'Mom', zone: 'America/New_York' },
    { name: 'Dan', zone: 'Europe/London' },
    { name: 'Mei', zone: 'Asia/Tokyo' }
  ];
  let shift = 0;

  let zones = [];
  try { zones = Intl.supportedValuesOf('timeZone'); } catch {}
  $('#zones').innerHTML = zones.map(z => '<option value="' + z + '">').join('');

  const valid = z => { try { new Intl.DateTimeFormat('en', { timeZone: z }); return true; } catch { return false; } };

  // accept "tokyo" or "new york" by matching the city part of an IANA name
  function resolve(input) {
    const s = input.trim();
    if (!s) return null;
    if (valid(s)) return s;
    const q = s.toLowerCase().replace(/\s+/g, '_');
    return zones.find(z => z.toLowerCase().split('/').pop() === q) ||
           zones.find(z => z.toLowerCase().indexOf(q) > -1) || null;
  }

  function parts(zone, date) {
    const f = new Intl.DateTimeFormat('en-GB', { timeZone: zone, hour: '2-digit', minute: '2-digit', hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric' });
    const o = {};
    f.formatToParts(date).forEach(p => { o[p.type] = p.value; });
    return { h: +o.hour, m: +o.minute, day: Date.UTC(+o.year, +o.month - 1, +o.day) / 864e5 };
  }
  const state = h => (h >= 8 && h < 22) ? 'awake' : (h >= 6 && h < 8) || h === 22 ? 'edge' : 'asleep';
  const pad = n => String(n).padStart(2, '0');

  function render() {
    const date = new Date(Date.now() + shift * 6e4);
    const here = parts(mine, date).day;
    const ul = $('#people');
    ul.innerHTML = '';
    let awake = 0;
    people.forEach((p, i) => {
      const t = parts(p.zone, date);
      const st = state(t.h);
      if (st === 'awake') awake++;
      const d = t.day - here;
      const dayTxt = d === 0 ? 'today' : d > 0 ? 'tomorrow' : 'yesterday';
      const li = document.createElement('li');
      li.innerHTML = '<span class="dot ' + st + '" title="' + st + '"></span>' +
        '<span class="who"><span class="nm"></span><br><span class="meta"></span></span>' +
        '<span class="t">' + pad(t.h) + ':' + pad(t.m) + '</span>' +
        '<button class="x" aria-label="Remove">&times;</button>';
      li.querySelector('.nm').textContent = p.name;
      li.querySelector('.meta').textContent = dayTxt + ' \u00b7 ' + p.zone.split('/').pop().replace(/_/g, ' ') + ' \u00b7 ' + st;
      li.querySelector('.x').onclick = () => { people.splice(i, 1); save(); render(); };
      ul.appendChild(li);
    });
    $('#empty').hidden = people.length > 0;
    const when = shift === 0 ? 'Now' : 'In ' + Math.floor(shift / 60) + 'h' + (shift % 60 ? ' 30m' : '');
    $('#slot').textContent = when + ' \u00b7 ' + awake + ' of ' + people.length + ' awake';
  }

  const save = () => store.set('flt.people', people);

  function score(min) {
    const date = new Date(Date.now() + min * 6e4);
    let s = 0;
    people.forEach(p => { const st = state(parts(p.zone, date).h); s += st === 'awake' ? 2 : st === 'edge' ? 1 : 0; });
    return s;
  }

  $('#shift').oninput = e => { shift = +e.target.value; render(); };
  $('#now').onclick = () => { shift = 0; $('#shift').value = 0; render(); };
  $('#best').onclick = () => {
    if (!people.length) return;
    let best = 0, top = -1;
    for (let m = 0; m <= 1440; m += 30) { const s = score(m); if (s > top) { top = s; best = m; } }
    shift = best; $('#shift').value = best; render();
  };
  $('#add').onclick = () => {
    const name = $('#name').value.trim(), zone = resolve($('#zone').value);
    const err = $('#err');
    if (!name) { err.textContent = 'Enter a name.'; return; }
    if (!zone) { err.textContent = 'Unknown place. Try a city like Tokyo.'; return; }
    err.textContent = '';
    people.push({ name, zone });
    save();
    $('#name').value = ''; $('#zone').value = '';
    render();
  };
  $('#zone').addEventListener('keydown', e => { if (e.key === 'Enter') $('#add').click(); });

  render();
  setInterval(render, 30000);
})();
</script>
</body>
</html>
