<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that records a sound and plays it back after a set delay</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


.dial { display: flex; align-items: baseline; gap: 8px; }
.dial .big { font-size: 64px; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.steps button { padding: 0; min-width: 0; }
.steps button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.adjust { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#go { width: 100%; min-height: 56px; }
.meter { height: 8px; background: var(--line); border-radius: var(--radius); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ink); }
#status { min-height: 1.45em; margin: 0; color: var(--meta); font-size: 16px; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that records a sound and plays it back after a set delay</h1>

<main id="app" class="stack">
  <div class="dial"><span id="delay" class="big">2.0</span><span>seconds behind</span></div>
  <div class="steps" role="group" aria-label="Preset delays">
    <button data-d="0.5">0.5</button><button data-d="1">1</button><button data-d="2">2</button><button data-d="5">5</button><button data-d="10">10</button>
  </div>
  <div class="adjust">
    <button id="less" aria-label="Shorter delay">&minus; 0.5 s</button>
    <button id="more" aria-label="Longer delay">+ 0.5 s</button>
  </div>
  <button id="go" class="primary">Tap to start</button>
  <div class="meter" aria-hidden="true"><i id="level"></i></div>
  <p id="status">Use headphones. Everything stays on this device.</p>
</main>

<script>
(() => {
  'use strict';
  // storage helper — never throws
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];


  const MIN = 0, MAX = 10, STEP = 0.5;
  let delay = Number(store.get('echo.delay', 2));
  if (!(delay >= MIN && delay <= MAX)) delay = 2;

  let ctx = null, stream = null, delayNode = null, analyser = null, raf = 0, startedAt = 0;
  const elDelay = $('#delay'), elGo = $('#go'), elStatus = $('#status'), elLevel = $('#level');
  const say = t => { elStatus.textContent = t; };

  function setDelay(d) {
    delay = Math.min(MAX, Math.max(MIN, Math.round(d / STEP) * STEP));
    elDelay.textContent = delay.toFixed(1);
    $$('.steps button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.d) === delay)));
    store.set('echo.delay', delay);
    if (delayNode && ctx) {
      delayNode.delayTime.setTargetAtTime(delay, ctx.currentTime, 0.05);
      startedAt = ctx.currentTime;
    }
  }

  function tick() {
    const buf = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(buf);
    let peak = 0;
    for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
    elLevel.style.width = Math.min(100, peak / 128 * 220) + '%';
    const wait = delay - (ctx.currentTime - startedAt);
    say(wait > 0.05 ? 'Recording. Playback starts in ' + wait.toFixed(1) + ' s.' : 'Recording and playing back ' + delay.toFixed(1) + ' s behind.');
    raf = requestAnimationFrame(tick);
  }

  async function start() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('This browser has no microphone access.');
      return;
    }
    elGo.disabled = true;
    say('Waiting for microphone permission.');
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false }
      });
    } catch (e) {
      elGo.disabled = false;
      stream = null;
      say(e && e.name === 'NotFoundError' ? 'No microphone found.' : 'Microphone blocked. Allow it in browser settings and tap again.');
      return;
    }
    ctx = new AC();
    if (ctx.state === 'suspended') await ctx.resume();
    const src = ctx.createMediaStreamSource(stream);
    delayNode = ctx.createDelay(MAX + 1);
    delayNode.delayTime.value = delay;
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    src.connect(delayNode).connect(ctx.destination);
    startedAt = ctx.currentTime;
    elGo.disabled = false;
    elGo.textContent = 'Stop';
    tick();
  }

  function stop() {
    cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ctx) ctx.close().catch(() => {});
    ctx = stream = delayNode = analyser = null;
    elLevel.style.width = '0';
    elGo.textContent = 'Tap to start';
    say('Stopped.');
  }

  $$('.steps button').forEach(b => b.addEventListener('click', () => setDelay(Number(b.dataset.d))));
  $('#less').addEventListener('click', () => setDelay(delay - STEP));
  $('#more').addEventListener('click', () => setDelay(delay + STEP));
  elGo.addEventListener('click', () => (ctx ? stop() : start()));
  setDelay(delay);
})();
</script>
</body>
</html>
