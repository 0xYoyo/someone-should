<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that adds a Stranger Things upside down filter to photos</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

canvas { width: 100%; height: auto; display: block; border-radius: var(--radius); background: #000; border: 1.5px solid var(--line); }
.seg button { flex: 1; min-width: 0; padding: 0 8px; }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
label.btn { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); border-radius: var(--radius); cursor: pointer; }
label.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; min-height: 0; padding: 0; border: 0; }
label.btn:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that adds a Stranger Things upside down filter to photos</h1>

<main id="app" class="stack">
  <canvas id="view" width="800" height="600" aria-label="photo with upside down filter"></canvas>
  <div id="status" class="meta">sample picture. choose your own photo.</div>
  <div class="row seg" role="group" aria-label="strength">
    <button id="lvl-1" aria-pressed="false">mild</button>
    <button id="lvl-2" aria-pressed="true">full</button>
    <button id="lvl-3" aria-pressed="false">deep</button>
  </div>
  <div class="row">
    <label class="btn" for="file">choose photo<input id="file" type="file" accept="image/*"></label>
    <button id="flicker" aria-pressed="false">flicker off</button>
    <button id="save" class="primary">save</button>
  </div>
</main>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const cv = $('#view'), ctx = cv.getContext('2d');
  const status = $('#status');
  const names = { 1: 'mild', 2: 'full', 3: 'deep' };
  let level = 2, flicker = false, source = null, sourceName = 'sample', seed = 7, raf = 0, t0 = 0;

  // small seeded random so the vines and spores stay put between frames
  function rng(s) { return () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }; }

  // generated stand-in picture: dusk sky, house, trees
  function makeSample() {
    const c = document.createElement('canvas'); c.width = 800; c.height = 600;
    const g = c.getContext('2d');
    const sky = g.createLinearGradient(0, 0, 0, 600);
    sky.addColorStop(0, '#5a86c8'); sky.addColorStop(0.6, '#f0b87a'); sky.addColorStop(1, '#6d8f4e');
    g.fillStyle = sky; g.fillRect(0, 0, 800, 600);
    g.fillStyle = '#fff4cf'; g.beginPath(); g.arc(630, 110, 42, 0, 7); g.fill();
    g.fillStyle = '#4f7a3a'; g.fillRect(0, 430, 800, 170);
    g.fillStyle = '#c9b79a'; g.fillRect(230, 270, 300, 190);
    g.fillStyle = '#8a3b2e'; g.beginPath(); g.moveTo(205, 275); g.lineTo(380, 170); g.lineTo(555, 275); g.fill();
    g.fillStyle = '#ffd877'; g.fillRect(270, 320, 56, 62); g.fillRect(430, 320, 56, 62);
    g.fillStyle = '#5b3a29'; g.fillRect(360, 360, 50, 100);
    g.fillStyle = '#2f5a2a';
    [[90, 470], [700, 480], [160, 500]].forEach(([x, y]) => { g.fillRect(x - 8, y - 90, 16, 90); g.beginPath(); g.arc(x, y - 110, 55, 0, 7); g.fill(); });
    return c;
  }

  function fit(img) {
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    const k = Math.min(1, 1000 / Math.max(w, h));
    cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
  }

  function vine(x0, y0, x1, y1, rand, W) {
    ctx.beginPath(); ctx.moveTo(x0, y0);
    const mx = (x0 + x1) / 2 + (rand() - 0.5) * W * 0.25, my = (y0 + y1) / 2 + (rand() - 0.5) * W * 0.25;
    ctx.quadraticCurveTo(mx, my, x1, y1);
    ctx.lineWidth = 2 + rand() * 6; ctx.stroke();
    // thin branches along the way
    for (let i = 0; i < 3; i++) {
      const t = 0.3 + i * 0.25, bx = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * mx + t * t * x1;
      const by = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * my + t * t * y1;
      ctx.beginPath(); ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(bx + (rand() - 0.5) * W * 0.12, by + (rand() - 0.5) * W * 0.12, bx + (rand() - 0.5) * W * 0.2, by + (rand() - 0.5) * W * 0.2);
      ctx.lineWidth = 1 + rand() * 2; ctx.stroke();
    }
  }

  function draw(time) {
    const W = cv.width, H = cv.height, k = level / 2;
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none';
    ctx.drawImage(source, 0, 0, W, H);
    // flicker: brightness pulses and sometimes drops out
    let f = 1;
    if (flicker) { const p = Math.sin(time / 90) * Math.sin(time / 230); f = p > 0.55 ? 0.35 : 1 - Math.abs(p) * 0.15; }
    // drain colour, then tint cold blue
    ctx.globalCompositeOperation = 'saturation'; ctx.globalAlpha = 0.55 + 0.3 * k;
    ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgb(' + Math.round(150 * f) + ',' + Math.round(165 * f) + ',' + Math.round(215 * f) + ')'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'color'; ctx.globalAlpha = 0.25 * k;
    ctx.fillStyle = '#1b3c7a'; ctx.fillRect(0, 0, W, H);
    // red glow low in the frame
    ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.35 * k * f;
    const glow = ctx.createLinearGradient(0, H, 0, H * 0.3);
    glow.addColorStop(0, '#b0160f'); glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    // heavy vignette
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 0.5 + 0.4 * k;
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,10,0)'); vg.addColorStop(1, 'rgba(5,0,15,1)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    // vines creeping in from the edges
    const r = rng(seed);
    ctx.globalAlpha = 0.85; ctx.strokeStyle = '#0b0610'; ctx.lineCap = 'round';
    const n = Math.round(4 + 6 * k);
    for (let i = 0; i < n; i++) {
      const side = i % 4, reach = (0.2 + r() * 0.3) * (0.6 + 0.6 * k);
      const a = r();
      if (side === 0) vine(a * W, 0, a * W + (r() - 0.5) * W * 0.3, H * reach, r, W);
      else if (side === 1) vine(a * W, H, a * W + (r() - 0.5) * W * 0.3, H * (1 - reach), r, W);
      else if (side === 2) vine(0, a * H, W * reach, a * H + (r() - 0.5) * H * 0.3, r, W);
      else vine(W, a * H, W * (1 - reach), a * H + (r() - 0.5) * H * 0.3, r, W);
    }

    // floating spores, drifting upward when flicker is on
    ctx.globalCompositeOperation = 'lighter';
    const count = Math.round(40 + 90 * k), drift = flicker ? time / 40 : 0;
    for (let i = 0; i < count; i++) {
      const x = r() * W, y0 = r() * H, s = (0.8 + r() * 2.4) * (W / 800), sp = 0.3 + r();
      const y = ((y0 - drift * sp) % H + H) % H;
      ctx.globalAlpha = (0.35 + r() * 0.5) * f;
      ctx.fillStyle = '#ffe9d2'; ctx.shadowColor = '#ff6a4d'; ctx.shadowBlur = 6 * (W / 800);
      ctx.beginPath(); ctx.arc(x, y, s, 0, 7); ctx.fill();
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  function render() { draw(performance.now() - t0); }

  function loop(now) {
    if (!flicker) { raf = 0; return; }
    draw(now - t0); raf = requestAnimationFrame(loop);
  }

  function setStatus() { status.textContent = sourceName + ' / ' + names[level] + (flicker ? ' / flicker' : ''); }

  function setLevel(n) {
    level = n;
    for (const i of [1, 2, 3]) $('#lvl-' + i).setAttribute('aria-pressed', String(i === n));
    setStatus(); render();
  }

  [1, 2, 3].forEach(i => $('#lvl-' + i).addEventListener('click', () => setLevel(i)));

  $('#flicker').addEventListener('click', () => {
    flicker = !flicker;
    const b = $('#flicker'); b.textContent = flicker ? 'flicker on' : 'flicker off'; b.setAttribute('aria-pressed', String(flicker));
    setStatus();
    if (flicker && !raf && !matchMedia('(prefers-reduced-motion: reduce)').matches) { t0 = performance.now(); raf = requestAnimationFrame(loop); }
    else if (flicker) { render(); }
    else render();
  });

  $('#file').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type)) { status.textContent = 'that is not a picture'; return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { source = img; sourceName = 'your photo'; fit(img); URL.revokeObjectURL(url); setStatus(); render(); };
    img.onerror = () => { URL.revokeObjectURL(url); status.textContent = 'could not open that photo'; };
    img.src = url;
  });

  $('#save').addEventListener('click', () => {
    try {
      render();
      const a = document.createElement('a');
      a.href = cv.toDataURL('image/jpeg', 0.92); a.download = 'upside-down.jpg';
      document.body.appendChild(a); a.click(); a.remove();
      status.textContent = 'saved ' + names[level] + ' picture';
    } catch { status.textContent = 'could not save, try a screenshot'; }
  });

  source = makeSample(); fit(source); setStatus(); render();
})();
</script>
</body>
</html>
