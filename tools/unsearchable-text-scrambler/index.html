<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that scrambles your text with symbols so it can't be searched</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

textarea { min-height: 96px; resize: vertical; }
#output { min-height: 96px; border: 1.5px solid var(--line); border-radius: var(--radius); padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
label.opt { display: flex; align-items: center; gap: 10px; min-height: var(--tap); }
label.opt input { width: 44px; min-height: 44px; height: 44px; margin: 0 -8px 0 -12px; }
#found.yes { color: var(--no); }
#found.no { color: var(--built); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that scrambles your text with symbols so it can't be searched</h1>
<main id="app" class="stack">
  <textarea id="input" aria-label="Your text" spellcheck="false">Meet me at the old bridge at noon. Bring the key.</textarea>
  <div class="row">
    <label class="opt"><input type="checkbox" id="look" checked> look-alike letters</label>
    <label class="opt"><input type="checkbox" id="zw" checked> invisible characters</label>
  </div>
  <div id="output" aria-live="polite"></div>
  <div class="row">
    <button class="primary" id="copy">Copy</button>
    <button id="again">Scramble again</button>
  </div>
  <div class="meta" id="stat"></div>
  <input id="probe" aria-label="Search test" placeholder="Search test: type a word from your text" value="bridge" autocomplete="off">
  <div id="found"></div>
</main>
<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  // Latin letters mapped to Cyrillic/Greek look-alikes
  const MAP = {
    a: ['\u0430'], c: ['\u0441'], e: ['\u0435'], o: ['\u043e', '\u03bf'], p: ['\u0440'],
    x: ['\u0445'], y: ['\u0443'], i: ['\u0456'], j: ['\u0458'], s: ['\u0455'],
    A: ['\u0410', '\u0391'], B: ['\u0412', '\u0392'], C: ['\u0421'], E: ['\u0415', '\u0395'],
    H: ['\u041d', '\u0397'], I: ['\u0406'], K: ['\u041a', '\u039a'], M: ['\u041c', '\u039c'],
    O: ['\u041e', '\u039f'], P: ['\u0420', '\u03a1'], T: ['\u0422', '\u03a4'], X: ['\u0425', '\u03a7'],
    Y: ['\u03a5'], Z: ['\u0396']
  };
  const ZW = ['\u200b', '\u200c', '\u2060'];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  let swapped = 0, hidden = 0;

  function scramble(text, look, zw) {
    swapped = 0; hidden = 0;
    let out = '';
    for (const ch of text) {
      let c = ch;
      if (look && MAP[ch]) { c = pick(MAP[ch]); swapped++; }
      out += c;
      if (zw && /[\p{L}\p{N}]/u.test(ch)) { out += pick(ZW); hidden++; }
    }
    return out;
  }
  // what a search would see: strip invisibles only (a search box would not match swapped letters)
  const plain = (s) => s.replace(/[\u200b\u200c\u2060]/g, '');

  function render() {
    const text = $('#input').value;
    const out = scramble(text, $('#look').checked, $('#zw').checked);
    $('#output').textContent = out;
    $('#stat').textContent = text.trim()
      ? swapped + ' letters swapped, ' + hidden + ' invisible characters added'
      : 'Type or paste text above.';
    probe(out);
    return out;
  }
  function probe(out) {
    const q = $('#probe').value.trim();
    const f = $('#found');
    if (!q || !out) { f.textContent = ''; f.className = ''; return; }
    const hit = out.toLowerCase().indexOf(q.toLowerCase()) > -1;
    f.textContent = hit ? 'Found: a search for "' + q + '" would still match.' : 'Not found: a search for "' + q + '" finds nothing.';
    f.className = hit ? 'yes' : 'no';
  }
  async function copy() {
    const out = $('#output').textContent;
    const b = $('#copy');
    if (!out) return;
    try { await navigator.clipboard.writeText(out); b.textContent = 'Copied'; }
    catch {
      const r = document.createRange(); r.selectNodeContents($('#output'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      b.textContent = 'Press copy on selection';
    }
    setTimeout(() => { b.textContent = 'Copy'; }, 1500);
  }
  $('#input').addEventListener('input', render);
  $('#look').addEventListener('change', render);
  $('#zw').addEventListener('change', render);
  $('#again').addEventListener('click', render);
  $('#copy').addEventListener('click', copy);
  $('#probe').addEventListener('input', () => probe($('#output').textContent));
  render();
})();
</script>
</body>
</html>
