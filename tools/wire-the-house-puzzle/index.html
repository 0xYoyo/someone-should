<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an electrician simulator game that teaches wiring household circuits</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
#board { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 0 56px; align-items: start; }
#wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.card { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 8px; display: grid; gap: 8px; margin-bottom: 12px; position: relative; z-index: 1; background: var(--paper); }
.card h2 { font: 500 14px/1.3 var(--mono); color: var(--meta); margin: 0; display: flex; justify-content: space-between; align-items: center; min-height: 24px; }
.term { width: 100%; text-align: left; padding: 0 10px; border-width: 1.5px; border-color: var(--line); background: var(--paper); }
.term.sel { border-color: var(--ink); outline: 2px solid var(--ink); outline-offset: 1px; }
.term.k-L { border-left: 6px solid var(--no); }
.term.k-N { border-left: 6px solid #3a6ea5; }
.term.k-G { border-left: 6px solid var(--built); }
.right .term.k-L, .right .term.k-N, .right .term.k-G { border-left-width: 1.5px; }
.left .term { text-align: right; }
.left .term.k-L, .left .term.k-N, .left .term.k-G { border-left-width: 1.5px; }
.left .term.k-L { border-right: 6px solid var(--no); }
.left .term.k-N { border-right: 6px solid #3a6ea5; }
.left .term.k-G { border-right: 6px solid var(--built); }
.w-L { stroke: var(--no); } .w-N { stroke: #3a6ea5; } .w-G { stroke: var(--built); }
.bulb { width: 22px; height: 22px; }
.bulb circle { fill: transparent; stroke: var(--meta); stroke-width: 2; }
.on .bulb circle { fill: #e8b923; stroke: #b88a00; }
.on h2 { color: var(--ink); }
#msg { min-height: 48px; margin: 4px 0 12px; }
#msg.ok { color: var(--built); }
#msg.bad { color: var(--no); }
.bar { display: flex; gap: 10px; flex-wrap: wrap; }
.bar button { flex: 1 1 auto; }
#level { margin: 0 0 12px; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an electrician simulator game that teaches wiring household circuits</h1>

<main id="app">
  <p id="level" class="meta"></p>
  <div id="board">
    <svg id="wires" aria-hidden="true"></svg>
    <div id="colL" class="left"></div>
    <div id="colR" class="right"></div>
  </div>
  <p id="msg" role="status"></p>
  <div class="bar">
    <button id="test" class="primary">Flip breaker on</button>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
    <button id="next" hidden>Next circuit</button>
  </div>
</main>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);

  // kinds: L live, N neutral, G ground. Terminal ids are short and used by the tests.
  const BREAKER = { name: 'Breaker panel', terms: [
    { id: 'bL', label: 'Live', kind: 'L' }, { id: 'bN', label: 'Neutral', kind: 'N' }, { id: 'bG', label: 'Ground', kind: 'G' } ] };
  const SWITCH = { name: 'Switch', terms: [
    { id: 'swIn', label: 'In', kind: 'L' }, { id: 'swOut', label: 'Out', kind: 'L' } ] };
  const LAMP = { id: 'lamp', lamp: true, name: 'Lamp', terms: [
    { id: 'lampL', label: 'Live', kind: 'L' }, { id: 'lampN', label: 'Neutral', kind: 'N' } ] };
  const OUTLET = { name: 'Outlet', terms: [
    { id: 'oH', label: 'Hot (brass)', kind: 'L' }, { id: 'oN', label: 'Neutral (silver)', kind: 'N' }, { id: 'oG', label: 'Ground (green)', kind: 'G' } ] };

  const LEVELS = [
    { title: 'A light on a switch', devices: [SWITCH, LAMP],
      need: ['bL-swIn', 'swOut-lampL', 'bN-lampN'],
      start: ['bL-swIn', 'bN-lampN'],
      win: 'Lamp lit. The switch breaks the live wire; neutral goes straight to the lamp.' },
    { title: 'An outlet', devices: [OUTLET],
      need: ['bL-oH', 'bN-oN', 'bG-oG'],
      start: [],
      win: 'Outlet powered. Live to hot, neutral to neutral, ground to ground.' },
    { title: 'Light and outlet on one circuit', devices: [SWITCH, LAMP, OUTLET],
      need: ['bL-swIn', 'swOut-lampL', 'bN-lampN', 'bL-oH', 'bN-oN', 'bG-oG'],
      start: [],
      win: 'Both work. The outlet takes live before the switch, so it is always on.' }
  ];

  let lv = 0, wires = [], sel = null, solved = false;
  const terms = {};
  const key = (a, b) => [a, b].sort().join('-');
  const need = L => L.need.map(w => key(...w.split('-')));
  const label = id => terms[id].dev + ' ' + terms[id].label.toLowerCase();

  function build() {
    const L = LEVELS[lv];
    Object.keys(terms).forEach(k => delete terms[k]);
    const colL = $('#colL'), colR = $('#colR');
    colL.textContent = ''; colR.textContent = '';
    const mk = (dev, col) => {
      const card = document.createElement('div'); card.className = 'card'; card.id = 'card-' + (dev.id || dev.terms[0].id);
      const h = document.createElement('h2'); h.textContent = dev.name;
      if (dev.lamp) {
        h.insertAdjacentHTML('beforeend', '<svg class="bulb" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle></svg>');
      }
      card.appendChild(h);
      dev.terms.forEach(t => {
        const b = document.createElement('button'); b.className = 'term k-' + t.kind; b.id = 't-' + t.id; b.textContent = t.label;
        b.addEventListener('click', () => pick(t.id));
        card.appendChild(b);
        terms[t.id] = { el: b, side: col === colL ? 'L' : 'R', kind: t.kind, label: t.label, dev: dev.name.toLowerCase() };
      });
      col.appendChild(card);
    };
    mk(BREAKER, colL);
    L.devices.forEach(d => mk(d, colR));
    wires = L.start.map(w => key(...w.split('-'))); sel = null; solved = false;
    $('#level').textContent = 'Circuit ' + (lv + 1) + ' of ' + LEVELS.length + ' \u2014 ' + L.title;
    $('#next').hidden = true; $('#test').hidden = false;
    say('Tap one terminal, then another, to run a wire.', '');
    draw();
  }

  function say(t, c) { const m = $('#msg'); m.textContent = t; m.className = c; }

  function pick(id) {
    if (solved) return;
    if (sel === null) { sel = id; }
    else if (sel === id) { sel = null; }
    else {
      const k = key(sel, id), i = wires.indexOf(k);
      if (i >= 0) wires.splice(i, 1); else wires.push(k);
      sel = null;
      say('', '');
    }
    draw();
  }

  function dot(id, root) {
    const r = terms[id].el.getBoundingClientRect(), b = root.getBoundingClientRect();
    return { x: (terms[id].side === 'L' ? r.right : r.left) - b.left, y: r.top + r.height / 2 - b.top, side: terms[id].side };
  }

  function draw() {
    Object.keys(terms).forEach(id => terms[id].el.classList.toggle('sel', id === sel));
    const svg = $('#wires'), root = $('#board');
    let out = '';
    wires.forEach(w => {
      const [a, b] = w.split('-');
      // colour by the breaker end if there is one, otherwise by the first end
      const col = terms[a].dev === 'breaker panel' ? a : terms[b].dev === 'breaker panel' ? b : a;
      const p = dot(a, root), q = dot(b, root);
      let d;
      if (p.side === q.side) {
        const o = p.side === 'L' ? 34 : -34;
        d = 'M' + p.x + ' ' + p.y + 'C' + (p.x + o) + ' ' + p.y + ' ' + (q.x + o) + ' ' + q.y + ' ' + q.x + ' ' + q.y;
      } else {
        const m = (q.x - p.x) / 2;
        d = 'M' + p.x + ' ' + p.y + 'C' + (p.x + m) + ' ' + p.y + ' ' + (q.x - m) + ' ' + q.y + ' ' + q.x + ' ' + q.y;
      }
      out += '<path d="' + d + '" fill="none" stroke-width="4" stroke-linecap="round" class="w-' + terms[col].kind + '"></path>';
    });
    svg.innerHTML = out;
  }

  function lamp(on) { const c = $('#card-lamp'); if (c) c.classList.toggle('on', on); }

  function test() {
    if (solved) return;
    const L = LEVELS[lv];
    if (!wires.length) { say('No wires yet.', 'bad'); return; }
    // dangerous first: live straight to neutral or ground trips the breaker
    for (const w of wires) {
      const [a, b] = w.split('-'), ka = terms[a].kind, kb = terms[b].kind;
      const hasB = terms[a].dev === 'breaker panel' || terms[b].dev === 'breaker panel';
      if (ka !== kb && (ka === 'L' || kb === 'L') && hasB && terms[a].dev === terms[b].dev) {
        say('Breaker tripped: live wired to ' + (ka === 'L' ? terms[b].label : terms[a].label).toLowerCase() + ' at the panel.', 'bad'); return;
      }
    }
    const extra = wires.find(w => !need(L).includes(w));
    if (extra) {
      const [a, b] = extra.split('-');
      say('Wrong: ' + label(a) + ' to ' + label(b) + '.', 'bad'); return;
    }
    const missing = need(L).filter(w => !wires.includes(w));
    if (missing.length) {
      const [a, b] = missing[0].split('-');
      say(missing.length + ' wire' + (missing.length > 1 ? 's' : '') + ' missing. Nothing happens. Try ' + label(a) + '.', 'bad'); return;
    }
    solved = true; sel = null; lamp(true);
    say(L.win, 'ok');
    $('#test').hidden = true;
    $('#next').hidden = false;
    $('#next').textContent = lv < LEVELS.length - 1 ? 'Next circuit' : 'Start over';
    draw();
  }

  $('#test').addEventListener('click', test);
  $('#undo').addEventListener('click', () => { if (solved) return; wires.pop(); sel = null; say('', ''); draw(); });
  $('#clear').addEventListener('click', () => { wires = []; sel = null; solved = false; lamp(false); $('#test').hidden = false; $('#next').hidden = true; say('', ''); draw(); });
  $('#next').addEventListener('click', () => { lv = (lv + 1) % LEVELS.length; build(); });
  window.addEventListener('resize', draw);
  build();
})();
</script>
</body>
</html>
