<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a website where you type your vision level and see what you see without glasses</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


label{display:grid;gap:4px;font-size:16px;color:var(--meta)}
.eyes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene{border:1.5px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative;min-height:150px;background:var(--paper)}
.scene .in{padding:12px;transition:filter .15s;display:grid;gap:8px}
.scene .sign{background:var(--ink);color:var(--paper);padding:6px 10px;font-weight:600;font-size:22px;justify-self:start;border-radius:var(--radius)}
.scene p{margin:0;font-size:17px}
.scene .small{font-size:16px}
.scene svg{width:100%;height:56px;display:block}
.cap{font-size:16px;color:var(--meta);margin:0 0 6px}
.note{font-size:16px;color:var(--meta);margin:0}
.msg{font-size:16px;color:var(--no);margin:0;min-height:1.4em}
.file{display:flex;align-items:center;min-height:44px}

</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a website where you type your vision level and see what you see without glasses</h1>
<main id="app" class="stack">
<div class="eyes">
<label>Right eye<input id="od" type="text" inputmode="decimal" value="-3.00" aria-label="Right eye sphere"></label>
<label>Left eye<input id="os" type="text" inputmode="decimal" value="-2.50" aria-label="Left eye sphere"></label>
</div>
<label>Looking at
<select id="dist" aria-label="Viewing distance">
<option value="0.4">phone, 40 cm</option>
<option value="1" selected>a person, 1 m</option>
<option value="6">a sign, 6 m</option>
</select></label>
<p class="msg" id="msg"></p>
<div class="eyes">
<div><p class="cap">Right</p><div class="scene" id="sr"><div class="in" data-s><div class="sign">EXIT 24</div><p>Bus 52 to Central Station</p><p class="small">Departs 08:15, platform 3</p><svg viewBox="0 0 200 56" aria-hidden="true"><rect x="0" y="40" width="200" height="16" fill="currentColor" opacity=".25"/><circle cx="30" cy="22" r="14" fill="currentColor" opacity=".7"/><rect x="70" y="8" width="40" height="40" fill="currentColor" opacity=".5"/><path d="M130 48 L160 6 L190 48Z" fill="currentColor" opacity=".8"/></svg></div></div></div>
<div><p class="cap">Left</p><div class="scene" id="sl"><div class="in" data-s><div class="sign">EXIT 24</div><p>Bus 52 to Central Station</p><p class="small">Departs 08:15, platform 3</p><svg viewBox="0 0 200 56" aria-hidden="true"><rect x="0" y="40" width="200" height="16" fill="currentColor" opacity=".25"/><circle cx="30" cy="22" r="14" fill="currentColor" opacity=".7"/><rect x="70" y="8" width="40" height="40" fill="currentColor" opacity=".5"/><path d="M130 48 L160 6 L190 48Z" fill="currentColor" opacity=".8"/></svg></div></div></div>
</div>
<label class="file">Your own photo <input id="photo" type="file" accept="image/*" aria-label="Your own photo"></label>
<p class="note" id="info"></p>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const PX_PER_D = 5; // blur px per diopter of defocus, tuned for a phone-width scene
  const od = $('#od'), os = $('#os'), dist = $('#dist'), msg = $('#msg'), info = $('#info');
  const saved = store.get('sws', null);
  if (saved) { od.value = saved.od; os.value = saved.os; dist.value = saved.d; }

  // Uncorrected defocus in diopters, no accommodation assumed.
  function defocus(sph, d) {
    if (sph < 0) return Math.max(0, -sph - 1 / d);
    return sph + 0.5 / d;
  }
  function read(el) {
    const v = parseFloat(String(el.value).replace(',', '.'));
    return Number.isFinite(v) && v >= -20 && v <= 12 ? v : null;
  }
  function render() {
    const a = read(od), b = read(os), d = parseFloat(dist.value);
    msg.textContent = (a === null || b === null) ? 'Enter a number from -20 to +12, like -2.50.' : '';
    const pairs = [[a, '#sr'], [b, '#sl']];
    const out = [];
    for (const [v, id] of pairs) {
      const el = $(id + ' [data-s]');
      const blur = v === null ? 0 : Math.round(defocus(v, d) * PX_PER_D * 10) / 10;
      el.style.filter = 'blur(' + blur + 'px)';
      el.style.transform = 'scale(1)';
      out.push(v === null ? '' : (v < 0 ? 'Clear only closer than ' + (Math.round(100 / -v)) + ' cm' : 'Blurred at every distance'));
    }
    info.textContent = a === null || b === null ? '' : 'Right: ' + out[0] + '. Left: ' + out[1] + '.';
    if (a !== null && b !== null) store.set('sws', { od: od.value, os: os.value, d: dist.value });
  }
  [od, os, dist].forEach(e => e.addEventListener('input', render));
  $('#photo').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      for (const id of ['#sr', '#sl']) {
        $(id + ' [data-s]').innerHTML = '<img alt="Your photo" style="width:100%;display:block" src="' + r.result + '">';
      }
      render();
    };
    r.onerror = () => { msg.textContent = 'Could not read that photo.'; };
    r.readAsDataURL(f);
  });
  render();
})();
</script>
</body>
</html>
