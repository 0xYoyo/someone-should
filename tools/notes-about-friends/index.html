<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app to write notes about your friends so you do not forget</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
.meta { font-size: 16px; }
.card { border: 1.5px solid var(--line); border-radius: var(--radius); }
.card > summary { min-height: var(--tap); padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.card .body { padding: 0 12px 12px; display: grid; gap: 10px; }
.card label { display: grid; gap: 4px; }
textarea { min-height: 72px; resize: vertical; }
.up li { padding: 10px 0; }
h2 { font: 500 16px/1.3 var(--mono); color: var(--meta); margin: 8px 0 0; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app to write notes about your friends so you do not forget</h1>

<main id="app" class="stack">
  <div class="row">
    <input id="name" type="text" placeholder="friend's name" aria-label="friend's name" style="flex:1;min-width:140px">
    <button id="add" class="primary">add friend</button>
  </div>
  <section id="upwrap" class="stack">
    <h2>birthdays, next 30 days</h2>
    <ul id="up" class="plain up"></ul>
  </section>
  <input id="search" type="search" placeholder="search names and notes" aria-label="search">
  <div id="list" class="stack"></div>
  <div class="row">
    <button id="export">export</button>
    <span id="msg" class="meta" role="status"></span>
  </div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const DAY = 86400000;
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  let friends = store.get('friends-v1', null);
  if (!Array.isArray(friends)) {
    // one example so the first screen shows the tool working
    const b = new Date(today().getTime() + 9 * DAY); b.setFullYear(1990);
    friends = [{ id: uid(), name: 'Sam (example)', bday: iso(b), kids: 'Noa, 4', likes: 'oat flat white, climbing',
      notes: 'Moving to Leeds in March. Ask how the new job is going.', last: iso(new Date(today().getTime() - 21 * DAY)) }];
    store.set('friends-v1', friends);
  }
  const save = () => store.set('friends-v1', friends);
  const say = t => { $('#msg').textContent = t; };

  function daysToBirthday(bday) {
    if (!bday) return null;
    const p = bday.split('-').map(Number);
    if (p.length < 3 || !p[1] || !p[2]) return null;
    const t = today();
    let d = new Date(t.getFullYear(), p[1] - 1, p[2]);
    if (d < t) d = new Date(t.getFullYear() + 1, p[1] - 1, p[2]);
    return Math.round((d - t) / DAY);
  }
  function ago(last) {
    if (!last) return 'not logged';
    const n = Math.round((today() - new Date(last + 'T00:00:00')) / DAY);
    return n <= 0 ? 'talked today' : n === 1 ? 'talked yesterday' : 'talked ' + n + ' days ago';
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function renderUpcoming() {
    const items = friends.map(f => ({ f, n: daysToBirthday(f.bday) })).filter(x => x.n !== null && x.n <= 30).sort((a, b) => a.n - b.n);
    $('#up').innerHTML = items.length
      ? items.map(x => '<li><span>' + esc(x.f.name) + '</span><span class="meta">' + (x.n === 0 ? 'today' : x.n === 1 ? 'tomorrow' : 'in ' + x.n + ' days') + '</span></li>').join('')
      : '<li class="empty">none</li>';
  }

  function render() {
    const q = $('#search').value.trim().toLowerCase();
    const shown = friends.filter(f => !q || [f.name, f.kids, f.likes, f.notes].join(' ').toLowerCase().includes(q));
    const list = $('#list');
    if (!friends.length) { list.innerHTML = '<p class="empty">No friends yet. Type a name above.</p>'; renderUpcoming(); return; }
    if (!shown.length) { list.innerHTML = '<p class="empty">No match.</p>'; renderUpcoming(); return; }
    list.innerHTML = shown.map((f, i) => '<details class="card" data-id="' + f.id + '"' + (i === 0 && !q ? ' open' : '') + '>'
      + '<summary><span>' + esc(f.name) + '</span><span class="meta">' + ago(f.last) + '</span></summary>'
      + '<div class="body">'
      + '<label><span class="meta">birthday</span><input type="date" data-k="bday" value="' + esc(f.bday || '') + '"></label>'
      + '<label><span class="meta">kids, partner, pets</span><input type="text" data-k="kids" value="' + esc(f.kids || '') + '"></label>'
      + '<label><span class="meta">likes</span><input type="text" data-k="likes" value="' + esc(f.likes || '') + '"></label>'
      + '<label><span class="meta">notes</span><textarea data-k="notes">' + esc(f.notes || '') + '</textarea></label>'
      + '<div class="row"><button class="talked">talked today</button><button class="del">delete</button></div>'
      + '</div></details>').join('');
    renderUpcoming();
  }

  function addFriend() {
    const name = $('#name').value.trim();
    if (!name) { say('Type a name first.'); return; }
    friends.unshift({ id: uid(), name, bday: '', kids: '', likes: '', notes: '', last: '' });
    save(); $('#name').value = ''; $('#search').value = ''; say('');
    render();
    const first = $('#list details'); if (first) first.open = true;
  }

  $('#add').addEventListener('click', addFriend);
  $('#name').addEventListener('keydown', e => { if (e.key === 'Enter') addFriend(); });
  $('#search').addEventListener('input', render);

  $('#list').addEventListener('input', e => {
    const k = e.target.dataset.k; const card = e.target.closest('.card');
    if (!k || !card) return;
    const f = friends.find(x => x.id === card.dataset.id);
    if (f) { f[k] = e.target.value; save(); if (k === 'bday') renderUpcoming(); }
  });
  $('#list').addEventListener('click', e => {
    const card = e.target.closest('.card'); if (!card) return;
    const f = friends.find(x => x.id === card.dataset.id); if (!f) return;
    if (e.target.classList.contains('talked')) {
      f.last = iso(new Date()); save();
      card.querySelector('summary .meta').textContent = ago(f.last);
    } else if (e.target.classList.contains('del')) {
      friends = friends.filter(x => x !== f); save(); render(); say('Deleted ' + f.name + '.');
    }
  });

  $('#export').addEventListener('click', () => {
    const text = friends.map(f => [f.name, f.bday && 'birthday: ' + f.bday, f.kids && 'family: ' + f.kids, f.likes && 'likes: ' + f.likes, f.notes && 'notes: ' + f.notes, f.last && 'last talked: ' + f.last].filter(Boolean).join('\n')).join('\n\n');
    if (!text) { say('Nothing to export.'); return; }
    const a = document.createElement('a');
    a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
    a.download = 'friends.txt';
    document.body.appendChild(a); a.click(); a.remove();
    say('Saved friends.txt.');
  });

  render();
})();
</script>
</body>
</html>
