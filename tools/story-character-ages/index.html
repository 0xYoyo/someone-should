<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that tracks the ages of characters in a story for writers</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

label { display: grid; gap: 4px; }
.when { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.when .row > * { flex: 1 1 0; min-width: 0; }
.add { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.add button { grid-column: 1 / -1; }
.age { font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
ul.plain li .who { min-width: 0; overflow-wrap: anywhere; }
ul.plain li .who span { display: block; }
.x { min-width: var(--tap); padding: 0; border-color: var(--line); color: var(--meta); }
.err { color: var(--no); min-height: 1.4em; margin: 0; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that tracks the ages of characters in a story for writers</h1>

<main id="app" class="stack">
  <section class="when stack">
    <label class="meta" for="now">story date</label>
    <input id="now" type="date" value="1923-06-15">
    <div class="row">
      <button id="back" type="button">&minus; 1 year</button>
      <button id="fwd" type="button">+ 1 year</button>
    </div>
  </section>

  <ul class="plain" id="list"></ul>
  <p class="empty" id="empty" hidden>No characters yet. Add one below.</p>

  <form class="add" id="form">
    <label class="meta" for="name">name<input id="name" type="text" autocomplete="off"></label>
    <label class="meta" for="born">born<input id="born" type="date"></label>
    <button id="add" class="primary" type="submit">Add character</button>
  </form>
  <p class="err" id="err" role="status"></p>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const example = [
    { name: 'Edith', born: '1889-03-02' },
    { name: 'Tom', born: '1915-11-20' },
    { name: 'Mara', born: '1923-09-01' }
  ];
  let chars = store.get('sca.chars', null);
  if (!Array.isArray(chars)) chars = example;
  const nowEl = $('#now');
  const savedNow = store.get('sca.now', null);
  if (typeof savedNow === 'string' && /^\d{4,}-\d\d-\d\d$/.test(savedNow)) nowEl.value = savedNow;

  // Parse YYYY-MM-DD without Date, so any fictional year works and no timezone shifts it.
  const parse = s => { const m = /^(\d{4,})-(\d\d)-(\d\d)$/.exec(s || ''); return m ? [+m[1], +m[2], +m[3]] : null; };

  // Completed years, plus months and days since the last birthday.
  function age(born, now) {
    let y = now[0] - born[0], m = now[1] - born[1], d = now[2] - born[2];
    if (d < 0) { m--; d += new Date(Date.UTC(2001, now[1] - 1, 0)).getUTCDate(); }
    if (m < 0) { y--; m += 12; }
    return { y, m, d };
  }
  const pl = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

  function render() {
    const now = parse(nowEl.value);
    const list = $('#list');
    list.textContent = '';
    $('#empty').hidden = chars.length > 0;
    const rows = chars.map((c, i) => ({ c, i, b: parse(c.born) })).sort((a, b) => (a.b[0] - b.b[0]) || (a.b[1] - b.b[1]) || (a.b[2] - b.b[2]));
    for (const { c, i, b } of rows) {
      const li = document.createElement('li');
      const who = document.createElement('div'); who.className = 'who';
      const n = document.createElement('span'); n.textContent = c.name;
      const sub = document.createElement('span'); sub.className = 'meta';
      const big = document.createElement('div'); big.className = 'age';
      if (!now) { sub.textContent = 'born ' + c.born; big.textContent = '?'; }
      else {
        const a = age(b, now);
        if (a.y < 0) {
          big.textContent = 'unborn';
          sub.textContent = 'born ' + c.born + ', in ' + pl(-a.y - (a.m || a.d ? 0 : 0), 'year');
          const dy = b[0] - now[0] - ((b[1] > now[1] || (b[1] === now[1] && b[2] > now[2])) ? 0 : 1);
          sub.textContent = 'born ' + c.born + ', in ' + (dy < 1 ? 'under a year' : pl(dy, 'year'));
        } else {
          big.textContent = String(a.y);
          sub.textContent = 'born ' + c.born + ' · ' + pl(a.m, 'month') + ' ' + pl(a.d, 'day') + ' past';
        }
      }
      who.append(n, sub);
      const x = document.createElement('button');
      x.type = 'button'; x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', 'Remove ' + c.name);
      x.addEventListener('click', () => { chars.splice(i, 1); save(); render(); });
      li.append(who, big, x);
      list.append(li);
    }
  }
  function save() { store.set('sca.chars', chars); store.set('sca.now', nowEl.value); }
  function say(t) { $('#err').textContent = t; }

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#name').value.trim(), born = $('#born').value;
    if (!name) return say('Give the character a name.');
    if (!parse(born)) return say('Pick a birth date.');
    say('');
    chars.push({ name, born });
    $('#name').value = ''; $('#born').value = '';
    save(); render();
  });

  function shift(n) {
    const t = parse(nowEl.value);
    if (!t) return say('Set a story date first.');
    say('');
    const y = Math.max(1, t[0] + n);
    const last = new Date(Date.UTC(2001, t[1], 0)).getUTCDate();
    const d = (t[1] === 2 && t[2] === 29) ? 28 : t[2];
    nowEl.value = String(y).padStart(4, '0') + '-' + String(t[1]).padStart(2, '0') + '-' + String(Math.min(d, last)).padStart(2, '0');
    save(); render();
  }
  $('#back').addEventListener('click', () => shift(-1));
  $('#fwd').addEventListener('click', () => shift(1));
  nowEl.addEventListener('change', () => { save(); render(); });

  render();
})();
</script>
</body>
</html>
