<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a timezone for the internet</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.card { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; }
label { display: block; }
.res { font: 500 24px/1.2 var(--mono); font-variant-numeric: tabular-nums; min-height: 30px; }
.err { color: var(--no); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a timezone for the internet</h1>

<main id="app" class="stack">
  <section class="card">
    <div class="big" id="beats">@000.00</div>
    <div class="meta" id="utc">UTC 00:00:00</div>
    <div class="meta" id="local">local 00:00:00</div>
  </section>
  <section class="card">
    <label for="lt">Your time (HH:MM) to beats</label>
    <input id="lt" type="text" inputmode="numeric" value="12:00" autocomplete="off" maxlength="5">
    <div class="res" id="lt-out" aria-live="polite"></div>
  </section>
  <section class="card">
    <label for="b">Beats (0 to 999) to your time</label>
    <input id="b" type="text" inputmode="decimal" value="500" autocomplete="off" maxlength="7">
    <div class="res" id="b-out" aria-live="polite"></div>
  </section>
</main>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const DAY = 86400000, HOUR = 3600000, BEAT = DAY / 1000;
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  // Swatch Internet Time: Biel Mean Time = UTC+1, 1000 beats per day.
  const beatsAt = ms => ((((ms + HOUR) % DAY) + DAY) % DAY) / BEAT;
  const fmtBeats = b => '@' + pad(Math.floor(b), 3) + '.' + pad(Math.floor((b % 1) * 100));
  const clock = d => pad(d.getHours()) + ':' + pad(d.getMinutes());

  function tick() {
    const now = new Date();
    $('#beats').textContent = fmtBeats(beatsAt(now.getTime()));
    $('#utc').textContent = 'UTC ' + pad(now.getUTCHours()) + ':' + pad(now.getUTCMinutes()) + ':' + pad(now.getUTCSeconds());
    $('#local').textContent = 'local ' + clock(now) + ':' + pad(now.getSeconds());
  }

  function timeToBeats() {
    const out = $('#lt-out');
    const m = /^(\d{1,2}):(\d{2})$/.exec($('#lt').value.trim());
    if (!m || +m[1] > 23 || +m[2] > 59) { out.className = 'res err'; out.textContent = 'Use HH:MM, like 18:30'; return; }
    const d = new Date(); d.setHours(+m[1], +m[2], 0, 0);
    out.className = 'res';
    out.textContent = fmtBeats(beatsAt(d.getTime()));
  }

  function beatsToTime() {
    const out = $('#b-out');
    const v = $('#b').value.trim().replace(/^@/, '');
    const b = parseFloat(v);
    if (!/^\d+(\.\d+)?$/.test(v) || b >= 1000) { out.className = 'res err'; out.textContent = 'Use 0 to 999.99'; return; }
    // Find the UTC instant of that beat within the current BMT day.
    const now = Date.now();
    const dayStart = Math.floor((now + HOUR) / DAY) * DAY - HOUR;
    const d = new Date(dayStart + b * BEAT);
    out.className = 'res';
    out.textContent = clock(d) + ' (UTC ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ')';
  }

  $('#lt').addEventListener('input', timeToBeats);
  $('#b').addEventListener('input', beatsToTime);
  tick(); timeToBeats(); beatsToTime();
  setInterval(tick, 864);
})();
</script>
</body>
</html>
