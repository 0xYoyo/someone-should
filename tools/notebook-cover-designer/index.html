<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an online designer for notepad book covers</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* tool styles */
.preview { display: flex; justify-content: center; padding: 8px 0 4px; }
#cover { width: 100%; max-width: 300px; height: auto; max-height: 52vh; border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
label.lab { display: block; font: 500 16px/1.3 var(--mono); color: var(--meta); margin-bottom: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts button { padding: 0 14px; }
.opts button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.sw { width: var(--tap); height: var(--tap); padding: 0; border-radius: 50%; border: 2px solid var(--line); }
.sw[aria-pressed="true"] { border: 3px solid var(--ink); outline: 2px solid var(--paper); outline-offset: -5px; }
.msg { min-height: 24px; color: var(--meta); }
.file { display: flex; align-items: center; min-height: var(--tap); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an online designer for notepad book covers</h1>

<main id="app" class="stack">
  <div class="preview"><svg id="cover" role="img" aria-label="Notebook cover preview"></svg></div>

  <div><label class="lab" for="title">title</label><input id="title" value="Field Notes" maxlength="40" autocomplete="off"></div>
  <div><label class="lab" for="sub">small line</label><input id="sub" value="Vol. 1" maxlength="40" autocomplete="off"></div>

  <div><span class="lab">size</span><div class="opts" id="sizes"></div></div>
  <div><span class="lab">colour</span><div class="opts" id="colors"></div></div>
  <div><span class="lab">pattern</span><div class="opts" id="pats"></div></div>
  <div><span class="lab">text</span><div class="opts" id="inks"></div></div>
  <div><label class="lab" for="img">image (stays on this device)</label><input id="img" type="file" accept="image/*" class="file"></div>
  <div class="row"><button id="clearimg" type="button">remove image</button><button id="export" class="primary" type="button">download PNG</button></div>
  <div class="msg" id="msg" role="status"></div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  // sizes in mm; export is 300 dpi
  const SIZES = { A6: [105, 148], A5: [148, 210], B5: [176, 250], Letter: [216, 279] };
  const COLORS = ['#f4f1ea', '#1f2a44', '#2e7d4f', '#c8321e', '#e8b931', '#d98ba0', '#141414'];
  const PATS = ['none', 'lines', 'dots', 'grid', 'circles', 'stripes'];
  const INKS = ['#141414', '#f4f1ea', '#e8b931'];

  const st = Object.assign({ title: 'Field Notes', sub: 'Vol. 1', size: 'A5', color: '#1f2a44', pat: 'dots', ink: '#f4f1ea' }, store.get('ncd', {}));
  let image = null; // data URL, never stored

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function wrap(text, max) {
    const words = text.trim().split(/\s+/).filter(Boolean), lines = [];
    let cur = '';
    for (const w of words) {
      if (cur && (cur + ' ' + w).length > max) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
    }
    if (cur) lines.push(cur);
    return lines.slice(0, 4);
  }

  function patternDef(kind, ink) {
    const c = ink, o = '0.22';
    switch (kind) {
      case 'lines': return `<pattern id="p" width="600" height="34" patternUnits="userSpaceOnUse"><rect y="30" width="600" height="2" fill="${c}" opacity="${o}"/></pattern>`;
      case 'dots': return `<pattern id="p" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="16" cy="16" r="3" fill="${c}" opacity="${o}"/></pattern>`;
      case 'grid': return `<pattern id="p" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="${c}" stroke-width="1.5" opacity="${o}"/></pattern>`;
      case 'circles': return `<pattern id="p" width="90" height="90" patternUnits="userSpaceOnUse"><circle cx="45" cy="45" r="34" fill="none" stroke="${c}" stroke-width="2" opacity="${o}"/><circle cx="45" cy="45" r="16" fill="none" stroke="${c}" stroke-width="2" opacity="${o}"/></pattern>`;
      case 'stripes': return `<pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="40" fill="${c}" opacity="0.14"/></pattern>`;
    }
    return '';
  }

  function render() {
    const [mw, mh] = SIZES[st.size];
    const W = 600, H = Math.round(W * mh / mw);
    const svg = $('#cover');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.style.aspectRatio = `${W} / ${H}`;
    const lines = wrap(st.title || '', 14);
    const fs = lines.some(l => l.length > 11) ? 56 : 72, lh = fs * 1.1;
    const cy = H * 0.42 - (lines.length - 1) * lh / 2;
    let s = `<defs>${patternDef(st.pat, st.ink)}</defs><rect width="${W}" height="${H}" fill="${st.color}"/>`;
    if (image) s += `<image href="${image}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice"/><rect width="${W}" height="${H}" fill="${st.color}" opacity="0.35"/>`;
    if (st.pat !== 'none') s += `<rect width="${W}" height="${H}" fill="url(#p)"/>`;
    // label panel behind the text
    const ph = lines.length * lh + 70;
    s += `<rect x="50" y="${cy - fs - 10}" width="${W - 100}" height="${ph + (st.sub ? 50 : 0)}" fill="${st.color}" opacity="0.88"/>`;
    s += `<rect x="50" y="${cy - fs - 10}" width="${W - 100}" height="${ph + (st.sub ? 50 : 0)}" fill="none" stroke="${st.ink}" stroke-width="3"/>`;
    lines.forEach((l, i) => { s += `<text class="t" x="${W / 2}" y="${cy + i * lh}" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="${fs}" font-weight="700" fill="${st.ink}">${esc(l)}</text>`; });
    if (st.sub) s += `<text class="s" x="${W / 2}" y="${cy + (lines.length - 1) * lh + 52}" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="${st.ink}">${esc(st.sub)}</text>`;
    svg.innerHTML = s;
  }

  function buttons(id, items, key, label) {
    const box = $(id);
    box.innerHTML = '';
    items.forEach(v => {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.v = v;
      b.setAttribute('aria-pressed', String(st[key] === v));
      if (key === 'color' || key === 'ink') { b.className = 'sw'; b.style.background = v; b.setAttribute('aria-label', key + ' ' + v); }
      else b.textContent = label ? label(v) : v;
      b.addEventListener('click', () => { st[key] = v; save(); sync(); });
      box.appendChild(b);
    });
  }

  function save() { store.set('ncd', st); }
  function sync() {
    buttons('#sizes', Object.keys(SIZES), 'size', k => `${k} ${SIZES[k][0]}x${SIZES[k][1]}`);
    buttons('#colors', COLORS, 'color');
    buttons('#pats', PATS, 'pat');
    buttons('#inks', INKS, 'ink');
    render();
  }

  $('#title').value = st.title;
  $('#sub').value = st.sub;
  $('#title').addEventListener('input', e => { st.title = e.target.value; save(); render(); });
  $('#sub').addEventListener('input', e => { st.sub = e.target.value; save(); render(); });

  $('#img').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) { $('#msg').textContent = 'That file is not an image.'; return; }
    const r = new FileReader();
    r.onload = () => { image = r.result; $('#msg').textContent = ''; render(); };
    r.onerror = () => { $('#msg').textContent = 'Could not read that image.'; };
    r.readAsDataURL(f);
  });
  $('#clearimg').addEventListener('click', () => { image = null; $('#img').value = ''; $('#msg').textContent = ''; render(); });

  $('#export').addEventListener('click', () => {
    const [mw, mh] = SIZES[st.size];
    const pw = Math.round(mw / 25.4 * 300), ph = Math.round(mh / 25.4 * 300);
    const svg = $('#cover');
    const xml = new XMLSerializer().serializeToString(svg).replace('<svg ', `<svg width="${pw}" height="${ph}" `);
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = pw; c.height = ph;
        c.getContext('2d').drawImage(img, 0, 0, pw, ph);
        c.toBlob(b => {
          if (!b) { $('#msg').textContent = 'Could not make the PNG.'; return; }
          const a = document.createElement('a');
          a.href = URL.createObjectURL(b);
          a.download = `cover-${st.size}-${pw}x${ph}.png`;
          document.body.appendChild(a); a.click(); a.remove();
          $('#msg').textContent = `Saved ${pw} x ${ph} px (${st.size}, 300 dpi).`;
        }, 'image/png');
      } catch { $('#msg').textContent = 'Could not make the PNG.'; }
    };
    img.onerror = () => { $('#msg').textContent = 'Could not make the PNG.'; };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  });

  sync();
})();
</script>
</body>
</html>
