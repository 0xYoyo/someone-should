<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an alarm that adds more instruments to a song each minute you don't dismiss it</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
.lay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; padding: 0; list-style: none; }
.lay li { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 10px 12px; min-height: var(--tap); color: var(--meta); }
.lay li.on { border-color: var(--ink); color: var(--ink); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ink); }
.time { width: auto; font-size: 32px; font-variant-numeric: tabular-nums; min-height: 56px; }
.grow { flex: 1 1 140px; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an alarm that adds more instruments to a song each minute you don't dismiss it</h1>
<main id="app" class="stack">
  <div class="row">
    <input id="at" class="time" type="time" value="07:00" aria-label="alarm time">
    <button id="arm" class="primary grow">set alarm</button>
  </div>
  <div id="status" class="meta">not set</div>
  <div class="big" id="count">1 of 6</div>
  <div class="bar"><i id="fill"></i></div>
  <ul class="lay" id="layers"></ul>
  <div class="row">
    <button id="try" class="grow">hear it (fast)</button>
    <button id="dismiss" class="grow" hidden>dismiss</button>
  </div>
  <div id="msg" class="meta">keep this page open and the volume up.</div>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const NAMES = ['kalimba', 'bass', 'kick', 'hi-hat', 'pad', 'bells'];
  const STEP = 0.25;                                  // seconds per eighth note
  const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]]; // Am F C G
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  let armed = store.get('alarm', null);               // "HH:MM" or null
  let ringing = false, fast = false, layers = 1, ringStart = 0;
  let ctx = null, master = null, nextT = 0, step = 0, sched = null, layerTimer = null;

  const list = $('#layers');
  NAMES.forEach(n => { const li = document.createElement('li'); li.textContent = n; list.appendChild(li); });

  function render() {
    [...list.children].forEach((li, i) => li.classList.toggle('on', i < layers));
    $('#count').textContent = layers + ' of ' + NAMES.length;
    $('#fill').style.width = (layers / NAMES.length * 100) + '%';
    $('#dismiss').hidden = !ringing;
    $('#arm').textContent = armed ? 'cancel alarm' : 'set alarm';
    $('#status').textContent = ringing ? 'ringing' : armed ? 'alarm set for ' + armed : 'not set';
  }

  function tone(t, f, dur, type, vol, att) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (att || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, vol) {
    const n = Math.floor(ctx.sampleRate * dur), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), g = ctx.createGain(), h = ctx.createBiquadFilter();
    h.type = 'highpass'; h.frequency.value = 7000; s.buffer = b;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(h); h.connect(g); g.connect(master); s.start(t);
  }

  function playStep(s, t) {
    const chord = CHORDS[(s >> 2) & 3], k = s & 3;
    if (layers > 0) { // kalimba: arpeggio of the chord
      const m = chord[[0, 1, 2, 1][k]] + 12;
      tone(t, hz(m), 0.5, 'sine', 0.25, 0.005);
    }
    if (layers > 1 && k % 2 === 0) tone(t, hz(chord[0] - 12), STEP * 1.8, 'triangle', 0.4, 0.01);
    if (layers > 2 && k === 0) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
      g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.25);
    }
    if (layers > 3 && k % 2 === 1) noise(t, 0.05, 0.25);
    if (layers > 4 && k === 0) chord.forEach(m => tone(t, hz(m), STEP * 4, 'sawtooth', 0.05, 0.08));
    if (layers > 5 && (s & 1) === 0) tone(t, hz(chord[(s >> 1) % 3] + 24), 0.6, 'sine', 0.12, 0.005);
  }

  function pump() {
    while (nextT < ctx.currentTime + 0.3) { playStep(step, nextT); step = (step + 1) & 15; nextT += STEP; }
  }

  function startRing(isFast) {
    if (ringing) return;
    ringing = true; fast = isFast; layers = 1; ringStart = Date.now();
    $('#msg').textContent = fast ? 'a new layer every second.' : 'a new layer every minute until you dismiss.';
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
      if (ctx.resume) ctx.resume();
      nextT = ctx.currentTime + 0.05; step = 0; pump(); sched = setInterval(pump, 100);
    } catch (e) { $('#msg').textContent = 'no sound available in this browser.'; }
    layerTimer = setInterval(() => {
      if (layers < NAMES.length) { layers++; render(); }
    }, fast ? 800 : 60000);
    render();
  }

  function stopRing() {
    ringing = false; layers = 1;
    clearInterval(sched); clearInterval(layerTimer);
    try { if (ctx) ctx.close(); } catch (e) {}
    ctx = null; render();
  }

  $('#try').addEventListener('click', () => { if (ringing) stopRing(); startRing(true); });
  $('#dismiss').addEventListener('click', () => {
    stopRing();
    if (armed && !fast) { armed = null; store.set('alarm', null); }
    fast = false; render();
    $('#msg').textContent = 'dismissed.';
  });
  $('#arm').addEventListener('click', () => {
    if (armed) { armed = null; store.set('alarm', null); render(); $('#msg').textContent = 'alarm cancelled.'; return; }
    const v = $('#at').value;
    if (!v) { $('#msg').textContent = 'pick a time first.'; return; }
    armed = v; store.set('alarm', v);
    // unlock audio on this tap so the alarm can sound later
    try { const AC = window.AudioContext || window.webkitAudioContext; const c = new AC(); c.resume && c.resume(); setTimeout(() => c.close(), 200); } catch (e) {}
    $('#msg').textContent = 'keep this page open and the volume up.';
    render();
  });

  let lastFired = '';
  setInterval(() => {
    if (!armed || ringing) return;
    const d = new Date(), hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    if (hm === armed && lastFired !== hm + d.getDate()) { lastFired = hm + d.getDate(); startRing(false); }
  }, 1000);

  if (armed) $('#at').value = armed;
  render();
})();
</script>
</body>
</html>
