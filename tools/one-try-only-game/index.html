<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a game that gives you only one try and you fail forever</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.track { position: relative; height: 64px; border: 1.5px solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.zone { position: absolute; top: 0; bottom: 0; left: 46%; width: 8%; background: var(--line); }
.mark { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--ink); }
#stop { width: 100%; min-height: 72px; font-size: 20px; }
#stop:disabled { opacity: .45; cursor: default; }
#result { min-height: 3em; }
.locked .mark { background: var(--meta); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a game that gives you only one try and you fail forever</h1>
<main id="app" class="stack">
  <p class="meta" id="rule">One try. Stop the line inside the grey zone.</p>
  <div class="track" id="track"><div class="zone"></div><div class="mark" id="mark"></div></div>
  <button class="primary" id="stop" type="button">Stop</button>
  <div id="result" class="big" aria-live="polite"></div>
  <p class="meta" id="note"></p>
</main>
<script>
(() => {
  'use strict';
  const KEY = 'one-try-only-game';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const ZONE_MIN = 46, ZONE_MAX = 54;
  const mark = $('#mark'), stop = $('#stop'), result = $('#result'), note = $('#note'), rule = $('#rule');
  let raf = 0, t0 = performance.now();

  // triangle wave 0..100, period 1.4 s
  const posAt = t => { const p = (t / 700) % 2; return (p < 1 ? p : 2 - p) * 100; };
  const show = r => {
    cancelAnimationFrame(raf);
    document.body.classList.add('locked');
    mark.style.left = r.pos + '%';
    stop.disabled = true;
    stop.textContent = 'Used';
    rule.textContent = 'Your one try is spent.';
    result.className = 'big ' + (r.hit ? 'built' : 'no');
    result.textContent = r.hit ? 'Hit.' : 'Missed by ' + r.off + '%.';
    note.textContent = r.hit ? 'It stays that way.' : 'You fail forever.';
  };
  const frame = now => { mark.style.left = posAt(now - t0) + '%'; raf = requestAnimationFrame(frame); };

  const saved = store.get(KEY, null);
  if (saved && typeof saved.pos === 'number') { show(saved); return; }
  raf = requestAnimationFrame(frame);

  stop.addEventListener('click', () => {
    const pos = Math.round(posAt(performance.now() - t0) * 10) / 10;
    const off = pos < ZONE_MIN ? ZONE_MIN - pos : pos > ZONE_MAX ? pos - ZONE_MAX : 0;
    const r = { pos, hit: off === 0, off: Math.round(off) };
    const ok = store.set(KEY, r);
    show(r);
    if (!ok) note.textContent += ' This browser will not remember it.';
  });
})();
</script>
</body>
</html>
