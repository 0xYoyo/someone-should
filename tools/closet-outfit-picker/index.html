<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a closet stylist app where you input your clothes</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* tool styles */
h1 { font-size: 16px; }
.meta { font-size: 16px; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; padding: 0 8px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.outfit { border: 1.5px solid var(--ink); border-radius: var(--radius); padding: 4px 14px; }
.outfit .piece { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.outfit .piece:last-child { border-bottom: 0; }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--meta); margin-right: 8px; vertical-align: -1px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid .full { grid-column: 1 / -1; }
label.f { display: grid; gap: 4px; }
ul.plain li button { min-width: var(--tap); padding: 0 12px; }
h2 { font: 500 16px/1.3 var(--mono); color: var(--meta); margin: 8px 0 0; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a closet stylist app where you input your clothes</h1>
<main id="app" class="stack">
  <div class="seg" role="group" aria-label="Weather">
    <button id="w-warm" data-w="warm" aria-pressed="false">Warm</button>
    <button id="w-mild" data-w="mild" aria-pressed="true">Mild</button>
    <button id="w-cold" data-w="cold" aria-pressed="false">Cold</button>
  </div>
  <div id="outfit" class="outfit" aria-live="polite"></div>
  <div class="row">
    <button id="pick" class="primary">Another outfit</button>
    <button id="wore">Wearing this</button>
  </div>
  <div id="msg" class="meta"></div>
  <h2>Add a piece</h2>
  <form id="form" class="grid">
    <label class="f full">Name<input id="name" autocomplete="off" placeholder="blue oxford shirt"></label>
    <label class="f">Type<select id="type"><option value="top">Top</option><option value="bottom">Bottom</option><option value="shoes">Shoes</option><option value="layer">Layer</option></select></label>
    <label class="f">Colour<select id="color"></select></label>
    <label class="f full">Season<select id="season"><option value="any">Any weather</option><option value="warm">Warm only</option><option value="cold">Cold only</option></select></label>
    <button id="add" class="primary full" type="submit">Add</button>
  </form>
  <h2 id="count"></h2>
  <ul id="list" class="plain"></ul>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const COLORS = {
    black: '#141414', white: '#ffffff', grey: '#9a9a9a', navy: '#1f2f54', beige: '#d8c8a8', denim: '#4a6a94',
    red: '#c8321e', blue: '#2a63c8', green: '#2e7d4f', yellow: '#e0b92a', pink: '#e58fb0', brown: '#7a5232'
  };
  const NEUTRAL = ['black', 'white', 'grey', 'navy', 'beige', 'denim'];
  const TYPES = ['top', 'bottom', 'shoes', 'layer'];

  const sample = [
    ['white t-shirt', 'top', 'white', 'warm'], ['blue oxford shirt', 'top', 'blue', 'any'],
    ['grey sweater', 'top', 'grey', 'cold'], ['red hoodie', 'top', 'red', 'cold'],
    ['dark jeans', 'bottom', 'denim', 'any'], ['black trousers', 'bottom', 'black', 'any'],
    ['beige shorts', 'bottom', 'beige', 'warm'], ['white sneakers', 'shoes', 'white', 'any'],
    ['brown boots', 'shoes', 'brown', 'cold'], ['navy jacket', 'layer', 'navy', 'any'],
    ['green coat', 'layer', 'green', 'cold']
  ].map((a, i) => ({ id: i + 1, name: a[0], type: a[1], color: a[2], season: a[3], worn: 0 }));

  let items = store.get('closet.items', null);
  if (!Array.isArray(items) || !items.length) items = sample;
  let weather = store.get('closet.weather', 'mild');
  let ranked = [], idx = 0, current = null;

  const save = () => { store.set('closet.items', items); store.set('closet.weather', weather); };

  function fits(it) {
    if (weather === 'warm') return it.season !== 'cold' && it.type !== 'layer';
    if (weather === 'cold') return it.season !== 'warm';
    return it.season === 'any';
  }

  // At most one loud colour per outfit; neutrals go with anything.
  function colourOk(parts) {
    const loud = new Set(parts.filter(p => !NEUTRAL.includes(p.color)).map(p => p.color));
    return loud.size <= 1;
  }

  function build() {
    const pool = items.filter(fits);
    const by = t => pool.filter(i => i.type === t);
    const tops = by('top'), bottoms = by('bottom'), shoes = by('shoes'), layers = by('layer');
    if (!tops.length || !bottoms.length || !shoes.length) { ranked = []; return; }
    const layerOpts = weather === 'warm' ? [null] : (layers.length ? (weather === 'cold' ? layers : [null, ...layers]) : [null]);
    const now = Date.now(), out = [];
    for (const t of tops) for (const b of bottoms) for (const s of shoes) for (const l of layerOpts) {
      const parts = [t, b, s, l].filter(Boolean);
      if (!colourOk(parts)) continue;
      // Prefer pieces not worn lately; a little noise so each tap differs.
      let score = Math.random() * 3;
      for (const p of parts) score += p.worn ? Math.min((now - p.worn) / 864e5, 14) / 14 : 1;
      out.push({ parts, score });
    }
    out.sort((a, b) => b.score - a.score);
    ranked = out.map(o => o.parts);
  }

  function dot(c) { return '<span class="dot" style="background:' + COLORS[c] + '"></span>'; }
  function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function showOutfit() {
    const box = $('#outfit');
    $('#msg').textContent = '';
    if (!ranked.length) {
      current = null;
      const have = t => items.some(i => i.type === t && fits(i));
      const miss = ['top', 'bottom', 'shoes'].filter(t => !have(t));
      box.innerHTML = '<div class="empty" id="none">' + (miss.length ? 'No ' + weather + '-weather ' + miss.join(', ') + ' yet. Add one below.' : 'Every combination clashes. Add a neutral piece.') + '</div>';
      return;
    }
    current = ranked[idx % ranked.length];
    box.innerHTML = current.map(p => '<div class="piece"><span class="pn">' + dot(p.color) + esc(p.name) + '</span><span class="meta">' + p.type + '</span></div>').join('');
  }

  function pick(again) {
    if (again && ranked.length) idx = (idx + 1) % Math.min(ranked.length, 12);
    else { build(); idx = 0; }
    showOutfit();
  }

  function renderList() {
    $('#count').textContent = items.length + (items.length === 1 ? ' piece' : ' pieces');
    const sorted = [...items].sort((a, b) => TYPES.indexOf(a.type) - TYPES.indexOf(b.type));
    $('#list').innerHTML = sorted.map(i => '<li><span>' + dot(i.color) + esc(i.name) + ' <span class="meta">' + i.type + '</span></span><button data-del="' + i.id + '" aria-label="Remove ' + esc(i.name) + '">Remove</button></li>').join('');
  }

  function setWeather(w) {
    weather = w; save();
    document.querySelectorAll('[data-w]').forEach(b => b.setAttribute('aria-pressed', b.dataset.w === w));
    pick(false);
  }

  $('#color').innerHTML = Object.keys(COLORS).map(c => '<option value="' + c + '">' + c + '</option>').join('');
  document.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => setWeather(b.dataset.w)));
  $('#pick').addEventListener('click', () => pick(true));
  $('#wore').addEventListener('click', () => {
    if (!current) return;
    const now = Date.now();
    current.forEach(p => { p.worn = now; });
    save(); build(); idx = 0; showOutfit();
    $('#msg').textContent = 'Saved as worn today. Next picks avoid it.';
  });
  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#name').value.trim();
    if (!name) { $('#msg').textContent = 'Give the piece a name.'; return; }
    items.push({ id: Date.now(), name: name.slice(0, 40), type: $('#type').value, color: $('#color').value, season: $('#season').value, worn: 0 });
    $('#name').value = '';
    save(); renderList(); pick(false);
  });
  $('#list').addEventListener('click', e => {
    const id = e.target.dataset && e.target.dataset.del;
    if (!id) return;
    items = items.filter(i => String(i.id) !== id);
    save(); renderList(); pick(false);
  });

  document.querySelectorAll('[data-w]').forEach(b => b.setAttribute('aria-pressed', b.dataset.w === weather));
  renderList();
  pick(false);
})();
</script>
</body>
</html>
