<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that flashes the screen or beeps when the noise reaches a set threshold</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
.meter { position: relative; height: 72px; border: 1.5px solid var(--ink); border-radius: var(--radius); overflow: hidden; }
#fill { position: absolute; left: 0; top: 0; bottom: 0; width: 35%; background: var(--ink); opacity: .85; }
#mark { position: absolute; top: 0; bottom: 0; width: 3px; left: 70%; background: var(--no); }
.over #fill { background: var(--no); }
body.flash { background: var(--no); }
body.flash h1, body.flash .meta { color: #fff; }
#status { min-height: 1.45em; }
.over #status { color: var(--no); font-weight: 600; }
body.flash #status { color: #fff; }
button.on { background: var(--ink); color: var(--paper); }
input[type=range] { padding: 0; accent-color: var(--ink); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that flashes the screen or beeps when the noise reaches a set threshold</h1>

<main id="app" class="stack">
  <div class="big" id="level">35</div>
  <div class="meter" id="meter"><div id="fill"></div><div id="mark"></div></div>
  <div id="status" class="meta" role="status">tap to start</div>
  <label class="stack"><span class="meta">threshold <span id="thv">70</span></span>
    <input id="th" type="range" min="5" max="95" value="70"></label>
  <div class="row">
    <button id="start" class="primary" type="button">start</button>
    <button id="beep" class="on" type="button" aria-pressed="true">beep</button>
    <button id="flash" class="on" type="button" aria-pressed="true">flash</button>
    <button id="test" type="button">test</button>
  </div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  let threshold = store.get('th', 70);
  let doBeep = store.get('beep', true);
  let doFlash = store.get('flash', true);
  let ctx = null, analyser = null, stream = null, buf = null, raf = 0, running = false;
  let lastAlarm = 0, flashTimer = 0;

  function show(level) {
    $('#level').textContent = Math.round(level);
    $('#fill').style.width = level + '%';
    $('#meter').classList.toggle('over', level >= threshold);
  }
  function setToggle(id, on) {
    const b = $(id); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  }
  function setThreshold(v) {
    threshold = +v; $('#th').value = threshold; $('#thv').textContent = threshold;
    $('#mark').style.left = threshold + '%';
    store.set('th', threshold);
  }

  function beep() {
    try {
      const c = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.value = 880; g.gain.value = 0.2;
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + 0.25);
    } catch {}
  }
  function alarm() {
    const now = Date.now();
    if (now - lastAlarm < 800) return;
    lastAlarm = now;
    $('#status').textContent = 'too loud';
    if (doFlash) {
      document.body.classList.add('flash');
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => document.body.classList.remove('flash'), 400);
    }
    if (doBeep) beep();
    try { if (navigator.vibrate) navigator.vibrate(120); } catch {}
  }

  function tick() {
    analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) { const d = (buf[i] - 128) / 128; sum += d * d; }
    const rms = Math.sqrt(sum / buf.length);
    // map roughly -50 dB..0 dB to 0..100
    const db = 20 * Math.log10(rms || 1e-5);
    const level = Math.max(0, Math.min(100, (db + 50) * 2));
    show(level);
    if (level >= threshold) alarm(); else if ($('#status').textContent === 'too loud') $('#status').textContent = 'listening';
    raf = requestAnimationFrame(tick);
  }

  async function start() {
    if (running) return stop();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $('#status').textContent = 'no microphone here, use test'; return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    } catch {
      $('#status').textContent = 'microphone blocked, allow it and retry'; return;
    }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.resume) ctx.resume();
    analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
    ctx.createMediaStreamSource(stream).connect(analyser);
    buf = new Uint8Array(analyser.fftSize);
    running = true;
    $('#start').textContent = 'stop';
    $('#status').textContent = 'listening';
    tick();
  }
  function stop() {
    running = false; cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ctx) { try { ctx.close(); } catch {} ctx = null; }
    stream = null;
    $('#start').textContent = 'start';
    $('#status').textContent = 'stopped';
    show(0);
  }

  $('#start').addEventListener('click', start);
  $('#th').addEventListener('input', e => setThreshold(e.target.value));
  $('#beep').addEventListener('click', () => { doBeep = !doBeep; store.set('beep', doBeep); setToggle('#beep', doBeep); });
  $('#flash').addEventListener('click', () => { doFlash = !doFlash; store.set('flash', doFlash); setToggle('#flash', doFlash); });
  $('#test').addEventListener('click', () => { show(Math.min(100, threshold + 10)); lastAlarm = 0; alarm(); });

  setThreshold(threshold); setToggle('#beep', doBeep); setToggle('#flash', doFlash);
  show(35);
})();
</script>
</body>
</html>
