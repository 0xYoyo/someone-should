<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an rpg where your character gets permanent injuries</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.bar { height: 12px; border: 1.5px solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); transition: width .2s; }
.bar.foe i { background: var(--no); }
.card { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; }
.card .name { display: flex; justify-content: space-between; gap: 8px; }
.acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.acts button { padding: 0 6px; }
button:disabled { opacity: .4; cursor: default; }
#last { min-height: 50px; }
#scars li { display: block; border-bottom: 1px solid var(--line); padding: 10px 0; }
#scars b { color: var(--no); font-weight: 500; }
#log { max-height: 0; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an rpg where your character gets permanent injuries</h1>

<main id="app" class="stack">
  <div class="card">
    <div class="name"><span id="foename">Rat</span><span class="meta" id="floor">Floor 1</span></div>
    <div class="bar foe"><i id="foebar" style="width:100%"></i></div>
    <div class="meta" id="intent">&nbsp;</div>
  </div>
  <div class="card">
    <div class="name"><span>You</span><span class="meta"><span id="hp">40</span> / <span id="maxhp">40</span> hp</span></div>
    <div class="bar"><i id="hpbar" style="width:100%"></i></div>
  </div>
  <p id="last" aria-live="polite">A rat blocks the stairs.</p>
  <div class="acts" id="acts">
    <button class="primary" id="strike">Strike</button>
    <button id="guard">Guard</button>
    <button id="potion">Potion <span id="potions">2</span></button>
  </div>
  <div id="over" hidden class="stack">
    <div class="no" id="overtext"></div>
    <button class="primary" id="again">New run</button>
  </div>
  <div>
    <div class="meta">scars, permanent for this run</div>
    <ul class="plain" id="scars"></ul>
    <div class="empty" id="noscars">None yet. Heavy blows leave marks.</div>
  </div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const SCARS = {
    eye:   { name: 'Lost eye',       text: 'Your strikes miss more often.' },
    arm:   { name: 'Broken arm',     text: 'Your strikes do 2 less damage.' },
    knee:  { name: 'Torn knee',      text: 'Guarding blocks only a quarter.' },
    ribs:  { name: 'Cracked ribs',   text: 'Max hp is 8 lower.' },
    ear:   { name: 'Ruined ear',     text: 'You can no longer hear a heavy blow coming.' },
    hand:  { name: 'Missing fingers', text: 'Potions heal half as much.' }
  };
  const FOES = [['Rat', 14, 4], ['Bandit', 22, 6], ['Wolf', 28, 7], ['Ogre', 40, 9], ['Wraith', 46, 11], ['Troll', 60, 13]];

  const fresh = () => ({ hp: 40, floor: 1, potions: 2, scars: [], foe: mkFoe(1), msg: 'A rat blocks the stairs.', dead: false, intent: 'n' });
  function mkFoe(f) {
    const b = FOES[Math.min(f - 1, FOES.length - 1)], extra = Math.max(0, f - FOES.length);
    return { name: b[0], max: b[1] + extra * 8, hp: b[1] + extra * 8, atk: b[2] + extra * 2 };
  }
  let s = store.get('lsr-run', null) || fresh();
  const has = k => s.scars.includes(k);
  const maxHp = () => 40 - (has('ribs') ? 8 : 0);
  const rnd = n => Math.floor(Math.random() * n);

  function save() { store.set('lsr-run', s); }

  function render() {
    const f = s.foe;
    $('#foename').textContent = f.name;
    $('#floor').textContent = 'Floor ' + s.floor;
    $('#foebar').style.width = Math.max(0, f.hp / f.max * 100) + '%';
    $('#hp').textContent = Math.max(0, s.hp);
    $('#maxhp').textContent = maxHp();
    $('#hpbar').style.width = Math.max(0, s.hp / maxHp() * 100) + '%';
    $('#potions').textContent = s.potions;
    $('#potion').disabled = s.potions < 1 || s.dead;
    $('#strike').disabled = $('#guard').disabled = s.dead;
    $('#intent').textContent = s.dead ? '\u00a0' : (s.intent === 'h' && !has('ear') ? 'Winding up a heavy blow.' : (has('ear') ? 'You cannot hear what it plans.' : 'Watching you.'));
    $('#last').textContent = s.msg;
    const ul = $('#scars'); ul.textContent = '';
    s.scars.forEach(k => {
      const li = document.createElement('li');
      const b = document.createElement('b'); b.textContent = SCARS[k].name;
      li.append(b, ' ' + SCARS[k].text);
      ul.append(li);
    });
    $('#noscars').hidden = s.scars.length > 0;
    $('#acts').hidden = s.dead;
    $('#over').hidden = !s.dead;
    if (s.dead) $('#overtext').textContent = 'Dead on floor ' + s.floor + ' with ' + s.scars.length + (s.scars.length === 1 ? ' scar.' : ' scars.');
  }

  // Resolve the foe's turn; guard = true if player guarded.
  function foeTurn(guard) {
    const f = s.foe, heavy = s.intent === 'h';
    let dmg = f.atk + rnd(3) - 1;
    if (heavy) dmg = Math.round(dmg * 2);
    if (guard) dmg = Math.round(dmg * (has('knee') ? 0.75 : 0.5));
    s.hp -= dmg;
    let m = f.name + (heavy ? ' lands a heavy blow' : ' hits you') + ' for ' + dmg + '.';
    // a scar needs a heavy blow, or any single hit over a third of max hp
    const big = dmg >= maxHp() / 3;
    if (s.hp > 0 && (heavy || big) && (big || Math.random() < 0.6) && !(guard && Math.random() < 0.5)) {
      const left = Object.keys(SCARS).filter(k => !has(k));
      if (left.length) {
        const k = left[rnd(left.length)];
        s.scars.push(k);
        m += ' Scarred: ' + SCARS[k].name + '.';
        if (k === 'ribs') s.hp = Math.min(s.hp, maxHp());
      }
    }
    s.intent = Math.random() < 0.3 ? 'h' : 'n';
    if (s.hp <= 0) { s.dead = true; s.hp = 0; m += ' You fall.'; }
    return m;
  }

  function act(kind) {
    if (s.dead) return;
    let m = '', guard = false;
    const f = s.foe;
    if (kind === 'strike') {
      const hit = 0.9 - (has('eye') ? 0.3 : 0);
      if (Math.random() < hit) {
        const d = Math.max(1, 5 + rnd(5) - (has('arm') ? 2 : 0));
        f.hp -= d; m = 'You hit the ' + f.name.toLowerCase() + ' for ' + d + '. ';
      } else m = 'You miss. ';
    } else if (kind === 'guard') {
      guard = true; m = 'You brace. ';
    } else if (kind === 'potion') {
      if (s.potions < 1) return;
      s.potions--;
      const h = has('hand') ? 8 : 16;
      s.hp = Math.min(maxHp(), s.hp + h); m = 'You drink: +' + h + ' hp. ';
    }
    if (f.hp <= 0) {
      s.floor++; s.foe = mkFoe(s.floor);
      s.hp = Math.min(maxHp(), s.hp + 6);
      if (s.floor % 3 === 0) s.potions++;
      s.intent = 'n';
      m += 'It dies. Floor ' + s.floor + ': a ' + s.foe.name.toLowerCase() + '.';
    } else m += foeTurn(guard);
    s.msg = m;
    save(); render();
  }

  $('#strike').addEventListener('click', () => act('strike'));
  $('#guard').addEventListener('click', () => act('guard'));
  $('#potion').addEventListener('click', () => act('potion'));
  $('#again').addEventListener('click', () => { s = fresh(); save(); render(); });
  render();
})();
</script>
</body>
</html>
