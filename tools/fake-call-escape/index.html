<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that calls you back after a few minutes so you can leave a conversation</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{flex:1 0 auto;min-width:64px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
label{display:grid;gap:6px}
.hint{font-size:16px;color:var(--meta)}
#count{font-size:56px}
#incoming,#talk{position:fixed;inset:0;background:#111;color:#f4f1ea;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:12vh 24px 8vh;text-align:center;z-index:9}
#incoming.on,#talk.on{display:flex}
#incoming .name,#talk .name{font-size:36px;font-weight:500}
#incoming .sub,#talk .sub{font-size:18px;color:#bbb;margin-top:8px}
.acts{display:flex;gap:56px}
.acts button{width:72px;height:72px;border-radius:50%;border:0;color:#fff;font-size:16px;padding:0}
#decline,#end{background:#c8321e}
#accept{background:#2e7d4f}
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that calls you back after a few minutes so you can leave a conversation</h1>
<main id="app" class="stack">
<section id="setup" class="stack">
<label>Caller<input id="name" value="Mom" maxlength="30" autocomplete="off"></label>
<div>Call me in</div>
<div class="chips" id="delays">
<button data-s="30" aria-pressed="false">30 s</button>
<button data-s="60" aria-pressed="false">1 min</button>
<button data-s="180" aria-pressed="true">3 min</button>
<button data-s="300" aria-pressed="false">5 min</button>
<button data-s="600" aria-pressed="false">10 min</button>
</div>
<button id="start" class="primary">Start timer</button>
<button id="preview">Preview the call</button>
<div id="msg" class="hint">Keep this page open and the sound on.</div>
</section>
<section id="wait" class="stack" hidden>
<div class="hint">Incoming call from <span id="who"></span> in</div>
<div id="count" class="big">03:00</div>
<button id="cancel">Cancel</button>
</section>
</main>
<div id="incoming" role="dialog" aria-label="Incoming call">
<div><div class="sub">incoming call</div><div class="name" id="inName"></div><div class="sub">mobile</div></div>
<div class="acts"><button id="decline">Decline</button><button id="accept">Accept</button></div>
</div>
<div id="talk" role="dialog" aria-label="Call">
<div><div class="name" id="talkName"></div><div class="sub" id="talkTime">00:00</div></div>
<div class="acts"><button id="end">End</button></div>
</div>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  let secs = store.get('delay', 180), endAt = 0, tick = 0, ringT = 0, talkT = 0, ctx = null, lock = null;
  const nameEl = $('#name');
  nameEl.value = store.get('name', 'Mom');
  const mmss = n => { n = Math.max(0, Math.round(n)); return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); };
  function markDelay() {
    let hit = false;
    $$('#delays button').forEach(b => { const on = +b.dataset.s === secs; b.setAttribute('aria-pressed', on); hit = hit || on; });
    if (!hit) { secs = 180; markDelay(); }
  }
  markDelay();
  $('#delays').onclick = e => { const b = e.target.closest('button'); if (!b) return; secs = +b.dataset.s; store.set('delay', secs); markDelay(); };
  const callerName = () => nameEl.value.trim() || 'Unknown';
  function show(w) { $('#setup').hidden = w !== 'setup'; $('#wait').hidden = w !== 'wait'; }

  function beep() {
    if (!ctx) return;
    const t = ctx.currentTime;
    [0, 0.25].forEach(off => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, t + off); g.gain.exponentialRampToValueAtTime(0.4, t + off + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.2);
      o.start(t + off); o.stop(t + off + 0.22);
    });
    try { navigator.vibrate && navigator.vibrate([400, 200, 400]); } catch {}
  }
  function audioOn() {
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume && ctx.resume(); } catch { ctx = null; }
  }
  function ring() {
    clearInterval(tick);
    $('#inName').textContent = callerName();
    $('#incoming').classList.add('on');
    beep(); ringT = setInterval(beep, 1800);
    try { document.title = 'Incoming call'; } catch {}
  }
  function stopRing() { clearInterval(ringT); try { navigator.vibrate && navigator.vibrate(0); } catch {} $('#incoming').classList.remove('on'); }
  function release() { try { lock && lock.release(); } catch {} lock = null; }
  function reset() { clearInterval(tick); stopRing(); release(); show('setup'); $('#msg').textContent = 'Keep this page open and the sound on.'; }

  $('#start').onclick = () => {
    store.set('name', nameEl.value);
    audioOn();
    endAt = Date.now() + secs * 1000;
    $('#who').textContent = callerName();
    show('wait');
    try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { lock = l; }, () => {}); } catch {}
    const upd = () => {
      const left = (endAt - Date.now()) / 1000;
      $('#count').textContent = mmss(Math.ceil(left));
      if (left <= 0) ring();
    };
    clearInterval(tick); upd(); tick = setInterval(upd, 250);
  };
  $('#cancel').onclick = reset;
  $('#preview').onclick = () => { audioOn(); ring(); };
  $('#decline').onclick = reset;
  $('#accept').onclick = () => {
    stopRing(); release();
    $('#talkName').textContent = callerName();
    const t0 = Date.now();
    $('#talkTime').textContent = '00:00';
    $('#talk').classList.add('on');
    talkT = setInterval(() => { $('#talkTime').textContent = mmss((Date.now() - t0) / 1000); }, 500);
  };
  $('#end').onclick = () => { clearInterval(talkT); $('#talk').classList.remove('on'); reset(); };
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && endAt && $('#wait').hidden === false && endAt <= Date.now()) ring();
  });
})();
</script>
</body>
</html>
