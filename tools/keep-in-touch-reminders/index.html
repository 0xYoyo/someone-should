<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a personal CRM app that reminds you to stay in touch with people</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.meta { font-size: 16px; }
.who { display: grid; gap: 2px; min-width: 0; }
.who b { font-weight: 500; overflow-wrap: anywhere; }
.acts { display: flex; gap: 8px; }
.acts button { padding: 0 12px; min-width: var(--tap); }
li.over .meta.s { color: var(--no); }
form.add { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 8px; }
form.add select { grid-column: 1; }
form.add button { grid-column: 2; grid-row: 1 / span 2; }
label.sr { position: absolute; left: -9999px; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a personal CRM app that reminds you to stay in touch with people</h1>
<main id="app" class="stack">
  <div id="summary" class="meta"></div>
  <ul id="list" class="plain"></ul>
  <form class="add" id="form">
    <label class="sr" for="name">Name</label>
    <input id="name" placeholder="Add a person" autocomplete="off" maxlength="60">
    <label class="sr" for="every">Every</label>
    <select id="every">
      <option value="7">every week</option>
      <option value="14">every 2 weeks</option>
      <option value="30" selected>every month</option>
      <option value="90">every 3 months</option>
      <option value="365">every year</option>
    </select>
    <button class="primary" id="add" type="submit">Add</button>
  </form>
  <div id="err" class="meta no"></div>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const DAY = 86400000;
  // whole days since epoch in local time
  const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / DAY); };
  const t0 = today();
  let people = store.get('kit.people', null);
  if (!Array.isArray(people)) {
    people = [
      { n: 'Mum', e: 7, l: t0 - 10 },
      { n: 'Old flatmate', e: 90, l: t0 - 100 },
      { n: 'Priya', e: 30, l: t0 - 12 }
    ];
  }
  const save = () => store.set('kit.people', people);
  const due = p => p.l + p.e - today();
  const phrase = n => Math.abs(n) + (Math.abs(n) === 1 ? ' day' : ' days');

  function render() {
    const sorted = people.map((p, i) => ({ p, i })).sort((a, b) => due(a.p) - due(b.p));
    const over = sorted.filter(x => due(x.p) < 0).length;
    $('#summary').textContent = people.length ? (over ? over + ' overdue' : 'no one overdue') : '';
    const ul = $('#list');
    ul.textContent = '';
    if (!people.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No one yet. Add someone below.';
      ul.appendChild(li);
      return;
    }
    sorted.forEach(({ p, i }) => {
      const d = due(p);
      const li = document.createElement('li');
      if (d < 0) li.className = 'over';
      const who = document.createElement('div');
      who.className = 'who';
      const b = document.createElement('b');
      b.textContent = p.n;
      const s = document.createElement('span');
      s.className = 'meta s';
      s.textContent = d < 0 ? 'overdue by ' + phrase(d) : d === 0 ? 'due today' : 'due in ' + phrase(d);
      who.append(b, s);
      const acts = document.createElement('div');
      acts.className = 'acts';
      const done = document.createElement('button');
      done.className = 'done';
      done.textContent = 'Talked';
      done.setAttribute('aria-label', 'Talked to ' + p.n);
      done.onclick = () => { people[i].l = today(); save(); render(); };
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '\u00d7';
      del.setAttribute('aria-label', 'Remove ' + p.n);
      del.onclick = () => { people.splice(i, 1); save(); render(); };
      acts.append(done, del);
      li.append(who, acts);
      ul.appendChild(li);
    });
  }

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const n = $('#name').value.trim();
    if (!n) { $('#err').textContent = 'Type a name first.'; return; }
    $('#err').textContent = '';
    people.push({ n, e: +$('#every').value, l: today() });
    save();
    $('#name').value = '';
    render();
  });
  render();
})();
</script>
</body>
</html>
