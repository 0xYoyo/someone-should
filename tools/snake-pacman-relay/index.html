<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a video game that alternates snake and pac-man levels, one feeding the next</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

canvas{display:block;width:100%;max-width:364px;aspect-ratio:1;border:1.5px solid var(--line);border-radius:var(--radius);touch-action:none;background:transparent}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center}
.pad button{min-height:56px;padding:0;font-size:20px}
#up{grid-column:2}#left{grid-row:2;grid-column:1}#down{grid-row:2;grid-column:2}#right{grid-row:2;grid-column:3}
#bar{display:flex;justify-content:space-between;gap:12px}

</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a video game that alternates snake and pac-man levels, one feeding the next</h1>

<!-- the tool. Smallest thing that fully does the wish. -->
<main id="app" class="stack">
<div id="bar" class="meta"><span id="mode">Snake 1</span><span id="goal">0/6</span><span id="lives">lives 3</span><span id="score">0</span></div>
<canvas id="c" width="390" height="390"></canvas>
<div id="msg" class="meta">Eat food as snake. Your body becomes the maze. Then be pac-man in it.</div>
<div class="pad"><button id="up" aria-label="up">&#9650;</button><button id="left" aria-label="left">&#9664;</button><button id="down" aria-label="down">&#9660;</button><button id="right" aria-label="right">&#9654;</button></div>
<button id="start" class="primary">start</button>
</main>

<script>

(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s) => document.querySelector(s);
  const N = 13, S = 30, ctx = $('#c').getContext('2d');
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const key = (x, y) => y * N + x;
  const inb = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
  let g, timer = null, best = store.get('spr-best', 0);

  function newSnake(level, bonus) {
    const len = 3 + Math.min(5, bonus);
    const snake = [];
    for (let i = 0; i < len; i++) snake.push([6 - i + (len > 6 ? 0 : 0), 6]);
    // keep the body inside the grid
    const shift = Math.max(0, len - 7);
    snake.forEach((p) => { p[0] -= 0; });
    g.mode = 'snake'; g.snake = snake.map((p) => [Math.max(0, p[0] - shift * 0), p[1]]);
    g.dir = 'right'; g.next = 'right'; g.eaten = 0; g.target = 5 + level; g.walls = new Set();
    placeFood();
  }
  function placeFood() {
    const used = new Set(g.snake.map((p) => key(p[0], p[1])));
    const free = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!used.has(key(x, y))) free.push([x, y]);
    g.food = free[Math.floor(Math.random() * free.length)];
  }
  function reachable(from) {
    const seen = new Set([key(from[0], from[1])]), q = [from], order = [];
    while (q.length) {
      const [x, y] = q.shift(); order.push([x, y]);
      for (const d of Object.values(DIRS)) {
        const nx = x + d[0], ny = y + d[1];
        if (inb(nx, ny) && !g.walls.has(key(nx, ny)) && !seen.has(key(nx, ny))) { seen.add(key(nx, ny)); q.push([nx, ny]); }
      }
    }
    return order;
  }
  function toPac() {
    g.walls = new Set(g.snake.map((p) => key(p[0], p[1])));
    const head = g.snake[0];
    // start at the free cell nearest the old head
    let start = null;
    for (const d of Object.values(DIRS)) { const x = head[0] + d[0], y = head[1] + d[1]; if (inb(x, y) && !g.walls.has(key(x, y))) { start = [x, y]; break; } }
    if (!start) { for (let y = 0; y < N && !start; y++) for (let x = 0; x < N; x++) if (!g.walls.has(key(x, y))) { start = [x, y]; break; } }
    const cells = reachable(start);
    g.mode = 'pac'; g.pac = start.slice(); g.dir = 'right'; g.next = 'right';
    g.ghost = cells[cells.length - 1].slice(); g.gt = 0;
    const pool = cells.slice(1, -1);
    g.dots = new Set();
    const n = Math.min(pool.length, 24 + g.level * 2);
    while (g.dots.size < n) { const c = pool[Math.floor(Math.random() * pool.length)]; g.dots.add(key(c[0], c[1])); }
    g.dotTotal = g.dots.size;
    if (!pool.length) { g.dots.clear(); }
  }
  function lose() {
    g.lives--;
    if (g.lives <= 0) { stop(); $('#msg').textContent = 'Game over. Score ' + g.score + '. Tap start.'; g.over = true; g.lives = 0; ui(); draw(); return; }
    $('#msg').textContent = g.mode === 'snake' ? 'Crashed. Level restarts.' : 'Caught. Level restarts.';
    if (g.mode === 'snake') newSnake(g.level, g.bonus); else toPac();
    if (g.mode === 'pac') { g.snake = g.snake; }
  }
  function tickSnake() {
    if (DIRS[g.next][0] + DIRS[g.dir][0] !== 0 || DIRS[g.next][1] + DIRS[g.dir][1] !== 0) g.dir = g.next;
    const d = DIRS[g.dir], h = g.snake[0], nx = h[0] + d[0], ny = h[1] + d[1];
    const hit = !inb(nx, ny) || g.snake.slice(0, -1).some((p) => p[0] === nx && p[1] === ny);
    if (hit) return lose();
    g.snake.unshift([nx, ny]);
    if (nx === g.food[0] && ny === g.food[1]) {
      g.eaten++; g.score += 10;
      if (g.eaten >= g.target) { $('#msg').textContent = 'Your body is now the maze.'; toPac(); return; }
      placeFood();
    } else g.snake.pop();
  }
  function open(x, y) { return inb(x, y) && !g.walls.has(key(x, y)); }
  function tickPac() {
    const nd = DIRS[g.next], cd = DIRS[g.dir];
    if (open(g.pac[0] + nd[0], g.pac[1] + nd[1])) g.dir = g.next;
    const d = DIRS[g.dir], nx = g.pac[0] + d[0], ny = g.pac[1] + d[1];
    if (open(nx, ny)) g.pac = [nx, ny];
    if (g.dots.delete(key(g.pac[0], g.pac[1]))) { g.score += 5; g.fed++; }
    if (g.ghost[0] === g.pac[0] && g.ghost[1] === g.pac[1]) return lose();
    if (!g.dots.size) {
      g.level++; g.bonus = Math.floor(g.fed / 8);
      $('#msg').textContent = 'Maze cleared. Dots made the next snake longer.';
      newSnake(g.level, g.bonus); g.fed = 0; return;
    }
    g.gt++;
    if (g.gt % 2 === 0) {
      let opts = Object.values(DIRS).map((v) => [g.ghost[0] + v[0], g.ghost[1] + v[1]]).filter((p) => open(p[0], p[1]));
      opts.sort((a, b) => (Math.abs(a[0] - g.pac[0]) + Math.abs(a[1] - g.pac[1])) - (Math.abs(b[0] - g.pac[0]) + Math.abs(b[1] - g.pac[1])));
      if (opts.length) g.ghost = Math.random() < 0.25 ? opts[Math.floor(Math.random() * opts.length)] : opts[0];
      if (g.ghost[0] === g.pac[0] && g.ghost[1] === g.pac[1]) return lose();
    }
  }
  function tick() {
    if (g.mode === 'snake') tickSnake(); else tickPac();
    if (g.score > best) { best = g.score; store.set('spr-best', best); }
    ui(); draw();
    if (timer) { clearInterval(timer); timer = setInterval(tick, g.mode === 'snake' ? Math.max(90, 170 - g.level * 8) : 190); }
  }
  function stop() { clearInterval(timer); timer = null; $('#start').textContent = 'start'; }
  function ui() {
    $('#mode').textContent = (g.mode === 'snake' ? 'Snake ' : 'Pac-man ') + g.level;
    $('#goal').textContent = g.mode === 'snake' ? g.eaten + '/' + g.target : (g.dotTotal - g.dots.size) + '/' + g.dotTotal;
    $('#lives').textContent = 'lives ' + g.lives;
    $('#score').textContent = g.score + (best ? ' (best ' + best + ')' : '');
  }
  function cell(x, y, color, inset, round) {
    ctx.fillStyle = color; ctx.beginPath();
    if (round) ctx.arc(x * S + S / 2, y * S + S / 2, S / 2 - inset, 0, 7); else ctx.rect(x * S + inset, y * S + inset, S - 2 * inset, S - 2 * inset);
    ctx.fill();
  }
  function draw() {
    const ink = css('--ink'), line = css('--line'), no = css('--no'), built = css('--built');
    ctx.clearRect(0, 0, 390, 390);
    ctx.strokeStyle = line; ctx.lineWidth = 1;
    for (let i = 1; i < N; i++) { ctx.beginPath(); ctx.moveTo(i * S, 0); ctx.lineTo(i * S, 390); ctx.moveTo(0, i * S); ctx.lineTo(390, i * S); ctx.stroke(); }
    g.walls.forEach((k) => cell(k % N, Math.floor(k / N), ink, 1, false));
    if (g.mode === 'snake') {
      g.snake.forEach((p, i) => cell(p[0], p[1], i ? ink : built, 2, false));
      cell(g.food[0], g.food[1], no, 7, true);
    } else {
      g.dots.forEach((k) => cell(k % N, Math.floor(k / N), ink, 12, true));
      cell(g.pac[0], g.pac[1], built, 3, true);
      cell(g.ghost[0], g.ghost[1], no, 4, false);
    }
  }
  function steer(d) { if (DIRS[d]) { g.next = d; if (g.mode === 'pac') g.dir = g.dir; } }
  function begin() {
    g = { level: 1, score: 0, lives: 3, bonus: 0, fed: 0, mode: 'snake', walls: new Set(), dots: new Set(), dotTotal: 0, over: false };
    newSnake(1, 0); ui(); draw();
  }
  $('#start').addEventListener('click', () => {
    if (timer) { stop(); $('#msg').textContent = 'Paused.'; return; }
    if (g.over) begin();
    $('#msg').textContent = 'Swipe the board or use the arrows.';
    $('#start').textContent = 'pause';
    timer = setInterval(tick, 170);
  });
  Object.keys(DIRS).forEach((d) => $('#' + d).addEventListener('click', () => steer(d)));
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
  addEventListener('keydown', (e) => { if (map[e.key]) { steer(map[e.key]); e.preventDefault(); } });
  let t0 = null;
  const cv = $('#c');
  cv.addEventListener('touchstart', (e) => { t0 = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
  cv.addEventListener('touchend', (e) => {
    if (!t0) return;
    const dx = e.changedTouches[0].clientX - t0[0], dy = e.changedTouches[0].clientY - t0[1];
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    t0 = null;
  });
  begin();
})();
</script>
</body>
</html>
