<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>Walking miles on a long-journey map</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.meta{font-size:16px}
svg{width:100%;height:auto;display:block;border:1.5px solid var(--line);border-radius:var(--radius)}
.trail{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.done{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.stop{fill:var(--paper);stroke:var(--meta);stroke-width:2.5}
.stop.on{fill:var(--ink);stroke:var(--ink)}
#me{fill:var(--no);stroke:var(--paper);stroke-width:3}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.add{display:grid;grid-template-columns:1fr auto;gap:10px}
.ms li.on{color:var(--ink)}.ms li{color:var(--meta)}
li button{min-width:var(--tap);padding:0 10px}
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that charts your walking miles on a map of a long journey</h1>
<main id="app" class="stack">
<div><div class="big" id="total">0 mi</div><div class="meta" id="status">&nbsp;</div></div>
<div class="bar"><i id="fill" style="width:0"></i></div>
<svg id="map" viewBox="0 0 360 300" role="img" aria-label="Route map">
<path id="route" class="trail" d="M30 260 C70 240 40 200 90 190 S150 215 170 175 S110 135 150 115 S250 130 260 90 S300 60 320 35"/>
<path id="walked" class="done" d=""/>
<g id="stops"></g>
<circle id="me" r="8" cx="30" cy="260"/>
</svg>
<form class="add" id="form"><input id="miles" type="number" inputmode="decimal" min="0" step="any" placeholder="miles walked" aria-label="miles walked"><button class="primary" id="add" type="submit">add</button></form>
<div class="meta" id="err" role="status"></div>
<ul class="plain ms" id="ms"></ul>
<ul class="plain" id="log"></ul>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const TOTAL = 1800;
  const STOPS = [
    ['Green hills, start', 0], ['Old forest', 150], ['Hill ridge', 400], ['Mountain pass', 700],
    ['Underground halls', 950], ['Great river', 1200], ['Tall city walls', 1450], ['Dark plain', 1650], ['Fire mountain, end', 1800]
  ];
  // example entries so the first view shows the map working
  let log = store.get('wm.log', null);
  if (!Array.isArray(log)) log = [{ m: 6.2, d: 'example' }, { m: 4.5, d: 'example' }, { m: 11, d: 'example' }];
  const route = $('#route'), len = route.getTotalLength();
  const at = mi => route.getPointAtLength(len * Math.min(mi, TOTAL) / TOTAL);
  const fmt = n => (Math.round(n * 10) / 10).toLocaleString('en-US');

  $('#stops').innerHTML = STOPS.map(([, mi], i) => {
    const p = at(mi);
    return '<circle id="s' + i + '" class="stop" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="6"/>';
  }).join('');

  function render() {
    const sum = log.reduce((a, e) => a + e.m, 0), mi = Math.min(sum, TOTAL), p = at(mi);
    $('#total').textContent = fmt(sum) + ' mi';
    $('#fill').style.width = (mi / TOTAL * 100) + '%';
    $('#me').setAttribute('cx', p.x); $('#me').setAttribute('cy', p.y);
    const w = len * mi / TOTAL, pts = [];
    for (let l = 0; l <= w; l += 4) { const q = route.getPointAtLength(l); pts.push((l ? 'L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1)); }
    pts.push('L' + p.x.toFixed(1) + ' ' + p.y.toFixed(1));
    $('#walked').setAttribute('d', pts.join(' '));
    const next = STOPS.find(s => s[1] > mi);
    $('#status').textContent = next ? fmt(next[1] - mi) + ' mi to ' + next[0].toLowerCase() : 'Journey complete';
    STOPS.forEach(([, m], i) => $('#s' + i).setAttribute('class', 'stop' + (mi >= m ? ' on' : '')));
    $('#ms').innerHTML = STOPS.map(([n, m]) => '<li class="' + (mi >= m ? 'on' : '') + '"><span>' + n + '</span><span>' + m + ' mi</span></li>').join('');
    $('#log').innerHTML = log.length ? log.map((e, i) => '<li><span>' + fmt(e.m) + ' mi' + (e.d === 'example' ? ' (example)' : '') + '</span><button data-i="' + i + '" aria-label="remove">x</button></li>').reverse().join('') : '<li class="empty">No walks logged.</li>';
  }

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const v = parseFloat($('#miles').value);
    if (!(v > 0) || v > 500) { $('#err').textContent = 'Enter miles between 0 and 500.'; return; }
    $('#err').textContent = '';
    log = log.filter(x => x.d !== 'example');
    log.push({ m: v, d: new Date().toISOString().slice(0, 10) });
    store.set('wm.log', log); $('#miles').value = ''; render();
  });
  $('#log').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    log.splice(+b.dataset.i, 1); store.set('wm.log', log); render();
  });
  render();
})();
</script>
</body>
</html>
