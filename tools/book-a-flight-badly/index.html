<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a puzzle web game where you book a flight on a badly designed website</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
.goal { border: 1.5px solid var(--ink); border-radius: var(--radius); padding: 12px; }
.goal b { font-weight: 600; }
.site { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; }
.site h2 { font: 600 18px/1.3 var(--mono); margin: 0; }
.dial { min-width: 88px; min-height: 72px; font-size: 32px; font-variant-numeric: tabular-nums; }
.chk { display: flex; gap: 12px; align-items: center; min-height: 48px; border-bottom: 1px solid var(--line); }
.chk input { width: 28px; min-height: 28px; height: 28px; flex: none; }
.seats { display: grid; grid-template-columns: repeat(3, 1fr) 20px repeat(3, 1fr); gap: 4px; }
.seats button { padding: 0; min-width: 0; }
.seats button.on { background: var(--ink); color: var(--paper); }
#msg { min-height: 24px; color: var(--no); }
#next { width: 100%; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a puzzle web game where you book a flight on a badly designed website</h1>
<main id="app" class="stack">
  <div class="goal"><span id="lvl">1 of 4</span> &middot; <b id="goal"></b></div>
  <section id="stage" class="site" aria-live="polite"></section>
  <div id="msg" role="status"></div>
  <button id="next" class="primary">Continue</button>
  <p class="row" id="foot"></p>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const GOALS = ['Lisbon to Oslo on 3 June',
    'Passenger name: JAG',
    'No offers, no insurance, no priority boarding, terms accepted',
    'A window seat in row 12'];
  const BTN = ['Continue', 'Clear', 'Back', 'Cancel'];
  const BOX = [
    ['Please keep sending me offers', true, false],
    ['Do not remove travel insurance', false, false],
    ['Do not skip priority boarding', true, false],
    ['I agree, without reading the terms', false, true]
  ];
  const COLS = ['C', 'A', 'F', 'B', 'E', 'D'];
  const ROWS = [13, 12, 11];
  let s;
  const fresh = () => ({ lvl: 0, day: 1, mon: 6, name: [0, 0, 0], boxes: BOX.map(b => b[1]), seat: null, taps: 0, done: false });

  function view() {
    const st = $('#stage');
    if (s.done) {
      const col = s.seat[1];
      st.innerHTML = '<h2>Booked</h2><div>Lisbon to Oslo, 3 June<br>JAG, seat ' + s.seat[0] + col +
        ' (window)<br>No extras</div><div class="meta">' + s.taps + ' taps' + (best ? ', best ' + best : '') + '</div>';
      $('#goal').textContent = 'Flight booked';
      $('#lvl').textContent = 'Done';
      $('#next').textContent = 'Play again';
      return;
    }
    $('#lvl').textContent = (s.lvl + 1) + ' of 4';
    $('#goal').textContent = GOALS[s.lvl];
    $('#next').textContent = BTN[s.lvl];
    let h = '';
    if (s.lvl === 0) {
      h = '<h2>SkyWays: when</h2><div class="row"><button id="day" class="dial" data-a="day">' + s.day +
        '</button><button id="mon" class="dial" data-a="mon">' + MONTHS[s.mon] + '</button></div>' +
        '<div class="meta">Tap a number to change it.</div>';
    } else if (s.lvl === 1) {
      h = '<h2>SkyWays: who</h2><div class="row">' + s.name.map((n, i) =>
        '<button class="dial" id="slot' + i + '" data-a="slot" data-i="' + i + '">' + A[n] + '</button>').join('') + '</div>';
    } else if (s.lvl === 2) {
      h = '<h2>SkyWays: extras</h2>' + BOX.map((b, i) =>
        '<label class="chk"><input type="checkbox" id="box' + i + '" data-a="box" data-i="' + i + '"' + (s.boxes[i] ? ' checked' : '') + '>' + b[0] + '</label>').join('');
    } else {
      h = '<h2>SkyWays: where to sit</h2><div class="seats">' + ROWS.map(r => COLS.map((c, i) =>
        (i === 3 ? '<span></span>' : '') + '<button id="s' + r + c + '" data-a="seat" data-r="' + r + '" data-c="' + c + '"' +
        (s.seat && s.seat[0] == r && s.seat[1] === c ? ' class="on"' : '') + '>' + r + c + '</button>').join('')).join('') + '</div>';
    }
    st.innerHTML = h;
  }

  function check() {
    if (s.lvl === 0) return s.day === 3 && s.mon === 5 ? '' : 'Not 3 June yet.';
    if (s.lvl === 1) return s.name.join() === [9, 0, 6].join() ? '' : 'Name does not match.';
    if (s.lvl === 2) return s.boxes.every((v, i) => v === BOX[i][2]) ? '' : 'Some boxes are still wrong.';
    if (!s.seat) return 'Pick a seat first.';
    const i = COLS.indexOf(s.seat[1]);
    if (s.seat[0] !== 12) return 'Wrong row.';
    return i === 0 || i === 5 ? '' : 'That is not a window.';
  }

  let best = store.get('baf-best', 0);
  $('#stage').addEventListener('click', e => {
    const t = e.target.closest('[data-a]');
    if (!t || s.done) return;
    const a = t.dataset.a;
    if (a === 'day') s.day = s.day % 31 + 1;
    else if (a === 'mon') s.mon = (s.mon + 11) % 12;
    else if (a === 'slot') s.name[+t.dataset.i] = (s.name[+t.dataset.i] + 3) % 26;
    else if (a === 'box') { s.boxes[+t.dataset.i] = t.checked; s.taps++; $('#msg').textContent = ''; store.set('baf-s', s); return; }
    else if (a === 'seat') s.seat = [+t.dataset.r, t.dataset.c];
    s.taps++;
    $('#msg').textContent = '';
    store.set('baf-s', s);
    view();
  });
  $('#next').addEventListener('click', () => {
    if (s.done) { s = fresh(); $('#msg').textContent = ''; store.set('baf-s', s); view(); return; }
    s.taps++;
    const err = check();
    $('#msg').textContent = err;
    if (err) return;
    if (s.lvl === 3) {
      s.done = true;
      if (!best || s.taps < best) { best = s.taps; store.set('baf-best', best); }
    } else s.lvl++;
    store.set('baf-s', s);
    view();
  });

  s = store.get('baf-s', null);
  if (!s || typeof s.lvl !== 'number' || !Array.isArray(s.name)) s = fresh();
  view();
})();
</script>
</body>
</html>
