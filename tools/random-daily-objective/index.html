<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that gives you random objectives for the day</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
#obj { font-size: 28px; line-height: 1.2; font-weight: 500; margin: 8px 0 4px; }
#obj.done { text-decoration: line-through; color: var(--meta); }
#date, #streak, #msg { margin: 0; }
.actions button { flex: 1 1 40%; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that gives you random objectives for the day</h1>
<main id="app" class="stack">
  <p id="date" class="meta"></p>
  <p id="obj"></p>
  <div class="row actions">
    <button id="done" class="primary" type="button">done</button>
    <button id="reroll" type="button">another one</button>
  </div>
  <p id="streak" class="meta"></p>
  <p id="msg" class="meta"></p>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const OBJ = [
    "Say good morning to someone you don't usually greet.",
    "Take a different route to wherever you go first.",
    "Drink a full glass of water before your first coffee.",
    "Write a thank-you message to someone and send it.",
    "Walk for 20 minutes without looking at your phone.",
    "Cook one thing you have never cooked before.",
    "Call someone you haven't spoken to in a year.",
    "Learn five words in a language you don't speak.",
    "Clear one surface completely: a desk, a shelf, a table.",
    "Ask a stranger for a recommendation and follow it.",
    "Eat lunch away from a screen.",
    "Throw away or give away ten things.",
    "Sit somewhere new and sketch what you see.",
    "Pay someone a specific, honest compliment.",
    "Go to bed 30 minutes earlier than usual.",
    "Read ten pages of a book you own and haven't opened.",
    "Fix one small thing that has been broken for weeks.",
    "Take a photo of something ordinary that looks good.",
    "Do ten minutes of stretching before noon.",
    "Listen to an album all the way through.",
    "Make a short list of what you want from this week.",
    "Visit a shop or park you have walked past but never entered.",
    "Spend an hour with no notifications.",
    "Teach someone one thing you know.",
    "Write down three things that went well today.",
    "Hold a door, carry a bag, or give up a seat for someone.",
    "Try a food you normally skip.",
    "Put your phone in another room for dinner.",
    "Tidy the one drawer you avoid opening.",
    "Look up a question you've wondered about and read the answer."
  ];
  const pad = n => String(n).padStart(2, '0');
  const now = new Date();
  const today = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  const dayNum = d => { const [y, m, dd] = d.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, dd) / 864e5); };
  // deterministic pick for a date plus reroll offset
  const pick = (d, n) => ((dayNum(d) * 7 + n * 11) % OBJ.length + OBJ.length) % OBJ.length;

  let st = store.get('rdo', {});
  if (typeof st !== 'object' || !st) st = {};
  st.streak = st.streak || 0;
  if (st.day !== today) { st.day = today; st.n = 0; st.done = false; st.rerolled = false; }

  function render() {
    $('#date').textContent = today;
    const o = $('#obj');
    o.textContent = OBJ[pick(today, st.n)];
    o.className = st.done ? 'done' : '';
    $('#done').textContent = st.done ? 'undo' : 'done';
    $('#reroll').disabled = st.rerolled || st.done;
    $('#reroll').style.opacity = $('#reroll').disabled ? '.5' : '1';
    $('#streak').textContent = st.streak ? 'streak: ' + st.streak + (st.streak === 1 ? ' day' : ' days') : 'streak: 0 days';
    $('#msg').textContent = st.rerolled && !st.done ? 'one reroll per day, used' : '';
  }

  $('#done').addEventListener('click', () => {
    if (!st.done) {
      st.done = true;
      st.streak = (st.last && dayNum(today) - dayNum(st.last) === 1) ? st.streak + 1 : (st.last === today ? st.streak : 1);
      st.prevLast = st.last; st.last = today;
    } else {
      st.done = false;
      st.streak = Math.max(0, st.streak - 1);
      st.last = st.prevLast;
    }
    store.set('rdo', st); render();
  });
  $('#reroll').addEventListener('click', () => {
    if (st.rerolled || st.done) return;
    st.rerolled = true; st.n = 1;
    store.set('rdo', st); render();
  });
  store.set('rdo', st);
  render();
})();
</script>
</body>
</html>
