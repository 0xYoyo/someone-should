<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a Where's Waldo smartphone game where the characters move around the map</title>
<style>
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
#card { display: flex; align-items: center; gap: 12px; }
#card canvas { width: 48px; height: 64px; border: 1.5px solid var(--line); border-radius: var(--radius); flex: none; }
#want { font-size: 17px; }
#stage { width: 100%; height: 52dvh; min-height: 280px; max-height: 520px; border: 1.5px solid var(--line); border-radius: var(--radius); display: block; touch-action: manipulation; }
.bar { justify-content: space-between; font-variant-numeric: tabular-nums; }
.bar span { font: 16px/1.4 var(--mono); }
#msg { min-height: 24px; font-size: 16px; color: var(--meta); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a Where's Waldo smartphone game where the characters move around the map</h1>

<main id="app" class="stack">
  <div id="card"><canvas id="target" width="96" height="128" aria-hidden="true"></canvas><div id="want">Find the walker in a red shirt and a tall hat.</div></div>
  <canvas id="stage" aria-label="Crowd of walking figures"></canvas>
  <div class="row bar"><span id="level">Level 1</span><span id="timer">0.0 s</span><span id="best"></span></div>
  <div class="row"><button id="start" class="primary">Start</button><button id="hint">Hint +5 s</button></div>
  <div id="msg" aria-live="polite">Tap Start, then tap the walker.</div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const SHIRTS = [['red', '#c8321e'], ['blue', '#2f5fa8'], ['green', '#2e7d4f'], ['yellow', '#d9a521']];
  const HATS = ['tall', 'cap', 'round', 'none'];
  const stage = $('#stage'), ctx = stage.getContext('2d');
  const tcv = $('#target'), tctx = tcv.getContext('2d');
  let W = 300, H = 300, dpr = 1;
  let level = 1, figs = [], target = null, playing = false, t0 = 0, elapsed = 0, penalty = 0, ringUntil = 0, flash = null, last = 0;
  let best = store.get('walker-best', 0);

  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const ink = () => getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#141414';

  function drawFig(c, x, y, s, f) {
    const col = SHIRTS[f.shirt][1], hat = HATS[f.hat];
    c.fillStyle = col;
    c.beginPath(); c.roundRect(x - 7 * s, y - 2 * s, 14 * s, 17 * s, 4 * s); c.fill();
    c.fillStyle = '#e8c9a4';
    c.beginPath(); c.arc(x, y - 7 * s, 6 * s, 0, 7); c.fill();
    c.fillStyle = ink();
    if (hat === 'tall') c.fillRect(x - 4 * s, y - 20 * s, 8 * s, 10 * s);
    else if (hat === 'cap') { c.beginPath(); c.arc(x, y - 9 * s, 6.5 * s, Math.PI, 0); c.fill(); c.fillRect(x, y - 10 * s, 9 * s, 2.5 * s); }
    else if (hat === 'round') { c.beginPath(); c.arc(x, y - 10 * s, 6.5 * s, Math.PI, 0); c.fill(); c.fillRect(x - 9 * s, y - 10 * s, 18 * s, 2.5 * s); }
    c.fillStyle = ink();
    c.fillRect(x - 4 * s, y + 15 * s, 3 * s, 4 * s); c.fillRect(x + 1 * s, y + 15 * s, 3 * s, 4 * s);
  }

  function describe(f) { const h = HATS[f.hat]; return SHIRTS[f.shirt][0] + ' shirt and ' + (h === 'none' ? 'no hat' : 'a ' + h + ' hat'); }

  function drawCard() {
    tctx.clearRect(0, 0, tcv.width, tcv.height);
    drawFig(tctx, 48, 52, 3, target);
    $('#want').textContent = 'Find the walker in ' + describe(target) + '.';
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    stage.width = Math.round(W * dpr); stage.height = Math.round(H * dpr);
    figs.forEach(f => { f.x = Math.min(f.x, W - 14); f.y = Math.min(f.y, H - 24); });
  }

  function newRound() {
    const n = Math.min(14 + level * 6, 70);
    const speed = 22 + level * 6;
    target = { shirt: Math.floor(Math.random() * 4), hat: Math.floor(Math.random() * 4) };
    figs = [];
    for (let i = 0; i < n; i++) {
      let f;
      do { f = { shirt: Math.floor(Math.random() * 4), hat: Math.floor(Math.random() * 4) }; }
      while (f.shirt === target.shirt && f.hat === target.hat);
      figs.push(mk(f, speed));
    }
    const t = mk(Object.assign({}, target), speed); t.isTarget = true;
    figs.splice(Math.floor(Math.random() * figs.length), 0, t);
    drawCard();
  }
  function mk(f, speed) {
    const a = rnd(0, 6.283), v = speed * rnd(0.6, 1.3);
    f.x = rnd(14, W - 14); f.y = rnd(24, H - 24); f.vx = Math.cos(a) * v; f.vy = Math.sin(a) * v;
    return f;
  }

  function step(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    for (const f of figs) {
      if (Math.random() < dt * 0.4) { const a = rnd(0, 6.283), v = Math.hypot(f.vx, f.vy); f.vx = Math.cos(a) * v; f.vy = Math.sin(a) * v; }
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.x < 14) { f.x = 14; f.vx = Math.abs(f.vx); } else if (f.x > W - 14) { f.x = W - 14; f.vx = -Math.abs(f.vx); }
      if (f.y < 22) { f.y = 22; f.vy = Math.abs(f.vy); } else if (f.y > H - 22) { f.y = H - 22; f.vy = -Math.abs(f.vy); }
    }
    if (playing) { elapsed = (now - t0) / 1000 + penalty; $('#timer').textContent = elapsed.toFixed(1) + ' s'; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    figs.slice().sort((a, b) => a.y - b.y).forEach(f => drawFig(ctx, f.x, f.y, 1, f));
    if (ringUntil > now) {
      const t = figs.find(f => f.isTarget);
      ctx.strokeStyle = ink(); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(t.x, t.y, 24, 0, 7); ctx.stroke();
    }
    if (flash && flash.until > now) {
      ctx.strokeStyle = '#c8321e'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(flash.x, flash.y, 18, 0, 7); ctx.stroke();
    }
    requestAnimationFrame(step);
  }

  function say(s) { $('#msg').textContent = s; }

  function start() {
    playing = true; penalty = 0; t0 = performance.now(); ringUntil = 0;
    $('#level').textContent = 'Level ' + level;
    $('#start').textContent = 'Restart';
    newRound();
    say('Tap the walker. A wrong tap costs 3 s.');
  }

  function onTap(e) {
    if (!playing) { say('Tap Start first.'); return; }
    const r = stage.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    let hit = null, bd = 1e9;
    for (const f of figs) { const d = Math.hypot(f.x - px, (f.y + 4) - py); if (d < bd) { bd = d; hit = f; } }
    if (!hit || bd > 26) return;
    if (hit.isTarget) {
      playing = false;
      const time = elapsed;
      if (!best || level > best.level || (level === best.level && time < best.time)) { best = { level, time: +time.toFixed(1) }; store.set('walker-best', best); }
      say('Found in ' + time.toFixed(1) + ' s. Next: level ' + (level + 1) + '.');
      $('#best').textContent = 'Best L' + best.level;
      level++;
      setTimeout(start, 900);
    } else {
      penalty += 3; flash = { x: hit.x, y: hit.y, until: performance.now() + 500 };
      say('Not that one. +3 s.');
    }
  }

  stage.addEventListener('pointerdown', onTap);
  $('#start').addEventListener('click', () => { level = playing ? level : level; start(); });
  $('#hint').addEventListener('click', () => {
    if (!playing) { say('Tap Start first.'); return; }
    penalty += 5; ringUntil = performance.now() + 1500; say('Ring shown. +5 s.');
  });
  window.addEventListener('resize', resize);

  resize();
  if (best) $('#best').textContent = 'Best L' + best.level;
  newRound();
  last = performance.now();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
