<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that tells you which food in your kitchen is expiring soon</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.hint,.when,.sect{font:16px/1.4 var(--mono);color:var(--meta)}
.sect{margin:8px 0 0}
.chips button{padding:0 14px}
.chips button.on{background:var(--ink);color:var(--paper)}
#list li{padding:0 0 0 0;min-height:56px}
#list .name{flex:1;overflow-wrap:anywhere;padding:10px 0}
#list .when{white-space:nowrap}
#list li.over .when,#list li.today .when{color:var(--no);font-weight:600}
#list li.soon .when{color:var(--ink);font-weight:600}
#list li.over,#list li.today{border-left:4px solid var(--no);padding-left:10px}
#list li.soon{border-left:4px solid var(--ink);padding-left:10px}
#list button{min-width:var(--tap);padding:0 10px}
.sum{font-size:20px;font-weight:500}
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that tells you which food in your kitchen is expiring soon</h1>
<main id="app" class="stack">
  <div id="sum" class="sum"></div>
  <ul id="list" class="plain"></ul>
  <form id="form" class="stack" autocomplete="off">
    <input id="name" type="text" placeholder="food" aria-label="food" maxlength="60">
    <div class="row chips" id="chips">
      <button type="button" data-d="1">1d</button>
      <button type="button" data-d="3" id="d3">3d</button>
      <button type="button" data-d="7">1w</button>
      <button type="button" data-d="30">1m</button>
    </div>
    <input id="date" type="date" aria-label="expires on">
    <button id="add" class="primary" type="submit">Add</button>
    <div id="err" class="hint"></div>
  </form>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const DAY = 864e5;
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
  const diff = s => { const [y, m, d] = s.split('-').map(Number); const t = new Date(); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())) / DAY); };

  // first run shows an example kitchen; it is replaced as soon as something is added or removed
  const examples = () => [
    { id: 1, name: 'milk', date: addDays(0) },
    { id: 2, name: 'spinach', date: addDays(2) },
    { id: 3, name: 'yogurt', date: addDays(5) },
    { id: 4, name: 'cheddar', date: addDays(21) }
  ];
  let items = store.get('items', null);
  let example = !Array.isArray(items);
  if (example) items = examples();

  const save = () => { example = false; store.set('items', items); };
  const label = n => n < 0 ? Math.abs(n) + 'd ago' : n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + 'd';

  function render() {
    const rows = items.map(i => ({ ...i, n: diff(i.date) })).sort((a, b) => a.n - b.n);
    const list = $('#list');
    list.textContent = '';
    if (!rows.length) {
      list.innerHTML = '<li class="empty">Nothing yet. Add what is in your kitchen.</li>';
      $('#sum').textContent = '';
      return;
    }
    const urgent = rows.filter(r => r.n <= 3).length;
    $('#sum').textContent = urgent ? urgent + ' to use within 3 days' : 'Nothing expires in the next 3 days';
    for (const r of rows) {
      const li = document.createElement('li');
      li.className = r.n < 0 ? 'over' : r.n === 0 ? 'today' : r.n <= 3 ? 'soon' : '';
      const name = document.createElement('span'); name.className = 'name'; name.textContent = r.name;
      const when = document.createElement('span'); when.className = 'when'; when.textContent = label(r.n);
      const del = document.createElement('button'); del.textContent = 'x'; del.setAttribute('aria-label', 'remove ' + r.name);
      del.onclick = () => { items = items.filter(i => i.id !== r.id); save(); render(); };
      li.append(name, when, del);
      list.append(li);
    }
  }

  function pick(n) {
    $('#date').value = addDays(n);
    for (const b of document.querySelectorAll('#chips button')) b.classList.toggle('on', +b.dataset.d === n);
  }
  $('#chips').addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(+b.dataset.d); });
  $('#date').addEventListener('input', () => { for (const b of document.querySelectorAll('#chips button')) b.classList.remove('on'); });
  pick(7);

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#name').value.trim(), date = $('#date').value;
    if (!name) { $('#err').textContent = 'Type a food first.'; return; }
    if (!date) { $('#err').textContent = 'Pick an expiry date.'; return; }
    $('#err').textContent = '';
    if (example) items = [];
    items.push({ id: Date.now() + Math.random(), name, date });
    save();
    $('#name').value = '';
    render();
  });

  render();
})();
</script>
</body>
</html>
