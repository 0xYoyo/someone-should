<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a tool that forces me to take rest breaks at the computer</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


main { max-width: 520px; }
label { display: grid; gap: 6px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.meta, #phase { font: 16px/1.4 var(--mono); color: var(--meta); }
#time { font-size: 72px; }
.row button { flex: 1 1 auto; }
#overlay { position: fixed; inset: 0; z-index: 10; background: var(--ink); color: var(--paper); display: none; flex-direction: column; justify-content: center; align-items: center; gap: 20px; padding: var(--gutter); text-align: center; }
#overlay.on { display: flex; }
#overlay .meta { color: var(--paper); opacity: .7; }
#break-time { font-size: 96px; }
#tip { font-size: 20px; max-width: 420px; }
#skip { border-color: var(--paper); color: var(--paper); position: relative; overflow: hidden; min-width: 220px; touch-action: none; user-select: none; -webkit-user-select: none; }
#skip span { position: relative; }
#fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--paper); opacity: .25; }
</style>
</head>
<body>
<h1 id="wish">someone should make a tool that forces me to take rest breaks at the computer</h1>

<main id="app" class="stack">
  <div class="fields">
    <label><span class="meta">work, minutes</span><input id="work" type="number" inputmode="decimal" min="1" max="240" step="1" value="25"></label>
    <label><span class="meta">break, minutes</span><input id="rest" type="number" inputmode="decimal" min="1" max="60" step="1" value="5"></label>
  </div>
  <div id="phase">stopped</div>
  <div id="time" class="big">25:00</div>
  <div class="row">
    <button id="start" class="primary">start</button>
    <button id="break-now">break now</button>
  </div>
  <div id="msg" class="meta" aria-live="polite"></div>
  <div id="stats" class="meta"></div>
</main>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="break-label">
  <div id="break-label" class="meta">break</div>
  <div id="break-time" class="big">5:00</div>
  <div id="tip"></div>
  <button id="skip"><div id="fill"></div><span>hold 3 s to skip</span></button>
</div>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const TIPS = [
    'Look at something at least 6 metres away.',
    'Stand up and walk around the room.',
    'Roll your shoulders back ten times.',
    'Close your eyes and breathe slowly.',
    'Stretch your arms over your head.',
    'Drink a glass of water.',
    'Blink slowly twenty times.',
    'Look out of a window.'
  ];
  const HOLD_MS = 3000;
  const today = () => new Date().toISOString().slice(0, 10);

  // state: phase = 'stopped' | 'work' | 'break'; end = epoch ms when the phase ends
  let s = Object.assign({ phase: 'stopped', end: 0, work: 25, rest: 5, day: today(), taken: 0, skipped: 0 }, store.get('rbr', {}));
  if (s.day !== today()) { s.day = today(); s.taken = 0; s.skipped = 0; }

  const workIn = $('#work'), restIn = $('#rest');
  workIn.value = s.work; restIn.value = s.rest;

  const mins = (el, def, max) => {
    const v = parseFloat(el.value);
    return v > 0 && v <= max ? v : def;
  };
  const fmt = ms => {
    const t = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  };
  const save = () => store.set('rbr', s);

  let audio;
  function chime() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 660; o.connect(g); g.connect(audio.destination);
      const t = audio.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
      o.start(t); o.stop(t + 0.85);
    } catch {}
  }

  function goFull() {
    const d = document.documentElement;
    try { if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); } catch {}
  }
  function leaveFull() {
    try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch {}
  }

  function startWork() {
    s.phase = 'work';
    s.end = Date.now() + s.work * 60000;
    leaveFull();
    save(); render();
  }
  function startBreak() {
    s.phase = 'break';
    s.end = Date.now() + s.rest * 60000;
    $('#tip').textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
    chime(); goFull();
    save(); render();
  }

  $('#start').addEventListener('click', () => {
    s.work = mins(workIn, 25, 240); s.rest = mins(restIn, 5, 60);
    workIn.value = s.work; restIn.value = s.rest;
    if (s.phase === 'stopped') { startWork(); $('#msg').textContent = 'Keep this tab open. It takes over the screen when time is up.'; }
    else { s.phase = 'stopped'; save(); render(); $('#msg').textContent = ''; }
  });
  $('#break-now').addEventListener('click', () => {
    s.work = mins(workIn, 25, 240); s.rest = mins(restIn, 5, 60);
    startBreak();
  });
  [workIn, restIn].forEach(el => el.addEventListener('change', () => {
    s.work = mins(workIn, 25, 240); s.rest = mins(restIn, 5, 60); save();
    if (s.phase === 'stopped') render();
  }));

  // skipping a break takes a deliberate 3-second hold
  let holdStart = 0, holdRaf = 0;
  const skip = $('#skip'), fill = $('#fill');
  function holdTick() {
    const p = Math.min(1, (Date.now() - holdStart) / HOLD_MS);
    fill.style.width = (p * 100) + '%';
    if (p >= 1) { holdStart = 0; fill.style.width = '0'; s.skipped++; startWork(); return; }
    holdRaf = requestAnimationFrame(holdTick);
  }
  function holdEnd() { holdStart = 0; cancelAnimationFrame(holdRaf); fill.style.width = '0'; }
  skip.addEventListener('pointerdown', e => { e.preventDefault(); holdStart = Date.now(); holdTick(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => skip.addEventListener(ev, holdEnd));
  skip.addEventListener('contextmenu', e => e.preventDefault());
  // Escape does nothing during a break
  document.addEventListener('keydown', e => { if (s.phase === 'break' && e.key === 'Escape') e.preventDefault(); });

  function render() {
    const left = s.end - Date.now();
    $('#overlay').classList.toggle('on', s.phase === 'break');
    $('#phase').textContent = s.phase === 'work' ? 'work — break in' : s.phase === 'break' ? 'on break' : 'stopped';
    $('#start').textContent = s.phase === 'stopped' ? 'start' : 'stop';
    if (s.phase === 'stopped') {
      $('#time').textContent = fmt(s.work * 60000);
      document.title = $('#wish').textContent;
    } else if (s.phase === 'work') {
      $('#time').textContent = fmt(left);
      document.title = fmt(left) + ' until break';
    } else {
      $('#break-time').textContent = fmt(left);
      $('#time').textContent = fmt(left);
      document.title = 'BREAK ' + fmt(left);
    }
    $('#stats').textContent = s.taken || s.skipped ? `today: ${s.taken} taken, ${s.skipped} skipped` : '';
  }

  function tick() {
    if (s.day !== today()) { s.day = today(); s.taken = 0; s.skipped = 0; save(); }
    if (s.phase !== 'stopped' && Date.now() >= s.end) {
      if (s.phase === 'work') startBreak();
      else { s.taken++; chime(); startWork(); }
      return;
    }
    render();
  }

  // resume a session left running in an earlier visit
  if (s.phase !== 'stopped' && Date.now() >= s.end + 3600000) { s.phase = 'stopped'; save(); }
  if (s.phase === 'break') $('#tip').textContent = TIPS[0];
  render();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
