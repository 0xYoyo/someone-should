<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that adds up the price of everything you put in your cart</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.meta { font-size: 16px; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-top: 2px solid var(--ink); padding-top: 12px; }
.add { display: grid; grid-template-columns: 1fr 76px auto; gap: 10px; }
.add .name { grid-column: 1 / -1; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label.f { display: grid; gap: 4px; }
li .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
li .amt { font-variant-numeric: tabular-nums; }
li button { min-width: var(--tap); padding: 0 12px; }
.over { color: var(--no); }
.ok { color: var(--built); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that adds up the price of everything you put in your cart</h1>

<main id="app" class="stack">
  <div class="total">
    <span class="meta" id="count"></span>
    <span class="big" id="total">0.00</span>
  </div>
  <div class="meta" id="detail"></div>
  <div class="meta" id="budgetline"></div>

  <form class="add" id="form" autocomplete="off">
    <input id="price" type="number" inputmode="decimal" step="0.01" min="0" placeholder="price" aria-label="price">
    <input id="qty" type="number" inputmode="numeric" step="1" min="1" value="1" aria-label="quantity">
    <button class="primary" id="add" type="submit">add</button>
    <input class="name" id="name" type="text" placeholder="item (optional)" aria-label="item name">
  </form>
  <div class="meta" id="err" role="status"></div>

  <ul class="plain" id="list"></ul>

  <div class="opts">
    <label class="f meta">tax %<input id="tax" type="number" inputmode="decimal" step="0.1" min="0" value="0"></label>
    <label class="f meta">budget<input id="budget" type="number" inputmode="decimal" step="1" min="0" placeholder="none"></label>
  </div>
  <div class="row"><button id="clear" type="button">clear cart</button></div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  // first visit shows an example cart; clearing it leaves it empty for good
  const example = [
    { n: 'milk', p: 3.49, q: 1 },
    { n: 'bread', p: 2.99, q: 2 },
    { n: 'eggs', p: 4.25, q: 1 }
  ];
  let state = store.get('cart-running-total', null);
  if (!state || !Array.isArray(state.items)) state = { items: example, tax: 0, budget: '' };

  const money = n => (Math.round(n * 100) / 100).toFixed(2);
  const save = () => store.set('cart-running-total', state);

  function render() {
    const sub = state.items.reduce((s, i) => s + i.p * i.q, 0);
    const tax = sub * (Number(state.tax) || 0) / 100;
    const total = sub + tax;
    const units = state.items.reduce((s, i) => s + i.q, 0);
    $('#total').textContent = money(total);
    $('#count').textContent = units + (units === 1 ? ' item' : ' items');
    $('#detail').textContent = tax > 0 ? 'subtotal ' + money(sub) + ' + tax ' + money(tax) : '';
    const b = parseFloat(state.budget);
    const bl = $('#budgetline');
    if (b > 0) {
      const left = b - total;
      bl.textContent = left >= 0 ? money(left) + ' left of ' + money(b) : 'over budget by ' + money(-left);
      bl.className = 'meta ' + (left >= 0 ? 'ok' : 'over');
    } else { bl.textContent = ''; bl.className = 'meta'; }
    const list = $('#list');
    list.textContent = '';
    if (!state.items.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'cart is empty. type a price and tap add.';
      list.appendChild(li);
    }
    state.items.forEach((it, idx) => {
      const li = document.createElement('li');
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = (it.n || 'item') + (it.q > 1 ? ' \u00d7 ' + it.q + ' @ ' + money(it.p) : '');
      const amt = document.createElement('span');
      amt.className = 'amt';
      amt.textContent = money(it.p * it.q);
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'rm';
      rm.setAttribute('aria-label', 'remove');
      rm.textContent = '\u00d7';
      rm.addEventListener('click', () => { state.items.splice(idx, 1); save(); render(); });
      li.append(nm, amt, rm);
      list.appendChild(li);
    });
  }

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const p = parseFloat($('#price').value.replace(',', '.'));
    const q = Math.max(1, Math.floor(Number($('#qty').value) || 1));
    if (!(p >= 0)) { $('#err').textContent = 'enter a price first'; return; }
    $('#err').textContent = '';
    state.items.push({ n: $('#name').value.trim(), p, q });
    $('#price').value = ''; $('#name').value = ''; $('#qty').value = 1;
    save(); render();
    $('#price').focus();
  });
  $('#tax').addEventListener('input', e => { state.tax = e.target.value; save(); render(); });
  $('#budget').addEventListener('input', e => { state.budget = e.target.value; save(); render(); });
  $('#clear').addEventListener('click', () => { state.items = []; save(); render(); });

  $('#tax').value = state.tax;
  $('#budget').value = state.budget;
  render();
})();
</script>
</body>
</html>
