<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that buzzes me when I've talked too long</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.bar { height: 10px; border: 1.5px solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--ink); }
.over .bar i { background: var(--no); }
.over .big { color: var(--no); }
.step { min-width: var(--tap); padding: 0; font-size: 22px; }
.lim { min-width: 96px; text-align: center; font: 500 22px var(--mono); }
.lvl { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.lvl i { display: block; height: 100%; width: 0; background: var(--meta); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that buzzes me when I've talked too long</h1>
<main id="app" class="stack">
  <div id="panel" class="stack">
    <div class="big" id="elapsed">0:00</div>
    <div class="bar"><i id="fill"></i></div>
    <div class="meta" id="state">tap to start</div>
    <div class="lvl" id="lvlwrap" hidden><i id="lvl"></i></div>
  </div>
  <div class="row">
    <span class="meta">buzz after</span>
    <button id="less" class="step" aria-label="shorter">-</button>
    <span class="lim" id="limit">1:00</span>
    <button id="more" class="step" aria-label="longer">+</button>
  </div>
  <div class="row">
    <button id="start" class="primary">Listen</button>
    <button id="manual">I'm talking</button>
    <button id="test">Test buzz</button>
  </div>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  let limit = store.get('limit', 60);       // seconds of continuous talking
  let mode = null;                           // null | 'mic' | 'manual'
  let talked = 0;                            // seconds of current stretch
  let quiet = 0;                             // seconds of silence since last speech
  let nextBuzz = 0, alerted = false;
  let ctx = null, analyser = null, stream = null, buf = null, timer = null, last = 0;
  const RESET_AFTER = 3;                     // seconds of silence that end a stretch
  const THRESH = 0.03;                       // RMS level that counts as speech

  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

  function render() {
    $('#elapsed').textContent = fmt(talked);
    $('#limit').textContent = fmt(limit);
    $('#fill').style.width = Math.min(100, talked / limit * 100) + '%';
    $('#panel').classList.toggle('over', talked >= limit);
    $('#start').textContent = mode === 'mic' ? 'Stop' : 'Listen';
    $('#manual').textContent = mode === 'manual' ? 'Stop' : "I'm talking";
  }
  function setState(t) { $('#state').textContent = t; }

  function beep() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = 220;
      g.gain.value = 0.2;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.35);
    } catch {}
  }
  function buzz() {
    try { if (navigator.vibrate) navigator.vibrate([300, 120, 300]); } catch {}
    beep();
    alerted = true;
    setState('you have talked too long');
    $('#panel').classList.add('over');
  }

  function tick() {
    const now = performance.now();
    const dt = Math.min(1, (now - last) / 1000);
    last = now;
    let speaking = mode === 'manual';
    if (mode === 'mic' && analyser) {
      analyser.getFloatTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      const rms = Math.sqrt(sum / buf.length);
      $('#lvl').style.width = Math.min(100, rms * 600) + '%';
      speaking = rms > THRESH;
    }
    if (speaking) {
      quiet = 0;
      talked += dt;
      if (talked >= limit && talked >= nextBuzz) { buzz(); nextBuzz = talked + 10; }
      else if (!alerted) setState(mode === 'mic' ? 'talking' : 'timing');
    } else {
      quiet += dt;
      if (quiet >= RESET_AFTER && talked > 0) { talked = 0; nextBuzz = 0; alerted = false; }
      if (!alerted) setState('quiet');
    }
    render();
  }

  function stop() {
    clearInterval(timer); timer = null;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = analyser = null;
    mode = null; talked = 0; quiet = 0; nextBuzz = 0; alerted = false;
    $('#lvlwrap').hidden = true;
    setState('tap to start');
    render();
  }
  function run(m) {
    mode = m; talked = 0; quiet = 0; nextBuzz = 0;
    last = performance.now();
    timer = setInterval(tick, 100);
    render();
  }

  $('#start').addEventListener('click', async () => {
    if (mode === 'mic') return stop();
    if (mode) stop();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      buf = new Float32Array(analyser.fftSize);
      ctx.createMediaStreamSource(stream).connect(analyser);
      $('#lvlwrap').hidden = false;
      run('mic');
      setState('quiet');
    } catch {
      stop();
      setState('no microphone access. use "I\'m talking" instead');
    }
  });
  $('#manual').addEventListener('click', () => {
    if (mode === 'manual') return stop();
    if (mode) stop();
    run('manual');
    setState('timing');
  });
  $('#test').addEventListener('click', () => { buzz(); });
  function adjust(d) {
    limit = Math.max(15, Math.min(1800, limit + d));
    store.set('limit', limit);
    render();
  }
  $('#less').addEventListener('click', () => adjust(-15));
  $('#more').addEventListener('click', () => adjust(15));
  render();
})();
</script>
</body>
</html>
