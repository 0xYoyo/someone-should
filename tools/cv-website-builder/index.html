<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a site that builds a personal CV website</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
h1 { font-size: 16px; }
h2 { font: 500 16px/1.3 var(--mono); color: var(--meta); margin: 8px 0 0; }
label { display: grid; gap: 4px; }
label > span { font-size: 16px; color: var(--meta); }
textarea { min-height: 96px; resize: vertical; }
.entry { display: grid; gap: 8px; padding: 12px; border: 1.5px solid var(--line); border-radius: var(--radius); }
.entry .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.entry button { justify-self: start; }
#form, #side { display: grid; gap: 12px; align-content: start; min-width: 0; }
#preview { border: 1.5px solid var(--line); border-radius: var(--radius); overflow: hidden; }
#status { min-height: 24px; }
@media (min-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: start; gap: 32px; }
  #side { position: sticky; top: 16px; }
}
</style>
<style id="cvcss">
.cv { --c-bg: #fbfaf7; --c-ink: #161616; --c-soft: #666; --c-line: #e2ded4; background: var(--c-bg); color: var(--c-ink); font: 17px/1.55 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; padding: 40px 24px; }
@media (prefers-color-scheme: dark) { .cv { --c-bg: #151515; --c-ink: #ececec; --c-soft: #a0a0a0; --c-line: #2c2c2c; } }
.cv * { box-sizing: border-box; }
.cv-in { max-width: 680px; margin: 0 auto; }
.cv h1 { font: 600 36px/1.1 Georgia, "Times New Roman", serif; color: var(--c-ink); margin: 0 0 6px; letter-spacing: -0.01em; }
.cv .cv-head { font-size: 19px; margin: 0; }
.cv .cv-soft { color: var(--c-soft); margin: 0; }
.cv .cv-links { display: flex; flex-wrap: wrap; gap: 0 18px; margin: 8px 0 0; padding: 0; list-style: none; }
.cv a { color: var(--c-ink); text-underline-offset: 3px; display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; overflow-wrap: anywhere; }
.cv section { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--c-line); }
.cv h2 { font: 600 14px/1.3 ui-monospace, Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: 0.08em; color: var(--c-soft); margin: 0 0 12px; }
.cv .cv-item { margin: 0 0 20px; }
.cv .cv-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 12px; }
.cv .cv-top b { font-weight: 600; }
.cv .cv-when { color: var(--c-soft); font-variant-numeric: tabular-nums; }
.cv p { margin: 4px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
.cv .cv-skills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.cv .cv-skills li { border: 1px solid var(--c-line); border-radius: 999px; padding: 2px 12px; }
@media print { .cv { padding: 0; background: #fff; color: #000; } .cv a { min-height: 0; } }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a site that builds a personal CV website</h1>

<main id="app" class="stack">
  <div id="form">
    <label><span>Name</span><input id="name" autocomplete="name"></label>
    <label><span>Headline</span><input id="headline" placeholder="Backend engineer"></label>
    <label><span>Location</span><input id="location" placeholder="Lisbon"></label>
    <label><span>Email</span><input id="email" type="email" autocomplete="email"></label>
    <label><span>Links, one per line</span><textarea id="links" rows="2" placeholder="github.com/you"></textarea></label>
    <label><span>About</span><textarea id="about" rows="3"></textarea></label>

    <h2>Experience</h2>
    <div id="exp" class="stack"></div>
    <button type="button" id="add-exp">Add job</button>

    <h2>Education</h2>
    <div id="edu" class="stack"></div>
    <button type="button" id="add-edu">Add school</button>

    <h2>Projects</h2>
    <div id="proj" class="stack"></div>
    <button type="button" id="add-proj">Add project</button>

    <label><span>Skills, comma separated</span><input id="skills" placeholder="Go, Postgres, Kubernetes"></label>
  </div>

  <div id="side">
    <div class="row">
      <button type="button" class="primary" id="download">Download site</button>
      <button type="button" id="clear">Start over</button>
    </div>
    <div id="status">One HTML file. Upload it anywhere that hosts static pages.</div>
    <div id="preview"></div>
  </div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const KEY = 'cv-website-builder';
  const FIELDS = ['name', 'headline', 'location', 'email', 'links', 'about', 'skills'];
  const LISTS = {
    exp: { title: 'Experience', a: 'Role', b: 'Company', btn: 'Remove job' },
    edu: { title: 'Education', a: 'Degree', b: 'School', btn: 'Remove school' },
    proj: { title: 'Projects', a: 'Project', b: 'Link', btn: 'Remove project' }
  };
  const blank = () => ({ a: '', b: '', when: '', text: '' });
  let data = store.get(KEY, null) || { exp: [], edu: [], proj: [] };
  for (const k in LISTS) if (!Array.isArray(data[k])) data[k] = [];

  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const isUrl = s => /^https?:\/\/\S+$/i.test(s);
  const linkify = s => {
    s = s.trim();
    if (!s) return '';
    const href = isUrl(s) ? s : /^[\w.-]+\.[a-z]{2,}(\/\S*)?$/i.test(s) ? 'https://' + s : '';
    const label = s.replace(/^https?:\/\//i, '').replace(/\/$/, '');
    return href ? `<a href="${esc(href)}">${esc(label)}</a>` : esc(s);
  };

  function entryEditor(kind, i) {
    const L = LISTS[kind], e = data[kind][i];
    const el = document.createElement('div');
    el.className = 'entry';
    el.innerHTML = `
      <div class="two">
        <label><span>${L.a}</span><input data-f="a"></label>
        <label><span>${L.b}</span><input data-f="b"></label>
      </div>
      <label><span>When</span><input data-f="when" placeholder="2021 – now"></label>
      <label><span>Details</span><textarea data-f="text" rows="2"></textarea></label>
      <button type="button" class="remove">${L.btn}</button>`;
    for (const inp of $$('[data-f]', el)) {
      inp.value = e[inp.dataset.f] || '';
      inp.addEventListener('input', () => { e[inp.dataset.f] = inp.value; changed(); });
    }
    $('.remove', el).addEventListener('click', () => { data[kind].splice(i, 1); drawLists(); changed(); });
    return el;
  }

  function drawLists() {
    for (const kind in LISTS) {
      const box = $('#' + kind);
      box.replaceChildren(...data[kind].map((_, i) => entryEditor(kind, i)));
    }
  }

  function cvHtml() {
    const d = data;
    const links = [d.email ? `<a href="mailto:${esc(d.email.trim())}">${esc(d.email.trim())}</a>` : '']
      .concat((d.links || '').split('\n').map(linkify)).filter(Boolean);
    let h = `<div class="cv-in"><header><h1>${esc(d.name) || 'Your name'}</h1>`;
    if (d.headline) h += `<p class="cv-head">${esc(d.headline)}</p>`;
    if (d.location) h += `<p class="cv-soft">${esc(d.location)}</p>`;
    if (links.length) h += `<ul class="cv-links">${links.map(l => `<li>${l}</li>`).join('')}</ul>`;
    h += '</header>';
    if (d.about && d.about.trim()) h += `<section><h2>About</h2><p>${esc(d.about.trim())}</p></section>`;
    for (const kind in LISTS) {
      const items = d[kind].filter(e => e.a || e.b || e.text);
      if (!items.length) continue;
      h += `<section><h2>${LISTS[kind].title}</h2>`;
      for (const e of items) {
        const b = kind === 'proj' ? linkify(e.b || '') : esc(e.b);
        const head = [e.a ? `<b>${esc(e.a)}</b>` : '', b].filter(Boolean).join(kind === 'proj' ? ' · ' : ', ');
        h += `<div class="cv-item"><div class="cv-top"><span>${head}</span>${e.when ? `<span class="cv-when">${esc(e.when)}</span>` : ''}</div>`;
        if (e.text && e.text.trim()) h += `<p>${esc(e.text.trim())}</p>`;
        h += '</div>';
      }
      h += '</section>';
    }
    const skills = (d.skills || '').split(',').map(s => s.trim()).filter(Boolean);
    if (skills.length) h += `<section><h2>Skills</h2><ul class="cv-skills">${skills.map(s => `<li>${esc(s)}</li>`).join('')}</ul></section>`;
    return h + '</div>';
  }

  function fullPage() {
    const title = esc(data.name ? data.name + (data.headline ? ' — ' + data.headline : '') : 'CV');
    const css = $('#cvcss').textContent.trim();
    return `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>${title}</title>
<meta name="description" content="${esc(data.headline || '')}">
<style>
html, body { margin: 0; }
${css}
.cv { min-height: 100vh; }
</style>
</head>
<body class="cv">
${cvHtml()}
</body>
</html>
`;
  }

  let saveTimer = 0;
  function changed() {
    $('#preview').className = 'cv';
    $('#preview').innerHTML = cvHtml();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => store.set(KEY, data), 250);
  }

  for (const f of FIELDS) {
    const inp = $('#' + f);
    inp.value = data[f] || '';
    inp.addEventListener('input', () => { data[f] = inp.value; changed(); });
  }
  for (const kind in LISTS) {
    $('#add-' + kind).addEventListener('click', () => {
      data[kind].push(blank());
      drawLists();
      changed();
      const last = $(`#${kind} .entry:last-child input`);
      if (last) last.focus();
    });
  }

  $('#download').addEventListener('click', () => {
    if (!data.name || !data.name.trim()) { $('#status').textContent = 'Add your name first.'; $('#name').focus(); return; }
    const html = fullPage();
    const kb = (new Blob([html]).size / 1024).toFixed(1);
    try {
      const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      $('#status').textContent = `Saved index.html, ${kb} kB. Upload it anywhere that hosts static pages.`;
    } catch {
      $('#status').textContent = 'This browser blocked the download.';
    }
  });

  $('#clear').addEventListener('click', () => {
    const btn = $('#clear');
    if (btn.dataset.armed !== '1') {
      btn.dataset.armed = '1';
      btn.textContent = 'Tap again to clear';
      setTimeout(() => { btn.dataset.armed = ''; btn.textContent = 'Start over'; }, 3000);
      return;
    }
    btn.dataset.armed = '';
    btn.textContent = 'Start over';
    data = { exp: [], edu: [], proj: [] };
    for (const f of FIELDS) $('#' + f).value = '';
    drawLists();
    changed();
    $('#status').textContent = 'Cleared.';
  });

  drawLists();
  changed();
})();
</script>
</body>
</html>
