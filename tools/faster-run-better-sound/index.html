<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a music player where sound quality improves with your jogging speed</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.bar{height:12px;border:1.5px solid var(--line);border-radius:var(--radius);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.file{display:flex;align-items:center;min-height:var(--tap);cursor:pointer;border:1.5px dashed var(--line);border-radius:var(--radius);padding:0 12px}
.file input{position:absolute;opacity:0;width:1px;height:1px;min-height:0;padding:0}
.file:focus-within{outline:2px solid var(--ink);outline-offset:2px}
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a music player where sound quality improves with your jogging speed</h1>
<main id="app" class="stack">
  <div><span class="big" id="spm">120</span> <span class="meta">steps / min</span></div>
  <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  <div class="meta"><span id="quality">muffled</span> &middot; <span id="cut">0</span> Hz</div>
  <div class="row">
    <button class="primary" id="start">tap to start</button>
    <button id="motion">use motion sensor</button>
  </div>
  <div class="row">
    <button id="down" aria-label="slower">-10</button>
    <button id="up" aria-label="faster">+10</button>
    <button id="step">tap your steps</button>
  </div>
  <label class="file"><span id="fname">play your own song</span><input type="file" id="file" accept="audio/*"></label>
  <div class="meta" id="msg">demo loop. no sensor? set steps by hand.</div>
</main>
<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  let spm = 120, ctx = null, filter = null, src = null, buffer = null, playing = false;
  let manual = true;

  // cadence 60 -> 300 Hz (muffled), 180 -> 18 kHz (clear)
  const cutoff = s => Math.round(300 * Math.pow(60, Math.min(1, Math.max(0, (s - 60) / 120))));
  function render() {
    const c = cutoff(spm);
    $('#spm').textContent = Math.round(spm);
    $('#cut').textContent = c;
    $('#fill').style.width = Math.round(100 * Math.log(c / 300) / Math.log(60)) + '%';
    $('#quality').textContent = c < 1500 ? 'muffled' : c < 6000 ? 'getting clearer' : 'full quality';
    if (filter) filter.frequency.setTargetAtTime(c, ctx.currentTime, 0.25);
  }
  function setSpm(v, fromManual) {
    spm = Math.min(200, Math.max(40, v));
    if (fromManual) manual = true;
    render();
  }

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { $('#msg').textContent = 'this browser cannot play audio.'; return false; }
    ctx = new AC();
    filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.Q.value = 0.7;
    filter.frequency.value = cutoff(spm);
    filter.connect(ctx.destination);
    buffer = demo();
    return true;
  }

  // 4 s synthetic loop: bass + arpeggio of saw waves, rich in highs so the filter is audible
  function demo() {
    const sr = ctx.sampleRate, n = sr * 4, b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
    const notes = [220, 277.2, 329.6, 440, 329.6, 277.2, 261.6, 329.6];
    for (let i = 0; i < n; i++) {
      const t = i / sr, k = Math.floor(t * 2) % notes.length, lt = (t * 2) % 1;
      const f = notes[k], env = Math.exp(-lt * 4);
      const saw = 2 * ((t * f) % 1) - 1;
      const bass = Math.sign(Math.sin(2 * Math.PI * 55 * t)) * 0.25;
      d[i] = (saw * env * 0.35 + bass * (lt < 0.5 ? 1 : 0.5)) * 0.6;
    }
    return b;
  }

  function play() {
    if (!init()) return;
    ctx.resume();
    if (src) { try { src.stop(); } catch {} }
    src = ctx.createBufferSource();
    src.buffer = buffer;
    src.loop = true;
    src.connect(filter);
    src.start();
    playing = true;
    $('#start').textContent = 'pause';
    render();
  }
  function stop() {
    if (src) { try { src.stop(); } catch {} src = null; }
    playing = false;
    $('#start').textContent = 'tap to start';
  }
  $('#start').onclick = () => (playing ? stop() : play());

  $('#file').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    if (!init()) return;
    try {
      buffer = await ctx.decodeAudioData(await f.arrayBuffer());
      $('#fname').textContent = f.name;
      $('#msg').textContent = 'your song is loaded.';
      play();
    } catch { $('#msg').textContent = 'could not read that audio file.'; }
  };

  $('#up').onclick = () => setSpm(spm + 10, true);
  $('#down').onclick = () => setSpm(spm - 10, true);

  // tap tempo from the last few taps
  let taps = [];
  $('#step').onclick = () => {
    const now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
    taps.push(now);
    taps = taps.slice(-6);
    if (taps.length >= 3) setSpm(60000 * (taps.length - 1) / (taps[taps.length - 1] - taps[0]), true);
    else $('#msg').textContent = 'keep tapping in step.';
  };

  // step detection: peaks in acceleration magnitude, at least 250 ms apart
  let steps = [], base = 9.8, last = 0, prev = 0, rising = false;
  function onMotion(e) {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null) return;
    const m = Math.hypot(a.x, a.y, a.z);
    base += (m - base) * 0.05;
    const v = m - base, now = performance.now();
    if (v > 1.5 && v < prev && rising && now - last > 250) {
      last = now;
      steps.push(now);
      steps = steps.filter(t => now - t < 6000);
      if (steps.length >= 4) {
        setSpm(60000 * (steps.length - 1) / (steps[steps.length - 1] - steps[0]));
        manual = false;
      }
    }
    rising = v > prev;
    prev = v;
  }
  $('#motion').onclick = async () => {
    try {
      if (!('DeviceMotionEvent' in window)) throw 0;
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        if ((await DeviceMotionEvent.requestPermission()) !== 'granted') throw 0;
      }
      window.addEventListener('devicemotion', onMotion);
      $('#msg').textContent = 'listening for steps. start jogging.';
    } catch { $('#msg').textContent = 'no motion sensor. use the buttons.'; }
  };

  render();
})();
</script>
</body>
</html>
