<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a progress bar for the back seat so kids can see if we're there yet</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.meta { font-size: 16px; }
.track { position: relative; height: 28px; border: 2px solid var(--ink); border-radius: 14px; margin: 44px 8px 8px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 12px; width: 0; transition: width .6s; }
.car { position: absolute; top: -34px; left: 0; width: 44px; height: 30px; margin-left: -22px; transition: left .6s; }
.flag { position: absolute; right: -6px; top: -34px; font: 500 16px var(--mono); }
.pct { text-align: center; }
.left { text-align: center; }
label { display: grid; gap: 4px; flex: 1; min-width: 140px; }
@media (prefers-reduced-motion: reduce) { .fill, .car { transition: none; } }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a progress bar for the back seat so kids can see if we're there yet</h1>
<main id="app" class="stack">
  <div class="pct big" id="pct">0%</div>
  <div class="track" aria-hidden="true">
    <div class="fill" id="fill"></div>
    <svg class="car" id="car" viewBox="0 0 44 30" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22v-6l5-1 5-8h16l6 8 6 1v6z" fill="var(--paper)"/><circle cx="12" cy="23" r="4" fill="var(--paper)"/><circle cx="33" cy="23" r="4" fill="var(--paper)"/></svg>
    <span class="flag">there</span>
  </div>
  <div class="left big" id="left">--</div>
  <div class="left meta" id="msg"></div>
  <div class="row">
    <label class="meta">leave<input type="time" id="dep"></label>
    <label class="meta">arrive<input type="time" id="arr"></label>
  </div>
  <div class="meta" id="err"></div>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const pad = n => String(n).padStart(2, '0');
  const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const MIN = 60000, DAY = 86400000;

  // default example: left 40 minutes ago, 2 hours long
  const saved = store.get('awty', null);
  const now0 = new Date();
  const d0 = new Date(now0 - 40 * MIN), a0 = new Date(+d0 + 120 * MIN);
  $('#dep').value = saved ? saved.dep : hm(d0);
  $('#arr').value = saved ? saved.arr : hm(a0);

  function toDate(str, base) {
    const [h, m] = str.split(':').map(Number);
    const d = new Date(base); d.setHours(h, m, 0, 0); return d;
  }
  function fmt(ms) {
    const m = Math.ceil(ms / MIN);
    if (m < 60) return m + ' min';
    return Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min';
  }
  function msgFor(p) {
    if (p >= 1) return 'we are there';
    if (p > 0.9) return 'almost there';
    if (p > 0.5) return 'more than halfway';
    if (p > 0.25) return 'a good start';
    return 'just getting going';
  }
  function tick() {
    const err = $('#err');
    if (!$('#dep').value || !$('#arr').value) { err.textContent = 'set both times'; return; }
    err.textContent = '';
    const now = new Date();
    let dep = toDate($('#dep').value, now), arr = toDate($('#arr').value, now);
    if (arr <= dep) arr = new Date(+arr + DAY);
    // a departure far in the future means the trip began yesterday
    if (dep - now > 12 * 3600000) { dep = new Date(+dep - DAY); arr = new Date(+arr - DAY); }
    const total = arr - dep;
    let p = (now - dep) / total;
    p = Math.max(0, Math.min(1, p));
    const pc = Math.floor(p * 100);
    $('#pct').textContent = pc + '%';
    $('#fill').style.width = (p * 100) + '%';
    $('#car').style.left = (p * 100) + '%';
    if (now < dep) { $('#left').textContent = 'leaves in ' + fmt(dep - now); $('#msg').textContent = 'not yet'; }
    else if (now >= arr) { $('#left').textContent = 'there'; $('#msg').textContent = msgFor(1); }
    else { $('#left').textContent = fmt(arr - now) + ' to go'; $('#msg').textContent = msgFor(p); }
  }
  function onEdit() { store.set('awty', { dep: $('#dep').value, arr: $('#arr').value }); tick(); }
  $('#dep').addEventListener('input', onEdit);
  $('#arr').addEventListener('input', onEdit);
  tick();
  setInterval(tick, 10000);
})();
</script>
</body>
</html>
