<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a tool that makes a plot when I click on a graph</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* ---- tool styles below ---- */
h1 { font-size: 16px; }
.hint { margin: 0; min-height: 1.45em; }
.err { color: var(--no); }
#stage { position: relative; border: 1.5px solid var(--line); border-radius: var(--radius); background: #fff; display: none; margin: 0 auto; width: 100%; }
#stage.on { display: block; }
#board { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; }
#loupe { position: absolute; top: 6px; left: 6px; width: 120px; height: 120px; border: 1.5px solid var(--ink); border-radius: 50%; background: #fff; display: none; pointer-events: none; }
#loupe.right { left: auto; right: 6px; }
.cal { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cal .row { flex-wrap: nowrap; gap: 6px; }
.cal button { padding: 0 10px; min-width: 64px; flex: none; }
.cal button.set { border-color: var(--built); color: var(--built); }
.cal button.now { background: var(--ink); color: var(--paper); }
.cal input { min-width: 0; }
.out li span { font-variant-numeric: tabular-nums; }
.out li button { min-width: 44px; padding: 0; }
#csv { font: 16px/1.4 var(--mono); white-space: pre-wrap; word-break: break-all; margin: 0; max-height: 200px; overflow: auto; border: 1.5px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
#replot { width: 100%; height: auto; display: block; }
#replot .ax { stroke: var(--line); fill: none; }
#replot .ln { stroke: var(--ink); fill: none; stroke-width: 1.5; }
#replot circle { fill: var(--ink); }
#replot text { fill: var(--meta); font: 16px var(--mono); }
.hidden { display: none !important; }
</style>
</head>
<body>
<h1 id="wish">someone should make a tool that makes a plot when I click on a graph</h1>

<main id="app" class="stack">
  <div class="row">
    <button id="load" class="primary">Open chart image</button>
    <button id="sample">Sample</button>
    <input id="file" type="file" accept="image/*" class="hidden">
  </div>
  <p id="status" class="hint">Open or paste a chart image.</p>
  <div id="stage"><canvas id="board"></canvas><canvas id="loupe" width="120" height="120"></canvas></div>

  <section id="calib" class="stack hidden">
    <div class="cal">
      <div class="row"><button id="pX1" data-k="X1">X1</button><input id="vX1" data-k="X1" inputmode="decimal" placeholder="x value"></div>
      <div class="row"><button id="pX2" data-k="X2">X2</button><input id="vX2" data-k="X2" inputmode="decimal" placeholder="x value"></div>
      <div class="row"><button id="pY1" data-k="Y1">Y1</button><input id="vY1" data-k="Y1" inputmode="decimal" placeholder="y value"></div>
      <div class="row"><button id="pY2" data-k="Y2">Y2</button><input id="vY2" data-k="Y2" inputmode="decimal" placeholder="y value"></div>
    </div>
    <div class="row">
      <button id="logx">x linear</button>
      <button id="logy">y linear</button>
    </div>
  </section>

  <section id="data" class="stack hidden">
    <div class="row" style="justify-content:space-between">
      <strong id="count">0 points</strong>
      <div class="row"><button id="undo">Undo</button><button id="clear">Clear</button></div>
    </div>
    <svg id="replot" viewBox="0 0 360 220" aria-label="plot of the points"></svg>
    <ul id="out" class="plain out"></ul>
    <pre id="csv">x,y</pre>
    <div class="row"><button id="copy">Copy CSV</button><button id="download">Download CSV</button></div>
  </section>
</main>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const board = $('#board'), ctx = board.getContext('2d');
  const loupe = $('#loupe'), lctx = loupe.getContext('2d');
  const KEYS = ['X1', 'X2', 'Y1', 'Y2'];
  const MAX_SIDE = 2400;

  let img = null;              // source drawn at board resolution
  let cal = {};                // { X1: {x, y}, ... } in board pixels
  let pick = null;             // calibration key being placed, or null for data points
  let points = [];             // [{x, y}] in board pixels
  let logx = false, logy = false;
  let drag = null;

  const status = (t, bad) => { const s = $('#status'); s.textContent = t; s.classList.toggle('err', !!bad); };
  const num = k => { const v = parseFloat($('#v' + k).value.replace(',', '.')); return Number.isFinite(v) ? v : null; };
  const fmt = v => {
    if (!Number.isFinite(v)) return 'NaN';
    const a = Math.abs(v);
    return (a !== 0 && (a < 1e-3 || a >= 1e7)) ? v.toExponential(3) : String(+v.toPrecision(5));
  };

  // ---- loading ----
  function useImage(src) {
    const scale = Math.min(1, MAX_SIDE / Math.max(src.width, src.height));
    board.width = Math.round(src.width * scale);
    board.height = Math.round(src.height * scale);
    const c = document.createElement('canvas');
    c.width = board.width; c.height = board.height;
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    img = c;
    cal = {}; points = [];
    KEYS.forEach(k => { $('#v' + k).value = ''; });
    $('#stage').style.maxWidth = `calc(60vh * ${board.width / board.height})`;
    $('#stage').classList.add('on');
    $('#calib').classList.remove('hidden');
    $('#data').classList.remove('hidden');
    pick = 'X1';
    refresh();
  }

  function loadFile(f) {
    if (!f || !/^image\//.test(f.type)) { status('That is not an image file.', true); return; }
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => useImage(im);
      im.onerror = () => status('Could not read that image.', true);
      im.src = r.result;
    };
    r.onerror = () => status('Could not read that file.', true);
    r.readAsDataURL(f);
  }

  $('#load').addEventListener('click', () => $('#file').click());
  $('#file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
  document.addEventListener('paste', e => {
    const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (it) { e.preventDefault(); loadFile(it.getAsFile()); }
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

  // a known chart so the tool can be tried without a file: y = x^2 / 1, axes 0..10 and 0..100
  $('#sample').addEventListener('click', () => {
    const c = document.createElement('canvas'); c.width = 800; c.height = 500;
    const g = c.getContext('2d');
    const L = 80, R = 760, T = 30, B = 440;
    const px = x => L + (x / 10) * (R - L), py = y => B - (y / 100) * (B - T);
    g.fillStyle = '#fff'; g.fillRect(0, 0, 800, 500);
    g.strokeStyle = '#e3e3e3'; g.lineWidth = 1; g.font = '20px sans-serif'; g.fillStyle = '#333';
    for (let i = 0; i <= 10; i += 2) {
      g.beginPath(); g.moveTo(px(i), T); g.lineTo(px(i), B); g.stroke();
      g.textAlign = 'center'; g.fillText(i, px(i), B + 30);
    }
    for (let j = 0; j <= 100; j += 20) {
      g.beginPath(); g.moveTo(L, py(j)); g.lineTo(R, py(j)); g.stroke();
      g.textAlign = 'right'; g.fillText(j, L - 10, py(j) + 7);
    }
    g.strokeStyle = '#111'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(L, T); g.lineTo(L, B); g.lineTo(R, B); g.stroke();
    g.strokeStyle = '#1f5fbf'; g.lineWidth = 3; g.beginPath();
    for (let x = 0; x <= 10; x += 0.1) { const X = px(x), Y = py(x * x); x === 0 ? g.moveTo(X, Y) : g.lineTo(X, Y); }
    g.stroke();
    useImage(c);
    cal = { X1: { x: px(0), y: B }, X2: { x: px(10), y: B }, Y1: { x: L, y: py(0) }, Y2: { x: L, y: py(100) } };
    $('#vX1').value = 0; $('#vX2').value = 10; $('#vY1').value = 0; $('#vY2').value = 100;
    pick = null;
    refresh();
  });

  // ---- calibration ----
  KEYS.forEach(k => {
    $('#p' + k).addEventListener('click', () => { pick = k; refresh(); });
    $('#v' + k).addEventListener('input', refresh);
  });
  $('#logx').addEventListener('click', () => { logx = !logx; refresh(); });
  $('#logy').addEventListener('click', () => { logy = !logy; refresh(); });

  function axis(a, b, va, vb, log) {
    if (!a || !b || va == null || vb == null) return null;
    if (log && (va <= 0 || vb <= 0)) return 'log';
    const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
    if (d2 < 4 || va === vb) return 'same';
    const f = log ? Math.log10 : v => v;
    const fa = f(va), fb = f(vb);
    // project the point onto the axis line through the two reference points
    return p => {
      const t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / d2;
      const v = fa + t * (fb - fa);
      return log ? Math.pow(10, v) : v;
    };
  }

  function mapping() {
    const fx = axis(cal.X1, cal.X2, num('X1'), num('X2'), logx);
    const fy = axis(cal.Y1, cal.Y2, num('Y1'), num('Y2'), logy);
    if (fx === 'log' || fy === 'log') return { err: 'Log axes need values above zero.' };
    if (fx === 'same') return { err: 'X1 and X2 need different spots and values.' };
    if (fy === 'same') return { err: 'Y1 and Y2 need different spots and values.' };
    if (!fx || !fy) return null;
    return { fx, fy };
  }

  // ---- input on the image ----
  function toBoard(e) {
    const r = board.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(board.width, (e.clientX - r.left) * board.width / r.width)),
      y: Math.max(0, Math.min(board.height, (e.clientY - r.top) * board.height / r.height))
    };
  }

  board.addEventListener('pointerdown', e => {
    if (!img) return;
    e.preventDefault();
    try { board.setPointerCapture(e.pointerId); } catch {}
    drag = toBoard(e);
    showLoupe(e);
  });
  board.addEventListener('pointermove', e => { if (drag) { drag = toBoard(e); showLoupe(e); } });
  board.addEventListener('pointerup', e => {
    if (!drag) return;
    const p = toBoard(e);
    drag = null; loupe.style.display = 'none';
    place(p);
  });
  board.addEventListener('pointercancel', () => { drag = null; loupe.style.display = 'none'; draw(); });

  function place(p) {
    if (pick) {
      cal[pick] = p;
      const k = pick;
      pick = KEYS.find(q => !cal[q]) || null;
      refresh();
      if (num(k) == null) { $('#v' + k).focus({ preventScroll: true }); }
      return;
    }
    const m = mapping();
    if (!m) { status('Set all four reference points and values first.', true); return; }
    if (m.err) { status(m.err, true); return; }
    points.push(p);
    refresh();
  }

  function showLoupe(e) {
    const r = board.getBoundingClientRect();
    loupe.classList.toggle('right', e.clientX - r.left < 150 && e.clientY - r.top < 150);
    loupe.style.display = 'block';
    const z = 4, s = 120 / z;
    lctx.fillStyle = '#fff'; lctx.fillRect(0, 0, 120, 120);
    lctx.imageSmoothingEnabled = false;
    lctx.drawImage(img, drag.x - s / 2, drag.y - s / 2, s, s, 0, 0, 120, 120);
    lctx.strokeStyle = '#c8321e'; lctx.lineWidth = 1;
    lctx.beginPath(); lctx.moveTo(60, 0); lctx.lineTo(60, 120); lctx.moveTo(0, 60); lctx.lineTo(120, 60); lctx.stroke();
    draw();
  }

  // ---- drawing ----
  function draw() {
    if (!img) return;
    ctx.drawImage(img, 0, 0);
    const u = Math.max(1, board.width / 500);
    ctx.lineWidth = 2 * u;
    ctx.font = `${Math.round(14 * u)}px sans-serif`;
    KEYS.forEach(k => {
      const p = cal[k]; if (!p) return;
      ctx.strokeStyle = '#2e7d4f'; ctx.fillStyle = '#2e7d4f';
      ctx.beginPath(); ctx.moveTo(p.x - 8 * u, p.y); ctx.lineTo(p.x + 8 * u, p.y); ctx.moveTo(p.x, p.y - 8 * u); ctx.lineTo(p.x, p.y + 8 * u); ctx.stroke();
      ctx.fillText(k, p.x + 5 * u, p.y - 5 * u);
    });
    ctx.strokeStyle = '#c8321e'; ctx.fillStyle = '#c8321e';
    points.forEach((p, i) => {
      ctx.beginPath(); ctx.arc(p.x, p.y, 4 * u, 0, Math.PI * 2); ctx.stroke();
      ctx.fillText(i + 1, p.x + 6 * u, p.y + 16 * u);
    });
    if (drag) {
      ctx.strokeStyle = '#c8321e'; ctx.lineWidth = u;
      ctx.beginPath(); ctx.moveTo(drag.x, 0); ctx.lineTo(drag.x, board.height); ctx.moveTo(0, drag.y); ctx.lineTo(board.width, drag.y); ctx.stroke();
    }
  }

  function refresh() {
    KEYS.forEach(k => {
      const b = $('#p' + k);
      b.classList.toggle('set', !!cal[k]);
      b.classList.toggle('now', pick === k);
    });
    $('#logx').textContent = logx ? 'x log' : 'x linear';
    $('#logy').textContent = logy ? 'y log' : 'y linear';

    const m = mapping();
    if (!img) status('Open or paste a chart image.');
    else if (pick) status(`Tap a spot on the image with a known ${pick[0].toLowerCase()} value (${pick}).`);
    else if (!m) status(`Type the value at ${KEYS.find(k => num(k) == null)}.`);
    else if (m.err) status(m.err, true);
    else status(points.length ? 'Tap more points. Hold and drag for a closer look.' : 'Tap points on the curve to read them.');

    const rows = (m && !m.err) ? points.map(p => [m.fx(p), m.fy(p)]) : [];
    $('#count').textContent = `${points.length} point${points.length === 1 ? '' : 's'}`;
    const out = $('#out'); out.textContent = '';
    if (!points.length) {
      const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'No points yet.'; out.append(li);
    }
    points.forEach((p, i) => {
      const li = document.createElement('li');
      const s = document.createElement('span');
      s.textContent = rows[i] ? `${i + 1}.  x ${fmt(rows[i][0])}   y ${fmt(rows[i][1])}` : `${i + 1}.  needs calibration`;
      const del = document.createElement('button');
      del.textContent = '×'; del.setAttribute('aria-label', `remove point ${i + 1}`);
      del.addEventListener('click', () => { points.splice(i, 1); refresh(); });
      li.append(s, del); out.append(li);
    });
    $('#csv').textContent = 'x,y\n' + rows.map(r => `${r[0]},${r[1]}`).join('\n');
    replot(rows);
    draw();
  }

  function replot(rows) {
    const svg = $('#replot'), W = 360, H = 220, P = { l: 70, r: 12, t: 12, b: 34 }, lab = v => String(+v.toPrecision(3));
    if (!rows.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">plot appears here</text>`; return; }
    const sorted = [...rows].sort((a, b) => a[0] - b[0]);
    const xs = rows.map(r => r[0]), ys = rows.map(r => r[1]);
    let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    if (x0 === x1) { x0 -= 1; x1 += 1; }
    if (y0 === y1) { y0 -= 1; y1 += 1; }
    const sx = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r);
    const sy = y => H - P.b - (y - y0) / (y1 - y0) * (H - P.t - P.b);
    const pts = sorted.map(r => `${sx(r[0]).toFixed(1)},${sy(r[1]).toFixed(1)}`);
    svg.innerHTML =
      `<path class="ax" d="M${P.l},${P.t}V${H - P.b}H${W - P.r}"/>` +
      `<polyline class="ln" points="${pts.join(' ')}"/>` +
      sorted.map(r => `<circle cx="${sx(r[0]).toFixed(1)}" cy="${sy(r[1]).toFixed(1)}" r="3.5"/>`).join('') +
      `<text x="${P.l}" y="${H - 8}">${lab(x0)}</text>` +
      `<text x="${W - P.r}" y="${H - 8}" text-anchor="end">${lab(x1)}</text>` +
      `<text x="${P.l - 6}" y="${H - P.b}" text-anchor="end">${lab(y0)}</text>` +
      `<text x="${P.l - 6}" y="${P.t + 12}" text-anchor="end">${lab(y1)}</text>`;
  }

  // ---- data actions ----
  $('#undo').addEventListener('click', () => { points.pop(); refresh(); });
  $('#clear').addEventListener('click', () => { points = []; refresh(); });
  $('#copy').addEventListener('click', async () => {
    const t = $('#csv').textContent;
    try { await navigator.clipboard.writeText(t); status('CSV copied.'); }
    catch {
      const r = document.createRange(); r.selectNodeContents($('#csv'));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      status('Copy blocked. The CSV is selected, copy it by hand.', true);
    }
  });
  $('#download').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent($('#csv').textContent);
    a.download = 'points.csv';
    document.body.append(a); a.click(); a.remove();
  });

  refresh();
})();
</script>
</body>
</html>
