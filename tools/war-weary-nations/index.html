<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a turn-based strategy game where warring countries degrade from war effort</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.nation h2 { font: 500 17px/1.3 var(--sans); margin: 0 0 8px; }
.stat { margin: 0 0 10px; }
.stat .meta { display: flex; justify-content: space-between; font-size: 16px; }
.bar { height: 10px; border: 1.5px solid var(--ink); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); transition: width .25s; }
.bar.low i { background: var(--no); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acts button { width: 100%; }
#status { font: 500 17px/1.4 var(--sans); min-height: 48px; }
#log li { display: block; font-size: 16px; color: var(--meta); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a turn-based strategy game where warring countries degrade from war effort</h1>
<main id="app" class="stack">
  <div class="meta" id="turn">turn 1</div>
  <div class="cols">
    <section class="nation" id="me"><h2>You</h2></section>
    <section class="nation" id="foe"><h2>Rival</h2></section>
  </div>
  <div id="status">Both nations are whole. Every turn of war costs both.</div>
  <div class="acts">
    <button id="attack" class="primary">Attack</button>
    <button id="defend">Defend</button>
    <button id="rebuild">Rebuild</button>
    <button id="peace">Offer peace</button>
  </div>
  <button id="reset">New war</button>
  <ul class="plain" id="log"></ul>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const KEYS = [['pop', 'Population'], ['eco', 'Economy'], ['mor', 'Morale']];
  const fresh = () => ({ turn: 1, me: { pop: 100, eco: 100, mor: 100 }, foe: { pop: 100, eco: 100, mor: 100 }, over: false, status: 'Both nations are whole. Every turn of war costs both.', log: [] });
  let g = store.get('wwn', null);
  if (!g || !g.me || !g.foe) g = fresh();

  const clamp = n => Math.max(0, Math.round(n));
  const avg = c => (c.pop + c.eco + c.mor) / 3;
  const strength = c => avg(c) / 100;

  function hit(target, dmg) {
    target.pop = clamp(target.pop - dmg);
    target.eco = clamp(target.eco - dmg * 0.7);
    target.mor = clamp(target.mor - dmg * 0.5);
  }

  function build() {
    for (const id of ['me', 'foe']) {
      const el = $('#' + id);
      el.querySelectorAll('.stat').forEach(n => n.remove());
      for (const [k, label] of KEYS) {
        const d = document.createElement('div');
        d.className = 'stat';
        d.innerHTML = '<div class="meta"><span>' + label + '</span><span data-v></span></div><div class="bar"><i></i></div>';
        d.dataset.k = k;
        el.appendChild(d);
      }
    }
  }

  function render() {
    for (const id of ['me', 'foe']) {
      document.querySelectorAll('#' + id + ' .stat').forEach(d => {
        const v = g[id][d.dataset.k];
        d.querySelector('[data-v]').textContent = v;
        d.querySelector('i').style.width = Math.min(100, v) + '%';
        d.querySelector('.bar').className = 'bar' + (v < 40 ? ' low' : '');
      });
    }
    $('#turn').textContent = g.over ? 'war over, turn ' + g.turn : 'turn ' + g.turn;
    $('#status').textContent = g.status;
    $('#log').innerHTML = '';
    g.log.slice(-6).reverse().forEach(t => { const li = document.createElement('li'); li.textContent = t; $('#log').appendChild(li); });
    for (const b of ['attack', 'defend', 'rebuild', 'peace']) $('#' + b).disabled = g.over;
    store.set('wwn', g);
  }

  function finish() {
    const m = g.me, f = g.foe;
    const mc = m.pop <= 0 || m.eco <= 0 || m.mor <= 0;
    const fc = f.pop <= 0 || f.eco <= 0 || f.mor <= 0;
    if (!mc && !fc) return false;
    g.over = true;
    g.status = mc && fc ? 'Both nations collapsed.' : mc ? 'Your nation collapsed. The rival won a ruin.' : 'The rival collapsed. You won a ruin.';
    return true;
  }

  function act(kind) {
    if (g.over) return;
    const me = g.me, foe = g.foe;
    if (kind === 'peace') {
      if (avg(foe) < 75) {
        g.over = true;
        g.status = 'Peace. You hold ' + Math.round(avg(me)) + ', the rival holds ' + Math.round(avg(foe)) + '.';
        g.log.push('Turn ' + g.turn + ': peace signed');
      } else {
        g.status = 'Refused. The rival is not tired enough yet.';
        g.log.push('Turn ' + g.turn + ': peace refused');
      }
      render();
      return;
    }
    // rival chooses: defend when hurt, rebuild when drained, otherwise attack
    const foeAct = foe.pop < 55 ? 'defend' : foe.eco < 45 ? 'rebuild' : 'attack';
    let myDmg = 0, foeDmg = 0;
    if (kind === 'attack') {
      myDmg = 14 * strength(me) * (foeAct === 'defend' ? 0.5 : 1);
      me.eco = clamp(me.eco - 4); me.pop = clamp(me.pop - 3);
    }
    if (kind === 'rebuild') { me.eco = Math.min(120, me.eco + 8); me.mor = Math.min(120, me.mor + 4); }
    if (kind === 'defend') me.mor = Math.min(120, me.mor + 2);
    if (foeAct === 'attack') {
      foeDmg = 14 * strength(foe) * (kind === 'defend' ? 0.5 : 1);
      foe.eco = clamp(foe.eco - 4); foe.pop = clamp(foe.pop - 3);
    }
    if (foeAct === 'rebuild') { foe.eco = Math.min(120, foe.eco + 8); foe.mor = Math.min(120, foe.mor + 4); }
    if (foeAct === 'defend') foe.mor = Math.min(120, foe.mor + 2);
    if (myDmg) hit(foe, myDmg);
    if (foeDmg) hit(me, foeDmg);
    // war weariness: both lose more each turn
    const drain = 2 + Math.floor(g.turn / 3);
    for (const c of [me, foe]) { c.pop = clamp(c.pop - drain); c.eco = clamp(c.eco - drain); c.mor = clamp(c.mor - drain); }
    g.log.push('Turn ' + g.turn + ': you ' + kind + ', rival ' + foeAct + ', both lose ' + drain + ' to the war');
    g.status = 'Weariness took ' + drain + ' from every figure on both sides.';
    if (!finish()) g.turn++;
    render();
  }

  for (const k of ['attack', 'defend', 'rebuild', 'peace']) $('#' + k).addEventListener('click', () => act(k));
  $('#reset').addEventListener('click', () => { g = fresh(); render(); });
  build();
  render();
})();
</script>
</body>
</html>
