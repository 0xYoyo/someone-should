<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a cat simulator game from the perspective of a cat</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
#stage { width: 100%; max-width: 420px; aspect-ratio: 320 / 360; display: block; border: 1.5px solid var(--line); border-radius: var(--radius); touch-action: manipulation; }
.hud { display: flex; justify-content: space-between; align-items: baseline; max-width: 420px; }
#msg { min-height: 24px; max-width: 420px; }
.btns { max-width: 420px; }
.btns button { flex: 1; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a cat simulator game from the perspective of a cat</h1>

<main id="app" class="stack">
  <div class="hud"><div class="big" id="score">0</div><div class="meta">best <span id="best">0</span></div></div>
  <canvas id="stage" width="640" height="720" aria-label="a house seen from above, you are the cat"></canvas>
  <div id="msg" class="meta">tap the floor to walk. knock things off. nap in the sun. avoid the human.</div>
  <div class="row btns">
    <button id="hunt" class="primary">knock something</button>
    <button id="nap">nap in the sun</button>
    <button id="restart">restart</button>
  </div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const W = 320, H = 360;
  const cv = $('#stage'), ctx = cv.getContext('2d');
  ctx.scale(2, 2);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  const START = { x: 160, y: 310 };
  let cat, human, items, score, sun, napT, caughtT, msgT, best = store.get('cat-best', 0);
  $('#best').textContent = best;

  function reset() {
    cat = { x: START.x, y: START.y, tx: null, ty: null, dir: 1, mode: null };
    human = { x: 280, y: 60, tx: 280, ty: 60, fx: -1, fy: 0, wait: 3 };
    items = [
      { n: 'cup', x: 110, y: 255, c: '#c8321e', fall: 0, down: false },
      { n: 'vase', x: 40, y: 150, c: '#2e7d8f', fall: 0, down: false },
      { n: 'plant', x: 150, y: 70, c: '#2e7d4f', fall: 0, down: false },
      { n: 'book', x: 240, y: 170, c: '#8a5a2b', fall: 0, down: false },
      { n: 'glass', x: 60, y: 40, c: '#6b8fb0', fall: 0, down: false }
    ];
    score = 0; sun = { x: 190, y: 220, w: 100, h: 70 }; napT = 0; caughtT = 0;
    say('tap the floor to walk. knock things off. nap in the sun. avoid the human.');
    $('#score').textContent = 0;
  }
  function say(t) { $('#msg').textContent = t; }
  function add(n) {
    score = Math.max(0, score + n);
    $('#score').textContent = Math.floor(score);
    if (score > best) { best = Math.floor(score); store.set('cat-best', best); $('#best').textContent = best; }
  }
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function walkTo(x, y, mode) { cat.tx = Math.max(12, Math.min(W - 12, x)); cat.ty = Math.max(12, Math.min(H - 12, y)); cat.mode = mode || null; }

  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect();
    walkTo((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
  });
  $('#hunt').addEventListener('click', () => {
    const up = items.filter(i => !i.down).sort((a, b) => dist(a, cat) - dist(b, cat))[0];
    if (!up) { say('nothing left standing. wait for the human to tidy.'); return; }
    walkTo(up.x, up.y + 18, 'hunt');
  });
  $('#nap').addEventListener('click', () => walkTo(sun.x + sun.w / 2, sun.y + sun.h / 2, 'nap'));
  $('#restart').addEventListener('click', reset);

  function watching() {
    const d = dist(human, cat);
    if (d > 120 || d < 1) return d <= 1;
    return ((cat.x - human.x) * human.fx + (cat.y - human.y) * human.fy) / d > 0.35;
  }

  function update(dt) {
    // cat
    if (cat.tx != null) {
      const d = Math.hypot(cat.tx - cat.x, cat.ty - cat.y);
      if (d < 3) { cat.tx = null; }
      else {
        const s = Math.min(d, 150 * dt);
        cat.x += (cat.tx - cat.x) / d * s; cat.y += (cat.ty - cat.y) / d * s;
        if (Math.abs(cat.tx - cat.x) > 1) cat.dir = cat.tx > cat.x ? 1 : -1;
      }
    }
    // knocking: any standing item within reach
    for (const it of items) {
      if (!it.down && dist(it, cat) < 26) {
        it.down = true; it.fall = 0;
        if (watching()) {
          add(-15); caughtT = 1.5; cat.x = START.x; cat.y = START.y; cat.tx = null;
          say('seen. back to the start, minus 15.');
          human.wait = 2; human.tx = it.x; human.ty = it.y + 30;
        } else { add(10); say('crash. +10'); }
        cat.tx = null;
      }
      if (it.down && it.fall < 1) it.fall = Math.min(1, it.fall + dt * 3);
    }
    // nap: stand still inside the sunbeam
    const inSun = cat.x > sun.x && cat.x < sun.x + sun.w && cat.y > sun.y && cat.y < sun.y + sun.h;
    if (inSun && cat.tx == null) {
      napT += dt; add(dt * 2);
      if (napT > 0.5) say('warm. +2 a second');
    } else napT = 0;
    sun.x = 150 + Math.sin(performance.now() / 9000) * 40;
    // human wanders, tidies fallen things
    if (human.wait > 0) human.wait -= dt;
    else {
      const d = Math.hypot(human.tx - human.x, human.ty - human.y);
      if (d < 4) {
        const fallen = items.find(i => i.down && dist(i, human) < 40);
        if (fallen) { fallen.down = false; fallen.fall = 0; human.wait = 1.5; }
        else {
          const target = items.find(i => i.down);
          if (target && Math.random() < 0.7) { human.tx = target.x; human.ty = target.y + 30; }
          else { human.tx = 30 + Math.random() * 260; human.ty = 40 + Math.random() * 280; human.wait = 1 + Math.random() * 2; }
        }
      } else {
        human.fx = (human.tx - human.x) / d; human.fy = (human.ty - human.y) / d;
        human.x += human.fx * 38 * dt; human.y += human.fy * 38 * dt;
      }
    }
    if (caughtT > 0) caughtT -= dt;
  }

  function draw() {
    const paper = css('--paper'), ink = css('--ink'), line = css('--line'), meta = css('--meta');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = paper; ctx.fillRect(0, 0, W, H);
    // floorboards
    ctx.strokeStyle = line; ctx.lineWidth = 1;
    for (let y = 30; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // sunbeam
    ctx.fillStyle = 'rgba(230,190,60,0.28)'; ctx.fillRect(sun.x, sun.y, sun.w, sun.h);
    ctx.strokeStyle = 'rgba(230,190,60,0.7)'; ctx.strokeRect(sun.x, sun.y, sun.w, sun.h);
    // shelf items
    for (const it of items) {
      ctx.save();
      const oy = it.down ? 30 * it.fall : 0;
      ctx.translate(it.x, it.y + oy); ctx.rotate(it.down ? it.fall * 1.2 : 0);
      ctx.globalAlpha = it.down ? 0.55 : 1;
      ctx.fillStyle = it.c; ctx.fillRect(-9, -9, 18, 18);
      ctx.strokeStyle = ink; ctx.lineWidth = 1.5; ctx.strokeRect(-9, -9, 18, 18);
      ctx.restore();
      if (!it.down) { ctx.strokeStyle = ink; ctx.beginPath(); ctx.moveTo(it.x - 16, it.y + 10); ctx.lineTo(it.x + 16, it.y + 10); ctx.stroke(); }
    }
    // human and gaze cone
    ctx.fillStyle = 'rgba(200,50,30,0.12)';
    const a = Math.atan2(human.fy, human.fx);
    ctx.beginPath(); ctx.moveTo(human.x, human.y); ctx.arc(human.x, human.y, 120, a - 1.2, a + 1.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(human.x, human.y, 14, 0, 7); ctx.fill();
    ctx.fillStyle = paper; ctx.beginPath(); ctx.arc(human.x + human.fx * 6, human.y + human.fy * 6, 4, 0, 7); ctx.fill();
    // cat
    ctx.save(); ctx.translate(cat.x, cat.y); ctx.scale(cat.dir, 1);
    ctx.fillStyle = '#d98a2b'; ctx.strokeStyle = ink; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-10, 2); ctx.quadraticCurveTo(-26, -6, -20, -16); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 2, 13, 8, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(11, -3, 7, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, -9); ctx.lineTo(9, -15); ctx.lineTo(13, -10); ctx.moveTo(12, -9); ctx.lineTo(16, -14); ctx.lineTo(17, -7); ctx.stroke();
    ctx.restore();
    if (caughtT > 0) { ctx.fillStyle = css('--no'); ctx.font = '500 16px ui-monospace, Menlo, monospace'; ctx.fillText('seen', human.x - 16, human.y - 22); }
    if (napT > 0.5) { ctx.fillStyle = meta; ctx.font = '500 16px ui-monospace, Menlo, monospace'; ctx.fillText('zzz', cat.x + 8, cat.y - 18); }
  }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    update(dt); draw(); requestAnimationFrame(frame);
  }
  reset();
  draw();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
