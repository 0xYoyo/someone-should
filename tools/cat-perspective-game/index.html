<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
:root { --acc: #d9731f; }
#stage { display: block; width: 100%; max-width: 420px; aspect-ratio: 360 / 440; border: 1.5px solid var(--line); border-radius: var(--radius); touch-action: none; user-select: none; -webkit-user-select: none; background: #d8b68a; }
@media (prefers-color-scheme: dark) { #stage { filter: brightness(.82); } }
.hud { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; max-width: 420px; }
.hud .big { font-size: 34px; }
.lab { font: 15px/1.3 var(--mono); color: var(--meta); }
#stealth { font: 16px/1 var(--mono); letter-spacing: 3px; color: var(--acc); white-space: nowrap; }
#msg { min-height: 48px; max-width: 420px; margin: 0; }
.goals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 420px; }
.goal { display: flex; align-items: center; gap: 10px; text-align: left; min-height: 52px; padding: 6px 10px; border-color: var(--line); font-size: 16px; line-height: 1.2; }
.goal .chk { flex: none; width: 20px; height: 20px; border: 1.5px solid var(--meta); border-radius: 50%; position: relative; }
.goal.done { color: var(--meta); }
.goal.done .chk { background: var(--acc); border-color: var(--acc); }
.goal.done .chk::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid var(--paper); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.btns { display: flex; gap: 8px; max-width: 420px; }
.btns button { flex: 1; }
</style>

<body>
<h1 id="wish">someone should make a cat simulator game from the perspective of a cat</h1>

<main id="app" class="stack">
  <canvas id="stage" aria-label="Top-down apartment. You are the cat."></canvas>
  <div class="hud">
    <div><span class="big" id="score">0</span> <span class="lab">chaos points &middot; best <span id="best">0</span></span></div>
    <div id="stealth" aria-label="stealth">&#9679;&#9679;&#9679;</div>
  </div>
  <p id="msg" aria-live="polite">drag to walk. tap things to knock them off.</p>
  <div class="goals">
    <button class="goal" id="g-mug"><span class="chk"></span>knock the mug off the table</button>
    <button class="goal" id="g-box"><span class="chk"></span>sit in the box</button>
    <button class="goal" id="g-sun"><span class="chk"></span>nap in the sunbeam</button>
    <button class="goal" id="g-lap"><span class="chk"></span>sit on the laptop</button>
    <button class="goal" id="g-zoom"><span class="chk"></span>3am zoomies</button>
    <button class="goal" id="g-stare"><span class="chk"></span>stare at nothing</button>
  </div>
  <div class="btns">
    <button id="restart">again</button>
    <button id="snd">sound on</button>
  </div>
</main>

<script>
(function () {
  var W = 360, H = 440, FLOOR = 80;
  var cv = document.getElementById('stage'), ctx = cv.getContext('2d');
  var S = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * S; cv.height = H * S;
  function $(id) { return document.getElementById(id); }
  var TAU = Math.PI * 2;

  // ---------- small helpers ----------
  function rr(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, TAU); c.fill(); }

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function angDiff(a, b) { var d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

  // ---------- sound (synthesized, created on first tap) ----------
  var AC = null, master = null, noiseBuf = null, muted = false, purrG = null;
  function initAudio() {
    if (AC || muted) { if (AC && AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  function tone(type, f0, f1, dur, vol, delay) {
    if (!AC || muted) return;
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, ftype, freq, vol, delay) {
    if (!AC || muted) return;
    var t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = ftype; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  var sfx = {
    tink: function () { tone('sine', 2200, 1500, 0.07, 0.15); },
    crash: function (kind) {
      if (kind === 'plant') { tone('sine', 140, 50, 0.25, 0.5); noise(0.3, 'lowpass', 900, 0.5); noise(0.15, 'highpass', 2500, 0.15, 0.04); return; }
      noise(0.35, 'highpass', 1800, 0.45);
      tone('sine', 220, 70, 0.12, 0.3);
      var n = kind === 'vase' ? 8 : 5;
      for (var i = 0; i < n; i++) tone('triangle', rnd(2200, 5200), rnd(1800, 3000), 0.14, 0.12, 0.03 + i * rnd(0.025, 0.06));
    },
    hey: function () { tone('sawtooth', 200, 120, 0.3, 0.25); tone('square', 100, 80, 0.3, 0.1); },
    mm: function () { tone('sine', 150, 130, 0.25, 0.12); },
    mew: function () {
      if (!AC || muted) return;
      var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(520, t); o.frequency.linearRampToValueAtTime(900, t + 0.12); o.frequency.linearRampToValueAtTime(600, t + 0.4);
      l.frequency.value = 9; lg.gain.value = 18; l.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      o.connect(g); g.connect(master); o.start(t); l.start(t); o.stop(t + 0.5); l.stop(t + 0.5);
    },
    purr: function (on) {
      if (!AC || muted) return;
      if (!purrG) {
        var s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
        s.buffer = noiseBuf; s.loop = true; f.type = 'bandpass'; f.frequency.value = 110; f.Q.value = 0.9;
        g.gain.value = 0; lg.gain.value = 0.35; l.frequency.value = 24;
        l.connect(lg); lg.connect(g.gain); s.connect(f); f.connect(g); g.connect(master);
        s.start(); l.start(); purrG = g;
      }
      purrG.gain.setTargetAtTime(on ? 0.45 : 0, AC.currentTime, 0.25);
    }
  };

  // ---------- room layout ----------
  var BOX = { x: 299, y: 385, w: 78, h: 70 };
  var LAP = { x: 252, y: 166 };
  var STARE = { x: 150, y: 150 };
  var START = { x: 195, y: 245 };
  var BW = 76, BH = 130, SK = 46, BY = 305, PERIOD = 110;
  function beamX(t) { var p = ((t + 17.5) / PERIOD) % 1; return 70 + 220 * (1 - Math.abs(2 * p - 1)); }
  function inBeam(x, y) {
    var cx = beamX(T);
    if (Math.abs(y - BY) > BH / 2 - 6) return false;
    return Math.abs(x - (cx + SK * (BY - y) / BH)) < BW / 2 - 8;
  }

  // ---------- static layer: wall, floor, rug, sofa, table, decor ----------
  var bg = document.createElement('canvas'); bg.width = W * S; bg.height = H * S;
  (function paintBackground() {
    var c = bg.getContext('2d'); c.scale(S, S);
    // floor planks
    c.fillStyle = '#d9b88c'; c.fillRect(0, FLOOR, W, H - FLOOR);
    for (var y = FLOOR, row = 0; y < H; y += 24, row++) {
      c.fillStyle = row % 2 ? 'rgba(160,110,60,.07)' : 'rgba(255,240,210,.09)'; c.fillRect(0, y, W, 24);
      c.fillStyle = 'rgba(120,80,40,.28)'; c.fillRect(0, y, W, 1.2);
      for (var x = (row * 53) % 97; x < W; x += 97) c.fillRect(x, y, 1.2, 24);
    }
    var sh = c.createLinearGradient(0, FLOOR, 0, FLOOR + 26); sh.addColorStop(0, 'rgba(60,35,15,.3)'); sh.addColorStop(1, 'rgba(60,35,15,0)');
    c.fillStyle = sh; c.fillRect(0, FLOOR, W, 26);
    // wall
    c.fillStyle = '#b9c7a9'; c.fillRect(0, 0, W, 74);
    c.fillStyle = 'rgba(255,255,255,.12)'; for (var i = 0; i < W; i += 30) c.fillRect(i, 0, 14, 74);
    c.fillStyle = '#f1e8d3'; c.fillRect(0, 74, W, 6);
    c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(0, 80, W, 2);
    // window
    c.fillStyle = '#f6efe0'; rr(c, 236, 6, 90, 62, 3); c.fill();
    c.fillStyle = '#bfe3f2'; c.fillRect(242, 12, 78, 50);
    c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.moveTo(242, 62); c.lineTo(262, 12); c.lineTo(274, 12); c.lineTo(254, 62); c.fill();
    c.fillStyle = '#f6efe0'; c.fillRect(279, 12, 4, 50); c.fillRect(242, 35, 78, 4);
    c.fillStyle = '#e9c46a'; c.fillRect(236, 66, 90, 4);
    c.fillStyle = '#c9695d'; c.beginPath(); c.moveTo(228, 4); c.lineTo(244, 4); c.quadraticCurveTo(250, 38, 240, 70); c.lineTo(226, 70); c.closePath(); c.fill();
    // upper shelf: books, frame, cactus
    c.fillStyle = '#8a5f3a'; c.fillRect(12, 17, 190, 4);
    var bk = ['#c9695d', '#e9c46a', '#4b7fb5', '#7a9e6b', '#f1e8d3'], bx = 18;
    for (i = 0; i < 5; i++) { var bh = 11 + (i * 5) % 5; c.fillStyle = bk[i]; c.fillRect(bx, 17 - bh, 6, bh); bx += 7; }
    c.save(); c.translate(61, 17); c.rotate(-0.25); c.fillStyle = '#7a9e6b'; c.fillRect(0, -12, 6, 12); c.restore();
    c.fillStyle = '#5b3a24'; c.fillRect(110, 2, 24, 15); c.fillStyle = '#f1e8d3'; c.fillRect(112, 4, 20, 11); c.fillStyle = '#8fb3a0'; c.fillRect(112, 10, 20, 5);
    c.fillStyle = '#e9c46a'; circ(c, 122, 8, 2.4);
    c.fillStyle = '#b5683b'; c.fillRect(160, 10, 12, 7); c.fillStyle = '#4f8a54'; rr(c, 162, 0, 8, 12, 3); c.fill();
    // lower shelf board + brackets
    c.fillStyle = '#8a5f3a'; c.fillRect(12, 62, 190, 5);
    c.fillStyle = '#6e4a2c'; c.fillRect(12, 67, 190, 2); c.fillRect(30, 67, 4, 7); c.fillRect(180, 67, 4, 7);
    // rug
    c.fillStyle = '#b5543e'; rr(c, 94, 246, 172, 128, 6); c.fill();
    c.strokeStyle = '#f1e8d3'; c.lineWidth = 3; rr(c, 100, 252, 160, 116, 3); c.stroke();
    c.strokeStyle = '#e9c46a'; c.lineWidth = 1.5;
    for (i = 0; i < 6; i++) { var rx = 122 + i * 23; c.beginPath(); c.moveTo(rx, 310); c.lineTo(rx + 11, 298); c.lineTo(rx + 22, 310); c.lineTo(rx + 11, 322); c.closePath(); c.stroke(); }
    c.fillStyle = 'rgba(0,0,0,.1)'; c.fillRect(106, 262, 148, 2);
    c.strokeStyle = '#f1e8d3'; c.lineWidth = 1.2;
    for (i = 0; i < 24; i++) { var fx = 98 + i * 7; c.beginPath(); c.moveTo(fx, 246); c.lineTo(fx, 241); c.moveTo(fx, 374); c.lineTo(fx, 379); c.stroke(); }
    // sofa
    c.fillStyle = 'rgba(0,0,0,.18)'; rr(c, 17, 182, 74, 170, 12); c.fill();
    c.fillStyle = '#5f7f86'; rr(c, 12, 176, 74, 170, 12); c.fill();
    c.fillStyle = '#4f6e75'; rr(c, 12, 176, 18, 170, 10); c.fill();
    c.fillStyle = '#6b8c93'; rr(c, 30, 176, 56, 20, 8); c.fill(); rr(c, 30, 326, 56, 20, 8); c.fill();
    c.fillStyle = '#7ba0a7'; rr(c, 32, 198, 52, 64, 7); c.fill(); rr(c, 32, 264, 52, 62, 7); c.fill();
    c.strokeStyle = 'rgba(0,0,0,.15)'; c.lineWidth = 1; rr(c, 32, 198, 52, 64, 7); c.stroke(); rr(c, 32, 264, 52, 62, 7); c.stroke();
    // coffee table
    c.fillStyle = 'rgba(0,0,0,.2)'; rr(c, 230, 128, 114, 76, 8); c.fill();
    c.fillStyle = '#8f6238'; rr(c, 224, 122, 114, 76, 8); c.fill();
    c.fillStyle = '#a87848'; rr(c, 228, 126, 106, 68, 6); c.fill();
    c.strokeStyle = 'rgba(80,50,20,.25)'; c.lineWidth = 1;
    for (i = 0; i < 4; i++) { c.beginPath(); c.moveTo(232, 140 + i * 15); c.lineTo(330, 140 + i * 15); c.stroke(); }
    // floor plant, bowl, ball of yarn
    c.fillStyle = 'rgba(0,0,0,.16)'; ell(c, 44, 408, 22, 17);
    c.fillStyle = '#b5683b'; circ(c, 40, 402, 15); c.fillStyle = '#6b4226'; circ(c, 40, 402, 11);
    var lc = ['#3f7d46', '#4f9255', '#2f6a3a'];
    for (i = 0; i < 9; i++) { var a = i * TAU / 9; c.fillStyle = lc[i % 3]; ell(c, 40 + Math.cos(a) * 14, 402 + Math.sin(a) * 14, 14, 5, a); }
    c.fillStyle = 'rgba(0,0,0,.15)'; ell(c, 154, 414, 17, 11);
    c.fillStyle = '#4b7fb5'; ell(c, 151, 410, 16, 11); c.fillStyle = '#8a5a36'; ell(c, 151, 410, 11, 7);
    c.fillStyle = 'rgba(0,0,0,.15)'; ell(c, 215, 330, 11, 7);
    c.fillStyle = '#c9695d'; circ(c, 212, 326, 9);
    c.strokeStyle = '#a24a40'; c.lineWidth = 1.2;
    for (i = 0; i < 4; i++) { c.beginPath(); c.arc(212, 326, 8 - i, i, i + 2.2); c.stroke(); }
    c.beginPath(); c.moveTo(220, 328); c.bezierCurveTo(232, 340, 236, 322, 248, 336); c.stroke();
  })();

  // ---------- state ----------
  var T, score, best = 0, stealth, goals, items, decals, parts, floats, cat, human, shake, hasStarted, route, dragging, banner;
  var GOALS = ['mug', 'box', 'sun', 'lap', 'zoom', 'stare'];
  var GOAL_PTS = { mug: 0, box: 100, sun: 100, lap: 100, zoom: 150, stare: 100 };
  try { best = parseInt(localStorage.getItem('cpg-best'), 10) || 0; } catch (e) {}

  function reset() {
    T = 0; score = 0; stealth = 3; shake = 0; hasStarted = false; route = []; dragging = false;
    goals = {}; decals = []; parts = []; floats = [];
    items = [
      { id: 'mug', k: 'mugT', x: 335, y: 140, st: [310, 160], land: [350, 214], pts: 100, s: 'on', t: 0, rot: 0, name: 'the mug', col: '#f4f0e8' },
      { id: 'vase', k: 'vase', x: 62, y: 62, st: [62, 100], land: [66, 112], pts: 120, s: 'on', t: 0, rot: 0, name: 'the vase', col: '#3f78b0' },
      { id: 'plant', k: 'plant', x: 124, y: 62, st: [124, 100], land: [120, 114], pts: 80, s: 'on', t: 0, rot: 0, name: 'the plant', col: '#b5683b' },
      { id: 'cup', k: 'cup', x: 178, y: 62, st: [178, 100], land: [184, 113], pts: 60, s: 'on', t: 0, rot: 0, name: 'the other mug', col: '#c9453a' }
    ];
    cat = { x: START.x, y: START.y, a: -2.4, mode: 'idle', tx: null, ty: null, ph: 0, tail: 0, moving: false, running: false, idleT: 0, sit: 0, nap: 0, swatT: 0, swatItem: null, zoomT: 0, stareT: 0, blink: 2, spot: '' };
    human = { s: 'sleep', t: 14, bub: 0, bubTxt: '', cool: 0, noiseT: -99 };
    GOALS.forEach(function (g) { $('g-' + g).classList.remove('done'); });
    sfx.purr(false);
    showScore(); showStealth(); msg('drag to walk. tap things to knock them off.');
  }
  function msg(s) { $('msg').textContent = s; }
  function showScore() { $('score').textContent = score; if (score > best) { best = score; try { localStorage.setItem('cpg-best', String(best)); } catch (e) {} } $('best').textContent = best; }
  function showStealth() { var s = ''; for (var i = 0; i < 3; i++) s += i < stealth ? '●' : '○'; $('stealth').textContent = s; $('stealth').setAttribute('aria-label', 'stealth ' + stealth + ' of 3'); }
  function addScore(n, x, y) { score = Math.max(0, score + n); showScore(); if (x != null) floats.push({ x: x, y: y, t: 0, txt: (n > 0 ? '+' : '') + n }); }
  function finishGoal(g, text) {
    if (goals[g]) return;
    goals[g] = true; $('g-' + g).classList.add('done');
    if (GOAL_PTS[g]) addScore(GOAL_PTS[g], cat.x, cat.y - 22);
    sfx.mew();
    var left = GOALS.filter(function (k) { return !goals[k]; }).length;
    msg(left ? text : 'all six done. the human will find out in the morning.');
  }

  // ---------- breaking things ----------
  function swat(it) {
    cat.mode = 'swat'; cat.swatT = 0; cat.swatItem = it; cat.a = Math.atan2(it.y - cat.y, it.x - cat.x); cat.tx = null; sfx.tink();
  }
  function startTeeter(it) { it.s = 'teeter'; it.t = 0; sfx.tink(); }
  function breakItem(it) {
    it.s = 'broken'; shake = 0.28;

    if (m === 'swat') { var ex = Math.sin(Math.min(1, c.swatT / 0.22) * Math.PI / 2) * 11; ctx.fillStyle = coat; ell(ctx, 16 + ex / 2, 5, 8 + ex / 2, 3.2, -0.05); ctx.fillStyle = lt; circ(ctx, 18 + ex, 5, 3.6); }

    ctx.save(); ctx.translate(hx, bob);
    ctx.fillStyle = coat; circ(ctx, 0, 0, 8.6);
    [-1, 1].forEach(function (s) {
      ctx.fillStyle = coat; ctx.beginPath(); ctx.moveTo(-3, s * 6); ctx.lineTo(1, s * 14); ctx.lineTo(5, s * 5.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e88a8a'; ctx.beginPath(); ctx.moveTo(-0.5, s * 7); ctx.lineTo(1.4, s * 11.5); ctx.lineTo(3.4, s * 6.5); ctx.closePath(); ctx.fill();
    });
    ctx.strokeStyle = dk; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(0, 0); ctx.moveTo(-5, -3); ctx.lineTo(-1, -2); ctx.moveTo(-5, 3); ctx.lineTo(-1, 2); ctx.stroke();

    else { ctx.fillStyle = '#9ccf6a'; circ(ctx, 3.8, -3.8, 2.2); circ(ctx, 3.8, 3.8, 2.2); ctx.fillStyle = '#1a1a1a'; ell(ctx, 4.1, -3.8, 0.8, 1.9); ell(ctx, 4.1, 3.8, 0.8, 1.9); }
    ctx.fillStyle = '#e88a8a'; ctx.beginPath(); ctx.moveTo(8.2, -1.3); ctx.lineTo(10.2, 0); ctx.lineTo(8.2, 1.3); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 0.8; ctx.beginPath();
    ctx.moveTo(8, -1.8); ctx.lineTo(15, -5); ctx.moveTo(8, -0.8); ctx.lineTo(15, -1.5); ctx.moveTo(8, 1.8); ctx.lineTo(15, 5); ctx.moveTo(8, 0.8); ctx.lineTo(15, 1.5); ctx.stroke();

    ctx.restore();
  }
  function drawBox(front) {
    var x = BOX.x - BOX.w / 2, y = BOX.y - BOX.h / 2;

    parts.forEach(function (p) {

    });
    if (human.bub > 0) bubble(40, 146, human.bubTxt);

  }

  // ---------- input ----------
  function pt(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
  function pick(p) {
    for (var i = 0; i < items.length; i++) { var it = items[i]; if (it.s === 'on' && dist(p.x, p.y, it.x, it.y - (it.k === 'mugT' ? 0 : 14)) < 26) return it; }
