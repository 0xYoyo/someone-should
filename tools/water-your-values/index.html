<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app where you water plants that represent the things you value most</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

h1 { font-size: 16px; }
.meta { font-size: 16px; }
.plant { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.plant svg { width: 64px; height: 72px; display: block; }
.plant .name { font-weight: 500; overflow-wrap: anywhere; }
.plant.wilted .name { color: var(--meta); }
.plant .del { border: 0; min-width: var(--tap); padding: 0; color: var(--meta); }
.leaf { fill: var(--built); }
.wilted .leaf, .wilted .stem { fill: var(--meta); stroke: var(--meta); }
.stem { stroke: var(--built); stroke-width: 3; fill: none; stroke-linecap: round; }
.pot { fill: var(--ink); }
.actions { display: grid; gap: 8px; justify-items: end; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app where you water plants that represent the things you value most</h1>
<main id="app" class="stack">
  <form id="form" class="row" autocomplete="off">
    <input id="name" type="text" maxlength="40" placeholder="a value, e.g. patience" aria-label="a value" style="flex:1;min-width:0">
    <button id="add" type="submit" class="primary">plant</button>
  </form>
  <div id="msg" class="meta" aria-live="polite"></div>
  <div id="list"></div>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const DAY = 86400000;
  const WILT_AFTER = 3; // days without water before a plant droops
  const now = () => Date.now();

  // Example garden so the first view shows the tool working.
  const seed = () => [
    { id: 1, name: 'family', log: [now() - 6 * DAY, now() - 4 * DAY, now() - 2 * DAY, now() - 3600000] },
    { id: 2, name: 'health', log: [now() - 5 * DAY, now() - DAY] },
    { id: 3, name: 'learning', log: [now() - 9 * DAY] }
  ];
  let plants = store.get('wyv.plants', null);
  if (!Array.isArray(plants)) plants = seed();
  const save = () => store.set('wyv.plants', plants);

  const daysSince = p => p.log.length ? Math.floor((now() - p.log[p.log.length - 1]) / DAY) : null;
  const wilted = p => { const d = daysSince(p); return d === null || d >= WILT_AFTER; };
  const stage = p => Math.min(5, Math.floor(p.log.length / 2));

  function svg(p) {
    const s = stage(p), h = 8 + s * 8;
    let leaves = '';
    for (let i = 0; i < s; i++) {
      const y = 52 - 8 - i * 7, left = i % 2 === 0;
      leaves += '<ellipse class="leaf" cx="' + (left ? 24 : 40) + '" cy="' + y + '" rx="8" ry="4" transform="rotate(' + (left ? -25 : 25) + ' ' + (left ? 24 : 40) + ' ' + y + ')"/>';
    }
    if (s === 0) leaves = '<circle class="leaf" cx="32" cy="46" r="4"/>';
    const lean = wilted(p) ? 'M32 54 Q32 ' + (54 - h / 2) + ' 44 ' + (54 - h + 6) : 'M32 54 L32 ' + (54 - h);
    return '<svg viewBox="0 0 64 72" aria-hidden="true"><path class="stem" d="' + lean + '"/>' + leaves +
      '<path class="pot" d="M18 54 H46 L42 70 H22 Z"/></svg>';
  }

  function status(p) {
    const n = p.log.length, d = daysSince(p);
    const count = n + (n === 1 ? ' watering' : ' waterings');
    if (d === null) return 'not watered yet';
    if (d >= WILT_AFTER) return count + ', thirsty for ' + d + ' days';
    return count + (d === 0 ? ', watered today' : ', ' + d + (d === 1 ? ' day' : ' days') + ' ago');
  }

  function render() {
    const list = $('#list');
    list.textContent = '';
    if (!plants.length) {
      const e = document.createElement('p');
      e.className = 'empty';
      e.textContent = 'Nothing planted yet. Name something you value.';
      list.appendChild(e);
      return;
    }
    plants.forEach(p => {
      const row = document.createElement('div');
      row.className = 'plant' + (wilted(p) ? ' wilted' : '');
      row.innerHTML = svg(p);
      const mid = document.createElement('div');
      const nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = p.name;
      const st = document.createElement('div');
      st.className = 'meta count';
      st.textContent = status(p);
      mid.append(nm, st);
      const act = document.createElement('div');
      act.className = 'actions';
      const w = document.createElement('button');
      w.className = 'water primary';
      w.textContent = 'water';
      w.setAttribute('aria-label', 'water ' + p.name);
      w.onclick = () => { p.log.push(now()); save(); render(); $('#msg').textContent = ''; };
      const x = document.createElement('button');
      x.className = 'del';
      x.textContent = 'remove';
      x.setAttribute('aria-label', 'remove ' + p.name);
      x.onclick = () => { plants = plants.filter(q => q !== p); save(); render(); };
      act.append(w, x);
      row.append(mid, act);
      row.insertBefore(row.firstChild, mid);
      list.appendChild(row);
    });
  }

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#name').value.trim();
    const msg = $('#msg');
    if (!v) { msg.textContent = 'Type a value first.'; return; }
    if (plants.some(p => p.name.toLowerCase() === v.toLowerCase())) { msg.textContent = 'Already planted.'; return; }
    if (plants.length >= 20) { msg.textContent = 'Twenty is plenty. Remove one first.'; return; }
    plants.push({ id: now(), name: v, log: [] });
    $('#name').value = '';
    msg.textContent = '';
    save(); render();
  });

  render();
})();
</script>
</body>
</html>
