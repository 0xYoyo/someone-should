<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app where you enter your hourly pay and see what you have made since clocking in</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

label { display: grid; gap: 6px; }
.big { font-size: 56px; }
.panel { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 20px 16px; }
.rates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rates div { border-top: 1px solid var(--line); padding-top: 8px; }
.rates b { display: block; font-weight: 500; font-variant-numeric: tabular-nums; }
.err { color: var(--no); min-height: 1.45em; margin: 0; }
button { flex: 1; }
[hidden] { display: none !important; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app where you enter your hourly pay and see what you have made since clocking in</h1>

<main id="app" class="stack">
  <label>Hourly pay
    <input id="rate" type="text" inputmode="decimal" value="20" autocomplete="off">
  </label>
  <label id="agoWrap">Already working for (minutes)
    <input id="ago" type="text" inputmode="numeric" value="0" autocomplete="off">
  </label>
  <p id="err" class="err" role="status"></p>
  <div class="panel stack">
    <div class="meta" id="state">not clocked in</div>
    <div class="big" id="earned">0.00</div>
    <div class="meta">time worked <span id="elapsed">0:00:00</span></div>
  </div>
  <div class="row">
    <button id="start" class="primary">Clock in</button>
    <button id="stop" hidden>Clock out</button>
  </div>
  <div class="rates meta">
    <div>per minute<b id="pm">0.33</b></div>
    <div>per hour<b id="ph">20.00</b></div>
    <div>8 hours<b id="p8">160.00</b></div>
  </div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  let startedAt = null;   // ms timestamp while clocked in
  let timer = null;

  const money = n => n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const readNum = text => {
    const n = parseFloat(String(text).replace(',', '.'));
    return isFinite(n) && n >= 0 ? n : NaN;
  };
  const clock = ms => {
    const s = Math.floor(ms / 1000);
    const p = x => String(x).padStart(2, '0');
    return Math.floor(s / 3600) + ':' + p(Math.floor(s / 60) % 60) + ':' + p(s % 60);
  };

  function showRates() {
    const r = readNum($('#rate').value);
    const ok = !isNaN(r);
    $('#pm').textContent = ok ? money(r / 60) : '-';
    $('#ph').textContent = ok ? money(r) : '-';
    $('#p8').textContent = ok ? money(r * 8) : '-';
  }

  function tick() {
    const r = readNum($('#rate').value);
    if (startedAt === null || isNaN(r)) return;
    const ms = Date.now() - startedAt;
    $('#earned').textContent = money(r * ms / 3600000);
    $('#elapsed').textContent = clock(ms);
  }

  function setRunning(on) {
    $('#start').hidden = on;
    $('#stop').hidden = !on;
    $('#agoWrap').hidden = on;
    $('#state').textContent = on ? 'clocked in' : 'not clocked in';
  }

  function start() {
    const r = readNum($('#rate').value);
    const a = $('#ago').value.trim() === '' ? 0 : readNum($('#ago').value);
    if (isNaN(r) || r === 0) { $('#err').textContent = 'Enter your hourly pay as a number.'; return; }
    if (isNaN(a)) { $('#err').textContent = 'Minutes must be a number.'; return; }
    $('#err').textContent = '';
    startedAt = Date.now() - a * 60000;
    store.set('rate', $('#rate').value);
    store.set('startedAt', startedAt);
    setRunning(true);
    tick();
    clearInterval(timer);
    timer = setInterval(tick, 250);
  }

  function stop() {
    tick();
    clearInterval(timer);
    startedAt = null;
    store.del('startedAt');
    setRunning(false);
    $('#state').textContent = 'clocked out, final amount';
    $('#ago').value = '0';
  }

  $('#rate').addEventListener('input', () => {
    $('#err').textContent = '';
    showRates();
    store.set('rate', $('#rate').value);
    tick();
  });
  $('#start').addEventListener('click', start);
  $('#stop').addEventListener('click', stop);

  // restore a shift that was running when the page closed
  const savedRate = store.get('rate', null);
  if (savedRate !== null) $('#rate').value = savedRate;
  showRates();
  const savedStart = store.get('startedAt', null);
  if (typeof savedStart === 'number' && savedStart <= Date.now()) {
    startedAt = savedStart;
    setRunning(true);
    tick();
    timer = setInterval(tick, 250);
  }
})();
</script>
</body>
</html>
