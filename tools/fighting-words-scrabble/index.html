<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.bars { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bar b { font: 500 28px/1.1 var(--mono); display: block; font-variant-numeric: tabular-nums; }
.track { height: 8px; border: 1.5px solid var(--ink); border-radius: var(--radius); overflow: hidden; margin-top: 4px; }
.track i { display: block; height: 100%; background: var(--ink); transition: width .3s; }
.stage { min-height: 64px; border-bottom: 1.5px solid var(--ink); padding: 6px 0; }
#word { font: 500 40px/1.1 var(--mono); letter-spacing: .08em; min-height: 44px; word-break: break-all; }
.rack { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { position: relative; min-height: 64px; padding: 0; font: 500 28px/1 var(--mono); background: var(--line); border-color: var(--ink); }
.tile small { position: absolute; right: 6px; bottom: 4px; font: 16px/1 var(--mono); color: var(--meta); }
.tile.used { opacity: .3; }
#log p { margin: 0 0 6px; }
.hit { color: var(--no); }

  </div>

  </div>

  <div class="meta" id="record"></div>
</main>

SADLY SAINT SALAD SAUCE SCALE SCARE SCENE SCENT SCOPE SCORE SCOUT SCREW SENSE SERVE SEVEN SHADE SHAKE SHALL SHAME SHAPE SHARE SHARK SHARP SHEEP SHEET SHELF SHELL SHIFT SHINE SHIRT SHOCK SHOOT SHORE SHORT SHOUT SHOWN SIGHT SILLY SINCE SIXTH SIXTY SKILL SKIRT SKULL SLEEP SLICE SLIDE SLOPE SMALL SMART SMELL SMILE SMOKE SNAKE SOLAR SOLID SOLVE SORRY SOUND SOUTH SPACE SPARE SPARK SPEAK SPEED SPELL SPEND SPICE SPIKE SPILL SPINE SPOKE SPOON SPORT SPRAY SQUAD STACK STAFF STAGE STAIN STAIR STAKE STALE STAMP STAND STARE START STATE STEAK STEAL STEAM STEEL STEEP STEER STERN STICK STIFF STILL STOCK STONE STOOD STORE STORM STORY STOVE STRAP STRAW STRIP STUCK STUDY STUFF STYLE SUGAR SUITE SUNNY SUPER SWEET SWEPT SWIFT SWING SWORD TABLE TASTE TEACH TEASE TEETH TEMPO TENTH THANK THEFT THEME THERE THICK THIEF THING THINK THIRD THORN THOSE THREE THREW THROW THUMB TIGER TIGHT TIMER TIRED TITLE TOAST TODAY TOOTH TOPIC TOTAL TOUCH TOUGH TOWEL TOWER TOXIC TRACE TRACK TRADE TRAIL TRAIN TRAIT TRASH TREAT TREND TRIAL TRIBE TRICK TRIED TROOP TRUCK TRULY TRUNK TRUST TRUTH TWICE TWIST ULTRA UNCLE UNDER UNION UNITE UNITY UNTIL UPPER UPSET URBAN USAGE USUAL VALID VALUE VAPOR VAULT VERSE VIDEO VIGOR VINYL VIRUS VISIT VITAL VIVID VOCAL VOICE VOTER WAGON WAIST WASTE WATCH WATER WEARY WEAVE WEIGH WEIRD WHALE WHEAT WHEEL WHERE WHICH WHILE WHITE WHOLE WHOSE WIDOW WIDTH WITCH WOMAN WOMEN WORLD WORRY WORSE WORST WORTH WOULD WOUND WRATH WRITE WRONG YACHT YOUNG YOUTH ZEBRA ANCHOR ANIMAL ANSWER APPEAR ARREST ARTIST ATTACK BASKET BATTLE BEAUTY BEFORE BETTER BEYOND BITTER BLANKET BORDER BOTTLE BRIDGE BRIGHT BROKEN BUTTER BUTTON CAMERA CANDLE CARPET CASTLE CENTER CHANCE CHANGE CHARGE CHEESE CHOICE CHOOSE CIRCLE CLIENT CLOSET COFFEE COLUMN COMMON COPPER CORNER COTTON COUPLE COURSE COUSIN CREATE CREDIT CUSTOM DAMAGE DANCER DANGER DECIDE DEFEND DEGREE DINNER DIRECT DOCTOR DOLLAR DOUBLE DRAGON DRAWER DREAMT DRIVER DURING EASILY EATING EMPIRE ENERGY ENGINE ENOUGH ENTIRE ESCAPE EXCEPT EXPECT FABRIC FACTOR FAMILY FARMER FATHER FELLOW FIGURE FINGER FINISH FLIGHT FLOWER FOREST FORGET FORMAL FOSSIL FRIEND FROZEN FUTURE GARDEN GENTLE GINGER GLANCE GOLDEN GOVERN GROUND GROWTH GUITAR HAMMER HANDLE HAPPEN HARBOR HEALTH HEAVEN HEIGHT HIDDEN HOCKEY HONEST HUNTER IMPACT INSECT INSIDE ISLAND JACKET JUNGLE KITCHEN LADDER LAWYER LEADER LEGEND LESSON LETTER LIQUID LISTEN LITTLE LIVING LONELY LUMBER MAGNET MANNER MARBLE MARKET MASTER MATTER MEDIUM MEMBER MENTAL METHOD MIDDLE MIRROR MODERN MOMENT MOTHER MOTION MUSCLE NARROW NATION NATURE NEARBY NEEDLE NOBODY NORMAL NOTICE NUMBER OBJECT OBTAIN OFFICE ONLINE ORANGE ORIGIN OUTFIT OXYGEN PACKET PALACE PARADE PARENT PARTLY PATROL PEOPLE PEPPER PERIOD PERSON PLANET PLAYER PLEASE POCKET POETRY POLICE POLITE POTATO POWDER PRAYER PRINCE PRISON PROFIT PROPER PUBLIC PURPLE PURSUE PUZZLE RABBIT RANDOM RATHER READER REALLY REASON RECORD REFORM REGION REMAIN REMOTE REPAIR REPEAT REPORT RESCUE RESULT RETURN REVEAL REWARD RIDDLE ROCKET RUBBER SADDLE SAFETY SAILOR SALMON SAMPLE SCHOOL SCREEN SCRIPT SEARCH SEASON SECOND SECRET SELECT SENIOR SERIES SERVER SETTLE SHADOW SHIELD SHOULDER SIGNAL SILENT SILVER SIMPLE SINGLE SISTER SKETCH SMOOTH SOCCER SOCIAL SOFTEN SOLDIER SPIRIT SPRING SQUARE STABLE STEADY STREAM STREET STRESS STRIKE STRING STRONG STUDIO SUBMIT SUDDEN SUFFER SUMMER SUNSET SUPPLY SURELY SWITCH SYMBOL SYSTEM TABLET TALENT TARGET TEMPLE TENNIS THANKS THEORY THIRTY THREAD THRONE TICKET TIMBER TOMATO TONIGHT TRAVEL TREATY TUNNEL TURKEY TURTLE TWELVE UNIQUE UNLESS VALLEY VENDOR VICTIM VISION VISUAL VOLUME WALLET WANDER WARMTH WEALTH WEAPON WEEKLY WEIGHT WINDOW WINTER WISDOM WONDER WOODEN WORKER YELLOW FIGHTER STRANGER STARLET SELDOM LANDER PLANETS'.split(' '));
  const LIST = [...WORDS];
  const PTS = {};
  '1:AEIOULNSTR 2:DG 3:BCMP 4:FHVWY 5:K 8:JX 10:QZ'.split(' ').forEach(g => { const [p, ls] = g.split(':'); for (const c of ls) PTS[c] = +p; });
  const BAG = 'AAAAAAAAABBCCDDDDEEEEEEEEEEEEFFGGGHHIIIIIIIIIJKLLLLMMNNNNNNOOOOOOOORPPQRRRRRRSSSSTTTTTTUUUUVVWWXYYZ';
  const VOW = 'AEIOU', HAND = 8, MAX = 40;
  const draw = () => BAG[Math.floor(Math.random() * BAG.length)];
  const power = w => { let s = 0; for (const c of w) s += PTS[c]; return 2 * s + 3 * (w.length - 2); };
  const shield = w => 2 * [...w].filter(c => VOW.includes(c)).length;
  const canMake = (w, rack) => { const r = [...rack]; for (const c of w) { const i = r.indexOf(c); if (i < 0) return false; r.splice(i, 1); } return true; };

  let id = 0, hp, rack, staged, aiRack, over;
  const tile = l => ({ id: ++id, l });
  const fill = r => { while (r.length < HAND) r.push(tile(draw())); };
  const hasWord = r => LIST.some(w => canMake(w, r.map(t => t.l)));
  function fresh(r) { let n = 0; do { r.length = 0; fill(r); } while (!hasWord(r) && ++n < 60); }
  const wordOf = () => staged.map(i => rack.find(t => t.id === i).l).join('');

  function aiPick() {
    const have = aiRack.map(t => t.l);
    const opts = LIST.filter(w => canMake(w, have)).sort((a, b) => power(b) - power(a));
    // mostly its best word, sometimes the second or third
    const k = Math.random() < .6 ? 0 : Math.min(opts.length - 1, 1 + Math.floor(Math.random() * 2));
    return opts[k] || '';
  }

  function render() {
    $('#hp-you').textContent = hp.you; $('#hp-ai').textContent = hp.ai;
    $('#bar-you').style.width = Math.max(0, hp.you / MAX * 100) + '%';
    $('#bar-ai').style.width = Math.max(0, hp.ai / MAX * 100) + '%';
    const w = wordOf();
    $('#word').textContent = w;
    $('#power').textContent = w ? `hit ${power(w)} · shield ${shield(w)}` : 'hit 0 · shield 0';
    $('#rack').innerHTML = '';
    for (const t of rack) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tile' + (staged.includes(t.id) ? ' used' : '');
      b.dataset.l = t.l; b.setAttribute('aria-label', t.l);
      b.innerHTML = t.l + '<small>' + PTS[t.l] + '</small>';
      b.onclick = () => { staged = staged.includes(t.id) ? staged.filter(x => x !== t.id) : [...staged, t.id]; render(); };
      $('#rack').appendChild(b);
    }
    $('#fight').hidden = over; $('#back').hidden = over; $('#clear').hidden = over; $('#again').hidden = !over;
    const rec = store.get('fws', { w: 0, l: 0 });
    $('#record').textContent = (rec.w || rec.l) ? `won ${rec.w} · lost ${rec.l}` : '';
  }

  function say(html, cls) { const p = document.createElement('p'); if (cls) p.className = cls; p.innerHTML = html; $('#log').prepend(p); }

  function fight() {
    const w = wordOf();
    if (w.length < 3) { $('#log').innerHTML = ''; say('Three letters or more.'); return; }
    if (!WORDS.has(w)) { $('#log').innerHTML = ''; say(w + ' is not in the word list.'); return; }
    const a = aiPick();
    const toAi = a ? Math.max(1, power(w) - shield(a)) : power(w);
    const toYou = a ? Math.max(1, power(a) - shield(w)) : 0;
    hp.ai -= toAi; hp.you -= toYou;
    $('#log').innerHTML = '';
    say(a ? `<b>${a}</b> hits you for ${toYou}.` : 'They had no word.', 'hit');
    say(`<b>${w}</b> hits them for ${toAi}.`);
    rack = rack.filter(t => !staged.includes(t.id)); staged = []; fill(rack);
    aiRack = []; fresh(aiRack); // their hand is redealt each round
    if (hp.ai <= 0 || hp.you <= 0) {
      over = true;
      const rec = store.get('fws', { w: 0, l: 0 });
      if (hp.ai <= 0 && hp.you > 0) { say('You win.'); rec.w++; }
      else if (hp.you <= 0 && hp.ai > 0) { say('You lose.'); rec.l++; }
      else say('Both down. Draw.');
      store.set('fws', rec);
    }
    render();
  }

  function start(first) {
    hp = { you: MAX, ai: MAX }; over = false;
    if (first) { // fixed opening hand so the first frame shows a word ready to fight
      rack = [...'STARELDN'].map(tile);
      staged = ['S', 'T', 'A', 'R'].map(c => rack.find(t => t.l === c).id);
    } else { rack = []; fresh(rack); staged = []; $('#log').innerHTML = ''; }
    aiRack = []; fresh(aiRack);
    render();
  }

  $('#back').onclick = () => { staged.pop(); render(); };
  $('#clear').onclick = () => { staged = []; render(); };
  $('#fight').onclick = fight;
  $('#again').onclick = () => start(false);
  start(true);
})();
</script>
