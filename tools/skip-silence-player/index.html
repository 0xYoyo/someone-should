<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a player that skips silent parts of audio and video</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
.pick { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); border-radius: var(--radius); cursor: pointer; background: var(--ink); color: var(--paper); }
.pick:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
#file { position: absolute; width: 1px; height: 1px; opacity: 0; min-height: 0; padding: 0; border: 0; }
#video { width: 100%; max-height: 50vh; background: #000; border-radius: var(--radius); display: block; }
#video.audio { display: none; }
#bar { width: 100%; height: 64px; display: block; border: 1.5px solid var(--line); border-radius: var(--radius); touch-action: none; cursor: pointer; }
.info { font: 16px/1.4 var(--mono); color: var(--meta); font-variant-numeric: tabular-nums; }
#now { font-variant-numeric: tabular-nums; }
.knob { display: grid; gap: 2px; }
.knob label { display: flex; justify-content: space-between; font-size: 16px; }
.knob output { font-family: var(--mono); color: var(--meta); }
input[type=range] { padding: 0; border: 0; accent-color: var(--ink); }
#player[hidden] { display: none; }
#play { min-width: 96px; }
</style>
</head>
<body>
<h1 id="wish">someone should make a player that skips silent parts of audio and video</h1>

<main id="app" class="stack">
  <div class="row">
    <label class="pick">open audio or video<input id="file" type="file" accept="audio/*,video/*"></label>
    <button id="sample" type="button">sample</button>
  </div>
  <p id="msg" class="empty">Nothing loaded. Your file stays on this device.</p>

  <section id="player" class="stack" hidden>
    <video id="video" class="audio" playsinline preload="auto"></video>
    <canvas id="bar" aria-label="timeline, quiet parts shaded"></canvas>
    <div class="row">
      <button id="play" class="primary" type="button">play</button>
      <span id="now" class="big" style="font-size:28px">0:00</span>
    </div>
    <div id="stat" class="info"></div>
    <div id="skips" class="info">skipped 0</div>
  </section>

  <div class="knob">
    <label for="thr">quiet below <output id="thrOut"></output></label>
    <input id="thr" type="range" min="-70" max="-15" step="1">
  </div>
  <div class="knob">
    <label for="gap">skip gaps longer than <output id="gapOut"></output></label>
    <input id="gap" type="range" min="0.2" max="3" step="0.1">
  </div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const video = $('#video'), bar = $('#bar'), msg = $('#msg'), player = $('#player');
  const playBtn = $('#play'), nowEl = $('#now'), statEl = $('#stat'), skipsEl = $('#skips');
  const thr = $('#thr'), gap = $('#gap');

  const RATE = 8000;          // analysis sample rate
  const WIN = 0.02;           // envelope window, seconds
  const LEAD = 0.1, TAIL = 0.15; // keep a little sound around each cut
  const MAX_ANALYSE = 400e6;  // bigger files fall back to live detection

  let env = null;       // Float32Array of dB per window, or null in live mode
  let ranges = [];      // [[start, end], ...] silent parts in seconds
  let skips = 0, saved = 0, timer = 0, loadId = 0;
  let live = null;      // { ctx, an, buf, quietSince }

  thr.value = store.get('ssp.thr', -42);
  gap.value = store.get('ssp.gap', 0.5);

  const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
  const say = t => { msg.textContent = t; msg.hidden = !t; };

  function showKnobs() {
    $('#thrOut').textContent = thr.value + ' dB';
    $('#gapOut').textContent = (+gap.value).toFixed(1) + ' s';
  }

  // envelope -> silent ranges
  function findRanges() {
    ranges = [];
    if (!env) return;
    const t = +thr.value, min = +gap.value;
    let start = -1;
    for (let i = 0; i <= env.length; i++) {
      const quiet = i < env.length && env[i] < t;
      if (quiet && start < 0) start = i;
      else if (!quiet && start >= 0) {
        const s = start * WIN, e = i * WIN;
        if (e - s >= min) ranges.push([s, e]);
        start = -1;
      }
    }
  }

  function showStat() {
    const dur = video.duration;
    if (!env) { statEl.textContent = live ? 'live mode: fast-forwards through quiet parts' : ''; return; }
    const cut = ranges.reduce((a, [s, e]) => a + Math.max(0, e - s - LEAD - TAIL), 0);
    const total = isFinite(dur) ? dur : env.length * WIN;
    statEl.textContent = `${ranges.length} silent part${ranges.length === 1 ? '' : 's'} · ${fmt(total - cut)} instead of ${fmt(total)}`;
  }

  function draw() {
    const w = bar.clientWidth, h = bar.clientHeight, dpr = window.devicePixelRatio || 1;
    if (!w) return;
    if (bar.width !== Math.round(w * dpr)) { bar.width = Math.round(w * dpr); bar.height = Math.round(h * dpr); }
    const c = bar.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cs = getComputedStyle(document.documentElement);
    const ink = cs.getPropertyValue('--ink').trim(), line = cs.getPropertyValue('--line').trim(), no = cs.getPropertyValue('--no').trim();
    c.clearRect(0, 0, w, h);
    const dur = isFinite(video.duration) ? video.duration : env ? env.length * WIN : 0;
    if (!dur) return;
    c.fillStyle = line;
    for (const [s, e] of ranges) c.fillRect(s / dur * w, 0, Math.max(1, (e - s) / dur * w), h);
    if (env) {
      c.fillStyle = ink;
      const step = env.length / w;
      for (let x = 0; x < w; x++) {
        let m = -100;
        for (let i = Math.floor(x * step), j = Math.min(env.length, Math.floor((x + 1) * step) + 1); i < j; i++) if (env[i] > m) m = env[i];
        const y = Math.max(0, Math.min(1, (m + 70) / 70)) * (h - 4);
        c.fillRect(x, (h - y) / 2, 1, Math.max(1, y));
      }
      const ty = h - Math.max(0, Math.min(1, (+thr.value + 70) / 70)) * (h - 4);
      c.fillStyle = no; c.globalAlpha = .5;
      c.fillRect(0, Math.round(ty / 2), w, 1); c.fillRect(0, Math.round(h - ty / 2), w, 1);
      c.globalAlpha = 1;
    }
    c.fillStyle = no;
    c.fillRect(Math.min(w - 2, video.currentTime / dur * w), 0, 2, h);
  }

  function showSkips() { skipsEl.textContent = `skipped ${skips} · ${fmt(saved)} saved`; }

  // the actual skipping
  function tick() {
    const t = video.currentTime;
    if (env) {
      for (const [s, e] of ranges) {
        if (t >= s + LEAD && t < e - TAIL) {
          video.currentTime = e - TAIL;
          skips++; saved += e - TAIL - t; showSkips();
          break;
        }
        if (s > t) break;
      }
    } else if (live) liveTick();
    nowEl.textContent = fmt(video.currentTime);
    draw();
  }

  function liveTick() {
    const { an, buf } = live;
    an.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const db = 10 * Math.log10(sum / buf.length + 1e-12);
    const now = performance.now();
    if (db < +thr.value) {
      if (live.quietSince == null) live.quietSince = now;
      if (now - live.quietSince > +gap.value * 1000 && video.playbackRate === 1) {
        video.playbackRate = 8; skips++; live.from = video.currentTime; showSkips();
      }
    } else {
      live.quietSince = null;
      if (video.playbackRate !== 1) { saved += (video.currentTime - live.from) * 7 / 8; video.playbackRate = 1; showSkips(); }
    }
  }

  function startLive() {
    if (live || !window.AudioContext) return;
    try {
      const ctx = new AudioContext();
      const src = ctx.createMediaElementSource(video);
      const an = ctx.createAnalyser(); an.fftSize = 2048;
      src.connect(an); an.connect(ctx.destination);
      live = { ctx, an, buf: new Float32Array(an.fftSize), quietSince: null };
    } catch { say('This browser cannot measure the sound here; playing without skipping.'); }
    showStat();
  }

  function decode(arrayBuffer) {
    const Off = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!Off) return Promise.reject(new Error('no audio'));
    const ctx = new Off(1, RATE, RATE);
    return new Promise((res, rej) => {
      const p = ctx.decodeAudioData(arrayBuffer, res, rej);
      if (p && p.catch) p.catch(rej);
    });
  }

  function envelope(audio) {
    const n = Math.floor(WIN * audio.sampleRate), chans = audio.numberOfChannels, len = audio.length;
    const data = []; for (let c = 0; c < chans; c++) data.push(audio.getChannelData(c));
    const out = new Float32Array(Math.ceil(len / n));
    for (let w = 0; w < out.length; w++) {
      let sum = 0, cnt = 0;
      for (let i = w * n, j = Math.min(len, i + n); i < j; i++) {
        let v = 0; for (let c = 0; c < chans; c++) v += data[c][i];
        v /= chans; sum += v * v; cnt++;
      }
      out[w] = 10 * Math.log10(sum / (cnt || 1) + 1e-12);
    }
    return out;
  }

  async function load(src, getBuffer, name, size) {
    const id = ++loadId;
    stop();
    video.playbackRate = 1;
    env = null; ranges = []; skips = 0; saved = 0; showSkips();
    statEl.textContent = '';
    player.hidden = false;
    say('Reading ' + name + '…');
    video.src = src;
    video.load();
    if (size <= MAX_ANALYSE) {
      try {
        const audio = await decode(await getBuffer());
        if (id !== loadId) return;
        env = envelope(audio);
      } catch { if (id !== loadId) return; env = null; }
    }
    findRanges();
    say(env ? '' : 'Could not read the sound ahead of time; will fast-forward quiet parts as they play.');
    showStat(); draw();
  }

  function readDataURL(file) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
  }

  $('#file').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const url = await readDataURL(f);
      await load(url, () => f.arrayBuffer(), f.name, f.size);
    } catch { say('Could not open that file.'); }
  });

  // sample: speech-like bursts with silences of 3 s, 2 s and 0.3 s
  function makeSample() {
    const parts = [[1, 1], [3, 0], [2, 1], [2, 0], [1.5, 1], [0.3, 0], [1.5, 1]];
    const total = parts.reduce((a, p) => a + p[0], 0), n = Math.round(total * RATE);
    const pcm = new Int16Array(n);
    let i = 0, seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647 - 0.5;
    for (const [len, loud] of parts) {
      const m = Math.round(len * RATE);
      for (let k = 0; k < m; k++, i++) {
        const t = i / RATE;
        const v = loud
          ? (0.35 * Math.sin(2 * Math.PI * (180 + 40 * Math.sin(t * 3)) * t) + 0.15 * Math.sin(2 * Math.PI * 520 * t)) * (0.55 + 0.45 * Math.sin(2 * Math.PI * 4 * t)) + 0.02 * rnd()
          : 0.0004 * rnd();
        pcm[i] = Math.max(-1, Math.min(1, v)) * 32767;
      }
    }
    const buf = new ArrayBuffer(44 + n * 2), d = new DataView(buf);
    const w = (o, s) => { for (let k = 0; k < s.length; k++) d.setUint8(o + k, s.charCodeAt(k)); };
    w(0, 'RIFF'); d.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
    d.setUint32(24, RATE, true); d.setUint32(28, RATE * 2, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true);
    w(36, 'data'); d.setUint32(40, n * 2, true);
    new Uint8Array(buf, 44).set(new Uint8Array(pcm.buffer));
    return buf;
  }

  $('#sample').addEventListener('click', () => {
    const buf = makeSample(), bytes = new Uint8Array(buf);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    load('data:audio/wav;base64,' + btoa(bin), async () => buf.slice(0), 'sample', buf.byteLength);
  });

  function stop() { clearInterval(timer); timer = 0; video.pause(); playBtn.textContent = 'play'; }

  playBtn.addEventListener('click', () => {
    if (!video.src) return;
    if (!video.paused) { stop(); return; }
    if (!env) startLive();
    if (live && live.ctx.state === 'suspended') live.ctx.resume().catch(() => {});
    const p = video.play();
    if (p && p.catch) p.catch(() => { say('Could not play this file in this browser.'); stop(); });
  });

  video.addEventListener('play', () => { playBtn.textContent = 'pause'; clearInterval(timer); timer = setInterval(tick, 40); });
  video.addEventListener('pause', () => { playBtn.textContent = 'play'; clearInterval(timer); timer = 0; tick(); });
  video.addEventListener('ended', () => { video.playbackRate = 1; });
  video.addEventListener('loadedmetadata', () => { video.classList.toggle('audio', !video.videoWidth); showStat(); draw(); });
  video.addEventListener('error', () => { if (video.src) say('This browser cannot play that file.'); });
  video.addEventListener('timeupdate', () => { if (!timer) { nowEl.textContent = fmt(video.currentTime); draw(); } });

  function seek(e) {
    const dur = video.duration;
    if (!isFinite(dur)) return;
    const r = bar.getBoundingClientRect();
    video.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * dur;
    tick();
  }
  bar.addEventListener('pointerdown', e => { bar.setPointerCapture(e.pointerId); seek(e); });
  bar.addEventListener('pointermove', e => { if (e.buttons) seek(e); });

  function retune() {
    store.set('ssp.thr', +thr.value); store.set('ssp.gap', +gap.value);
    showKnobs(); findRanges(); showStat(); draw();
  }
  thr.addEventListener('input', retune);
  gap.addEventListener('input', retune);
  window.addEventListener('resize', draw);

  showKnobs();
})();
</script>
</body>
</html>
