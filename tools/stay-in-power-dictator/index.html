<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a computer game where you are an evil dictator keeping power</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.meters{display:grid;gap:10px}
.m{display:grid;grid-template-columns:84px 1fr 34px;gap:10px;align-items:center;font:16px/1.2 var(--mono)}
.bar{height:12px;border:1.5px solid var(--ink);border-radius:var(--radius);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s}
.m.warn .bar i{background:var(--no)}
.m.warn{color:var(--no)}
.card{border:1.5px solid var(--line);border-radius:var(--radius);padding:14px;min-height:96px}
.card b{display:block;font-weight:500;margin-bottom:4px}
.choices{display:grid;gap:10px}
.choices button{text-align:left;padding:10px 14px;height:auto;min-height:var(--tap)}
.stat{display:flex;justify-content:space-between;gap:12px}
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a computer game where you are an evil dictator keeping power</h1>
<main id="app" class="stack">
  <div class="stat meta"><span>day <span id="turn">1</span></span><span id="best"></span></div>
  <div class="meters" id="meters"></div>
  <div class="card" id="card"><b id="ctitle"></b><span id="ctext"></span></div>
  <div class="choices" id="choices">
    <button id="a" class="primary"></button>
    <button id="b"></button>
  </div>
  <div class="meta" id="log"></div>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const KEYS = ['army', 'people', 'treasury', 'court'];
  const LOW = {
    army: 'The army stopped taking orders. A colonel now holds your office.',
    people: 'The crowds reached the palace gates. Nobody came to stop them.',
    treasury: 'The treasury is empty. Nobody was paid, so nobody stayed.',
    court: 'Your own court voted. You were not invited to the count.'
  };
  const HIGH = {
    army: 'The generals grew strong enough to need no dictator. You are retired.',
    people: 'The people loved someone else more, and asked for elections.',
    treasury: 'Your wealth drew every plotter in the country. One of them succeeded.',
    court: 'Your court became a rival government. You are a figurehead.'
  };
  // effects are [army, people, treasury, court]
  const EVENTS = [
    ['Bread riots', 'Prices are up. Crowds fill the main square.', 'Open the granaries', [0,12,-14,0], 'Send the army', [10,-16,0,0]],
    ['Mine strike', 'The miners want pay that the mines cannot afford.', 'Grant the raise', [0,10,-14,0], 'Arrest the leaders', [6,-14,6,0]],
    ['Foreign loan', 'A neighbour offers gold with strings attached.', 'Take the loan', [0,0,18,-12], 'Refuse', [0,4,0,6]],
    ['Rumour of a coup', 'A general is seen dining with ministers.', 'Purge the general', [-12,0,0,10], 'Promote him', [10,0,-6,-10]],
    ['Parade day', 'The army asks for a show of strength.', 'Fund a grand parade', [12,6,-14,0], 'Cancel it', [-12,0,8,0]],
    ['Press leak', 'A newspaper printed your private accounts.', 'Shut the paper', [4,-12,0,6], 'Deny everything', [0,-4,0,-8]],
    ['Harvest failure', 'Half the grain is gone.', 'Import food', [0,10,-16,0], 'Ration and blame traitors', [6,-12,6,0]],
    ['Minister proposes reform', 'He says it will calm the people and weaken you.', 'Approve some of it', [0,12,-4,-12], 'Exile him', [0,-8,0,10]],
    ['Oil discovered', 'Surveyors found a field in the north.', 'Nationalise it', [0,0,16,-8], 'Sell rights to friends', [0,-4,6,14]],
    ['Student protest', 'Thousands of students are holding signs.', 'Close the universities', [6,-14,0,6], 'Meet their leaders', [0,10,0,-10]],
    ['Border skirmish', 'A neighbour is testing your soldiers.', 'Mobilise', [12,-6,-12,0], 'Pay them off', [-8,0,-10,0]],
    ['Palace banquet', 'The court expects to be fed and flattered.', 'Spend lavishly', [0,-6,-12,14], 'Serve bread', [0,2,6,-12]],
    ['Secret police request', 'They want more informers and a bigger budget.', 'Fund them', [8,-10,-10,4], 'Cut them back', [-4,6,6,-6]],
    ['Tax revolt', 'Merchants are refusing to pay.', 'Send collectors with soldiers', [6,-10,14,0], 'Forgive a year of taxes', [0,8,-14,6]],
    ['Fake election', 'Advisers suggest a vote you cannot lose.', 'Hold it', [0,-6,-6,10], 'Skip it', [0,2,0,-8]],
    ['Soldiers unpaid', 'Barracks are quiet in a bad way.', 'Pay them from reserves', [14,0,-14,0], 'Promise pay next month', [-14,0,0,4]],
    ['Exiled rival speaks', 'He broadcasts from abroad.', 'Jam the signal', [0,-6,-6,4], 'Offer him a pardon', [0,6,0,-12]],
    ['Statue unveiled', 'Your likeness, twelve metres tall.', 'Build it', [0,-4,-10,12], 'Melt it for coin', [0,0,10,-10]]
  ];

  let s;
  const clamp = n => Math.max(0, Math.min(100, n));
  const fresh = () => ({ turn: 1, m: { army: 50, people: 50, treasury: 50, court: 50 }, over: false, deck: [], cur: null, last: '' });
  const pick = () => {
    if (!s.deck.length) s.deck = EVENTS.map((_, i) => i).sort(() => Math.random() - 0.5);
    return s.deck.pop();
  };
  // first frame is a fixed, mid-game-looking example so the thumbnail shows play
  const start = () => { s = fresh(); s.cur = 0; s.m = { army: 58, people: 42, treasury: 36, court: 64 }; s.turn = 1; render(); };

  function render() {
    const mm = $('#meters');
    mm.innerHTML = KEYS.map(k => {
      const v = s.m[k], w = (v < 18 || v > 82) ? ' warn' : '';
      return '<div class="m' + w + '" id="m-' + k + '"><span>' + k + '</span><span class="bar"><i style="width:' + v + '%"></i></span><span>' + v + '</span></div>';
    }).join('');
    $('#turn').textContent = s.turn;
    const best = store.get('best', 0);
    $('#best').textContent = best ? 'longest reign ' + best + ' days' : '';
    const a = $('#a'), b = $('#b');
    if (s.over) {
      $('#ctitle').textContent = 'Overthrown after ' + (s.turn - 1) + ' days';
      $('#ctext').textContent = s.last;
      a.textContent = 'Rule again'; b.hidden = true;
      $('#log').textContent = '';
      return;
    }
    const e = EVENTS[s.cur];
    $('#ctitle').textContent = e[0];
    $('#ctext').textContent = e[1];
    a.textContent = e[2]; b.textContent = e[4]; b.hidden = false;
    $('#log').textContent = s.last;
  }

  function choose(i) {
    if (s.over) { s = fresh(); s.cur = pick(); render(); return; }
    const e = EVENTS[s.cur], fx = e[i ? 5 : 3];
    KEYS.forEach((k, j) => { s.m[k] = clamp(s.m[k] + fx[j]); });
    // each day the treasury leaks a little
    s.m.treasury = clamp(s.m.treasury - 1);
    s.last = KEYS.map((k, j) => fx[j] ? k + (fx[j] > 0 ? ' +' : ' ') + fx[j] : '').filter(Boolean).join(', ');
    const bad = KEYS.find(k => s.m[k] <= 0 || s.m[k] >= 100);
    if (bad) {
      s.over = true;
      s.last = s.m[bad] <= 0 ? LOW[bad] : HIGH[bad];
      if (s.turn > store.get('best', 0)) store.set('best', s.turn);
    }
    s.turn++;
    if (!s.over) s.cur = pick();
    render();
  }

  $('#a').addEventListener('click', () => choose(0));
  $('#b').addEventListener('click', () => choose(1));
  start();
})();
</script>
</body>
</html>
