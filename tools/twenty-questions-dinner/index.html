<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a 20 questions tool that helps you work out what you want to eat</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.q{font-size:28px;line-height:1.2;font-weight:500;margin:8px 0 4px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers button{font-size:19px}
.answers .wide{grid-column:1/-1;border-color:var(--line);color:var(--meta)}
.dish{font-size:34px;line-height:1.1;font-weight:500;margin:8px 0}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{border:1px solid var(--line);border-radius:var(--radius);padding:2px 8px;font:13px/1.4 var(--mono);color:var(--meta)}
[hidden]{display:none!important}
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a 20 questions tool that helps you work out what you want to eat</h1>
<main id="app" class="stack">
  <div class="bar"><i id="bar"></i></div>
  <section id="ask" class="stack">
    <div class="meta"><span id="step">1</span> of 20 &middot; <span id="left">0</span> dishes left</div>
    <div class="q" id="q"></div>
    <div class="answers">
      <button class="primary" id="yes">Yes</button>
      <button id="no">No</button>
      <button class="wide" id="skip">Don't care</button>
    </div>
  </section>
  <section id="done" class="stack" hidden>
    <div class="meta" id="lead">Tonight</div>
    <div class="dish" id="dish"></div>
    <div class="chips" id="chips"></div>
    <div class="row"><button class="primary" id="another">Something else</button><button id="restart">Start over</button></div>
  </section>
  <div class="row"><button id="back">Back</button></div>
  <p class="meta" id="msg" hidden></p>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  // tag -> question
  const Q = {
    H: 'Do you want something hot?',
    S: 'Do you want it spicy?',
    M: 'Do you want meat?',
    F: 'Fish or seafood?',
    V: 'Should it be vegetarian?',
    B: 'Something you can eat with your hands?',
    R: 'Rice on the plate?',
    N: 'Noodles or pasta?',
    O: 'Something soupy?',
    X: 'Fried is fine?',
    L: 'Keep it light?',
    Q: 'Ready in 20 minutes or less?',
    C: 'Cheesy or creamy?',
    Z: 'Something sweet?'
  };
  // name | tags
  const DISHES = `Pad thai|HNQXS
Ramen|HNOM
Pho|HNOM
Spaghetti carbonara|HNMCQ
Spaghetti with tomato sauce|HNVQ
Mac and cheese|HNVC
Lasagna|HNMC
Pesto pasta|HNVQ
Fried rice|HRQXM
Egg fried rice|HRQXV
Chicken curry with rice|HRMS
Chickpea curry|HRVS
Burrito|HBRMS
Quesadilla|HBCQ
Tacos|HBMS
Falafel wrap|BVX
Chicken shawarma|HBM
Cheeseburger|HBMXC
Veggie burger|HBVX
Margherita pizza|HBVC
Pepperoni pizza|HBMC
Grilled cheese sandwich|HBVCQX
Club sandwich|BMQ
Tuna sandwich|BFQ
Hot dog|HBMQ
Fish and chips|HFX
Sushi|RF
Poke bowl|RFL
Grilled salmon|HFL
Shrimp stir fry|HRFQS
Fish tacos|HBFX
Tomato soup|HOVL
Chicken noodle soup|HNOM
Lentil soup|HOVL
Miso soup with tofu|HOVLQ
Chili|HOMS
Caesar salad|MLQC
Greek salad|VLQC
Garden salad|VLQ
Poke-style tuna salad|FLQ
Cobb salad|MLC
Omelette|HVQC
Scrambled eggs on toast|HVQB
Pancakes|HVZ
French toast|HVZB
Waffles|HZVX
Oatmeal with fruit|HVLZ
Yogurt with granola|VLQZ
Fruit bowl|VLQZ
Ice cream|ZCQ
Chocolate cake|Z
Steak and potatoes|HM
Roast chicken|HML
Chicken nuggets|HMXQ
Fried chicken|HMX
Meatballs and pasta|HNM
Stir-fried beef with rice|HRMQ
Bibimbap|HRMS
Dumplings|HXM
Veggie stir fry|HRVLQ
Tofu scramble|HVLQ
Hummus plate with pita|VBLQ
Baked potato|HVC
Nachos|HVXCS
Cheese and crackers|VCQ
Bagel with cream cheese|VBCQ
Peanut butter toast|VBQ
Shakshuka|HVS
Tikka masala|HRMCS
Dal with rice|HRVS`.split('\n').map(l => { const [n, t] = l.split('|'); return { n, t }; });

  const MAX = 20;
  // history: [{tag, ans}] ans = 1 yes, 0 no, -1 skip
  let hist = store.get('tqd-hist', []);
  let pool = [], pick = 0;
  if (!Array.isArray(hist)) hist = [];

  const matches = () => DISHES.filter(d => hist.every(h => h.ans < 0 || (h.ans ? d.t.includes(h.tag) : !d.t.includes(h.tag))));

  // choose the tag that splits remaining dishes closest to half
  function nextTag(list) {
    const asked = new Set(hist.map(h => h.tag));
    let best = null, bestScore = 1;
    for (const tag of Object.keys(Q)) {
      if (asked.has(tag)) continue;
      const yes = list.filter(d => d.t.includes(tag)).length;
      if (yes === 0 || yes === list.length) continue;
      const score = Math.abs(yes / list.length - 0.5);
      if (score < bestScore) { bestScore = score; best = tag; }
    }
    return best;
  }

  function show(dish, list) {
    $('#ask').hidden = true; $('#done').hidden = false;
    $('#lead').textContent = list.length > 1 ? list.length + ' dishes fit. Start with' : 'You want';
    $('#dish').textContent = dish.n;
    $('#chips').innerHTML = '';
    hist.filter(h => h.ans > 0).forEach(h => {
      const s = document.createElement('span'); s.textContent = Q[h.tag].replace(/\?$/, '').toLowerCase(); $('#chips').appendChild(s);
    });
    $('#another').hidden = list.length < 2;
  }

  function render() {
    const msg = $('#msg'); msg.hidden = true;
    const list = matches();
    $('#bar').style.width = (hist.length / MAX * 100) + '%';
    $('#back').hidden = hist.length === 0 && $('#ask').hidden === false;
    $('#back').disabled = hist.length === 0;
    if (!list.length) {
      msg.textContent = 'Nothing fits all of that. Go back one answer.'; msg.hidden = false;
      $('#ask').hidden = true; $('#done').hidden = true; $('#back').hidden = false; $('#back').disabled = hist.length === 0;
      return;
    }
    const tag = hist.length >= MAX ? null : nextTag(list);
    if (list.length === 1 || !tag) {
      pool = list; pick = Math.min(pick, pool.length - 1);
      show(pool[pick], list); return;
    }
    $('#done').hidden = true; $('#ask').hidden = false;
    $('#step').textContent = hist.length + 1;
    $('#left').textContent = list.length;
    $('#q').textContent = Q[tag];
    $('#q').dataset.tag = tag;
  }

  function answer(ans) {
    const tag = $('#q').dataset.tag;
    if (!tag) return;
    hist.push({ tag, ans }); pick = 0;
    store.set('tqd-hist', hist); render();
  }

  $('#yes').addEventListener('click', () => answer(1));
  $('#no').addEventListener('click', () => answer(0));
  $('#skip').addEventListener('click', () => answer(-1));
  $('#back').addEventListener('click', () => { hist.pop(); pick = 0; store.set('tqd-hist', hist); render(); });
  $('#restart').addEventListener('click', () => { hist = []; pick = 0; store.set('tqd-hist', hist); render(); });
  $('#another').addEventListener('click', () => {
    const list = matches(); pick = (pick + 1) % list.length; pool = list; show(pool[pick], list);
  });

  // first frame: a restored run only if unfinished, else start fresh
  if (matches().length < 2 || !nextTag(matches())) { hist = []; }
  render();
})();
</script>
</body>
</html>
