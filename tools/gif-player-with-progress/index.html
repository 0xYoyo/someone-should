<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a progress bar for gifs so you know how long they run</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.stage{background:var(--line);border-radius:var(--radius);display:flex;justify-content:center;align-items:center;min-height:200px;padding:8px}
canvas{max-width:100%;max-height:50vh;width:100%;height:auto;object-fit:contain;image-rendering:auto}
canvas.px{image-rendering:pixelated}
.bar{position:relative;height:44px;border:1.5px solid var(--ink);border-radius:var(--radius);cursor:pointer;touch-action:none;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink)}
.between{justify-content:space-between}
#elapsed,#total,#frameinfo{font-size:16px}
.open{position:relative;display:flex;align-items:center;justify-content:center;min-height:var(--tap);border:1.5px solid var(--ink);border-radius:var(--radius);cursor:pointer;overflow:hidden}
.open input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:var(--tap)}
#msg{font-size:16px;min-height:1.4em;margin:0}
#prev,#next{min-width:var(--tap)}
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>

<body>
<h1 id="wish">someone should make a progress bar for gifs so you know how long they run</h1>
<main id="app" class="stack">
  <div class="stage"><canvas id="cv" width="32" height="24" aria-label="gif"></canvas></div>
  <div id="bar" class="bar" role="slider" tabindex="0" aria-label="progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill" class="fill"></div></div>
  <div class="row between meta"><span id="elapsed">0.00 s</span><span id="total">/ 0.00 s</span></div>
  <div class="row meta"><span id="frameinfo">frame 1 of 1</span></div>
  <div class="row">
    <button id="prev" aria-label="previous frame">&lt;</button>
    <button id="play" class="primary" aria-label="play or pause">pause</button>
    <button id="next" aria-label="next frame">&gt;</button>
    <button id="speed">1x</button>
  </div>
  <label class="open primary-like" for="file">open a gif<input id="file" type="file" accept="image/gif"></label>
  <p id="msg" class="meta" role="status"></p>
</main>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const msg = (t) => { $('#msg').textContent = t || ''; };
  let frames = [], total = 0, idx = 0, playing = true, speed = 1, lastT = 0, acc = 0, dragging = false;
  const speeds = [0.25, 0.5, 1, 2];

  // Decode a GIF into composited frames: {img: ImageData, delay: ms}
  function decode(buf) {
    const d = new Uint8Array(buf);
    let p = 0;
    const str = (n) => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(d[p++]); return s; };
    const u16 = () => { const v = d[p] | d[p + 1] << 8; p += 2; return v; };
    if (!/^GIF8[79]a$/.test(str(6))) throw new Error('not a gif');
    const W = u16(), H = u16(), flags = d[p++]; p += 2;
    let gct = null;
    if (flags & 0x80) { const n = 3 << ((flags & 7) + 1); gct = d.subarray(p, p + n); p += n; }
    const out = [];
    let gce = { delay: 10, disp: 0, trans: -1 };
    let canvas = new Uint8ClampedArray(W * H * 4);
    while (p < d.length) {
      const b = d[p++];
      if (b === 0x3b) break;
      if (b === 0x21) {
        const label = d[p++];
        if (label === 0xf9) {
          const f = d[p + 1];
          gce = { disp: (f >> 2) & 7, delay: (d[p + 2] | d[p + 3] << 8) * 10, trans: f & 1 ? d[p + 4] : -1 };
        }
        while (d[p]) p += d[p] + 1;
        p++;
      } else if (b === 0x2c) {
        const x0 = u16(), y0 = u16(), w = u16(), h = u16(), lf = d[p++];
        let ct = gct;
        if (lf & 0x80) { const n = 3 << ((lf & 7) + 1); ct = d.subarray(p, p + n); p += n; }
        const mcs = d[p++];
        const data = [];
        while (d[p]) { for (let i = 1; i <= d[p]; i++) data.push(d[p + i]); p += d[p] + 1; }
        p++;
        const idxs = lzw(mcs, data, w * h);
        const prev = gce.disp === 3 ? canvas.slice() : null;
        const rows = [];
        if (lf & 0x40) {
          for (const [s, st] of [[0, 8], [4, 8], [2, 4], [1, 2]]) for (let y = s; y < h; y += st) rows.push(y);
        } else for (let y = 0; y < h; y++) rows.push(y);
        for (let r = 0; r < h; r++) {
          const y = rows[r] + y0;
          for (let x = 0; x < w; x++) {
            const c = idxs[r * w + x];
            if (c === gce.trans || !ct || x + x0 >= W || y >= H) continue;
            const o = (y * W + x + x0) * 4;
            canvas[o] = ct[c * 3]; canvas[o + 1] = ct[c * 3 + 1]; canvas[o + 2] = ct[c * 3 + 2]; canvas[o + 3] = 255;
          }
        }
        out.push({ img: new ImageData(canvas.slice(), W, H), delay: gce.delay < 20 && gce.delay === 0 ? 100 : gce.delay });
        if (gce.disp === 2) {
          for (let y = y0; y < Math.min(H, y0 + h); y++) for (let x = x0; x < Math.min(W, x0 + w); x++) canvas.fill(0, (y * W + x) * 4, (y * W + x) * 4 + 4);
        } else if (prev) canvas = prev;
        gce = { delay: 10, disp: 0, trans: -1 };
      } else throw new Error('bad gif');
    }
    if (!out.length) throw new Error('no frames');
    return { W, H, out };
  }

  function lzw(mcs, data, n) {
    const clear = 1 << mcs, eoi = clear + 1;
    const out = new Uint8Array(n);
    let prefix = new Int32Array(4096), suffix = new Uint8Array(4096), lens = new Uint16Array(4096);
    for (let i = 0; i < clear; i++) { suffix[i] = i; lens[i] = 1; prefix[i] = -1; }
    let size = mcs + 1, next = eoi + 1, prev = -1, o = 0, bits = 0, nb = 0, di = 0;
    const tmp = new Uint8Array(4097);
    while (o < n) {
      while (nb < size && di < data.length) { bits |= data[di++] << nb; nb += 8; }
      if (nb < size) break;
      const code = bits & ((1 << size) - 1);
      bits >>= size; nb -= size;
      if (code === clear) { size = mcs + 1; next = eoi + 1; prev = -1; continue; }
      if (code === eoi) break;
      let cur = code;
      if (code >= next) { if (prev < 0) break; cur = prev; }
      let l = lens[cur], k = l, c = cur;
      while (k > 0) { tmp[--k] = suffix[c]; c = prefix[c]; }
      const first = tmp[0];
      let len = l;
      if (code >= next) { tmp[len++] = first; }
      for (let i = 0; i < len && o < n; i++) out[o++] = tmp[i];
      if (prev >= 0 && next < 4096) { prefix[next] = prev; suffix[next] = first; lens[next] = lens[prev] + 1; next++; if (next === (1 << size) && size < 12) size++; }
      prev = code;
    }
    return out;
  }

  function load(buf) {
    const g = decode(buf);
    frames = g.out; idx = 0; acc = 0;
    total = frames.reduce((s, f) => s + f.delay, 0);
    cv.width = g.W; cv.height = g.H;
    cv.className = g.W < 120 ? 'px' : '';
    $('#total').textContent = '/ ' + (total / 1000).toFixed(2) + ' s';
    draw();
  }

  function startOf(i) { let s = 0; for (let k = 0; k < i; k++) s += frames[k].delay; return s; }

  function draw() {
    ctx.putImageData(frames[idx].img, 0, 0);
    const t = startOf(idx) + acc;
    const pct = total ? Math.min(100, (t / total) * 100) : 0;
    $('#fill').style.width = pct + '%';
    $('#bar').setAttribute('aria-valuenow', Math.round(pct));
    $('#elapsed').textContent = (t / 1000).toFixed(2) + ' s';
    $('#frameinfo').textContent = 'frame ' + (idx + 1) + ' of ' + frames.length;
    $('#play').textContent = playing ? 'pause' : 'play';
  }

  function tick(now) {
    if (playing && !dragging && frames.length) {
      const dt = Math.min(now - lastT, 250) * speed;
      acc += dt;
      while (acc >= frames[idx].delay) {
        acc -= frames[idx].delay;
        idx = (idx + 1) % frames.length;
      }
      draw();
    }
    lastT = now;
    requestAnimationFrame(tick);
  }

  function seek(clientX) {
    const r = $('#bar').getBoundingClientRect();
    const t = Math.max(0, Math.min(0.9999, (clientX - r.left) / r.width)) * total;
    let s = 0, i = 0;
    while (i < frames.length - 1 && s + frames[i].delay <= t) { s += frames[i].delay; i++; }
    idx = i; acc = t - s; draw();
  }
  function step(n) {
    playing = false; acc = 0;
    idx = (idx + n + frames.length) % frames.length; draw();
  }

  bar.addEventListener('pointerdown', (e) => { dragging = true; try { bar.setPointerCapture(e.pointerId); } catch {} seek(e.clientX); });

  const up = () => { dragging = false; };

  $('#next').addEventListener('click', () => step(1));

    speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length];
    $('#speed').textContent = speed + 'x';

  $('#file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    msg('');
    f.arrayBuffer().then(load).catch(() => msg('That file is not a readable GIF.'));
