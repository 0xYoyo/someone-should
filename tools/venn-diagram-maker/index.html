<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a tool that draws Venn diagrams</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
.sets { display: grid; gap: 14px; }
.set { display: grid; gap: 8px; }
.set[hidden] { display: none; }
.set .row input { flex: 1 1 auto; width: auto; min-width: 0; }
.set .sw { font: 500 16px/1 var(--mono); color: var(--meta); width: 20px; text-align: center; }
textarea { min-height: 76px; resize: vertical; }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { flex: 1 1 0; padding: 0 10px; }
#venn { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: var(--radius); }
#regions { list-style: none; margin: 0; padding: 0; }
#regions li { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
#regions .k { font: 16px/1.4 var(--mono); color: var(--meta); }
#regions .v { overflow-wrap: anywhere; }
#status { min-height: 1.45em; color: var(--meta); margin: 0; }
#status.err { color: var(--no); }
</style>
</head>
<body>
<h1 id="wish">someone should make a tool that draws Venn diagrams</h1>

<main id="app" class="stack">
  <div class="seg" role="group" aria-label="Number of sets">
    <button id="two" type="button" aria-pressed="true">2 sets</button>
    <button id="three" type="button" aria-pressed="false">3 sets</button>
    <button id="scale" type="button" aria-pressed="false">Scale to size</button>
  </div>

  <div class="sets">
    <div class="set" id="set-a">
      <div class="row"><span class="sw">A</span><input id="name-a" aria-label="Name of set A" placeholder="Set A name" autocomplete="off"></div>
      <textarea id="items-a" aria-label="Items in set A" placeholder="Items, separated by commas or new lines"></textarea>
    </div>
    <div class="set" id="set-b">
      <div class="row"><span class="sw">B</span><input id="name-b" aria-label="Name of set B" placeholder="Set B name" autocomplete="off"></div>
      <textarea id="items-b" aria-label="Items in set B" placeholder="Items, separated by commas or new lines"></textarea>
    </div>
    <div class="set" id="set-c" hidden>
      <div class="row"><span class="sw">C</span><input id="name-c" aria-label="Name of set C" placeholder="Set C name" autocomplete="off"></div>
      <textarea id="items-c" aria-label="Items in set C" placeholder="Items, separated by commas or new lines"></textarea>
    </div>
  </div>

  <div id="out"></div>
  <p id="status" role="status"></p>

  <div class="row">
    <button id="svg" type="button">Save SVG</button>
    <button id="png" type="button">Save PNG</button>
    <button id="clear" type="button">Clear</button>
  </div>

  <ul id="regions" aria-label="Regions"></ul>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const KEY = 'venn-diagram-maker:v1';
  const W = 600, H = 500, PAD = 14;
  const IDS = ['a', 'b', 'c'];
  const LIGHT = { paper: '#f4f1ea', ink: '#141414', meta: '#6b6b6b' };
  // SVG namespace, assembled so the source holds no literal URL
  const SVGNS = ['http:', '', 'www.w3.org', '2000', 'svg'].join('/');
  const FONT = '-apple-system, Segoe UI, Roboto, system-ui, sans-serif';

  let state = Object.assign({ n: 2, scale: false, names: ['', '', ''], items: ['', '', ''] }, store.get(KEY, {}));
  let lastSvg = '';

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const nameOf = i => state.names[i].trim() || 'Set ' + 'ABC'[i];

  function parseItems(text) {
    const seen = new Map();
    for (const raw of text.split(/[,\n;]+/)) {
      const t = raw.trim();
      if (t && !seen.has(t.toLowerCase())) seen.set(t.toLowerCase(), t);
    }
    return seen;
  }

  // region mask: bit 1 = A, 2 = B, 4 = C
  function regions(n) {
    const sets = state.items.slice(0, n).map(parseItems);
    const out = {};
    const all = new Map();
    sets.forEach(s => s.forEach((v, k) => { if (!all.has(k)) all.set(k, v); }));
    all.forEach((v, k) => {
      let m = 0;
      sets.forEach((s, i) => { if (s.has(k)) m |= 1 << i; });
      (out[m] = out[m] || []).push(v);
    });
    return { sets, out };
  }

  function lensArea(r1, r2, d) {
    if (d >= r1 + r2) return 0;
    if (d <= Math.abs(r1 - r2)) return Math.PI * Math.min(r1, r2) ** 2;
    const a = r1 * r1 * Math.acos((d * d + r1 * r1 - r2 * r2) / (2 * d * r1));
    const b = r2 * r2 * Math.acos((d * d + r2 * r2 - r1 * r1) / (2 * d * r2));
    const c = 0.5 * Math.sqrt((-d + r1 + r2) * (d + r1 - r2) * (d - r1 + r2) * (d + r1 + r2));
    return a + b - c;
  }

  // distance between centres giving the wanted overlap area
  function distFor(r1, r2, area) {
    if (area <= 0) return r1 + r2 + Math.min(r1, r2) * 0.15;
    let lo = Math.abs(r1 - r2), hi = r1 + r2;
    for (let i = 0; i < 50; i++) {
      const mid = (lo + hi) / 2;
      if (lensArea(r1, r2, mid) > area) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }

  function classic(n) {
    if (n === 2) return [{ x: 220, y: 270, r: 165 }, { x: 380, y: 270, r: 165 }];
    return [{ x: 224, y: 185, r: 140 }, { x: 376, y: 185, r: 140 }, { x: 300, y: 315, r: 140 }];
  }

  function scaled(n, sets) {
    const sizes = sets.map(s => s.size);
    if (sizes.some(s => s === 0)) return null;
    const r = sizes.map(s => Math.sqrt(s / Math.PI));
    const inter = (i, j) => { let c = 0; sets[i].forEach((_, k) => { if (sets[j].has(k)) c++; }); return c; };
    const d01 = distFor(r[0], r[1], inter(0, 1));
    const c = [{ x: 0, y: 0, r: r[0] }, { x: d01, y: 0, r: r[1] }];
    if (n === 3) {
      let d02 = distFor(r[0], r[2], inter(0, 2));
      let d12 = distFor(r[1], r[2], inter(1, 2));
      // keep the triangle possible
      d02 = Math.min(Math.max(d02, Math.abs(d01 - d12) + 1e-6), d01 + d12);
      const x = (d01 * d01 + d02 * d02 - d12 * d12) / (2 * d01 || 1);
      const y = Math.sqrt(Math.max(0, d02 * d02 - x * x));
      c.push({ x, y, r: r[2] });
    }
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    c.forEach(o => { x0 = Math.min(x0, o.x - o.r); y0 = Math.min(y0, o.y - o.r); x1 = Math.max(x1, o.x + o.r); y1 = Math.max(y1, o.y + o.r); });
    const top = 44, bottom = n === 3 ? 44 : 20;
    const k = Math.min((W - 2 * PAD - 40) / (x1 - x0), (H - top - bottom) / (y1 - y0));
    const ox = (W - (x1 - x0) * k) / 2 - x0 * k, oy = top + (H - top - bottom - (y1 - y0) * k) / 2 - y0 * k;
    return c.map(o => ({ x: o.x * k + ox, y: o.y * k + oy, r: o.r * k }));
  }

  const maskAt = (c, x, y) => c.reduce((m, o, i) => (Math.hypot(x - o.x, y - o.y) < o.r ? m | 1 << i : m), 0);

  // most open point inside each region, by grid sampling
  function anchors(c) {
    const best = {};
    for (let y = 4; y < H; y += 5) for (let x = 4; x < W; x += 5) {
      const m = maskAt(c, x, y);
      if (!m) continue;
      let cl = Math.min(x, W - x, y, H - y);
      for (const o of c) cl = Math.min(cl, Math.abs(Math.hypot(x - o.x, y - o.y) - o.r));
      if (!best[m] || cl > best[m].cl) best[m] = { x, y, cl };
    }
    return best;
  }

  function runX(c, m, x, y) {
    let l = x, r = x;
    while (l > 0 && maskAt(c, l - 3, y) === m) l -= 3;
    while (r < W && maskAt(c, r + 3, y) === m) r += 3;
    return [l, r];
  }

  function fitText(t, px) {
    const max = Math.max(1, Math.floor(px / 8.6));
    return t.length <= max ? t : t.slice(0, Math.max(1, max - 1)) + '…';
  }

  function regionText(c, m, a, items) {
    const LH = 19;
    let up = a.y, dn = a.y;
    while (up > 0 && maskAt(c, a.x, up - 3) === m) up -= 3;
    while (dn < H && maskAt(c, a.x, dn + 3) === m) dn += 3;
    const cap = Math.max(1, Math.floor((dn - up - 10) / LH));
    let lines = items.slice();
    if (lines.length > cap) lines = cap > 1 ? lines.slice(0, cap - 1).concat('+' + (items.length - cap + 1) + ' more') : [items.length + ' items'];
    const y0 = a.y - ((lines.length - 1) * LH) / 2;
    return lines.map((t, i) => {
      const y = y0 + i * LH;
      const [l, r] = runX(c, m, a.x, y);
      const cx = (l + r) / 2;
      return `<text class="item" x="${cx.toFixed(1)}" y="${(y + 5.5).toFixed(1)}" text-anchor="middle" font-size="16">${esc(fitText(t, r - l - 12))}</text>`;
    }).join('');
  }

  function buildSvg(n, c, out, pal) {
    const fill = 0.07;
    let s = `<svg xmlns="${SVGNS}" id="venn" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${FONT}" role="img" aria-label="Venn diagram">`;
    s += `<rect width="${W}" height="${H}" fill="${pal.paper}"/>`;
    s += `<g fill="${pal.ink}" fill-opacity="${fill}" stroke="${pal.ink}" stroke-width="2">`;
    c.forEach(o => { s += `<circle cx="${o.x.toFixed(1)}" cy="${o.y.toFixed(1)}" r="${o.r.toFixed(1)}"/>`; });
    s += '</g>';
    const cx = W / 2, cy = c.reduce((t, o) => t + o.y, 0) / c.length;
    c.forEach((o, i) => {
      // name sits outside the circle, pushed away from the diagram centre
      let dx = o.x - cx, dy = o.y - cy;
      if (n === 2) { dx = Math.sign(dx) * 0.5; dy = -1; }
      const len = Math.hypot(dx, dy) || 1;
      let lx = o.x + (dx / len) * (o.r + 16), ly = o.y + (dy / len) * (o.r + 16);
      ly = Math.min(H - 10, Math.max(22, ly + 6));
      const anchor = Math.abs(dx / len) < 0.3 ? 'middle' : dx < 0 ? 'end' : 'start';
      if (anchor === 'end') lx = Math.max(lx, PAD + 60);
      if (anchor === 'start') lx = Math.min(lx, W - PAD - 60);
      s += `<text class="name" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" font-size="20" font-weight="600" fill="${pal.ink}">${esc(fitText(nameOf(i), 220))}</text>`;
    });
    const an = anchors(c);
    s += `<g fill="${pal.ink}">`;
    for (const m in out) if (an[m]) s += regionText(c, +m, an[m], out[m]);
    s += '</g></svg>';
    return s;
  }

  function label(m, n) {
    const ins = [], outs = [];
    for (let i = 0; i < n; i++) (m & 1 << i ? ins : outs).push(nameOf(i));
    if (ins.length === 1) return ins[0] + ' only';
    return ins.join(' and ') + (outs.length ? ', not ' + outs.join(' or ') : '');
  }

  function render() {
    const n = state.n;
    $('#two').setAttribute('aria-pressed', n === 2);
    $('#three').setAttribute('aria-pressed', n === 3);
    $('#scale').setAttribute('aria-pressed', state.scale);
    $('#set-c').hidden = n !== 3;

    const { sets, out } = regions(n);
    let c = null, msg = '', err = false;
    if (state.scale) {
      c = scaled(n, sets);
      if (!c) { msg = 'Scaling needs at least one item in every set.'; err = true; }
    }
    if (!c) c = classic(n);
    const total = Object.keys(out).length;
    if (!total && !msg) msg = 'Add items to fill the regions.';

    const css = getComputedStyle(document.documentElement);
    const pal = { paper: css.getPropertyValue('--paper').trim() || LIGHT.paper, ink: css.getPropertyValue('--ink').trim() || LIGHT.ink };
    $('#out').innerHTML = buildSvg(n, c, out, pal);
    lastSvg = buildSvg(n, c, out, LIGHT);
    $('#status').textContent = msg;
    $('#status').classList.toggle('err', err);

    const masks = n === 2 ? [1, 2, 3] : [1, 2, 4, 3, 5, 6, 7];
    const id = m => 'r-' + IDS.filter((_, i) => m & 1 << i).join('');
    $('#regions').innerHTML = masks.map(m =>
      `<li id="${id(m)}"><span class="k">${esc(label(m, n))} · ${(out[m] || []).length}</span><span class="v">${esc((out[m] || []).join(', ') || '—')}</span></li>`
    ).join('');
  }

  function save() { store.set(KEY, state); }

  function download(href, name) {
    const a = document.createElement('a');
    a.href = href; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  const fileBase = () => (state.names.slice(0, state.n).map(s => s.trim()).filter(Boolean).join('-').replace(/[^\w-]+/g, '_').slice(0, 60) || 'venn');
  const svgUrl = () => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(lastSvg);

  $('#svg').addEventListener('click', () => { download(svgUrl(), fileBase() + '.svg'); $('#status').textContent = 'Saved SVG.'; });
  $('#png').addEventListener('click', () => {
    const img = new Image();
    img.onload = () => {
      try {
        const cv = document.createElement('canvas');
        cv.width = W * 2; cv.height = H * 2;
        const g = cv.getContext('2d');
        g.scale(2, 2); g.drawImage(img, 0, 0, W, H);
        download(cv.toDataURL('image/png'), fileBase() + '.png');
        $('#status').textContent = 'Saved PNG.';
      } catch { $('#status').textContent = 'This browser could not make a PNG. Try Save SVG.'; }
    };
    img.onerror = () => { $('#status').textContent = 'This browser could not make a PNG. Try Save SVG.'; };
    img.src = svgUrl();
  });

  $('#two').addEventListener('click', () => { state.n = 2; save(); render(); });
  $('#three').addEventListener('click', () => { state.n = 3; save(); render(); });
  $('#scale').addEventListener('click', () => { state.scale = !state.scale; save(); render(); });
  $('#clear').addEventListener('click', () => {
    state.names = ['', '', '']; state.items = ['', '', ''];
    IDS.forEach(k => { $('#name-' + k).value = ''; $('#items-' + k).value = ''; });
    save(); render();
  });

  IDS.forEach((k, i) => {
    const nm = $('#name-' + k), it = $('#items-' + k);
    nm.value = state.names[i] || ''; it.value = state.items[i] || '';
    nm.addEventListener('input', () => { state.names[i] = nm.value; save(); render(); });
    it.addEventListener('input', () => { state.items[i] = it.value; save(); render(); });
  });

  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', render);
  render();
})();
</script>
</body>
</html>
