<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a running app that plays your playlist only when you move above a set speed</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
.state { font: 500 22px/1.2 var(--mono); }
.state.on { color: var(--built); }
.state.off { color: var(--no); }
label { display: grid; gap: 6px; }
.file { display: flex; align-items: center; min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.file input { position: absolute; opacity: 0; width: 1px; height: 1px; min-height: 0; padding: 0; }
.file:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; position: relative; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 4px; width: 0; }
.bar b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--no); }
.line { min-height: 24px; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a running app that plays your playlist only when you move above a set speed</h1>

<main id="app" class="stack">
  <div class="row"><div class="big"><span id="speed">0.0</span> <span class="meta">km/h</span></div></div>
  <div class="bar" aria-hidden="true"><i id="fill"></i><b id="mark"></b></div>
  <div id="state" class="state off">paused</div>
  <div class="row">
    <button id="start" class="primary" type="button">start</button>
    <label class="file"><span id="filelabel">my music</span><input id="files" type="file" accept="audio/*" multiple></label>
  </div>
  <label>play above (km/h) <span class="meta" id="pace"></span>
    <input id="min" type="number" inputmode="decimal" min="1" max="30" step="0.5" value="6">
  </label>
  <label>test speed (km/h, empty uses GPS)
    <input id="sim" type="number" inputmode="decimal" min="0" max="40" step="0.5" placeholder="GPS">
  </label>
  <div id="msg" class="meta line">built-in beat plays until you add music</div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const GRACE = 1200;           // ms below the limit before pausing (GPS is noisy)
  let running = false, speed = 0, belowSince = 0, playing = false;
  let ctx = null, beatTimer = 0, nextBeat = 0;
  let tracks = [], idx = 0, audio = null;
  let watchId = null, last = null;

  const min = $('#min');
  min.value = store.get('min', 6);

  function limit() { const v = parseFloat(min.value); return v > 0 ? v : 6; }
  function say(t) { $('#msg').textContent = t; }

  // ---- sound: user files if any, else a built-in kick beat ----
  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.8, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.22);
  }
  function schedule() {
    while (nextBeat < ctx.currentTime + 0.3) { kick(nextBeat); nextBeat += 60 / 165; }
  }
  function sound(on) {
    if (tracks.length) {
      if (!audio) return;
      if (on) audio.play().catch(() => say('tap start again to allow sound')); else audio.pause();
      return;
    }
    if (!ctx) return;
    clearInterval(beatTimer);
    if (on) { nextBeat = ctx.currentTime + 0.05; beatTimer = setInterval(schedule, 100); }
  }
  function loadTrack(i) {
    idx = (i + tracks.length) % tracks.length;
    audio.src = tracks[idx].url;
    $('#filelabel').textContent = tracks[idx].name;
  }
  function readFile(f) {
    return new Promise(res => {
      const r = new FileReader();
      r.onload = () => res({ name: f.name.replace(/\.[^.]+$/, ''), url: r.result });
      r.onerror = () => res(null);
      r.readAsDataURL(f);
    });
  }
  $('#files').addEventListener('change', async e => {
    const list = [...e.target.files].filter(f => f.type.indexOf('audio') === 0);
    if (!list.length) { say('no audio files in that pick'); return; }
    say('loading ' + list.length + ' file' + (list.length > 1 ? 's' : '') + '...');
    const got = (await Promise.all(list.map(readFile))).filter(Boolean);
    if (!got.length) { say('could not read those files'); return; }
    sound(false);
    tracks = got;
    if (!audio) {
      audio = new Audio();
      audio.addEventListener('ended', () => { loadTrack(idx + 1); if (playing) audio.play().catch(() => {}); });
    }
    loadTrack(0);
    say(tracks.length + ' track' + (tracks.length > 1 ? 's' : '') + ' ready');
    sound(playing);
  });

  // ---- decide ----
  function setPlaying(on) {
    if (on === playing) return;
    playing = on;
    sound(on);
    render();
  }
  function tick() {
    const now = Date.now();
    const lim = limit();
    if (!running) return;
    if (speed >= lim) { belowSince = 0; setPlaying(true); }
    else {
      if (!belowSince) belowSince = now;
      if (playing && now - belowSince >= GRACE) setPlaying(false);
    }
  }
  function render() {
    const lim = limit();
    $('#speed').textContent = speed.toFixed(1);
    const s = $('#state');
    s.textContent = !running ? 'tap start' : playing ? 'playing' : 'paused';
    s.className = 'state ' + (playing ? 'on' : 'off');
    const top = Math.max(lim * 2, 12);
    $('#fill').style.width = Math.min(100, speed / top * 100) + '%';
    $('#mark').style.left = Math.min(100, lim / top * 100) + '%';
    const pace = 60 / lim, m = Math.floor(pace), sec = Math.round((pace - m) * 60);
    $('#pace').textContent = '= ' + m + ':' + String(sec === 60 ? 59 : sec).padStart(2, '0') + ' min/km';
  }

  // ---- speed: manual test value, else GPS ----
  function setSpeed(v) { speed = Math.max(0, v); render(); tick(); }
  function simValue() { const v = parseFloat($('#sim').value); return isNaN(v) ? null : v; }
  function onPos(p) {
    if (simValue() !== null) return;
    let ms = p.coords.speed;
    if ((ms == null || isNaN(ms)) && last) {
      const dt = (p.timestamp - last.timestamp) / 1000;
      const dx = dist(last.coords, p.coords);
      ms = dt > 0 ? dx / dt : 0;
    }
    last = p;
    setSpeed((ms || 0) * 3.6);
  }
  function dist(a, b) {
    const R = 6371000, r = Math.PI / 180;
    const x = (b.longitude - a.longitude) * r * Math.cos((a.latitude + b.latitude) / 2 * r);
    const y = (b.latitude - a.latitude) * r;
    return Math.sqrt(x * x + y * y) * R;
  }
  function startGps() {
    if (!('geolocation' in navigator)) { say('no GPS here. type a test speed instead'); return; }
    if (watchId !== null) return;
    say('waiting for GPS...');
    watchId = navigator.geolocation.watchPosition(
      p => { if (simValue() === null) say('GPS on'); onPos(p); },
      err => { say(err.code === 1 ? 'location denied. allow it, or type a test speed' : 'no GPS signal'); },
      { enableHighAccuracy: true, maximumAge: 1000 });
  }

  // ---- controls ----
  $('#start').addEventListener('click', () => {
    if (running) {
      running = false; belowSince = 0; setPlaying(false);
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      $('#start').textContent = 'start';
      render(); return;
    }
    running = true;
    $('#start').textContent = 'stop';
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch { say('no sound available here'); }
    const v = simValue();
    if (v !== null) setSpeed(v); else startGps();
    render(); tick();
  });
  $('#sim').addEventListener('input', () => {
    const v = simValue();
    if (v !== null) setSpeed(v);
  });
  min.addEventListener('input', () => { store.set('min', limit()); render(); tick(); });

  setInterval(tick, 250);
  render();
})();
</script>
</body>
</html>
