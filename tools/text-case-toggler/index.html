<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a tool where highlighting text and pressing caps lock switches its case</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

textarea { min-height: 160px; resize: vertical; }
.row button { flex: 1 1 auto; }
#out { white-space: pre-wrap; word-break: break-word; border-top: 1px solid var(--line); padding-top: 12px; min-height: var(--tap); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a tool where highlighting text and pressing caps lock switches its case</h1>
<main id="app" class="stack">
<textarea id="text" aria-label="text" spellcheck="false">the quick brown fox jumps over the lazy dog. select a part, then press Caps Lock or a button.</textarea>
<div class="row">
<button id="upper" class="primary">UPPER</button>
<button id="lower">lower</button>
<button id="title">Title</button>
<button id="invert">iNVERT</button>
</div>
<div class="row">
<button id="copy">Copy</button>
<button id="undo">Undo</button>
<span id="msg" class="meta" aria-live="polite">Caps Lock cycles the selection</span>
</div>
<div id="out" aria-label="result"></div>
</main>
<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const ta = $('#text'), out = $('#out'), msg = $('#msg');
  const history = [];
  let cycle = 0;

  const fns = {
    upper: (s) => s.toUpperCase(),
    lower: (s) => s.toLowerCase(),
    title: (s) => s.toLowerCase().replace(/(^|[^\p{L}\p{N}'])(\p{L})/gu, (m, a, b) => a + b.toUpperCase()),
    invert: (s) => [...s].map((c) => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join('')
  };

  function show() { out.textContent = ta.value; }

  function apply(name) {
    let a = ta.selectionStart, b = ta.selectionEnd;
    if (a === b) { a = 0; b = ta.value.length; } // no selection: whole text
    history.push([ta.value, a, b]);
    if (history.length > 50) history.shift();
    const v = ta.value;
    ta.value = v.slice(0, a) + fns[name](v.slice(a, b)) + v.slice(b);
    ta.setSelectionRange(a, b);
    show();
  }

  Object.keys(fns).forEach((n) => $('#' + n).addEventListener('click', () => apply(n)));

  // Caps Lock cycles upper, lower, title on the selection while the text box has focus
  ta.addEventListener('keydown', (e) => {
    if (e.key !== 'CapsLock') return;
    apply(['upper', 'lower', 'title'][cycle++ % 3]);
  });

  ta.addEventListener('input', show);

  $('#undo').addEventListener('click', () => {
    const h = history.pop();
    if (!h) { msg.textContent = 'Nothing to undo'; return; }
    ta.value = h[0]; ta.setSelectionRange(h[1], h[2]); show();
  });

  $('#copy').addEventListener('click', async () => {
    const s = ta.selectionStart === ta.selectionEnd ? ta.value : ta.value.slice(ta.selectionStart, ta.selectionEnd);
    try { await navigator.clipboard.writeText(s); msg.textContent = 'Copied'; }
    catch { ta.focus(); ta.select(); msg.textContent = 'Press copy on the selected text'; }
  });

  show();
})();
</script>
</body>
</html>
