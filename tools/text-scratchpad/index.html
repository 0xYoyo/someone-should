<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a site that is just a text scratchpad</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
body { display: flex; flex-direction: column; height: 100dvh; }
h1 { margin-bottom: 12px; }
#app { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
#pad { flex: 1; min-height: 240px; width: 100%; resize: none; border: none; padding: 0; font: 18px/1.55 var(--sans); background: transparent; }
#pad:focus { outline: none; }
.bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 10px; }
.bar .info { font: 16px/1.3 var(--mono); color: var(--meta); font-variant-numeric: tabular-nums; }
.bar .acts { display: flex; gap: 8px; }
.bar button { padding: 0 14px; }
</style>
</head>
<body>
<h1 id="wish">someone should make a site that is just a text scratchpad</h1>

<main id="app">
  <textarea id="pad" aria-label="scratchpad" placeholder="Type anything. It stays on this device." spellcheck="true" autofocus></textarea>
  <div class="bar">
    <div class="info"><span id="count">0 words</span> <span id="status"></span></div>
    <div class="acts">
      <button id="copy" type="button">copy</button>
      <button id="clear" type="button">clear</button>
    </div>
  </div>
</main>

<script>
(() => {
  'use strict';
  const KEY = 'text-scratchpad:v1';
  let storageOk = true;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { storageOk = false; return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { storageOk = false; return false; } }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const pad = $('#pad'), count = $('#count'), status = $('#status');
  const copyBtn = $('#copy'), clearBtn = $('#clear');
  let saveTimer = 0, statusTimer = 0, clearArmed = 0;

  function say(msg, keep) {
    status.textContent = msg ? '\u00b7 ' + msg : '';
    clearTimeout(statusTimer);
    if (!keep) statusTimer = setTimeout(() => { status.textContent = ''; }, 1800);
  }

  function updateCount() {
    const t = pad.value.trim();
    const n = t ? t.split(/\s+/).length : 0;
    count.textContent = n + (n === 1 ? ' word' : ' words');
  }

  function save() {
    clearTimeout(saveTimer);
    if (store.set(KEY, pad.value)) say('saved');
    else say('not saved: storage off', true);
  }

  pad.value = store.get(KEY, '');
  updateCount();
  if (!storageOk) say('not saved: storage off', true);

  pad.addEventListener('input', () => {
    updateCount();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 250);
  });
  addEventListener('pagehide', save);

  // keep two open tabs in step
  addEventListener('storage', e => {
    if (e.key !== KEY || document.activeElement === pad) return;
    try { pad.value = e.newValue == null ? '' : JSON.parse(e.newValue); } catch {}
    updateCount();
  });

  copyBtn.addEventListener('click', async () => {
    if (!pad.value) { say('nothing to copy'); return; }
    try {
      await navigator.clipboard.writeText(pad.value);
      say('copied');
    } catch {
      pad.select();
      say('selected, copy it');
    }
  });

  // two taps to clear, so a stray tap never wipes the page
  clearBtn.addEventListener('click', () => {
    if (!pad.value) { say('already empty'); return; }
    if (!clearArmed) {
      clearBtn.textContent = 'sure?';
      clearArmed = setTimeout(() => { clearArmed = 0; clearBtn.textContent = 'clear'; }, 2500);
      return;
    }
    clearTimeout(clearArmed); clearArmed = 0;
    clearBtn.textContent = 'clear';
    pad.value = '';
    updateCount();
    save();
    say('cleared');
    pad.focus();
  });
})();
</script>
</body>
</html>
