<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a simulator of plate tectonics</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


/* ---- tool styles below ---- */
h1 { font-size: 16px; }
.meta { font-size: 16px; }
#world { display: block; width: 100%; height: auto; image-rendering: pixelated; border: 1.5px solid var(--line); border-radius: var(--radius); touch-action: none; cursor: crosshair; background: #0b2a4a; }
.stats { display: flex; gap: 6px 18px; flex-wrap: wrap; font: 16px/1.4 var(--mono); }
.stats span { font-variant-numeric: tabular-nums; }
.controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.controls button { padding: 0 8px; }
#status { min-height: 1.4em; }

</style>
</head>
<body>
<h1 id="wish">someone should make a simulator of plate tectonics</h1>

<main id="app" class="stack">
  <canvas id="world" width="120" height="72" aria-label="World map"></canvas>
  <div class="stats">
    <span id="age">0 Myr</span><span id="land">0% land</span><span id="peaks">0% mountains</span><span id="nplates">0 plates</span>
  </div>
  <div class="controls">
    <button id="play" class="primary">Play</button>
    <button id="step">+10 Myr</button>
    <button id="speed">Speed 1x</button>
    <button id="view">Plates</button>
    <button id="new">New world</button>
    <button id="more">7 plates</button>
  </div>
  <p id="status" class="meta">Drag on a plate to push it in a new direction.</p>
</main>

<script>
(() => {
  'use strict';
  // storage helper — never throws
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];


  const W = 120, H = 72, N = W * H;
  const SPEEDS = [1, 4, 12];
  const PLATE_COUNTS = [4, 7, 12];
  const canvas = $('#world'), ctx = canvas.getContext('2d');
  const img = ctx.createImageData(W, H);
  const settings = Object.assign({ speed: 0, view: 'terrain', count: 1 }, store.get('pts-settings', {}));

  let plate = new Int16Array(N), elev = new Float32Array(N);
  let nextPlate = new Int16Array(N), nextElev = new Float32Array(N);
  let plates = [], age = 0, running = false, dirty = true;

  const wrapX = x => (x % W + W) % W;
  const wrapY = y => (y % H + H) % H;
  const idx = (x, y) => wrapY(y) * W + wrapX(x);
  const rand = (a, b) => a + Math.random() * (b - a);

  function randomVelocity() {
    const a = Math.random() * Math.PI * 2, s = rand(0.04, 0.12);
    return [Math.cos(a) * s, Math.sin(a) * s];
  }

  // Smooth value noise for coastlines
  function noiseField(cell) {
    const gw = Math.ceil(W / cell), gh = Math.ceil(H / cell);
    const g = Array.from({ length: gw * gh }, () => Math.random());
    const at = (x, y) => g[((y % gh + gh) % gh) * gw + ((x % gw + gw) % gw)];
    const f = new Float32Array(N);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const fx = x / cell, fy = y / cell, x0 = Math.floor(fx), y0 = Math.floor(fy);
      const tx = fx - x0, ty = fy - y0, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
      const a = at(x0, y0) + (at(x0 + 1, y0) - at(x0, y0)) * sx;
      const b = at(x0, y0 + 1) + (at(x0 + 1, y0 + 1) - at(x0, y0 + 1)) * sx;
      f[y * W + x] = a + (b - a) * sy;
    }
    return f;
  }

  function newWorld() {
    const count = PLATE_COUNTS[settings.count];
    plates = [];
    for (let p = 0; p < count; p++) {
      const [vx, vy] = randomVelocity();
      plates.push({ cx: Math.random() * W, cy: Math.random() * H, vx, vy, ax: 0, ay: 0,
        hue: Math.round(p * 360 / count + rand(-10, 10)), size: 0 });
    }
    const n1 = noiseField(12), n2 = noiseField(5);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let best = 0, bd = Infinity;
      for (let p = 0; p < count; p++) {
        let dx = Math.abs(x - plates[p].cx), dy = Math.abs(y - plates[p].cy);
        dx = Math.min(dx, W - dx); dy = Math.min(dy, H - dy);
        const d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = p; }
      }
      const i = y * W + x, h = n1[i] * 0.75 + n2[i] * 0.25;
      plate[i] = best;
      elev[i] = h > 0.56 ? 0.05 + (h - 0.56) * 1.2 : -0.25 - (0.56 - h) * 1.4;
    }
    age = 0; dirty = true; updateStats();
  }

  // One million years
  function tick() {
    const shifts = plates.map(p => {
      p.ax += p.vx; p.ay += p.vy;
      const dx = Math.trunc(p.ax), dy = Math.trunc(p.ay);
      p.ax -= dx; p.ay -= dy;
      p.cx = (p.cx + dx + W) % W; p.cy = (p.cy + dy + H) % H;
      return [dx, dy];
    });
    nextPlate.fill(-1); nextElev.fill(0);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, p = plate[i], [dx, dy] = shifts[p];
      const j = dx || dy ? idx(x + dx, y + dy) : i;
      const e = elev[i];
      if (nextPlate[j] === -1) { nextPlate[j] = p; nextElev[j] = e; continue; }
      if (nextPlate[j] === p) { nextElev[j] = Math.max(nextElev[j], e); continue; }
      // Collision: the more buoyant crust stays on top
      const top = nextElev[j] >= e ? nextElev[j] : e;
      const under = nextElev[j] >= e ? e : nextElev[j];
      const owner = nextElev[j] >= e ? nextPlate[j] : p;
      const lift = under > 0 ? 0.04 + under * 0.5 : 0.025;
      nextPlate[j] = owner; nextElev[j] = Math.min(top + lift, 1.6);
    }
    for (let i = 0; i < N; i++) {
      if (nextPlate[i] === -1) { nextPlate[i] = plate[i]; nextElev[i] = -0.35; } // rift: new ocean floor
    }
    [plate, nextPlate] = [nextPlate, plate];
    [elev, nextElev] = [nextElev, elev];
    // Erosion and ocean floor cooling
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, e = elev[i];
      if (e > 0) {
        const avg = (elev[idx(x + 1, y)] + elev[idx(x - 1, y)] + elev[idx(x, y + 1)] + elev[idx(x, y - 1)]) / 4;
        if (avg < e) nextElev[i] = e + (avg - e) * 0.015 - 0.0004 * e;
        else nextElev[i] = e;
      } else nextElev[i] = Math.max(-1, e - 0.004);
    }
    [elev, nextElev] = [nextElev, elev];
    age++; dirty = true;
  }

  function terrainColor(e) {
    if (e < 0) {
      const t = Math.min(1, -e);
      return [Math.round(40 - 30 * t), Math.round(120 - 80 * t), Math.round(190 - 100 * t)];
    }
    if (e < 0.25) { const t = e / 0.25; return [Math.round(70 + 60 * t), Math.round(140 - 10 * t), Math.round(70 - 10 * t)]; }
    if (e < 0.8) { const t = (e - 0.25) / 0.55; return [Math.round(130 + 30 * t), Math.round(130 - 30 * t), Math.round(60 + 10 * t)]; }
    const t = Math.min(1, (e - 0.8) / 0.6);
    return [Math.round(160 + 90 * t), Math.round(100 + 150 * t), Math.round(70 + 180 * t)];
  }

  function hslRgb(h, s, l) {
    const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return [f(0) * 255, f(8) * 255, f(4) * 255];
  }

  function render() {
    const d = img.data, platesView = settings.view === 'plates';
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, e = elev[i];
      let c;
      if (platesView) {
        const p = plate[i];
        const edge = plate[idx(x + 1, y)] !== p || plate[idx(x, y + 1)] !== p;
        c = edge ? [20, 20, 20] : hslRgb(plates[p].hue, 0.45, e > 0 ? 0.62 : 0.42);
      } else c = terrainColor(e);
      d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    if (platesView) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      for (const p of plates) {
        const ex = p.cx + p.vx * 60, ey = p.cy + p.vy * 60;
        ctx.beginPath(); ctx.moveTo(p.cx, p.cy); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.fillRect(ex - 1, ey - 1, 2, 2);
      }
    }
    dirty = false;
  }

  function updateStats() {
    let land = 0, high = 0;
    const live = new Set();
    for (let i = 0; i < N; i++) { if (elev[i] > 0) land++; if (elev[i] > 0.8) high++; live.add(plate[i]); }
    $('#age').textContent = age + ' Myr';
    $('#land').textContent = Math.round(land / N * 100) + '% land';
    $('#peaks').textContent = Math.round(high / N * 100) + '% mountains';
    $('#nplates').textContent = live.size + (live.size === 1 ? ' plate' : ' plates');
  }

  let frames = 0;
  function loop() {
    if (running) {
      for (let k = 0; k < SPEEDS[settings.speed]; k++) tick();
      if (++frames % 6 === 0) updateStats();
      requestAnimationFrame(loop);
    }
    if (dirty) render();
  }

  function setRunning(on) {
    running = on;
    $('#play').textContent = on ? 'Pause' : 'Play';
    if (on) requestAnimationFrame(loop); else { updateStats(); if (dirty) render(); }
  }

  function syncLabels() {
    $('#speed').textContent = 'Speed ' + SPEEDS[settings.speed] + 'x';
    $('#view').textContent = settings.view === 'plates' ? 'Terrain' : 'Plates';
    $('#more').textContent = PLATE_COUNTS[settings.count] + ' plates';
    store.set('pts-settings', settings);
  }

  $('#play').addEventListener('click', () => setRunning(!running));
  $('#step').addEventListener('click', () => { for (let k = 0; k < 10; k++) tick(); updateStats(); render(); });
  $('#speed').addEventListener('click', () => { settings.speed = (settings.speed + 1) % SPEEDS.length; syncLabels(); });
  $('#view').addEventListener('click', () => { settings.view = settings.view === 'plates' ? 'terrain' : 'plates'; syncLabels(); render(); });
  $('#new').addEventListener('click', () => { newWorld(); render(); $('#status').textContent = 'New world.'; });
  $('#more').addEventListener('click', () => { settings.count = (settings.count + 1) % PLATE_COUNTS.length; syncLabels(); newWorld(); render(); });

  // Drag on a plate to set its direction and speed
  let drag = null;
  const toCell = ev => {
    const r = canvas.getBoundingClientRect();
    return [(ev.clientX - r.left) / r.width * W, (ev.clientY - r.top) / r.height * H];
  };
  canvas.addEventListener('pointerdown', ev => {
    const [x, y] = toCell(ev);
    drag = { x, y, p: plate[idx(Math.floor(x), Math.floor(y))] };
    canvas.setPointerCapture(ev.pointerId);
  });
  canvas.addEventListener('pointerup', ev => {
    if (!drag) return;
    const [x, y] = toCell(ev), dx = x - drag.x, dy = y - drag.y, len = Math.hypot(dx, dy);
    const p = plates[drag.p];
    drag = null;
    if (len < 2) { $('#status').textContent = 'Drag further to push a plate.'; return; }
    const s = Math.min(0.25, len / 120);
    p.vx = dx / len * s; p.vy = dy / len * s;
    $('#status').textContent = 'Plate pushed. ' + Math.round(s * 333) + ' km per Myr.';
    if (settings.view === 'plates') render();
  });
  canvas.addEventListener('pointercancel', () => { drag = null; });

  syncLabels();
  newWorld();
  render();
})();
</script>
</body>
</html>
