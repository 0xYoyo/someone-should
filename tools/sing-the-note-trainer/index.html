<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that plays a tone and shows if I hit it when singing</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
.target { display: grid; grid-template-columns: var(--tap) 1fr var(--tap); gap: 10px; align-items: center; text-align: center; }
.target button { padding: 0; font-size: 22px; }
#note { font-size: 64px; }
#hz { font: 16px/1.4 var(--mono); color: var(--meta); }
.controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.controls button { padding: 0 8px; }
.meter { position: relative; height: 56px; border: 1.5px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.meter .zone { position: absolute; top: 0; bottom: 0; left: 40%; width: 20%; background: var(--line); }
.meter .mid { position: absolute; top: 0; bottom: 0; left: 50%; width: 1.5px; background: var(--meta); }
#needle { position: absolute; top: 6px; bottom: 6px; width: 6px; margin-left: -3px; left: 50%; background: var(--ink); border-radius: 3px; opacity: .25; transition: left .08s linear; }
#needle.on { opacity: 1; }
#needle.hit { background: var(--built); }
.scale { display: flex; justify-content: space-between; font: 16px/1.4 var(--mono); color: var(--meta); }
#cents { min-height: 1.1em; font-size: 32px; }
#heard, #score { font-size: 16px; }
#cents.hit { color: var(--built); }
#status { min-height: 1.45em; color: var(--meta); }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that plays a tone and shows if I hit it when singing</h1>

<main id="app" class="stack">
  <div class="target">
    <button id="down" type="button" aria-label="Lower note">&minus;</button>
    <div><div id="note" class="big">A3</div><div id="hz">220.0 Hz</div></div>
    <button id="up" type="button" aria-label="Higher note">+</button>
  </div>
  <div class="controls">
    <button id="play" type="button">Play</button>
    <button id="sing" type="button" class="primary">Sing</button>
    <button id="random" type="button">New note</button>
  </div>
  <div class="meter" aria-hidden="true"><div class="zone"></div><div class="mid"></div><div id="needle"></div></div>
  <div class="scale" aria-hidden="true"><span>flat</span><span>0</span><span>sharp</span></div>
  <div id="cents" class="big" aria-live="polite">&ndash;</div>
  <div id="heard" class="meta"></div>
  <div id="status" aria-live="polite">Play the note, then tap Sing and hold it.</div>
  <div id="score" class="meta"></div>
</main>

<script>
(() => {
  'use strict';
  // storage helper — never throws
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];


  const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const MIN_MIDI = 36, MAX_MIDI = 84;          // C2..C6
  const HIT_CENTS = 20, HIT_HOLD_MS = 500;
  const freqOf = m => 440 * Math.pow(2, (m - 69) / 12);
  const nameOf = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);

  let target = Math.min(MAX_MIDI, Math.max(MIN_MIDI, store.get('stn.target', 57) | 0));
  let hits = store.get('stn.hits', 0) | 0;
  let ctx = null, analyser = null, buf = null, stream = null, raf = 0;
  let toneUntil = 0, holdStart = 0, hitDone = false;

  const ui = { note: $('#note'), hz: $('#hz'), cents: $('#cents'), heard: $('#heard'), status: $('#status'), needle: $('#needle'), score: $('#score'), sing: $('#sing') };
  const say = t => { ui.status.textContent = t; };

  function renderTarget() {
    ui.note.textContent = nameOf(target);
    ui.hz.textContent = freqOf(target).toFixed(1) + ' Hz';
    ui.score.textContent = hits ? 'Notes hit: ' + hits : '';
    hitDone = false; holdStart = 0;
    store.set('stn.target', target);
  }
  function setTarget(m) { target = Math.min(MAX_MIDI, Math.max(MIN_MIDI, m)); renderTarget(); resetMeter(); }

  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function playTone() {
    const ac = audio();
    if (!ac) { say('This browser cannot play audio.'); return; }
    const t = ac.currentTime, dur = 1.6;
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freqOf(target);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.35, t + 0.04);
    gain.gain.setValueAtTime(0.35, t + dur - 0.25);
    gain.gain.linearRampToValueAtTime(0, t + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
    toneUntil = performance.now() + dur * 1000 + 250;   // ignore the mic while the tone sounds
    say('Playing ' + nameOf(target) + '.');
  }

  // McLeod-style normalized autocorrelation. Returns Hz or -1.
  function detectPitch(x, sr) {
    let rms = 0;
    for (let i = 0; i < x.length; i++) rms += x[i] * x[i];
    if (Math.sqrt(rms / x.length) < 0.01) return -1;
    const minLag = Math.floor(sr / 1100), maxLag = Math.min(Math.floor(sr / 60), x.length >> 1);
    const W = x.length - maxLag;
    const n = new Float32Array(maxLag + 2);
    for (let lag = minLag; lag <= maxLag + 1; lag++) {
      let r = 0, m = 0;
      for (let i = 0; i < W; i++) { const a = x[i], b = x[i + lag]; r += a * b; m += a * a + b * b; }
      n[lag] = m ? 2 * r / m : 0;
    }
    let best = 0;
    for (let lag = minLag + 1; lag <= maxLag; lag++) if (n[lag] > best) best = n[lag];
    if (best < 0.6) return -1;
    // first peak that comes close to the best one avoids octave errors
    for (let lag = minLag + 1; lag <= maxLag; lag++) {
      if (n[lag] >= 0.9 * best && n[lag] >= n[lag - 1] && n[lag] >= n[lag + 1]) {
        const a = n[lag - 1], b = n[lag], c = n[lag + 1], d = a - 2 * b + c;
        const shift = d ? 0.5 * (a - c) / d : 0;
        return sr / (lag + shift);
      }
    }
    return -1;
  }

  function resetMeter() {
    ui.needle.className = ''; ui.needle.style.left = '50%';
    ui.cents.textContent = '–'; ui.cents.className = 'big'; ui.heard.textContent = '';
  }

  let smooth = null;
  function tick() {
    raf = requestAnimationFrame(tick);
    const now = performance.now();
    if (now < toneUntil) return;
    analyser.getFloatTimeDomainData(buf);
    const f = detectPitch(buf, ctx.sampleRate);
    if (f < 0) { smooth = null; holdStart = 0; ui.needle.classList.remove('on', 'hit'); ui.heard.textContent = 'Listening…'; return; }
    let cents = 1200 * Math.log2(f / freqOf(target));
    const octaves = Math.round(cents / 1200);
    cents -= octaves * 1200;                    // any octave counts as the same note
    smooth = smooth == null ? cents : smooth * 0.6 + cents * 0.4;
    const c = Math.round(smooth);
    const sungMidi = Math.round(69 + 12 * Math.log2(f / 440));
    ui.heard.textContent = 'You: ' + nameOf(sungMidi) + ' · ' + f.toFixed(1) + ' Hz' +
      (octaves ? ' · ' + Math.abs(octaves) + ' octave' + (Math.abs(octaves) > 1 ? 's ' : ' ') + (octaves < 0 ? 'down' : 'up') : '');
    const pos = 50 + Math.max(-50, Math.min(50, c / 2));   // bar shows -100..+100 cents
    ui.needle.style.left = pos + '%';
    ui.needle.classList.add('on');
    const inZone = Math.abs(c) <= HIT_CENTS;
    ui.needle.classList.toggle('hit', inZone);
    ui.cents.className = 'big' + (inZone ? ' hit' : '');
    ui.cents.textContent = inZone ? 'On pitch' : (c > 0 ? '+' : '') + c + ' cents ' + (c > 0 ? 'sharp' : 'flat');
    if (inZone) {
      if (!holdStart) holdStart = now;
      if (!hitDone && now - holdStart >= HIT_HOLD_MS) {
        hitDone = true; hits++; store.set('stn.hits', hits);
        ui.score.textContent = 'Notes hit: ' + hits;
        say('Hit ' + nameOf(target) + '.');
      }
    } else holdStart = 0;
  }

  async function startListening() {
    const ac = audio();
    if (!ac || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { say('This browser cannot use the microphone.'); return; }
    say('Asking for the microphone…');
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    } catch (e) {
      stream = null;
      say('Microphone blocked. Allow it in browser settings to check your pitch.');
      return;
    }
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser();
    analyser.fftSize = 2048;
    buf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
    ui.sing.textContent = 'Stop';
    say('Sing ' + nameOf(target) + ' and hold it.');
    tick();
  }

  function stopListening() {
    cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; analyser = null; smooth = null;
    ui.sing.textContent = 'Sing';
    resetMeter();
    say('Stopped.');
  }

  $('#up').addEventListener('click', () => setTarget(target + 1));
  $('#down').addEventListener('click', () => setTarget(target - 1));
  $('#random').addEventListener('click', () => {
    let m; do { m = 48 + Math.floor(Math.random() * 25); } while (m === target);   // C3..C5
    setTarget(m); playTone();
  });
  $('#play').addEventListener('click', playTone);
  ui.sing.addEventListener('click', () => { stream ? stopListening() : startListening(); });

  renderTarget();
})();
</script>
</body>
</html>
