<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that tracks my vegetarian days</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
main { max-width: 480px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat .label { font-size: 15px; color: var(--meta); }
.stat .val { font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.15; }
#today { width: 100%; }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nav button { width: var(--tap); padding: 0; font-size: 20px; }
.nav button:disabled { opacity: .3; cursor: default; }
#month { font-weight: 500; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.wd { text-align: center; font-size: 14px; color: var(--meta); padding: 4px 0; }
.day { min-height: var(--tap); min-width: 0; padding: 0; border: 1px solid var(--line); font-size: 16px; font-variant-numeric: tabular-nums; }
.day.on { background: var(--built); border-color: var(--built); color: #fff; }
.day.now { border: 2px solid var(--ink); }
.day:disabled { opacity: .35; cursor: default; }
.day:disabled:active { transform: none; }
.pad { min-height: var(--tap); }
#msg { min-height: 1.45em; color: var(--meta); font-size: 15px; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that tracks my vegetarian days</h1>

<main id="app" class="stack">
  <div class="stats">
    <div class="stat"><div class="label">current streak</div><div class="val" id="streak">0 days</div></div>
    <div class="stat"><div class="label">this year</div><div class="val" id="year">0%</div></div>
    <div class="stat"><div class="label">this month</div><div class="val" id="monthCount">0</div></div>
    <div class="stat"><div class="label">longest streak</div><div class="val" id="best">0 days</div></div>
  </div>
  <button class="primary" id="today">Today was vegetarian</button>
  <div class="nav">
    <button id="prev" aria-label="Previous month">&lsaquo;</button>
    <div id="month"></div>
    <button id="next" aria-label="Next month">&rsaquo;</button>
  </div>
  <div class="grid" id="grid" role="grid"></div>
  <div id="msg"></div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const KEY = 'veg-days';
  const days = new Set(store.get(KEY, []));
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let view = new Date(today.getFullYear(), today.getMonth(), 1);

  function save() {
    if (!store.set(KEY, [...days].sort())) $('#msg').textContent = 'Storage is off here, so marks last only until you close this page.';
  }

  function toggle(key) {
    days.has(key) ? days.delete(key) : days.add(key);
    $('#msg').textContent = '';
    save();
    render();
  }

  function streakEndingAt(d) {
    let n = 0;
    while (days.has(iso(d))) { n++; d = addDays(d, -1); }
    return n;
  }

  function longest() {
    let best = 0;
    for (const k of days) {
      const [y, m, dd] = k.split('-').map(Number);
      const d = new Date(y, m - 1, dd);
      if (days.has(iso(addDays(d, -1)))) continue; // not the start of a run
      let n = 0, c = d;
      while (days.has(iso(c))) { n++; c = addDays(c, 1); }
      if (n > best) best = n;
    }
    return best;
  }

  function stats() {
    // an unmarked today does not break the streak yet; the day is not over
    const s = days.has(iso(today)) ? streakEndingAt(today) : streakEndingAt(addDays(today, -1));
    $('#streak').textContent = plural(s, 'day');
    $('#best').textContent = plural(longest(), 'day');

    const y = today.getFullYear();
    const elapsed = Math.round((today - new Date(y, 0, 1)) / 864e5) + 1;
    let inYear = 0;
    for (const k of days) if (k.startsWith(y + '-') && k <= iso(today)) inYear++;
    $('#year').textContent = `${Math.round(inYear / elapsed * 100)}%`;
    $('#year').title = `${inYear} of ${elapsed} days`;

    const vy = view.getFullYear(), vm = view.getMonth();
    const prefix = `${vy}-${pad(vm + 1)}-`;
    let inMonth = 0;
    for (const k of days) if (k.startsWith(prefix)) inMonth++;
    const isCur = vy === today.getFullYear() && vm === today.getMonth();
    const total = isCur ? today.getDate() : new Date(vy, vm + 1, 0).getDate();
    $('#monthCount').textContent = `${inMonth} / ${total}`;

    $('#today').textContent = days.has(iso(today)) ? 'Undo today' : 'Today was vegetarian';
  }

  function render() {
    const grid = $('#grid');
    grid.textContent = '';
    for (const w of ['M','T','W','T','F','S','S']) {
      const el = document.createElement('div');
      el.className = 'wd'; el.textContent = w;
      grid.append(el);
    }
    const vy = view.getFullYear(), vm = view.getMonth();
    const lead = (view.getDay() + 6) % 7;
    for (let i = 0; i < lead; i++) { const p = document.createElement('div'); p.className = 'pad'; grid.append(p); }
    const last = new Date(vy, vm + 1, 0).getDate();
    const todayKey = iso(today);
    for (let d = 1; d <= last; d++) {
      const date = new Date(vy, vm, d), key = iso(date);
      const b = document.createElement('button');
      b.className = 'day' + (days.has(key) ? ' on' : '') + (key === todayKey ? ' now' : '');
      b.textContent = d;
      b.dataset.date = key;
      b.setAttribute('aria-pressed', days.has(key));
      b.setAttribute('aria-label', `${MONTHS[vm]} ${d}${days.has(key) ? ', vegetarian' : ''}`);
      if (date > today) b.disabled = true;
      grid.append(b);
    }
    $('#month').textContent = `${MONTHS[vm]} ${vy}`;
    $('#next').disabled = vy === today.getFullYear() && vm === today.getMonth();
    stats();
  }

  $('#grid').addEventListener('click', e => {
    const b = e.target.closest('button.day');
    if (b && !b.disabled) toggle(b.dataset.date);
  });
  $('#today').addEventListener('click', () => toggle(iso(today)));
  $('#prev').addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); });
  $('#next').addEventListener('click', () => {
    if ($('#next').disabled) return;
    view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render();
  });

  render();
  if (!days.size) $('#msg').textContent = 'Tap a day to mark it vegetarian.';
})();
</script>
</body>
</html>
