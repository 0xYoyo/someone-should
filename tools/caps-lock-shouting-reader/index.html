<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a text-to-speech tool that yells when text is in all caps</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

textarea { min-height: 120px; resize: vertical; }
#out { padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: var(--tap); }
#out .y { font-weight: 700; text-transform: uppercase; color: var(--no); }
#out .y.on { background: var(--no); color: var(--paper); }
#out .n.on { text-decoration: underline; }
label { display: grid; gap: 4px; }

</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a text-to-speech tool that yells when text is in all caps</h1>

<!-- the tool. Smallest thing that fully does the wish. -->
<main id="app" class="stack">
  <textarea id="text" aria-label="text to read" spellcheck="false">Please keep it down. I SAID STOP THAT RIGHT NOW. Thank you, and have a lovely evening.</textarea>
  <label class="meta">yell level <input id="level" type="range" min="1" max="3" step="1" value="2"></label>
  <div class="row">
    <button id="speak" class="primary" type="button">read aloud</button>
    <button id="stop" type="button">stop</button>
  </div>
  <div id="out" aria-live="polite"></div>
  <div id="status" class="meta"></div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const text = $('#text'), level = $('#level'), out = $('#out'), status = $('#status');
  const synth = window.speechSynthesis;
  // a word shouts when it has 2+ letters and none are lowercase
  const isShout = w => { const l = w.replace(/[^A-Za-z\u00C0-\u024F\u0400-\u04FF]/g, ''); return l.length >= 2 && l === l.toUpperCase() && l !== l.toLowerCase(); };
  // split into runs of consecutive shouted / normal words
  function segments(s) {
    const segs = [];
    (s.match(/\S+/g) || []).forEach(w => {
      const y = isShout(w), last = segs[segs.length - 1];
      if (last && last.y === y) last.t += ' ' + w; else segs.push({ y, t: w });
    });
    return segs;
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function render() {
    const segs = segments(text.value);
    const n = segs.filter(x => x.y).length;
    out.innerHTML = segs.length
      ? segs.map((x, i) => '<span class="' + (x.y ? 'y' : 'n') + '" data-i="' + i + '">' + esc(x.t) + '</span>').join(' ')
      : '<span class="empty">Type something.</span>';
    status.textContent = segs.length ? n + (n === 1 ? ' shout' : ' shouts') + ' found' : '';
    store.set('caps-text', text.value);
    return segs;
  }
  function speak() {
    const segs = render();
    if (!segs.length) return;
    if (!synth || typeof SpeechSynthesisUtterance === 'undefined') { status.textContent = 'This browser cannot speak.'; return; }
    synth.cancel();
    const lv = +level.value;
    segs.forEach((x, i) => {
      const u = new SpeechSynthesisUtterance(x.t);
      u.volume = x.y ? 1 : 0.45;
      u.pitch = x.y ? 0.9 + lv * 0.4 : 1;
      u.rate = x.y ? 0.95 + lv * 0.15 : 0.95;
      u.onstart = () => { const el = out.querySelector('[data-i="' + i + '"]'); if (el) el.classList.add('on'); };
      u.onend = () => { const el = out.querySelector('[data-i="' + i + '"]'); if (el) el.classList.remove('on'); };
      synth.speak(u);
    });
  }
  $('#speak').addEventListener('click', speak);
  $('#stop').addEventListener('click', () => { if (synth) synth.cancel(); out.querySelectorAll('.on').forEach(e => e.classList.remove('on')); });
  text.addEventListener('input', render);
  level.addEventListener('input', () => store.set('caps-level', level.value));
  const saved = store.get('caps-text', null);
  if (typeof saved === 'string' && saved.trim()) text.value = saved;
  level.value = store.get('caps-level', '2');
  render();
})();
</script>
</body>
</html>
