<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a tool that makes a heatmap from a table of numbers</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
textarea { min-height: 150px; font: 16px/1.4 var(--mono); resize: vertical; white-space: pre; overflow-x: auto; }
label.f { display: grid; gap: 4px; flex: 1 1 140px; }
label.f span { font: 16px/1.3 var(--sans); color: var(--meta); }
.wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
#map svg { display: block; }
#status { font: 16px/1.4 var(--mono); color: var(--meta); }
#status.err { color: var(--no); }
.row button { flex: 1 1 auto; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a tool that makes a heatmap from a table of numbers</h1>

<main id="app" class="stack">
  <textarea id="data" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Table of numbers" placeholder="Paste from a spreadsheet, CSV, or space-separated text"></textarea>
  <div class="row">
    <label class="f"><span>Colors</span>
      <select id="palette">
        <option value="heat">Yellow to red</option>
        <option value="blue">Light to dark blue</option>
        <option value="gray">Grayscale</option>
        <option value="div">Blue, white, red</option>
      </select>
    </label>
    <label class="f"><span>Scale across</span>
      <select id="norm">
        <option value="all">Whole table</option>
        <option value="row">Each row</option>
        <option value="col">Each column</option>
      </select>
    </label>
    <label class="f"><span>Numbers in cells</span>
      <select id="vals">
        <option value="on">Show</option>
        <option value="off">Hide</option>
      </select>
    </label>
  </div>
  <div class="row">
    <button id="draw" class="primary">Draw heatmap</button>
    <button id="svg">Save SVG</button>
    <button id="png">Save PNG</button>
  </div>
  <div id="status" role="status"></div>
  <div id="map" class="wrap"></div>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  // SVG namespace, assembled so the file holds no literal URL
  const SVGNS = ['http:', '', 'www.w3.org', '2000', 'svg'].join('/');
  const SAMPLE = '\tMon\tTue\tWed\tThu\tFri\n9:00\t4\t7\t6\t9\t3\n12:00\t12\t15\t11\t14\t18\n15:00\t8\t6\t10\t7\t5\n18:00\t2\t3\t1\t4\t9';

  const PALETTES = {
    heat: ['#fff7d1', '#fed976', '#fd8d3c', '#e31a1c', '#800026'],
    blue: ['#eef4fb', '#b6d2ea', '#6aa6d3', '#2c6fae', '#0b3768'],
    gray: ['#f2f2f2', '#c4c4c4', '#8a8a8a', '#4d4d4d', '#141414'],
    div:  ['#2166ac', '#92c5de', '#f7f7f7', '#f4a582', '#b2182b']
  };

  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  function ramp(stops, t) {
    t = Math.max(0, Math.min(1, t));
    const p = t * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(p)), f = p - i;
    const a = hex(stops[i]), b = hex(stops[i + 1]);
    return '#' + a.map((v, k) => Math.round(v + (b[k] - v) * f).toString(16).padStart(2, '0')).join('');
  }
  const textOn = c => { const [r, g, b] = hex(c); return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#141414' : '#ffffff'; };

  // Accepts "1,234", "12%", "$5", "1.5e3", "−3"; returns NaN for anything else.
  function num(s, delim) {
    let t = String(s).trim().replace(/−/g, '-').replace(/[%$€£\s]/g, '');
    if (delim !== ',' && /^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) t = t.replace(/,/g, '');
    if (delim !== ',' && /^-?\d+,\d+$/.test(t)) t = t.replace(',', '.');
    if (t === '' || !/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return NaN;
    return Number(t);
  }

  function splitLine(line, delim) {
    if (delim === ' ') return line.trim().split(/\s+/);
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
      else if (c === delim && !q) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out.map(s => s.trim());
  }

  function parse(text) {
    const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim() !== '');
    if (!lines.length) return null;
    const sample = lines.slice(0, 5).join('\n');
    const delim = sample.includes('\t') ? '\t' : sample.includes(';') ? ';' : sample.includes(',') ? ',' : ' ';
    let rows = lines.map(l => splitLine(l, delim));
    const isNum = s => !Number.isNaN(num(s, delim));

    // header row: its cells (after the first) are mostly not numbers
    const head = rows[0].slice(1);
    const hasHeader = rows.length > 1 && head.length > 0 && head.filter(isNum).length < head.length / 2 || (rows[0].length > 1 && rows[0].every(s => !isNum(s)));
    let colLabels = null;
    if (hasHeader) colLabels = rows.shift();
    // label column: first cells mostly not numbers
    const firsts = rows.map(r => r[0]);
    const hasRowLabels = firsts.filter(s => !isNum(s)).length > firsts.length / 2;
    let rowLabels = null;
    if (hasRowLabels) { rowLabels = firsts; rows = rows.map(r => r.slice(1)); if (colLabels) colLabels = colLabels.slice(1); }
    else if (colLabels && colLabels.length > (rows[0] || []).length) colLabels = colLabels.slice(1);

    const ncol = Math.max(0, ...rows.map(r => r.length));
    const vals = rows.map(r => Array.from({ length: ncol }, (_, j) => num(r[j] ?? '', delim)));
    const count = vals.flat().filter(Number.isFinite).length;
    if (!rows.length || !ncol || !count) return null;
    colLabels = Array.from({ length: ncol }, (_, j) => (colLabels && colLabels[j]) || String(j + 1));
    rowLabels = rows.map((_, i) => (rowLabels && rowLabels[i]) || String(i + 1));
    return { vals, rowLabels, colLabels, count };
  }

  function fmt(v) {
    if (!Number.isFinite(v)) return '';
    const a = Math.abs(v);
    if (a !== 0 && (a >= 1e6 || a < 1e-3)) return v.toExponential(1);
    return String(+v.toPrecision(4));
  }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  function measure(s, size) { // rough width for layout without a canvas
    return [...String(s)].reduce((w, c) => w + (/[ilj.,:;|!'1]/.test(c) ? 0.33 : /[MW@%]/.test(c) ? 0.9 : /[A-Z0-9]/.test(c) ? 0.64 : 0.55), 0) * size;
  }
  const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

  let last = null;

  function build(d, opt) {
    const stops = PALETTES[opt.palette] || PALETTES.heat;
    const { vals } = d, R = vals.length, C = vals[0].length;
    const finite = a => a.filter(Number.isFinite);
    const range = a => { const f = finite(a); return f.length ? [Math.min(...f), Math.max(...f)] : [0, 0]; };
    const all = range(vals.flat());
    const rowR = vals.map(range);
    const colR = Array.from({ length: C }, (_, j) => range(vals.map(r => r[j])));
    const tOf = (v, i, j) => {
      let [lo, hi] = opt.norm === 'row' ? rowR[i] : opt.norm === 'col' ? colR[j] : all;
      if (opt.palette === 'div') { const m = Math.max(Math.abs(lo), Math.abs(hi)) || 1; return lo < 0 ? 0.5 + v / (2 * m) : (hi === lo ? 0.5 : (v - lo) / (hi - lo)); }
      return hi === lo ? 0.5 : (v - lo) / (hi - lo);
    };

    const FS = 16;
    const rl = d.rowLabels.map(s => clip(s, 18)), cl = d.colLabels.map(s => clip(s, 14));
    const cellText = vals.flat().map(fmt);
    const cw = Math.max(48, Math.ceil(Math.max(...cellText.map(s => measure(s, 15)), ...cl.map(s => measure(s, FS)))) + 14);
    const ch = 40;
    const lw = Math.ceil(Math.max(...rl.map(s => measure(s, FS)))) + 12;
    const top = 30, pad = 4;
    const gw = C * cw, gh = R * ch;
    const W = lw + gw + pad, legendY = top + gh + 18, H = legendY + 14 + 28;
    const fill = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#141414';
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim() || '#f4f1ea';

    let s = `<svg xmlns="${SVGNS}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="${FS}">`;
    s += `<rect width="${W}" height="${H}" fill="${bg}"/>`;
    s += `<defs><pattern id="na" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${bg}"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width="1.5"/></pattern>`;
    s += `<linearGradient id="lg">${stops.map((c, k) => `<stop offset="${k / (stops.length - 1)}" stop-color="${c}"/>`).join('')}</linearGradient></defs>`;
    cl.forEach((t, j) => { s += `<text class="col-label" x="${lw + j * cw + cw / 2}" y="${top - 9}" text-anchor="middle" fill="${fill}">${esc(t)}</text>`; });
    rl.forEach((t, i) => { s += `<text class="row-label" x="${lw - 8}" y="${top + i * ch + ch / 2 + 5}" text-anchor="end" fill="${fill}">${esc(t)}</text>`; });
    for (let i = 0; i < R; i++) for (let j = 0; j < C; j++) {
      const v = vals[i][j], x = lw + j * cw, y = top + i * ch;
      const ok = Number.isFinite(v), c = ok ? ramp(stops, tOf(v, i, j)) : 'url(#na)';
      s += `<g class="cell" data-v="${ok ? v : ''}"><title>${esc(d.rowLabels[i])} / ${esc(d.colLabels[j])}: ${ok ? fmt(v) : 'no number'}</title><rect x="${x}" y="${y}" width="${cw}" height="${ch}" fill="${c}" stroke="${bg}" stroke-width="1"/>`;
      if (ok && opt.vals) s += `<text x="${x + cw / 2}" y="${y + ch / 2 + 5}" text-anchor="middle" font-size="15" fill="${textOn(c)}" style="font-variant-numeric:tabular-nums">${esc(fmt(v))}</text>`;
      s += '</g>';
    }
    // color scale
    const lx = lw, lwid = Math.min(gw, 260);
    let loT, hiT;
    if (opt.norm === 'all') {
      let [lo, hi] = all;
      if (opt.palette === 'div' && lo < 0) { const m = Math.max(-lo, hi); lo = -m; hi = m; }
      loT = fmt(lo); hiT = fmt(hi);
    } else { loT = opt.norm === 'row' ? 'row low' : 'col low'; hiT = opt.norm === 'row' ? 'row high' : 'col high'; }
    s += `<rect x="${lx}" y="${legendY}" width="${lwid}" height="12" fill="url(#lg)" stroke="${fill}" stroke-opacity=".2"/>`;
    s += `<text x="${lx}" y="${legendY + 32}" fill="${fill}">${esc(loT)}</text><text x="${lx + lwid}" y="${legendY + 32}" text-anchor="end" fill="${fill}">${esc(hiT)}</text>`;
    s += '</svg>';
    return { svg: s, all, R, C, W, H };
  }

  function opts() { return { palette: $('#palette').value, norm: $('#norm').value, vals: $('#vals').value === 'on' }; }
  function setStatus(t, err) { const el = $('#status'); el.textContent = t; el.className = err ? 'err' : ''; }

  function draw() {
    const text = $('#data').value;
    store.set('t2h', { text, ...opts() });
    last = null;
    if (!text.trim()) { $('#map').innerHTML = ''; setStatus('Paste a table of numbers above.'); return; }
    const d = parse(text);
    if (!d) { $('#map').innerHTML = ''; setStatus('No numbers found in that table.', true); return; }
    last = build(d, opts());
    $('#map').innerHTML = last.svg;
    const miss = last.R * last.C - d.count;
    setStatus(`${last.R} rows × ${last.C} columns, ${fmt(last.all[0])} to ${fmt(last.all[1])}` + (miss ? `, ${miss} blank` : ''));
  }

  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  $('#svg').addEventListener('click', () => {
    if (!last) return setStatus('Nothing to save yet.', true);
    download(new Blob([last.svg], { type: 'image/svg+xml' }), 'heatmap.svg');
  });
  $('#png').addEventListener('click', () => {
    if (!last) return setStatus('Nothing to save yet.', true);
    const img = new Image(), k = 2;
    img.onload = () => {
      const cv = document.createElement('canvas'); cv.width = last.W * k; cv.height = last.H * k;
      const ctx = cv.getContext('2d'); ctx.scale(k, k); ctx.drawImage(img, 0, 0);
      cv.toBlob(b => b ? download(b, 'heatmap.png') : setStatus('PNG export failed here; try SVG.', true), 'image/png');
    };
    img.onerror = () => setStatus('PNG export failed here; try SVG.', true);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(last.svg);
  });

  let timer;
  $('#data').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(draw, 250); });
  ['#palette', '#norm', '#vals'].forEach(s => $(s).addEventListener('change', draw));
  $('#draw').addEventListener('click', draw);

  const saved = store.get('t2h', null);
  $('#data').value = saved && typeof saved.text === 'string' ? saved.text : SAMPLE;
  if (saved) {
    if (PALETTES[saved.palette]) $('#palette').value = saved.palette;
    if (['all', 'row', 'col'].includes(saved.norm)) $('#norm').value = saved.norm;
    $('#vals').value = saved.vals === false ? 'off' : 'on';
  }
  draw();
})();
</script>
</body>
</html>
