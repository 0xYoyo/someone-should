<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that plays audio with easy rewind and speed control for transcribing</title>
<style>
/* ---- paste design/tokens.css here, verbatim ---- */
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
main { max-width: 640px; }
.file { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); border-radius: var(--radius); cursor: pointer; }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
#name { overflow-wrap: anywhere; }
.info { font: 16px/1.4 var(--mono); color: var(--meta); }
#clock { font-size: 36px; }
#seek { padding: 0; border: 0; min-height: var(--tap); accent-color: var(--ink); }
.controls { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; }
.controls button { padding: 0 8px; }
#play { min-height: 56px; }
.speed { display: grid; grid-template-columns: var(--tap) 1fr var(--tap); gap: 10px; align-items: center; text-align: center; }
.speed button { padding: 0; }
#speed { font: 500 22px/1 var(--mono); font-variant-numeric: tabular-nums; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts label { display: grid; gap: 4px; }
#notes { min-height: 40vh; resize: vertical; line-height: 1.5; }
.split { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
</style>
</head>
<body>
<h1 id="wish">someone should make an app that plays audio with easy rewind and speed control for transcribing</h1>

<main id="app" class="stack">
  <div class="row">
    <label class="file">open audio<input type="file" id="file" accept="audio/*,video/*"></label>
    <span id="name" class="info">no file open</span>
  </div>
  <div id="clock" class="big">0:00 / 0:00</div>
  <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="position">
  <div class="controls">
    <button id="back" type="button">−3 s</button>
    <button id="play" class="primary" type="button">play</button>
    <button id="fwd" type="button">+3 s</button>
  </div>
  <div class="speed">
    <button id="slower" type="button" aria-label="slower">−</button>
    <div id="speed">1.0×</div>
    <button id="faster" type="button" aria-label="faster">+</button>
  </div>
  <div class="opts">
    <label class="info">jump
      <select id="step"><option value="1">1 s</option><option value="2">2 s</option><option value="3">3 s</option><option value="5">5 s</option><option value="10">10 s</option></select>
    </label>
    <label class="info">on resume, back
      <select id="resume"><option value="0">0 s</option><option value="1">1 s</option><option value="2">2 s</option><option value="3">3 s</option></select>
    </label>
  </div>
  <textarea id="notes" spellcheck="true" aria-label="transcript" placeholder="type here"></textarea>
  <div class="split">
    <div id="status" class="info">0 words</div>
    <button id="stamp" type="button">insert time</button>
  </div>
  <div class="info">Esc play/pause · Alt+J back · Alt+L forward · Alt+, Alt+. speed · Alt+T time</div>
</main>

<audio id="audio" preload="metadata"></audio>

<script>
(() => {
  'use strict';
  // storage helper — never throws
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const K = 'ss-transcription-player:';
  const audio = $('#audio'), notes = $('#notes'), seek = $('#seek'), status = $('#status');
  let rate = store.get(K + 'rate', 1);
  let fileKey = null, msg = '', saveTimer = 0, posTimer = 0;

  $('#step').value = String(store.get(K + 'step', 3));
  $('#resume').value = String(store.get(K + 'resume', 1));
  notes.value = store.get(K + 'notes', '');

  const fmt = (t, tenths) => {
    t = Math.max(0, t || 0);
    const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = Math.floor(t % 60);
    const ss = String(s).padStart(2, '0');
    let out = h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
    if (tenths) out += '.' + Math.floor((t * 10) % 10);
    return out;
  };
  const loaded = () => !!audio.src && isFinite(audio.duration);

  function showStatus() {
    const words = (notes.value.match(/\S+/g) || []).length;
    status.textContent = msg || `${words} word${words === 1 ? '' : 's'}`;
  }
  function say(text) { msg = text; showStatus(); clearTimeout(say.t); say.t = setTimeout(() => { msg = ''; showStatus(); }, 2500); }

  function showTime() {
    $('#clock').textContent = `${fmt(audio.currentTime, true)} / ${fmt(loaded() ? audio.duration : 0)}`;
    if (document.activeElement !== seek) seek.value = audio.currentTime || 0;
  }
  function showStep() {
    const s = +$('#step').value;
    $('#back').textContent = `−${s} s`;
    $('#fwd').textContent = `+${s} s`;
  }
  function setRate(r) {
    rate = Math.min(2, Math.max(0.5, Math.round(r * 10) / 10));
    audio.playbackRate = rate;
    audio.defaultPlaybackRate = rate;
    $('#speed').textContent = rate.toFixed(1) + '×';
    store.set(K + 'rate', rate);
  }
  function jump(d) {
    if (!loaded()) return say('open an audio file first');
    audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + d));
    showTime();
  }
  function toggle() {
    if (!loaded()) return say('open an audio file first');
    if (audio.paused) {
      const back = +$('#resume').value;
      if (back && audio.currentTime > 0) audio.currentTime = Math.max(0, audio.currentTime - back);
      audio.playbackRate = rate;
      audio.play().catch(() => say('this file will not play here'));
    } else audio.pause();
  }
  function stamp() {
    const tag = `[${fmt(audio.currentTime)}] `;
    const a = notes.selectionStart ?? notes.value.length, b = notes.selectionEnd ?? a;
    const before = notes.value.slice(0, a);
    const lead = before && !/\s$/.test(before) ? ' ' : '';
    notes.value = before + lead + tag + notes.value.slice(b);
    const caret = a + lead.length + tag.length;
    notes.focus();
    notes.setSelectionRange(caret, caret);
    saveNotes();
  }
  function saveNotes() {
    showStatus();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => store.set(K + 'notes', notes.value), 300);
  }

  $('#file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    audio.pause();
    $('#name').textContent = 'loading…';
    // CSP allows data: media only, so read the file as a data URL
    const reader = new FileReader();
    reader.onload = () => {
      fileKey = K + 'pos:' + f.name + ':' + f.size;
      audio.src = reader.result;
      $('#name').textContent = f.name;
    };
    reader.onerror = () => { $('#name').textContent = 'could not read that file'; };
    reader.readAsDataURL(f);
  });
  audio.addEventListener('loadedmetadata', () => {
    seek.max = audio.duration;
    const pos = fileKey ? store.get(fileKey, 0) : 0;
    if (pos && pos < audio.duration) audio.currentTime = pos;
    setRate(rate);
    showTime();
  });
  audio.addEventListener('error', () => { if (audio.src) $('#name').textContent = 'that file is not playable audio'; });
  audio.addEventListener('timeupdate', () => {
    showTime();
    if (fileKey && !posTimer) posTimer = setTimeout(() => { store.set(fileKey, audio.currentTime); posTimer = 0; }, 2000);
  });
  audio.addEventListener('play', () => { $('#play').textContent = 'pause'; });
  audio.addEventListener('pause', () => { $('#play').textContent = 'play'; if (fileKey) store.set(fileKey, audio.currentTime); });
  audio.addEventListener('ended', () => { $('#play').textContent = 'play'; });

  seek.addEventListener('input', () => { if (loaded()) { audio.currentTime = +seek.value; showTime(); } });
  $('#play').addEventListener('click', toggle);
  $('#back').addEventListener('click', () => jump(-$('#step').value));
  $('#fwd').addEventListener('click', () => jump(+$('#step').value));
  $('#slower').addEventListener('click', () => setRate(rate - 0.1));
  $('#faster').addEventListener('click', () => setRate(rate + 0.1));
  $('#stamp').addEventListener('click', stamp);
  $('#step').addEventListener('change', () => { store.set(K + 'step', +$('#step').value); showStep(); });
  $('#resume').addEventListener('change', () => store.set(K + 'resume', +$('#resume').value));
  notes.addEventListener('input', saveNotes);

  // shortcuts work while typing; e.code keeps Alt+letter working on macOS
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.code === 'F4') { e.preventDefault(); return toggle(); }
    if (!e.altKey || e.ctrlKey || e.metaKey) return;
    const act = {
      KeyJ: () => jump(-$('#step').value), KeyL: () => jump(+$('#step').value), KeyK: toggle,
      Comma: () => setRate(rate - 0.1), Period: () => setRate(rate + 0.1), KeyT: stamp
    }[e.code];
    if (act) { e.preventDefault(); act(); }
  });

  setRate(rate);
  showStep();
  showStatus();
  showTime();
})();
</script>
</body>
</html>
