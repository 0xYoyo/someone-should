<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app that tracks a freelancer's finances</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


[hidden] { display: none !important; }
input { min-width: 0; max-width: 100%; }
main, form, section { min-width: 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.seg button { border-radius: 0; }
.seg button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.seg button:last-child { border-radius: 0 var(--radius) var(--radius) 0; border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > * { min-width: 0; }
label { display: grid; gap: 4px; min-width: 0; }
label > span { font: 13px/1.3 var(--mono); color: var(--meta); }
.check { display: flex; gap: 10px; align-items: center; min-height: var(--tap); }
.check input { width: 44px; height: 44px; min-height: 44px; margin: 0; accent-color: var(--ink); flex: none; }
.period { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; text-align: center; }
.period button { padding: 0; width: 44px; }
.totals { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 10px; }
.totals div { display: grid; gap: 2px; min-width: 0; }
.num { font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.totals .wide { grid-column: 1 / -1; }
.totals .wide .num { font-size: 36px; }
#msg { min-height: 1.45em; color: var(--meta); }
#msg.err { color: var(--no); }
ul.plain li > div { min-width: 0; flex: 1; }
.what { overflow-wrap: anywhere; }
.amt { font-variant-numeric: tabular-nums; white-space: nowrap; }
.out { color: var(--meta); }
.acts { display: flex; gap: 6px; flex: none; }
.acts button { padding: 0 10px; min-width: 44px; }
details summary { min-height: var(--tap); display: flex; align-items: center; cursor: pointer; }
h2 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 8px 0 0; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app that tracks a freelancer's finances</h1>

<main id="app" class="stack">
  <form id="entry" class="stack" autocomplete="off">
    <div class="seg" role="group" aria-label="Entry type">
      <button type="button" id="kind-in" aria-pressed="true">Income</button>
      <button type="button" id="kind-out" aria-pressed="false">Expense</button>
    </div>
    <div class="grid2">
      <label><span>Amount</span><input id="amount" inputmode="decimal" placeholder="0.00"></label>
      <label><span>Date</span><input id="date" type="date"></label>
    </div>
    <div class="grid2">
      <label><span id="who-label">Client</span><input id="who" list="who-list" placeholder="Acme Co"></label>
      <label><span>Category</span><input id="cat" list="cat-list" placeholder="Design"></label>
    </div>
    <label class="check" id="unpaid-row"><input type="checkbox" id="unpaid"> Invoiced, not paid yet</label>
    <button type="submit" id="add" class="primary">Add</button>
    <div id="msg" role="status"></div>
  </form>
  <datalist id="who-list"></datalist>
  <datalist id="cat-list"></datalist>

  <div class="period">
    <button type="button" id="prev" aria-label="Previous month">&lsaquo;</button>
    <strong id="month"></strong>
    <button type="button" id="next" aria-label="Next month">&rsaquo;</button>
  </div>

  <section class="totals" aria-live="polite">
    <div><span class="meta">Income received</span><span class="num" id="income"></span></div>
    <div><span class="meta">Expenses</span><span class="num" id="expenses"></span></div>
    <div class="wide"><span class="meta">Profit</span><span class="num" id="profit"></span></div>
    <div><span class="meta" id="tax-label">Set aside for tax</span><span class="num" id="tax"></span></div>
    <div><span class="meta">Still owed to you</span><span class="num" id="owed"></span></div>
    <div class="wide"><span class="meta" id="ytd"></span></div>
  </section>

  <h2>By client</h2>
  <ul class="plain" id="clients"></ul>

  <h2>Entries</h2>
  <ul class="plain" id="list"></ul>

  <details>
    <summary>Settings and export</summary>
    <div class="stack">
      <div class="grid2">
        <label><span>Tax rate %</span><input id="rate" inputmode="decimal"></label>
        <label><span>Currency</span><input id="cur" maxlength="4" placeholder="$"></label>
      </div>
      <button type="button" id="export">Export CSV</button>
    </div>
  </details>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const KEY = 'fml.entries', SET = 'fml.settings';
  let entries = store.get(KEY, []);
  if (!Array.isArray(entries)) entries = [];
  const settings = Object.assign({ rate: 25, cur: '' }, store.get(SET, {}));
  let kind = 'in';

  const pad = n => String(n).padStart(2, '0');
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  let view = today().slice(0, 7);

  // Amounts are stored as integer cents to avoid float drift.
  const fmt = c => {
    const neg = c < 0; c = Math.abs(Math.round(c));
    const whole = String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + settings.cur + whole + '.' + pad(c % 100);
  };
  const parseAmount = s => {
    const v = parseFloat(String(s).replace(/[^0-9.]/g, ''));
    return isFinite(v) && v > 0 ? Math.round(v * 100) : 0;
  };
  const monthName = ym => {
    const [y, m] = ym.split('-').map(Number);
    return ['January','February','March','April','May','June','July','August','September','October','November','December'][m - 1] + ' ' + y;
  };
  const shiftMonth = (ym, d) => {
    let [y, m] = ym.split('-').map(Number); m += d;
    while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
    return y + '-' + pad(m);
  };
  const save = () => store.set(KEY, entries);
  const say = (t, err) => { const m = $('#msg'); m.textContent = t; m.className = err ? 'err' : ''; };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function sums(list) {
    let inc = 0, exp = 0, owed = 0;
    for (const e of list) {
      if (e.kind === 'out') exp += e.cents;
      else if (e.unpaid) owed += e.cents;
      else inc += e.cents;
    }
    const profit = inc - exp;
    return { inc, exp, owed, profit, tax: Math.max(0, profit) * (Number(settings.rate) || 0) / 100 };
  }

  function setKind(k) {
    kind = k;
    $('#kind-in').setAttribute('aria-pressed', k === 'in');
    $('#kind-out').setAttribute('aria-pressed', k === 'out');
    $('#who-label').textContent = k === 'in' ? 'Client' : 'Paid to';
    $('#unpaid-row').hidden = k !== 'in';
  }

  function render() {
    $('#month').textContent = monthName(view);
    const inMonth = entries.filter(e => e.date.slice(0, 7) === view);
    const s = sums(inMonth);
    $('#income').textContent = fmt(s.inc);
    $('#expenses').textContent = fmt(s.exp);
    $('#profit').textContent = fmt(s.profit);
    $('#tax').textContent = fmt(s.tax);
    $('#owed').textContent = fmt(s.owed);
    $('#tax-label').textContent = 'Set aside for tax (' + (Number(settings.rate) || 0) + '%)';
    const y = sums(entries.filter(e => e.date.slice(0, 4) === view.slice(0, 4)));
    $('#ytd').textContent = view.slice(0, 4) + ' so far: profit ' + fmt(y.profit) + ', tax ' + fmt(y.tax) + ', owed ' + fmt(y.owed);

    const by = new Map();
    for (const e of inMonth) if (e.kind === 'in') by.set(e.who || 'No client', (by.get(e.who || 'No client') || 0) + e.cents);
    const cl = $('#clients'); cl.replaceChildren();
    if (!by.size) cl.append(el('li', 'empty', 'No income this month.'));
    [...by].sort((a, b) => b[1] - a[1]).forEach(([w, c]) => {
      const li = el('li'); li.append(el('span', 'what', w), el('span', 'amt', fmt(c))); cl.append(li);
    });

    const ul = $('#list'); ul.replaceChildren();
    const sorted = inMonth.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
    if (!sorted.length) ul.append(el('li', 'empty', 'Nothing logged in ' + monthName(view) + '.'));
    for (const e of sorted) {
      const li = el('li'); li.dataset.id = e.id;
      const d = el('div');
      d.append(el('div', 'what', (e.who || (e.kind === 'in' ? 'Income' : 'Expense')) + (e.cat ? ' · ' + e.cat : '')));
      d.append(el('div', 'meta', e.date.slice(5) + (e.kind === 'in' ? (e.unpaid ? ' · owed' : ' · paid') : ' · expense')));
      const amt = el('span', 'amt' + (e.unpaid ? ' out' : ''), (e.kind === 'out' ? '-' : '+') + fmt(e.cents));
      const acts = el('div', 'acts');
      if (e.kind === 'in' && e.unpaid) {
        const p = el('button', 'pay', 'Paid'); p.type = 'button'; p.dataset.act = 'pay'; acts.append(p);
      }
      const x = el('button', 'del', '\u00d7'); x.type = 'button'; x.dataset.act = 'del'; x.setAttribute('aria-label', 'Delete'); acts.append(x);
      li.append(d, amt, acts); ul.append(li);
    }

    const fill = (id, vals) => { const dl = $(id); dl.replaceChildren(...[...new Set(vals.filter(Boolean))].slice(0, 50).map(v => { const o = el('option'); o.value = v; return o; })); };
    fill('#who-list', entries.map(e => e.who));
    fill('#cat-list', entries.map(e => e.cat));
  }

  $('#kind-in').addEventListener('click', () => setKind('in'));
  $('#kind-out').addEventListener('click', () => setKind('out'));

  $('#entry').addEventListener('submit', ev => {
    ev.preventDefault();
    const cents = parseAmount($('#amount').value);
    if (!cents) { say('Enter an amount above zero.', true); $('#amount').focus(); return; }
    const date = /^\d{4}-\d{2}-\d{2}$/.test($('#date').value) ? $('#date').value : today();
    const e = { id: Date.now() + Math.random(), kind, cents, date, who: $('#who').value.trim(), cat: $('#cat').value.trim(), unpaid: kind === 'in' && $('#unpaid').checked };
    entries.push(e); save();
    view = date.slice(0, 7);
    $('#amount').value = ''; $('#unpaid').checked = false;
    say('Added ' + (kind === 'in' ? 'income' : 'expense') + ' ' + fmt(cents) + '.');
    render();
  });

  $('#list').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    const id = Number(b.closest('li').dataset.id);
    const i = entries.findIndex(e => e.id === id); if (i < 0) return;
    if (b.dataset.act === 'del') { entries.splice(i, 1); say('Deleted.'); }
    else if (b.dataset.act === 'pay') { entries[i].unpaid = false; say('Marked paid.'); }
    save(); render();
  });

  $('#prev').addEventListener('click', () => { view = shiftMonth(view, -1); render(); });
  $('#next').addEventListener('click', () => { view = shiftMonth(view, 1); render(); });

  $('#rate').value = settings.rate;
  $('#cur').value = settings.cur;
  $('#rate').addEventListener('input', () => { const r = parseFloat($('#rate').value); settings.rate = isFinite(r) && r >= 0 && r <= 100 ? r : 0; store.set(SET, settings); render(); });
  $('#cur').addEventListener('input', () => { settings.cur = $('#cur').value.trim(); store.set(SET, settings); render(); });

  $('#export').addEventListener('click', () => {
    if (!entries.length) { say('Nothing to export yet.', true); return; }
    const q = v => { if (typeof v === 'number') return String(v); v = String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const rows = [['date', 'type', 'amount', 'client_or_payee', 'category', 'status']];
    entries.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(e => rows.push([
      e.date, e.kind === 'in' ? 'income' : 'expense', (e.kind === 'out' ? -e.cents : e.cents) / 100,
      e.who, e.cat, e.kind === 'in' ? (e.unpaid ? 'owed' : 'paid') : ''
    ]));
    const csv = rows.map(r => r.map(q).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = 'freelance-ledger-' + today() + '.csv';
    document.body.append(a); a.click(); a.remove();
    say('Exported ' + entries.length + ' entries.');
  });

  $('#date').value = today();
  setKind('in');
  render();
})();
</script>
</body>
</html>
