<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a tool that measures real distances on images</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- tool styles below ---- */
.file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
#stage { position: relative; display: flex; justify-content: center; border: 1.5px solid var(--line); border-radius: var(--radius); min-height: 160px; align-items: center; overflow: hidden; }
#cv { display: none; touch-action: none; max-width: 100%; }
#stage.has #cv { display: block; }
#stage.has .empty { display: none; }
#stage .empty { padding: 24px 16px; text-align: center; }
.ref { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tools button { padding: 0 8px; }
button:disabled { opacity: .4; cursor: default; }
#list li { cursor: pointer; }
#list li.sel .name { font-weight: 600; }
#list .val { font-variant-numeric: tabular-nums; margin-left: auto; }
#list .kill { min-width: 44px; padding: 0 10px; }
.hint { color: var(--meta); font-size: 16px; margin: 0; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a tool that measures real distances on images</h1>

<main id="app" class="stack">
  <div class="row">
    <button id="open" class="primary" type="button">Open photo</button>
    <button id="sample" type="button">Try a sample</button>
    <input id="file" class="file" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
  </div>

  <div id="stage">
    <p class="empty" id="msg">Open a photo with something of known length in it.</p>
    <canvas id="cv" aria-label="photo with measurement lines"></canvas>
  </div>

  <div class="ref">
    <input id="ref-len" type="number" inputmode="decimal" min="0" step="any" placeholder="reference length" aria-label="reference length">
    <select id="unit" aria-label="unit">
      <option>mm</option><option selected>cm</option><option>m</option><option>in</option><option>ft</option>
    </select>
  </div>

  <div class="tools">
    <button id="add-ref" type="button" disabled>Reference</button>
    <button id="add-line" type="button" disabled>+ Line</button>
    <button id="add-area" type="button" disabled>+ Area</button>
  </div>
  <button id="add-corner" type="button" hidden>+ Corner on selected area</button>

  <ul class="plain" id="list"></ul>
  <p class="hint" id="hint">Drag the dots. Measure on the same flat surface as the reference.</p>
</main>

<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);

  const cv = $('#cv'), ctx = cv.getContext('2d'), stage = $('#stage'), msg = $('#msg');
  const refLen = $('#ref-len'), unitSel = $('#unit'), list = $('#list');
  const HIT = 26, LOUPE_R = 56, LOUPE_Z = 3;

  // An A4 sheet (297 mm wide) with a bank card (85.6 x 54 mm) on it, 1 mm = 360/297 px.
  const K = 360 / 297, CX = 160, CY = 120, CW = 85.6 * K, CH = 54 * K;
  function sampleSrc() {
    const c = document.createElement('canvas'); c.width = 600; c.height = 340;
    const g = c.getContext('2d');
    g.fillStyle = '#b08658'; g.fillRect(0, 0, 600, 340);
    g.fillStyle = '#fbfaf6'; g.fillRect(120, 40, 360, 210 * K);
    g.fillStyle = '#888'; g.font = '16px sans-serif'; g.textAlign = 'center';
    g.fillText('A4 sheet, 29.7 cm wide', 300, 70);
    g.fillStyle = '#2f5f8f'; g.fillRect(CX, CY, CW, CH);
    g.fillStyle = '#d6b75a'; g.fillRect(CX + 10, CY + 22, 16, 12);
    return c.toDataURL('image/png');
  }
  const SAMPLE = {
        presets: {
      ref: [[120, 40], [480, 40]],
      line: [[CX, CY + CH], [CX + CW, CY + CH]],
      area: [[CX, CY], [CX + CW, CY], [CX + CW, CY + CH], [CX, CY + CH]]
    }
  };

  let img = null, presets = null, scaled = null, scale = 1, dpr = 1;
  let shapes = [], selected = null, drag = null, lineN = 0, areaN = 0;

  refLen.value = store.get('mop.len', '');
  unitSel.value = store.get('mop.unit', 'cm');

  // ---- loading ----
  $('#open').addEventListener('click', () => $('#file').click());
  $('#sample').addEventListener('click', () => load(sampleSrc(), SAMPLE.presets));
  $('#file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) { fail('That file is not an image.'); return; }
    const rd = new FileReader();
    rd.onload = () => load(rd.result, null);
    rd.onerror = () => fail('Could not read that photo.');
    rd.readAsDataURL(f);
    e.target.value = '';
  });

  function fail(t) { stage.classList.remove('has'); msg.textContent = t; img = null; setButtons(); }

  function load(src, pre) {
    const im = new Image();
    im.onload = () => {
      img = im; presets = pre ? JSON.parse(JSON.stringify(pre)) : null;
      shapes = []; selected = null; lineN = 0; areaN = 0;
      stage.classList.add('has');
      layout(); render(); setButtons();
    };
    im.onerror = () => fail('Could not open that photo.');
    im.src = src;
  }

  function layout() {
    if (!img) return;
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    const availW = stage.clientWidth - 3, maxH = Math.max(260, window.innerHeight * 0.62);
    scale = Math.min(availW / w, maxH / h);
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = Math.round(w * scale), ch = Math.round(h * scale);
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    // pre-scaled copy so redraws during a drag stay fast with big photos
    scaled = document.createElement('canvas');
    scaled.width = cv.width; scaled.height = cv.height;
    scaled.getContext('2d').drawImage(img, 0, 0, scaled.width, scaled.height);
  }
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { layout(); render(); }, 120); });

  // ---- shapes (points are stored in image pixels) ----
  const W = () => img.naturalWidth || img.width, H = () => img.naturalHeight || img.height;
  function take(kind, fallback) {
    if (presets && presets[kind]) { const p = presets[kind]; delete presets[kind]; return p; }
    return fallback.map(([x, y]) => [x * W(), y * H()]);
  }
  function addRef() {
    let r = shapes.find(s => s.kind === 'ref');
    if (!r) { r = { kind: 'ref', name: 'Reference', pts: take('ref', [[0.2, 0.22], [0.8, 0.22]]) }; shapes.unshift(r); }
    selected = r; refresh();
    if (!refLen.value) refLen.focus({ preventScroll: true });
  }
  function addLine() {
    const k = (lineN % 5) * 0.08;
    const s = { kind: 'line', name: 'Line ' + (++lineN), pts: take('line', [[0.25, 0.45 + k], [0.75, 0.45 + k]]) };
    shapes.push(s); selected = s; refresh();
  }
  function addArea() {
    const k = (areaN % 4) * 0.05;
    const s = { kind: 'area', name: 'Area ' + (++areaN), pts: take('area', [[0.3 + k, 0.35 + k], [0.7 + k, 0.35 + k], [0.7 + k, 0.7 + k], [0.3 + k, 0.7 + k]]) };
    shapes.push(s); selected = s; refresh();
  }
  function addCorner() {
    if (!selected || selected.kind !== 'area') return;
    const p = selected.pts; let best = 0, bl = -1;
    for (let i = 0; i < p.length; i++) { const l = dist(p[i], p[(i + 1) % p.length]); if (l > bl) { bl = l; best = i; } }
    const a = p[best], b = p[(best + 1) % p.length];
    p.splice(best + 1, 0, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
    refresh();
  }
  $('#add-ref').addEventListener('click', addRef);
  $('#add-line').addEventListener('click', addLine);
  $('#add-area').addEventListener('click', addArea);
  $('#add-corner').addEventListener('click', addCorner);

  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  function polyArea(p) { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; } return Math.abs(s) / 2; }

  // image pixels per one unit, or null when the reference is incomplete
  function pxPerUnit() {
    const r = shapes.find(s => s.kind === 'ref'), L = parseFloat(refLen.value);
    if (!r || !(L > 0)) return null;
    const d = dist(r.pts[0], r.pts[1]);
    return d > 0 ? d / L : null;
  }
  function fmt(v) { const a = Math.abs(v); return v.toFixed(a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3); }
  function valueOf(s) {
    const u = unitSel.value;
    if (s.kind === 'ref') { const L = parseFloat(refLen.value); return L > 0 ? fmt(L) + ' ' + u : 'enter length'; }
    const k = pxPerUnit();
    if (!k) return shapes.some(x => x.kind === 'ref') ? 'enter length' : 'add reference';
    if (s.kind === 'line') return fmt(dist(s.pts[0], s.pts[1]) / k) + ' ' + u;
    return fmt(polyArea(s.pts) / (k * k)) + ' ' + u + '²';
  }

  // ---- list ----
  function refresh() { renderList(); render(); setButtons(); }
  function renderList() {
    list.textContent = '';
    if (!shapes.length) {
      const li = document.createElement('li'); li.className = 'empty';
      li.textContent = img ? 'Add a reference line over something of known length.' : 'Nothing measured yet.';
      list.append(li); return;
    }
    shapes.forEach(s => {
      const li = document.createElement('li');
      li.className = s === selected ? 'sel' : '';
      li.dataset.kind = s.kind;
      const n = document.createElement('span'); n.className = 'name'; n.textContent = s.name;
      const v = document.createElement('span'); v.className = 'val'; v.textContent = valueOf(s);
      const x = document.createElement('button'); x.type = 'button'; x.className = 'kill'; x.textContent = '×';
      x.setAttribute('aria-label', 'remove ' + s.name);
      x.addEventListener('click', e => { e.stopPropagation(); shapes = shapes.filter(t => t !== s); if (selected === s) selected = null; refresh(); });
      li.addEventListener('click', () => { selected = s; refresh(); });
      li.append(n, v, x); list.append(li);
    });
  }
  function setButtons() {
    ['#add-ref', '#add-line', '#add-area'].forEach(id => { $(id).disabled = !img; });
    $('#add-corner').hidden = !(img && selected && selected.kind === 'area');
  }
  refLen.addEventListener('input', () => { store.set('mop.len', refLen.value); renderList(); render(); });
  unitSel.addEventListener('change', () => { store.set('mop.unit', unitSel.value); renderList(); render(); });

  // ---- drawing ----
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function toScreen(p) { return [p[0] * scale, p[1] * scale]; }
  function render() {
    if (!img || !scaled) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(scaled, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    shapes.forEach(s => drawShape(s));
    if (drag) drawLoupe(drag);
  }
  function stroke(path, w, color, dash) {
    ctx.setLineDash(dash || []); ctx.lineWidth = w; ctx.strokeStyle = color; path(); ctx.stroke();
  }
  function drawShape(s) {
    const pts = s.pts.map(toScreen), sel = s === selected;
    const col = s.kind === 'ref' ? '#c8321e' : '#ffd400';
    const path = () => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); if (s.kind === 'area') ctx.closePath(); };
    if (s.kind === 'area') { path(); ctx.fillStyle = 'rgba(255,212,0,.18)'; ctx.fill(); }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    stroke(path, sel ? 6 : 5, 'rgba(0,0,0,.65)');
    stroke(path, sel ? 3 : 2, col, s.kind === 'ref' ? [8, 6] : null);
    ctx.setLineDash([]);
    pts.forEach(p => {
      ctx.beginPath(); ctx.arc(p[0], p[1], sel ? 9 : 7, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = col; ctx.stroke();
      ctx.beginPath(); ctx.arc(p[0], p[1], 1.5, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
    });
    // label
    let lx, ly;
    if (s.kind === 'area') { lx = pts.reduce((a, p) => a + p[0], 0) / pts.length; ly = pts.reduce((a, p) => a + p[1], 0) / pts.length; }
    else { lx = (pts[0][0] + pts[1][0]) / 2; ly = (pts[0][1] + pts[1][1]) / 2 - 18; }
    const t = valueOf(s);
    ctx.font = '600 15px ' + css('--sans');
    const tw = ctx.measureText(t).width + 12, cw = cv.width / dpr, ch = cv.height / dpr;
    lx = Math.min(Math.max(lx, tw / 2 + 2), cw - tw / 2 - 2); ly = Math.min(Math.max(ly, 13), ch - 13);
    ctx.fillStyle = 'rgba(0,0,0,.72)';
    ctx.fillRect(lx - tw / 2, ly - 12, tw, 24);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t, lx, ly + 1);
  }
  function drawLoupe(d) {
    const p = d.shape.pts[d.idx], [sx, sy] = toScreen(p), cw = cv.width / dpr;
    const chh = cv.height / dpr, g = LOUPE_R + 40, R = LOUPE_R + 2;
    // keep the loupe clear of the finger: above, below, then beside it
    const spots = [[sx, sy - g], [sx, sy + g], [sx - g - 20, sy], [sx + g + 20, sy]].map(([x, y]) =>
      [Math.min(Math.max(x, R), cw - R), Math.min(Math.max(y, R), chh - R)]);
    const [cx, cy] = spots.find(q => Math.hypot(q[0] - sx, q[1] - sy) >= LOUPE_R + 30) ||
      spots.reduce((a, q) => Math.hypot(q[0] - sx, q[1] - sy) > Math.hypot(a[0] - sx, a[1] - sy) ? q : a);
    const r = LOUPE_R / (LOUPE_Z * scale); // radius of the source region in image pixels
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, LOUPE_R, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#000'; ctx.fillRect(cx - LOUPE_R, cy - LOUPE_R, LOUPE_R * 2, LOUPE_R * 2);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, p[0] - r, p[1] - r, r * 2, r * 2, cx - LOUPE_R, cy - LOUPE_R, LOUPE_R * 2, LOUPE_R * 2);
    ctx.imageSmoothingEnabled = true;
    ctx.restore();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, LOUPE_R, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1; ctx.strokeStyle = '#ff2b2b';
    ctx.beginPath(); ctx.moveTo(cx - 14, cy); ctx.lineTo(cx + 14, cy); ctx.moveTo(cx, cy - 14); ctx.lineTo(cx, cy + 14); ctx.stroke();
  }

  // ---- dragging ----
  function local(e) { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
  function segDist(p, a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy;
    const t = l ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l)) : 0;
    return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
  }
  cv.addEventListener('pointerdown', e => {
    if (!img) return;
    const m = local(e);
    let hit = null, best = HIT;
    // selected shape wins ties so overlapping dots stay grabbable
    const order = selected ? [selected, ...shapes.filter(s => s !== selected).reverse()] : [...shapes].reverse();
    order.forEach(s => s.pts.forEach((p, i) => { const d = dist(toScreen(p), m); if (d < best - (s === selected ? 0 : 0.01)) { best = d; hit = { shape: s, idx: i }; } }));
    if (hit) {
      e.preventDefault();
      const sp = toScreen(hit.shape.pts[hit.idx]);
      drag = { ...hit, off: [sp[0] - m[0], sp[1] - m[1]] };
      selected = hit.shape;
      cv.setPointerCapture(e.pointerId);
      refresh(); return;
    }
    // tap on a line or inside an area selects it
    const pick = [...shapes].reverse().find(s => {
      const P = s.pts.map(toScreen);
      for (let i = 0; i < P.length - (s.kind === 'area' ? 0 : 1); i++) if (segDist(m, P[i], P[(i + 1) % P.length]) < 14) return true;
      return false;
    });
    if (pick !== undefined || selected) { selected = pick || null; refresh(); }
  });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const m = local(e), cw = cv.width / dpr, ch = cv.height / dpr;
    const x = Math.min(Math.max(m[0] + drag.off[0], 0), cw), y = Math.min(Math.max(m[1] + drag.off[1], 0), ch);
    drag.shape.pts[drag.idx] = [x / scale, y / scale];
    render();
    if (!drag.raf) drag.raf = requestAnimationFrame(() => { if (drag) { drag.raf = 0; renderList(); } });
  });
  const end = () => { if (!drag) return; drag = null; refresh(); };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);

  renderList(); setButtons();
})();
</script>
</body>
</html>
