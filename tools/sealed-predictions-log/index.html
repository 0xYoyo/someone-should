<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make an app to record private predictions</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.meta { font-size: 16px; }
label { display: grid; gap: 4px; }
.card { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px; }
#score { font-size: 17px; }
.item { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.item p { margin: 0; overflow-wrap: anywhere; }
.item.done p { color: var(--meta); }
.due { color: var(--no); }
.right { color: var(--built); }
.row > * { flex: 1 1 0; }
.row button { min-width: 0; }
.link { border: 0; text-decoration: underline; color: var(--meta); flex: 0 0 auto; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make an app to record private predictions</h1>
<main id="app" class="stack">
  <form id="form" class="stack card">
    <label>I predict
      <input id="text" type="text" maxlength="140" autocomplete="off" value="It rains on my birthday">
    </label>
    <div class="row">
      <label>Confidence
        <select id="conf"><option>50</option><option>60</option><option selected>70</option><option>80</option><option>90</option><option>99</option></select>
      </label>
      <label>Check on
        <input id="date" type="date">
      </label>
    </div>
    <button id="add" class="primary" type="submit">Seal it</button>
    <div id="err" class="meta no" role="alert"></div>
  </form>
  <div id="score" class="meta"></div>
  <div id="list"></div>
  <div class="meta">Stored on this device only.</div>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const KEY = 'sealed-predictions';
  let items = store.get(KEY, []);
  if (!Array.isArray(items)) items = [];

  const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const today = () => iso(new Date());
  const inDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
  $('#date').value = inDays(30);

  const save = () => store.set(KEY, items);
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function renderScore() {
    const done = items.filter(i => i.result);
    if (!done.length) { $('#score').textContent = 'No results yet. Mark predictions right or wrong once they resolve.'; return; }
    const right = done.filter(i => i.result === 'right').length;
    const expected = done.reduce((a, i) => a + i.conf, 0) / done.length;
    const actual = right / done.length * 100;
    const diff = actual - expected;
    const verdict = Math.abs(diff) < 5 ? 'well calibrated' : diff < 0 ? 'overconfident' : 'underconfident';
    $('#score').textContent = right + ' of ' + done.length + ' right (' + Math.round(actual) + '%). You said ' + Math.round(expected) + '% on average: ' + verdict + '.';
  }

  function render() {
    renderScore();
    const list = $('#list');
    if (!items.length) { list.innerHTML = '<div class="empty">Nothing sealed yet.</div>'; return; }
    const t = today();
    const sorted = items.map((it, i) => ({ it, i })).sort((a, b) => (!!a.it.result - !!b.it.result) || a.it.date.localeCompare(b.it.date));
    list.innerHTML = sorted.map(({ it, i }) => {
      const due = !it.result && it.date <= t;
      const meta = it.conf + '% sure, check ' + it.date + (due ? ' (due)' : '');
      const body = it.result
        ? '<div class="meta ' + (it.result === 'right' ? 'right' : 'no') + '">' + (it.result === 'right' ? 'Right' : 'Wrong') + '</div>'
        : '<div class="row"><button data-act="right" data-i="' + i + '">Right</button><button data-act="wrong" data-i="' + i + '">Wrong</button><button class="link" data-act="del" data-i="' + i + '">Delete</button></div>';
      return '<div class="item' + (it.result ? ' done' : '') + '"><p>' + esc(it.text) + '</p><div class="meta' + (due ? ' due' : '') + '">' + meta + '</div>' + body + '</div>';
    }).join('');
  }

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const text = $('#text').value.trim();
    const date = $('#date').value;
    if (!text) { $('#err').textContent = 'Write a prediction first.'; return; }
    if (!date) { $('#err').textContent = 'Pick a date to check it.'; return; }
    $('#err').textContent = '';
    items.push({ text, conf: +$('#conf').value, date, made: today(), result: null });
    save();
    $('#text').value = '';
    render();
  });

  $('#list').addEventListener('click', e => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const i = +b.dataset.i;
    if (b.dataset.act === 'del') items.splice(i, 1);
    else items[i].result = b.dataset.act;
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
