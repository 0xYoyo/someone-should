<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:;">
<meta name="color-scheme" content="light dark">
<title>someone should make a note app for jokes and ideas that hides the whole list until you want to see it</title>
<style>
/* someone should. — shared tokens. Inline this block into every tool and the shell. */
:root {
  --paper: #f4f1ea;
  --ink: #141414;
  --meta: #6b6b6b;
  --line: #d9d4c7;
  --no: #c8321e;
  --built: #2e7d4f;
  --accent: #141414;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 4px;
  --tap: 44px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121212; --ink: #ededed; --meta: #9a9a9a; --line: #2a2a2a; --accent: #ededed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: var(--gutter); min-height: 100dvh; }
h1 { font: 500 15px/1.3 var(--mono); color: var(--meta); margin: 0 0 20px; letter-spacing: 0; text-transform: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { min-height: var(--tap); padding: 0 18px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--radius); cursor: pointer; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:active { transform: translateY(1px); }
input, select, textarea { min-height: var(--tap); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius); background: transparent; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.meta { font: 13px/1.4 var(--mono); color: var(--meta); }
.big { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.empty { color: var(--meta); padding: 24px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.no { color: var(--no); }
.built { color: var(--built); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* tool */
textarea { min-height: 96px; resize: vertical; }
#count { color: var(--meta); }
#list li { align-items: flex-start; }
#list .t { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
#list button { flex: none; min-width: var(--tap); padding: 0 12px; }
.err { color: var(--no); min-height: 1.45em; margin: 0; }
</style>
<style data-embed-hide>html.embed h1:first-of-type{display:none}html.embed body{padding-top:12px}</style><script>if(location.search.indexOf("embed")>-1)document.documentElement.className+=" embed";</script>
</head>
<body>
<h1 id="wish">someone should make a note app for jokes and ideas that hides the whole list until you want to see it</h1>
<main id="app" class="stack">
  <label for="text" class="meta">new joke or idea</label>
  <textarea id="text" rows="3" maxlength="500" placeholder="write it down, it disappears from view"></textarea>
  <div class="row">
    <button id="add" class="primary" type="button">Add</button>
    <button id="toggle" type="button" aria-expanded="false">Show</button>
  </div>
  <p id="msg" class="err" role="status"></p>
  <div id="count">0 notes hidden</div>
  <ul id="list" class="plain" hidden></ul>
</main>
<script>
(() => {
  'use strict';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
  };
  const $ = (s, r = document) => r.querySelector(s);
  const KEY = 'hidden-ideas-list.v1';
  const seed = [
    { id: 1, t: 'Joke: my password is the last thing I forgot' },
    { id: 2, t: 'Idea: a jar that only opens on Sundays' }
  ];
  let notes = store.get(KEY, null);
  if (!Array.isArray(notes)) notes = seed;
  let shown = false;

  function render() {
    const n = notes.length;
    $('#count').textContent = shown ? n + (n === 1 ? ' note' : ' notes') : n + (n === 1 ? ' note hidden' : ' notes hidden');
    const list = $('#list');
    list.textContent = '';
    list.hidden = !shown;
    $('#toggle').textContent = shown ? 'Hide' : 'Show';
    $('#toggle').setAttribute('aria-expanded', String(shown));
    if (!shown) return;
    if (!n) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'Nothing saved yet.'; list.appendChild(li); return; }
    notes.slice().reverse().forEach(note => {
      const li = document.createElement('li');
      const s = document.createElement('span'); s.className = 't'; s.textContent = note.t;
      const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Del'; b.setAttribute('aria-label', 'Delete note');
      b.addEventListener('click', () => { notes = notes.filter(x => x.id !== note.id); save(); render(); });
      li.append(s, b); list.appendChild(li);
    });
  }
  function save() {
    $('#msg').textContent = store.set(KEY, notes) ? '' : 'Storage is off, notes last until you close this page.';
  }
  function add() {
    const t = $('#text').value.trim();
    if (!t) { $('#msg').textContent = 'Write something first.'; return; }
    notes.push({ id: Date.now() + Math.random(), t });
    $('#text').value = '';
    save();
    shown = false;
    render();
  }
  $('#add').addEventListener('click', add);
  $('#toggle').addEventListener('click', () => { shown = !shown; render(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && shown) { shown = false; render(); } });
  render();
})();
</script>
</body>
</html>
