<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>someone should.</title>
<meta name="description" content="every “someone should make an app that…” on the internet — built.">
<meta property="og:title" content="someone should.">
<meta property="og:description" content="every “someone should make an app that…” on the internet — built.">
<meta property="og:image" content="assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--paper:#f4f1ea;--ink:#141414;--meta:#6b6b6b;--line:#d9d4c7;--no:#c8321e;--built:#2e7d4f;--sans:-apple-system,"SF Pro Text","Segoe UI",Inter,Roboto,system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--radius:4px;--gutter:16px}
@media(prefers-color-scheme:dark){:root{--paper:#121212;--ink:#ededed;--meta:#9a9a9a;--line:#2a2a2a}}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.4 var(--sans);-webkit-text-size-adjust:100%}
body{padding:0 var(--gutter) 48px;min-height:100dvh}
header{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 10px;font:13px/1.4 var(--mono);color:var(--meta);position:sticky;top:0;background:var(--paper);z-index:2}
header b{font-weight:500;color:var(--ink)}
#wall{column-gap:28px;column-width:340px}
@media(max-width:720px){#wall{column-width:auto;columns:1}}
.tile{break-inside:avoid;margin:0 0 52px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wish{font-size:24px;line-height:1.22;letter-spacing:-.005em;font-weight:500;margin:0 0 8px}
@media(min-width:721px){.wish{font-size:22px}}
.meta{font:13px/1.4 var(--mono);color:var(--meta);display:flex;gap:10px;align-items:center;margin-bottom:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--built);display:inline-block}
.frame{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:var(--radius);background:var(--paper);border:1px solid var(--line)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:var(--paper)}
.frame::after{content:"";position:absolute;inset:0}
.stamp{display:inline-block;transform:rotate(-6deg);transform-origin:left center;border:2px solid var(--no);color:var(--no);font:600 15px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;border-radius:3px;margin:6px 0 0 4px;background:var(--paper)}
footer{font:13px/1.6 var(--mono);color:var(--meta);padding:40px 0 0}
footer a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
/* player */
#player{position:fixed;inset:0;background:var(--paper);z-index:10;display:none;flex-direction:column}
#player.open{display:flex}
#bar{display:flex;align-items:center;gap:12px;padding:10px var(--gutter);font:13px/1.4 var(--mono);color:var(--meta);border-bottom:1px solid var(--line)}
#bar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{min-height:44px;min-width:44px;border:0;background:transparent;font:inherit;color:var(--ink);cursor:pointer;padding:0}
#stage{flex:1;position:relative}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper)}
#drawer{border-top:1px solid var(--line);background:var(--paper);font:13px/1.65 var(--mono);color:var(--meta);transition:max-height .25s ease;max-height:44px;overflow:hidden}
#drawer.up{max-height:60vh;overflow:auto}
#handle{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--gutter);cursor:pointer;color:var(--ink)}
#rcpt{padding:0 var(--gutter) 24px}
#rcpt div{display:flex;gap:16px;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0}
#rcpt div span:last-child{text-align:right;color:var(--ink);max-width:62%}
#rcpt a{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><span>someone should.</span><span id="count"></span></header>
<main id="wall" aria-live="polite"></main>
<footer><a href="about.html" id="byline">built overnight by yoav zrihan's agents.</a></footer>

<div id="player" role="dialog" aria-modal="true">
  <div id="bar"><div class="t" id="ptitle"></div><button id="share" aria-label="copy link">link</button><button id="close" aria-label="close">×</button></div>
  <div id="stage"></div>
  <div id="drawer"><div id="handle"><span>receipt</span><span id="chev">▴</span></div><div id="rcpt"></div></div>
</div>

<script>
(() => {
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const fmt = n => n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/,'') + 'k' : String(n);
const mon = d => { try { return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'}).toLowerCase(); } catch { return ''; } };
const mony = d => { try { return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}).toLowerCase(); } catch { return ''; } };

async function load(path, fallback) {
  try { const r = await fetch(path, {cache:'no-cache'}); if (!r.ok) throw 0; return await r.json(); }
  catch { if (fallback) { try { const r = await fetch(fallback); if (r.ok) return await r.json(); } catch {} } return null; }
}

function interleave(built, nos) {
  // at most 1 NO in the first 6, then ~1 in 7
  const out = []; let b = 0, n = 0, i = 0;
  while (b < built.length || n < nos.length) {
    const wantNo = n < nos.length && ((i === 4) || (i > 6 && (i - 4) % 7 === 0) || b >= built.length);
    if (wantNo) out.push({kind:'no', ...nos[n++]}); else out.push({kind:'built', ...built[b++]});
    i++;
  }
  return out;
}

function tile(t) {
  const el = document.createElement('article'); el.className = 'tile'; el.dataset.slug = t.slug;
  const meta = t.agreed >= 10 ? `${t.year} · ${fmt(t.agreed)} agreed` : `${t.year}`;
  if (t.kind === 'no') {
    el.innerHTML = `<h2 class="wish"></h2><div class="meta"><span></span></div><div class="stamp"></div>`;
    $('.wish', el).textContent = t.wish; $('.meta span', el).textContent = meta; $('.stamp', el).textContent = 'NO · ' + t.no;
    el.onclick = () => { if (t.sources?.[0]?.url) window.open(t.sources[0].url, '_blank', 'noopener'); };
    return el;
  }
  el.innerHTML = `<h2 class="wish"></h2><div class="meta"><span></span>${t.approved ? '<i class="dot"></i><span>built ' + mon(t.built) + '</span>' : ''}</div><div class="frame" data-src="tools/${t.slug}/index.html"></div>`;
  $('.wish', el).textContent = t.wish; $('.meta span', el).textContent = meta;
  el.onclick = () => open(t);
  return el;
}

// mount thumbnails only near the viewport (100 iframes at once would be heavy)
const io = new IntersectionObserver(es => {
  for (const e of es) {
    const f = e.target;
    if (e.isIntersecting && !f.firstChild) { const i = document.createElement('iframe'); i.sandbox = 'allow-scripts'; i.loading = 'lazy'; i.tabIndex = -1; i.setAttribute('aria-hidden','true'); i.src = f.dataset.src + '?embed=1'; f.appendChild(i); }
    else if (!e.isIntersecting && f.firstChild && Math.abs(e.boundingClientRect.top) > innerHeight * 4) f.replaceChildren();
  }
}, { rootMargin: '150% 0px' });

let current = null;
async function open(t) {
  current = t; history.replaceState(null, '', '#' + t.slug);
  $('#ptitle').textContent = t.wish;
  const s = $('#stage'); s.replaceChildren();
  const i = document.createElement('iframe'); i.sandbox = 'allow-scripts allow-same-origin allow-forms allow-downloads'; i.allow = 'microphone; camera; geolocation; accelerometer; gyroscope; clipboard-write'; i.src = `tools/${t.slug}/index.html`; i.title = t.wish; s.appendChild(i);
  $('#drawer').classList.remove('up'); $('#chev').textContent = '▴';
  $('#player').classList.add('open'); document.body.style.overflow = 'hidden';
  const j = await load(`tools/${t.slug}/tool.json`);
  const src = (j?.sources || t.sources || [])[0];
  const rows = [];
  if (src) rows.push(['wished', `<a href="${src.url}" target="_blank" rel="noopener">${mony(src.date)} on ${({hn:'hacker news',se:'stack exchange',reddit:'reddit'})[src.site] || src.site}</a>`]);
  if (t.agreed >= 10) rows.push(['agreed', fmt(t.agreed)]);
  if (j?.spec) rows.push(['spec', String(j.spec).replace(/</g,'&lt;')]);
  if (t.tests) rows.push(['tests passed', t.tests]);
  if (t.kb) rows.push(['size', `${t.kb} kB`]);
  rows.push(['network requests', '0']);
  if (t.built) rows.push(['built', `${mony(t.built)} · ${t.model || 'opus 5.5'}${t.minutes ? ' · ' + t.minutes + ' min' : ''}`]);
  rows.push(['approved', t.approved ? `by yoav · ${mony(t.approvedAt || t.built)}` : 'not yet']);
  rows.push(['open on its own', `<a href="tools/${t.slug}/" target="_blank" rel="noopener">/tools/${t.slug}/</a>`]);
  $('#rcpt').innerHTML = rows.map(([k,v]) => `<div><span>${k}</span><span>${v}</span></div>`).join('');
}
function close() { $('#player').classList.remove('open'); $('#stage').replaceChildren(); document.body.style.overflow = ''; history.replaceState(null, '', location.pathname); current = null; }
$('#close').onclick = close;
$('#handle').onclick = () => { const d = $('#drawer'); d.classList.toggle('up'); $('#chev').textContent = d.classList.contains('up') ? '▾' : '▴'; };
$('#share').onclick = async () => { const url = location.origin + location.pathname + '#' + current.slug; try { if (navigator.share) await navigator.share({title: current.wish, url}); else { await navigator.clipboard.writeText(url); $('#share').textContent = 'copied'; setTimeout(()=>$('#share').textContent='link', 1200); } } catch {} };
addEventListener('keydown', e => { if (e.key === 'Escape' && current) close(); });

// drift until first touch
let drifting = !matchMedia('(prefers-reduced-motion: reduce)').matches, last = 0;
function drift(ts) { if (!drifting) return; if (last) scrollBy(0, (ts - last) * 0.012); last = ts; requestAnimationFrame(drift); }
for (const ev of ['touchstart','wheel','keydown','pointerdown']) addEventListener(ev, () => drifting = false, {passive:true, once:true});

(async () => {
  const top = await load('data/top.json', 'data/fixture/top.json');
  const built = await load('data/built.json', 'data/fixture/built.json');
  if (!top) { $('#wall').innerHTML = '<p class="meta">nothing yet.</p>'; return; }
  const status = Object.fromEntries((built?.tools || []).map(t => [t.slug, t]));
  const shipped = (top.build || []).filter(w => status[w.slug]?.status === 'pass').map(w => ({...w, ...status[w.slug]}));
  const nos = top.no || [];
  const approved = shipped.filter(t => t.approved).length;
  $('#count').innerHTML = `<b>${shipped.length}</b> built · <b>${nos.length}</b> told no${approved ? ` · <b>${approved}</b> approved` : ''}`;
  if (shipped.length && approved === shipped.length) $('#byline').textContent = "built overnight by yoav zrihan's agents. he approved every one.";
  const wall = $('#wall');
  for (const t of interleave(shipped, nos)) wall.appendChild(tile(t));
  wall.querySelectorAll('.frame').forEach(f => io.observe(f));
  const want = decodeURIComponent(location.hash.slice(1));
  const hit = want && shipped.find(t => t.slug === want);
  if (hit) open(hit); else setTimeout(() => requestAnimationFrame(drift), 1200);
})();
})();
</script>
</body>
</html>
